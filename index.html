 {u:'Втора част',ar:'سُورَةُ الْفِيلِ',t:'Сура Ал-Фил',a:['أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ|Не видя ли какво стори твоят Господ с хората на слона?','أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ|Не провали ли Той коварството им?','وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ|И изпрати срещу тях птици на ята,','تَرْمِيهِمْ بِحِجَارَةٍ مِنْ سِجِّيلٍ|които ги замеряха с камъни от печена глина,','فَجَعَلَهُمْ كَعَصْفٍ مَأْكُولٍ|и ги направи като изядена слама.'],w:['أَصْحَابُ الْفِيلِ|хората на слона','كَيْدٌ|коварство','تَضْلِيلٌ|провал','طَيْرٌ|птици','أَبَابِيلُ|ята','حِجَارَةٌ|камъни','سِجِّيلٌ|печена глина','عَصْفٌ|слама','مَأْكُولٌ|изяден'],x:['Сурата разказва за войската със слонове, тръгнала да разруши Кааба в годината, когато е роден Пророкът.']},
 {u:'Трета част',ar:'سُورَةُ قُرَيْشٍ',t:'Сура Курайш',a:['لِإِيلَافِ قُرَيْشٍ|Заради сигурността на курайшитите,','إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ|сигурността им при зимното и лятното пътуване,','فَلْيَعْبُدُوا رَبَّ هٰذَا الْبَيْتِ|нека служат на Господа на този Дом,','الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ|Който ги нахрани в глада и ги опази от страха.'],w:['إِيلَافٌ|сигурност, привичност','قُرَيْشٌ|Курайш (племето)','رِحْلَةٌ|пътуване','الشِّتَاءُ|зимата','الصَّيْفُ|лятото','الْبَيْتُ|Домът (Кааба)','أَطْعَمَهُمْ|нахрани ги','جُوعٌ|глад','خَوْفٌ|страх']},
 {u:'Трета част',ar:'سُورَةُ الْمَاعُونِ',t:'Сура Ал-Маун',a:['أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ|Видя ли онзи, който отрича възмездието?','فَذٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ|Той е онзи, който грубо отблъсква сирачето','وَلَا يَحُضُّ عَلَى طَعَامِ الْمِسْكِينِ|и не подтиква към нахранване на бедния.','فَوَيْلٌ لِلْمُصَلِّينَ|Горко на молещите се,','الَّذِينَ هُمْ عَنْ صَلَاتِهِمْ سَاهُونَ|които нехаят за молитвата си,','الَّذِينَ هُمْ يُرَاءُونَ|които се показват пред хората','وَيَمْنَعُونَ الْمَاعُونَ|и отказват дори дребна помощ.'],w:['يُكَذِّبُ|отрича','الدِّينُ|възмездието; вярата','يَدُعُّ|отблъсква грубо','الْيَتِيمُ|сирачето','يَحُضُّ|подтиква','الْمِسْكِينُ|бедният','سَاهُونَ|нехайни','يُرَاءُونَ|показват се пред хората','الْمَاعُونُ|дребна помощ']},
 {u:'Трета част',ar:'سُورَةُ الْكَوْثَرِ',t:'Сура Ал-Каусар',a:['إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ|Ние ти дарихме Ал-Каусар.','فَصَلِّ لِرَبِّكَ وَانْحَرْ|Затова се моли на своя Господ и принасяй жертва!','إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ|Онзи, който те мрази, той е откъснатият.'],w:['أَعْطَيْنَاكَ|дарихме те','الْكَوْثَرُ|Ал-Каусар (изобилие; река в Рая)','صَلِّ|моли се','انْحَرْ|принеси жертва','شَانِئَكَ|мразещият те','الْأَبْتَرُ|откъснатият, без следа'],x:['Това е най-кратката сура в Корана — само три аята.']},
 {u:'Четвърта част',ar:'سُورَةُ الْكَافِرُونَ',t:'Сура Ал-Кафирун',a:['قُلْ يَا أَيُّهَا الْكَافِرُونَ|Кажи: „О, неверници!','لَا أَعْبُدُ مَا تَعْبُدُونَ|Не служа на онова, на което вие служите,','وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ|нито вие служите на Онзи, на Когото служа аз.','وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ|Нито пък аз ще служа на онова, на което вие сте служили,','وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ|нито вие ще служите на Онзи, на Когото служа аз.','لَكُمْ دِينُكُمْ وَلِيَ دِينِ|Вие си имате своята вяра, а аз — моята.“'],w:['قُلْ|кажи','الْكَافِرُونَ|неверниците','أَعْبُدُ|служа','تَعْبُدُونَ|служите','عَابِدٌ|служещ','دِينٌ|вяра, религия']},
 {u:'Четвърта част',ar:'سُورَةُ النَّصْرِ',t:'Сура Ан-Наср',a:['إِذَا جَاءَ نَصْرُ اللّٰهِ وَالْفَتْحُ|Когато дойдат помощта на Аллах и победата','وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللّٰهِ أَفْوَاجًا|и видиш хората да влизат във вярата на Аллах на тълпи,','فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا|прославяй своя Господ с хвала и Го моли за прошка. Той винаги приема покаянието.'],w:['جَاءَ|дойде','نَصْرٌ|помощ, победа','الْفَتْحُ|победата (превземането на Мека)','النَّاسُ|хората','أَفْوَاجًا|на тълпи','سَبِّحْ|прославяй','اسْتَغْفِرْهُ|моли Го за прошка','تَوَّابٌ|Приемащ покаянието']},
 {u:'Четвърта част',ar:'سُورَةُ الْمَسَدِ',t:'Сура Ал-Масад',a:['تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ|Да загинат ръцете на Абу Лахаб, и загина той!','مَا أَغْنَى عَنْهُ مَالُهُ وَمَا كَسَبَ|Не му помогнаха нито имотът му, нито онова, което спечели.','سَيَصْلَى نَارًا ذَاتَ لَهَبٍ|Ще гори в пламтящ огън,','وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ|и жена му — носачката на дърва,','فِي جِيدِهَا حَبْلٌ مِنْ مَسَدٍ|с въже от палмови влакна на шията си.'],w:['تَبَّتْ|да загинат','يَدَا|двете ръце на','لَهَبٌ|пламък','أَغْنَى|помогна, послужи','كَسَبَ|спечели','امْرَأَتُهُ|жена му','الْحَطَبُ|дърва за огрев','جِيدٌ|шия','حَبْلٌ|въже','مَسَدٌ|палмови влакна']},
 {u:'Пета част',ar:'سُورَةُ الْإِخْلَاصِ',t:'Сура Ал-Ихлас',a:['قُلْ هُوَ اللّٰهُ أَحَدٌ|Кажи: „Той е Аллах, Единният,','اللّٰهُ الصَّمَدُ|Аллах, Вечният, към Когото всички се обръщат.','لَمْ يَلِدْ وَلَمْ يُولَدْ|Не е родил и не е роден,','وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ|и няма никой равен Нему.“'],w:['أَحَدٌ|Единен','الصَّمَدُ|Вечният, към Когото всички се обръщат','لَمْ يَلِدْ|не е родил','لَمْ يُولَدْ|не е роден','كُفُوًا|равен']},
 {u:'Пета част',ar:'سُورَةُ الْفَلَقِ',t:'Сура Ал-Фалак',a:['قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ|Кажи: „Търся закрила у Господа на зората','مِنْ شَرِّ مَا خَلَقَ|от злото на онова, което Той е сътворил,','وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ|и от злото на мрака, когато настъпи,','وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ|и от злото на духащите във възлите,','وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ|и от злото на завистника, когато завижда.“'],w:['الْفَلَقُ|зората','شَرٌّ|зло','خَلَقَ|сътвори','غَاسِقٌ|мракът на нощта','وَقَبَ|настъпи','النَّفَّاثَاتُ|духащите (магьосниците)','الْعُقَدُ|възлите','حَاسِدٌ|завистник']},
 {u:'Пета част',ar:'سُورَةُ النَّاسِ',t:'Сура Ан-Нас',a:['قُلْ أَعُوذُ بِرَبِّ النَّاسِ|Кажи: „Търся закрила у Господа на хората,','مَلِكِ النَّاسِ|Царя на хората,','إِلٰهِ النَّاسِ|Бога на хората,','مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ|от злото на нашепващия, който се оттегля,','الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ|който нашепва в гърдите на хората,','مِنَ الْجِنَّةِ وَالنَّاسِ|измежду джиновете и хората.“'],w:['مَلِكٌ|цар','إِلٰهٌ|бог','الْوَسْوَاسُ|нашепващият','الْخَنَّاسُ|който се оттегля','يُوَسْوِسُ|нашепва','صُدُورٌ|гърди','الْجِنَّةُ|джиновете']}
];

 p:['أَسْأَلُ اللّٰهَ أَنْ يُبْعِدَ عَنِّي …|الشَّيْطَانُ|أَسْأَلُ اللّٰهَ أَنْ يُبْعِدَ عَنِّي الشَّيْطَانَ.|Моля Аллах да отдалечи от мен шейтана.|أَسْأَلُ اللّٰهَ أَنْ يُبْعِدَ عَنِّي الشَّيْطَانُ.|أَسْأَلُ اللّٰهَ أَنْ أُبْعِدَ عَنِّي الشَّيْطَانَ.','أَسْأَلُ اللّٰهَ أَنْ يُبْعِدَ عَنِّي …|الشَّرُّ|أَسْأَلُ اللّٰهَ أَنْ يُبْعِدَ عَنِّي الشَّرَّ.|Моля Аллах да отдалечи от мен злото.|أَسْأَلُ اللّٰهَ أَنْ يُبْعِدَ عَنِّي الشَّرُّ.|أَسْأَلُ اللّٰهَ أَنْ يُبْعِدَ عَنْكَ الشَّرَّ.','مَتَى تَقْرَأُ الِاسْتِعَاذَةَ؟|قَبْلَ الْقِرَاءَةِ|أَقْرَأُ الِاسْتِعَاذَةَ قَبْلَ قِرَاءَةِ الْقُرْآنِ.|Казвам истиаза преди четенето на Корана.|أَقْرَأُ الِاسْتِعَاذَةَ بَعْدَ قِرَاءَةِ الْقُرْآنِ.|يَقْرَأُ الِاسْتِعَاذَةَ قَبْلَ قِرَاءَةِ الْقُرْآنِ.'],
 f:['أَعُوذُ بِاللّٰهِ مِنَ الشَّيْطَانِ ___|الرَّجِيمِ|الرَّحِيمِ|الرَّحْمٰنِ','بِسْمِ اللّٰهِ الرَّحْمٰنِ ___|الرَّحِيمِ|الرَّجِيمِ|الشَّيْطَانِ','يَقُولُ الْمُسْلِمُ: بِسْمِ اللّٰهِ فِي أَوَّلِ ___|الْأَكْلِ|الشَّيْطَانِ|الرَّجِيمِ'],
 c:'ع|ء',pp:['عَنْ|أَنْ','سَعَلَ|سَأَلَ','تَعَلَّمَ|تَأَلَّمَ','عَلِمَ|أَلِمَ'],
 q:['مَتَى يَقْرَأُ الْمُسْلِمُ الِاسْتِعَاذَةَ؟|قَبْلَ قِرَاءَةِ الْقُرْآنِ|بَعْدَ قِرَاءَةِ الْقُرْآنِ|فِي آخِرِ السُّورَةِ','مَا مَعْنَى «الرَّجِيمِ»؟|الْبَعِيدُ عَنْ رَحْمَةِ اللّٰهِ|الْكَثِيرُ الرَّحْمَةِ|الْقَرِيبُ مِنَ اللّٰهِ','مَتَى يَقُولُ الْمُسْلِمُ «بِسْمِ اللّٰهِ»؟|فِي أَوَّلِ السُّورَةِ وَأَوَّلِ الْأَكْلِ|بَعْدَ الْأَكْلِ فَقَطْ|فِي آخِرِ الصَّلَاةِ','مَا «الرَّحْمٰنُ»؟|اسْمٌ مِنْ أَسْمَاءِ اللّٰهِ|اسْمُ مَدِينَةٍ|اسْمُ رَجُلٍ']},
1:{m:['الْحَمْدُ لِلّٰهِ|الشُّكْرُ وَالثَّنَاءُ لِلّٰهِ|благодарност и хвала на Аллах','الْعَالَمِينَ|الْإِنْسُ وَالْجِنُّ وَغَيْرُهُمْ|хората, джиновете и всичко друго','يَوْمِ الدِّينِ|يَوْمُ الْحِسَابِ، يَوْمُ الْقِيَامَةِ|Денят на равносметката, Съдният ден','نَسْتَعِينُ|نَطْلُبُ الْمُسَاعَدَةَ|молим за помощ','اهْدِنَا|أَرْشِدْنَا إِلَى الطَّرِيقِ وَثَبِّتْنَا عَلَيْهِ|напъти ни и ни укрепи по пътя','الْمَغْضُوبِ عَلَيْهِمْ|ضِدُّ الْمَرْضِيِّ عَنْهُمْ|онези, на които Аллах се е разгневил','الضَّالِّينَ|ضِدُّ الْمُهْتَدِينَ|заблудените, обратното на напътените'],
 e:['نَحْمَدُ اللّٰهَ رَبَّ الْعَالَمِينَ، وَهُوَ الرَّحْمٰنُ الرَّحِيمُ.|Възхваляваме Аллах, Господа на световете — Той е Всемилостивият, Милосърдният.','وَهُوَ مَالِكُ يَوْمِ الْقِيَامَةِ.|Той е Владетелят на Съдния ден.','نَعْبُدُ اللّٰهَ وَحْدَهُ، وَنَطْلُبُ الْمُسَاعَدَةَ مِنْهُ وَحْدَهُ.|Служим само на Аллах и само от Него молим помощ.','وَنَسْأَلُهُ أَنْ يُرْشِدَنَا إِلَى الطَّرِيقِ الْمُسْتَقِيمِ، طَرِيقِ الَّذِينَ أَنْعَمَ عَلَيْهِمْ.|И Го молим да ни напъти към правия път — пътя на онези, които е облагодетелствал.'],
 o:['الضَّالُّ|الْمُهْتَدِي','الْمَغْضُوبُ عَلَيْهِ|الْمَرْضِيُّ عَنْهُ','الْمُسْتَقِيمُ|الْمُعْوَجُّ'],
 p:['إِيَّاكَ نَعْبُدُ = نَعْبُدُكَ. وَإِيَّاكَ نَسْأَلُ = ؟|نَسْأَلُ|نَسْأَلُكَ|Тебе молим.|نَسْأَلُهُ|أَسْأَلُكَ','إِيَّاكَ نَعْبُدُ = نَعْبُدُكَ. وَإِيَّاكَ نَشْكُرُ = ؟|نَشْكُرُ|نَشْكُرُكَ|Тебе благодарим.|نَشْكُرُهُ|يَشْكُرُكَ','مَنْ مَالِكُ يَوْمِ الدِّينِ؟|اللّٰهُ|اللّٰهُ مَالِكُ يَوْمِ الدِّينِ.|Аллах е Владетелят на Съдния ден.|اللّٰهُ مَالِكَ يَوْمِ الدِّينِ.|اللّٰهُ مَالِكُ يَوْمُ الدِّينِ.','مَنْ مَالِكُ الْبَيْتِ؟|أَنَا|أَنَا مَالِكُ الْبَيْتِ.|Аз съм стопанинът на къщата.|أَنَا مَالِكُ الْبَيْتُ.|أَنْتَ مَالِكُ الْبَيْتِ.'],
 f:['الْحَمْدُ لِلّٰهِ رَبِّ ___|الْعَالَمِينَ|الضَّالِّينَ|الرَّحِيمِ','مَالِكِ يَوْمِ ___|الدِّينِ|الْعَالَمِينَ|الْمُسْتَقِيمِ','إِيَّاكَ نَعْبُدُ وَإِيَّاكَ ___|نَسْتَعِينُ|نَعْبُدُ|اهْدِنَا','اهْدِنَا الصِّرَاطَ ___|الْمُسْتَقِيمَ|الرَّحِيمَ|الدِّينَ'],
 c:'ض|د',pp:['ضَالٌّ|دَالٌّ','نَاضِرٌ|نَادِرٌ','مَضَارٌّ|مَدَارٌ','عَضَّ|عَدَّ'],
 q:['مَنْ رَبُّ الْعَالَمِينَ؟|اللّٰهُ|الْإِنْسَانُ|الْمَلِكُ','مَا يَوْمُ الدِّينِ؟|يَوْمُ الْقِيَامَةِ|يَوْمُ الْجُمُعَةِ|يَوْمُ الْعِيدِ','مِمَّنْ نَطْلُبُ الْمُسَاعَدَةَ؟|مِنَ اللّٰهِ وَحْدَهُ|مِنَ النَّاسِ|مِنَ الْمَلِكِ','مَا الصِّرَاطُ الْمُسْتَقِيمُ؟|طَرِيقُ الَّذِينَ أَنْعَمَ اللّٰهُ عَلَيْهِمْ|طَرِيقُ الضَّالِّينَ|طَرِيقُ الْمَغْضُوبِ عَلَيْهِمْ']},
2:{m:['الْعَصْرُ|الْوَقْتُ، وَوَقْتُ صَلَاةِ الْعَصْرِ|времето; времето на следобедната молитва','خُسْرٌ|خَسَارَةٌ|загуба','تَوَاصَوْا بِالْحَقِّ|أَوْصَى بَعْضُهُمْ بَعْضًا بِالْحَقِّ|съветваха се взаимно към истината','الصَّبْرُ|الصَّبْرُ عَلَى الْمَكْرُوهِ فِي سَبِيلِ الْحَقِّ|търпение в трудностите по пътя на истината'],
 e:['يُقْسِمُ اللّٰهُ تَعَالَى بِالْعَصْرِ أَنَّ النَّاسَ فِي خَسَارَةٍ،|Аллах Всевишният се кълне във времето, че хората са в загуба,','إِلَّا الَّذِينَ آمَنُوا بِاللّٰهِ وَعَمِلُوا الْأَعْمَالَ الصَّالِحَةَ،|освен онези, които повярваха в Аллах и вършеха праведни дела,','وَأَوْصَى بَعْضُهُمْ بَعْضًا بِالْحَقِّ، وَبِالصَّبْرِ عَلَى الْمَكْرُوهِ فِي سَبِيلِ الْحَقِّ.|и се съветваха взаимно към истината и към търпение в трудностите по пътя на истината.'],
 p:['الْمُؤْمِنُونَ تَوَاصَوْا بِالْخَيْرِ. ← (تَوَاصَى / بِالْحَقِّ)|تَوَاصَى / بِالْحَقِّ|الْمُؤْمِنُونَ تَوَاصَوْا بِالْحَقِّ.|Вярващите се съветваха взаимно към истината.|الْمُؤْمِنُونَ تَوَاصَى بِالْحَقِّ.|الْمُؤْمِنُونَ تَوَاصَوْا الْحَقَّ.','الْمُؤْمِنُونَ تَوَاصَوْا بِالْخَيْرِ. ← (آمَنَ / بِاللّٰهِ)|آمَنَ / بِاللّٰهِ|الْمُؤْمِنُونَ آمَنُوا بِاللّٰهِ.|Вярващите повярваха в Аллах.|الْمُؤْمِنُونَ آمَنَ بِاللّٰهِ.|الْمُؤْمِنُونَ آمَنُوا اللّٰهَ.','الْمُؤْمِنُونَ تَوَاصَوْا بِالْخَيْرِ. ← (عَمِلَ / الصَّالِحَاتِ)|عَمِلَ / الصَّالِحَاتِ|الْمُؤْمِنُونَ عَمِلُوا الصَّالِحَاتِ.|Вярващите вършеха праведни дела.|الْمُؤْمِنُونَ عَمِلَ الصَّالِحَاتِ.|الْمُؤْمِنُونَ عَمِلُوا بِالصَّالِحَاتِ.','الْمُؤْمِنُونَ تَوَاصَوْا بِالْخَيْرِ. ← (اسْتَعَانَ / بِاللّٰهِ)|اسْتَعَانَ / بِاللّٰهِ|الْمُؤْمِنُونَ اسْتَعَانُوا بِاللّٰهِ.|Вярващите потърсиха помощта на Аллах.|الْمُؤْمِنُونَ اسْتَعَانَ بِاللّٰهِ.|الْمُؤْمِنُونَ اسْتَعَانُوا اللّٰهَ.'],
 f:['إِنَّ الْإِنْسَانَ لَفِي ___|خُسْرٍ|صَبْرٍ|حَقٍّ','وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا ___|بِالصَّبْرِ|بِالْعَصْرِ|بِالْخُسْرِ','الْمُؤْمِنُ عَمِلَ عَمَلًا ___|صَالِحًا|خَاسِرًا|مَكْرُوهًا'],
 c:'ص|س',pp:['صَبَحَ|سَبَحَ','صَلَّى|سَلَّى','نَصْلٌ|نَسْلٌ','صَارَ|سَارَ'],
 q:['بِمَاذَا أَقْسَمَ اللّٰهُ تَعَالَى؟|بِالْعَصْرِ|بِالشَّمْسِ|بِاللَّيْلِ','مَنِ الَّذِينَ لَيْسُوا فِي خُسْرٍ؟|الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ|الَّذِينَ جَمَعُوا الْمَالَ|كُلُّ النَّاسِ','بِمَاذَا يَتَوَاصَى الْمُؤْمِنُونَ؟|بِالْحَقِّ وَبِالصَّبْرِ|بِالْمَالِ|بِالْخُسْرِ'],
 h:['كَانَ الرَّجُلَانِ مِنْ أَصْحَابِ رَسُولِ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ إِذَا الْتَقَيَا لَمْ يَتَفَرَّقَا حَتَّى يَقْرَأَ أَحَدُهُمَا عَلَى الْآخَرِ سُورَةَ الْعَصْرِ.|Когато двама от сподвижниците на Пратеника се срещнели, не се разделяли, докато единият не прочете на другия сура Ал-Аср. (по тълкуванието на Ибн Касир)']},
3:{m:['وَيْلٌ|كَلِمَةٌ لِلزَّجْرِ وَالْعَذَابِ|горко; дума за заплаха с наказание','هُمَزَةٍ لُمَزَةٍ|الَّذِي يَعِيبُ النَّاسَ بِقَوْلِهِ وَعَمَلِهِ|който хули хората с думи и дела','عَدَّدَهُ|عَدَّهُ مَرَّةً بَعْدَ مَرَّةٍ|броил го е отново и отново','أَخْلَدَهُ|جَعَلَهُ خَالِدًا لَا يَمُوتُ|ще го направи вечен, безсмъртен','لَيُنْبَذَنَّ|لَيُرْمَيَنَّ|непременно ще бъде хвърлен','الْحُطَمَةِ|النَّارُ يَوْمَ الْقِيَامَةِ|огънят в Съдния ден'],
 e:['الْعَذَابُ لِلَّذِي يَعِيبُ النَّاسَ بِقَوْلِهِ وَعَمَلِهِ،|Наказание очаква онзи, който хули хората с думи и дела,','وَلِلَّذِي يَجْمَعُ الْمَالَ وَهُوَ بَخِيلٌ، وَيَعُدُّهُ مَرَّةً بَعْدَ مَرَّةٍ.|и онзи, който трупа богатство, скъперник е и го брои отново и отново.','يَظُنُّ أَنَّ مَالَهُ يَجْعَلُهُ خَالِدًا لَا يَمُوتُ.|Той мисли, че богатството ще го направи безсмъртен.','كَلَّا! سَيُرْمَى فِي النَّارِ يَوْمَ الْقِيَامَةِ.|Не! Той ще бъде хвърлен в огъня в Съдния ден.'],
 p:['وَيْلٌ لَهُ (هُوَ). ← (هِيَ)|هِيَ|وَيْلٌ لَهَا.|Горко ѝ.|وَيْلٌ لَهُ.|وَيْلٌ لَكِ.','وَيْلٌ لَهُ (هُوَ). ← (أَنْتُمْ)|أَنْتُمْ|وَيْلٌ لَكُمْ.|Горко ви.|وَيْلٌ لَهُمْ.|وَيْلٌ لَكَ.','وَيْلٌ لَهُ (هُوَ). ← (أَنْتَ)|أَنْتَ|وَيْلٌ لَكَ.|Горко ти.|وَيْلٌ لَكِ.|وَيْلٌ لَهُ.','وَيْلٌ لَهُ (هُوَ). ← (هُمْ)|هُمْ|وَيْلٌ لَهُمْ.|Горко им.|وَيْلٌ لَكُمْ.|وَيْلٌ لَهُ.'],
 f:['وَيْلٌ لِكُلِّ هُمَزَةٍ ___|لُمَزَةٍ|مُوقَدَةٍ|مُؤْصَدَةٍ','الَّذِي جَمَعَ ___ وَعَدَّدَهُ|مَالًا|نَارًا|عَمَدًا','يَحْسَبُ أَنَّ مَالَهُ ___|أَخْلَدَهُ|عَدَّدَهُ|جَمَعَهُ','كَلَّا لَيُنْبَذَنَّ فِي ___|الْحُطَمَةِ|الْأَفْئِدَةِ|عَمَدٍ'],
 c:'ح|ه',pp:['حَرَمٌ|هَرَمٌ','نَحْرٌ|نَهْرٌ','امْتِحَانٌ|امْتِهَانٌ','سَحْلٌ|سَهْلٌ'],
 q:['لِمَنِ الْعَذَابُ فِي هٰذِهِ السُّورَةِ؟|لِلَّذِي يَعِيبُ النَّاسَ وَيَجْمَعُ الْمَالَ|لِلَّذِي يُصَلِّي|لِلَّذِي يُسَاعِدُ النَّاسَ','مَاذَا يَظُنُّ الْبَخِيلُ؟|أَنَّ مَالَهُ يَجْعَلُهُ خَالِدًا|أَنَّهُ فَقِيرٌ|أَنَّ الْمَالَ قَلِيلٌ','أَيْنَ سَيُرْمَى؟|فِي الْحُطَمَةِ|فِي الْمَسْجِدِ|فِي بَيْتِهِ']},
4:{m:['مَا أَدْرَاكَ|مَا أَعْلَمَكَ؟ كَيْفَ تَعْرِفُ؟|откъде да знаеш?','الْمُوقَدَةُ|الْمُشْتَعِلَةُ|разпаленият','تَطَّلِعُ عَلَى الْأَفْئِدَةِ|تَصِلُ إِلَى الْقُلُوبِ|стига до сърцата','مُؤْصَدَةٌ|مُغْلَقَةٌ|затворен','عَمَدٍ مُمَدَّدَةٍ|أَعْمِدَةٌ طَوِيلَةٌ|дълги стълбове'],
 e:['وَالْحُطَمَةُ نَارُ اللّٰهِ الْمُشْتَعِلَةُ،|А Ал-Хутама е разпаленият огън на Аллах,','وَهِيَ تَصِلُ إِلَى الْقُلُوبِ.|който стига до сърцата.','وَأَبْوَابُ جَهَنَّمَ مُغْلَقَةٌ عَلَيْهِمْ، وَعَلَيْهَا أَعْمِدَةٌ طَوِيلَةٌ،|Портите на Ада са затворени над тях и върху тях има дълги стълбове,','فَلَا يَخْرُجُونَ مِنْهَا.|и те не излизат оттам.'],
 o:['مُغْلَقٌ|مَفْتُوحٌ','مُشْتَعِلٌ|مُطْفَأٌ','طَوِيلٌ|قَصِيرٌ'],
 p:['مَا أَدْرَاكَ مَا الْحُطَمَةُ؟ ← (يَوْمُ الدِّينِ)|يَوْمُ الدِّينِ|مَا أَدْرَاكَ مَا يَوْمُ الدِّينِ؟|А откъде да знаеш какво е Съдният ден?|مَا أَدْرَاكَ مَا يَوْمَ الدِّينِ؟|مَا أَدْرَاكَ يَوْمُ الدِّينِ؟','الْحُجْرَةُ مُغْلَقَةٌ. ← (الْبَابُ)|الْبَابُ|الْبَابُ مُغْلَقٌ.|Вратата е затворена.|الْبَابُ مُغْلَقَةٌ.|الْبَابَ مُغْلَقٌ.','النَّارُ مُوقَدَةٌ. ← (النِّيرَانُ)|النِّيرَانُ|النِّيرَانُ مُوقَدَةٌ.|Огньовете са разпалени.|النِّيرَانُ مُوقَدٌ.|النِّيرَانَ مُوقَدَةٌ.'],
 f:['نَارُ اللّٰهِ ___|الْمُوقَدَةُ|الْمُؤْصَدَةُ|الْمُمَدَّدَةُ','الَّتِي تَطَّلِعُ عَلَى ___|الْأَفْئِدَةِ|الْعَمَدِ|الْحُطَمَةِ','إِنَّهَا عَلَيْهِمْ ___|مُؤْصَدَةٌ|مُوقَدَةٌ|مُمَدَّدَةٌ','فِي عَمَدٍ ___|مُمَدَّدَةٍ|مُؤْصَدَةٍ|مُوقَدَةٍ'],
 c:'ط|ت',pp:['طَابَ|تَابَ','طِينٌ|تِينٌ','طَامَّةٌ|تَامَّةٌ'],
 q:['مَا الْحُطَمَةُ؟|نَارُ اللّٰهِ الْمُوقَدَةُ|بَيْتٌ كَبِيرٌ|مَالٌ كَثِيرٌ','إِلَى أَيْنَ تَصِلُ النَّارُ؟|إِلَى الْقُلُوبِ|إِلَى الْأَبْوَابِ|إِلَى الْأَعْمِدَةِ','هَلْ يَخْرُجُونَ مِنْ جَهَنَّمَ؟|لَا، لِأَنَّ أَبْوَابَهَا مُؤْصَدَةٌ|نَعَمْ، بَعْدَ يَوْمٍ|نَعَمْ، لِأَنَّ أَبْوَابَهَا مَفْتُوحَةٌ']},
5:{m:['أَصْحَابِ الْفِيلِ|الْجَيْشُ الَّذِي جَاءَ وَمَعَهُ فِيلٌ|войската, която дошла със слон','كَيْدَهُمْ|خُطَّتَهُمْ|кроежът им','فِي تَضْلِيلٍ|فِي ضَيَاعٍ وَفَسَادٍ|пропаднал, провален','أَبَابِيلَ|جَمَاعَاتٍ|на ята','سِجِّيلٍ|طِينٌ يَابِسٌ مُحْرَقٌ|изпечена суха глина','كَعَصْفٍ مَأْكُولٍ|كَوَرَقِ الزَّرْعِ الْيَابِسِ الَّذِي أَكَلَتْهُ الْحَيَوَانَاتُ|като изядени от животните сухи листа'],
 e:['جَاءَ جَيْشُ أَبْرَهَةَ لِيَهْدِمَ الْكَعْبَةَ، وَكَانَ مَعَ الْجَيْشِ فِيلٌ.|Войската на Абраха дошла, за да разруши Кааба, и с нея имало слон.','فَأَرْسَلَ اللّٰهُ عَلَيْهِمْ جَمَاعَاتٍ مِنَ الطُّيُورِ تَحْمِلُ حِجَارَةً،|Аллах изпратил срещу тях ята птици, които носели камъни,','فَأَلْقَتِ الْحِجَارَةَ عَلَيْهِمْ فَمَاتُوا.|и те хвърлили камъните върху войниците и те загинали.'],
 p:['أَلْقَى الطَّيْرُ الْحِجَارَةَ عَلَيْهِ (هُوَ). ← (هُمْ)|هُمْ|أَلْقَى الطَّيْرُ الْحِجَارَةَ عَلَيْهِمْ.|Птиците хвърлиха камъните върху тях.|أَلْقَى الطَّيْرُ الْحِجَارَةَ عَلَيْهِ.|أَلْقَى الطَّيْرُ الْحِجَارَةُ عَلَيْهِمْ.','هَدَمَ الْعَامِلُ الْبَيْتَ. ← (الْجَيْشُ / الْمَدِينَةُ)|الْجَيْشُ / الْمَدِينَةُ|هَدَمَ الْجَيْشُ الْمَدِينَةَ.|Войската разруши града.|هَدَمَ الْجَيْشَ الْمَدِينَةُ.|هَدَمَتِ الْجَيْشُ الْمَدِينَةَ.','الطَّعَامُ مَأْكُولٌ. ← (الْخُبْزُ)|الْخُبْزُ|الْخُبْزُ مَأْكُولٌ.|Хлябът е изяден.|الْخُبْزُ مَأْكُولَةٌ.|الْخُبْزَ مَأْكُولٌ.'],
 f:['أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ ___|الْفِيلِ|الطَّيْرِ|الْكَعْبَةِ','وَأَرْسَلَ عَلَيْهِمْ طَيْرًا ___|أَبَابِيلَ|سِجِّيلٍ|مَأْكُولٍ','تَرْمِيهِمْ بِحِجَارَةٍ مِنْ ___|سِجِّيلٍ|تَضْلِيلٍ|عَصْفٍ','جَاءَ الْجَيْشُ لِيَهْدِمَ ___|الْكَعْبَةَ|الْفِيلَ|الطَّيْرَ'],
 q:['إِلَى أَيْنَ جَاءَ الْجَيْشُ؟ وَلِمَاذَا؟|إِلَى مَكَّةَ لِيَهْدِمَ الْكَعْبَةَ|إِلَى الْمَدِينَةِ لِلتِّجَارَةِ|إِلَى الْيَمَنِ لِلْحَرْبِ','مَاذَا كَانَ مَعَ الْجَيْشِ؟|فِيلٌ|طُيُورٌ|حِجَارَةٌ','مَاذَا أَرْسَلَ اللّٰهُ عَلَيْهِمْ؟|طُيُورًا تَحْمِلُ حِجَارَةً|جَيْشًا كَبِيرًا|مَاءً كَثِيرًا','مَاذَا قَالَ عَبْدُ الْمُطَّلِبِ لِأَبْرَهَةَ؟|أَنَا رَبُّ الْإِبِلِ، وَلِلْبَيْتِ رَبٌّ يَحْمِيهِ|أَنَا رَبُّ الْبَيْتِ|خُذُوا الْإِبِلَ وَاتْرُكُوا الْبَيْتَ'],
 h:['عِنْدَمَا جَاءَ جَيْشُ أَبْرَهَةَ مِنَ الْيَمَنِ إِلَى مَكَّةَ، أَخَذَ الْجُنُودُ إِبِلًا لِعَبْدِ الْمُطَّلِبِ، جَدِّ النَّبِيِّ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ.|Когато войската на Абраха дошла от Йемен към Мека, войниците взели камилите на Абдулмутталиб, дядото на Пророка.','فَذَهَبَ عَبْدُ الْمُطَّلِبِ إِلَى أَبْرَهَةَ وَطَلَبَ إِبِلَهُ.|Абдулмутталиб отишъл при Абраха и поискал камилите си.','تَعَجَّبَ أَبْرَهَةُ، لِأَنَّهُ لَمْ يَطْلُبْ مِنْهُ أَنْ يَتْرُكَ الْكَعْبَةَ.|Абраха се учудил, че не го моли да остави Кааба.','فَقَالَ عَبْدُ الْمُطَّلِبِ: أَنَا رَبُّ الْإِبِلِ، وَلِلْبَيْتِ رَبٌّ يَحْمِيهِ.|Абдулмутталиб отговорил: „Аз съм стопанинът на камилите, а Домът си има Господ, който ще го пази.“ (по „Сира“ на Ибн Хишам)']},
6:{m:['لِإِيلَافِ قُرَيْشٍ|لِاعْتِيَادِ قُرَيْشٍ وَتَعَوُّدِهِمْ|заради навика и сигурността на курайшитите','رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ|سَفَرُهُمْ لِلتِّجَارَةِ إِلَى الْيَمَنِ وَإِلَى الشَّامِ|търговските им пътувания до Йемен и до Шам','أَطْعَمَهُمْ|أَعْطَاهُمُ الطَّعَامَ|нахрани ги','آمَنَهُمْ|جَعَلَهُمْ فِي أَمْنٍ|направи ги в безопасност'],
 e:['أَنْعَمَ اللّٰهُ عَلَى قُرَيْشٍ بِنِعْمَةِ الْأَمْنِ وَنِعْمَةِ الطَّعَامِ.|Аллах дарил курайшитите с безопасност и с храна.','كَانَتْ لِقُرَيْشٍ رِحْلَتَانِ لِلتِّجَارَةِ: الْأُولَى إِلَى الْيَمَنِ فِي الشِّتَاءِ، وَالثَّانِيَةُ إِلَى الشَّامِ فِي الصَّيْفِ.|Курайш имали две търговски пътувания: до Йемен през зимата и до Шам през лятото.','لِهٰذَا يَجِبُ عَلَيْهِمْ أَنْ يَعْبُدُوا اللّٰهَ رَبَّ الْبَيْتِ الْحَرَامِ شُكْرًا لَهُ عَلَى هٰذِهِ النِّعَمِ.|Затова трябва да служат на Аллах, Господа на Свещения дом, в благодарност за тези блага.'],
 o:['الْأَمْنُ|الْخَوْفُ','الْجُوعُ|الشِّبَعُ','الشِّتَاءُ|الصَّيْفُ'],
 p:['أَطْعَمَهُ اللّٰهُ مِنْ جُوعٍ (هُوَ). ← (هُمْ)|هُمْ|أَطْعَمَهُمُ اللّٰهُ مِنْ جُوعٍ.|Аллах ги нахрани в глада.|أَطْعَمَهُ اللّٰهُ مِنْ جُوعٍ.|أَطْعَمَهُمُ اللّٰهُ مِنْ جُوعٌ.','أَطْعَمَهُ اللّٰهُ مِنْ جُوعٍ (هُوَ). ← (أَنْتَ)|أَنْتَ|أَطْعَمَكَ اللّٰهُ مِنْ جُوعٍ.|Аллах те нахрани в глада.|أَطْعَمَكِ اللّٰهُ مِنْ جُوعٍ.|أَطْعَمَهُ اللّٰهُ مِنْ جُوعٍ.','آمَنَهُ اللّٰهُ مِنْ خَوْفٍ (هُوَ). ← (هُمَا)|هُمَا|آمَنَهُمَا اللّٰهُ مِنْ خَوْفٍ.|Аллах ги опази (двамата) от страха.|آمَنَهُمُ اللّٰهُ مِنْ خَوْفٍ.|آمَنَهُ اللّٰهُ مِنْ خَوْفٍ.'],
 f:['لِإِيلَافِ ___|قُرَيْشٍ|الْبَيْتِ|الشِّتَاءِ','إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَ___|الصَّيْفِ|الْخَوْفِ|الْجُوعِ','فَلْيَعْبُدُوا رَبَّ هٰذَا ___|الْبَيْتِ|الشِّتَاءِ|الصَّيْفِ','الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ ___|خَوْفٍ|جُوعٍ|شِتَاءٍ'],
 q:['مَنِ الَّذِينَ يَخْرُجُونَ فِي رِحْلَةِ الشِّتَاءِ وَالصَّيْفِ؟|قُرَيْشٌ|أَصْحَابُ الْفِيلِ|أَهْلُ الْيَمَنِ','إِلَى أَيْنَ كَانَتْ رِحْلَةُ الشِّتَاءِ؟|إِلَى الْيَمَنِ|إِلَى الشَّامِ|إِلَى مِصْرَ','إِلَى أَيْنَ كَانَتْ رِحْلَةُ الصَّيْفِ؟|إِلَى الشَّامِ|إِلَى الْيَمَنِ|إِلَى الْعِرَاقِ','مَاذَا طَلَبَ اللّٰهُ مِنْ قُرَيْشٍ؟|أَنْ يَعْبُدُوا رَبَّ الْبَيْتِ|أَنْ يُسَافِرُوا كَثِيرًا|أَنْ يَجْمَعُوا الْمَالَ']},
7:{m:['يُكَذِّبُ بِالدِّينِ|لَا يُؤْمِنُ بِيَوْمِ الدِّينِ|не вярва в Съдния ден','يَدُعُّ الْيَتِيمَ|يَدْفَعُهُ بِشِدَّةٍ|отблъсква го грубо','الْيَتِيمُ|الَّذِي مَاتَ أَبُوهُ وَهُوَ صَغِيرٌ|дете, чийто баща е починал','لَا يَحُضُّ|لَا يَحُثُّ|не подтиква','سَاهُونَ|غَافِلُونَ، لَا يُصَلُّونَ الصَّلَاةَ فِي وَقْتِهَا|нехайни: не се молят навреме','يُرَاءُونَ|يُصَلُّونَ لِيَرَاهُمُ النَّاسُ|молят се, за да ги видят хората','الْمَاعُونَ|الشَّيْءُ الرَّخِيصُ، مِثْلُ الْقَلَمِ وَالْمِلْحِ وَالْمَاءِ|дребни евтини неща като химикалка, сол и вода'],
 e:['الْمُسْلِمُ يُؤْمِنُ بِيَوْمِ الدِّينِ، وَيُسَاعِدُ الْيَتِيمَ، وَيُطْعِمُ الْمِسْكِينَ.|Мюсюлманинът вярва в Съдния ден, помага на сирачето и храни бедния.','وَالْكَافِرُ لَا يُؤْمِنُ بِيَوْمِ الدِّينِ، وَيَدْفَعُ الْيَتِيمَ، وَلَا يَحُثُّ عَلَى إِطْعَامِ الْمِسْكِينِ.|А неверникът не вярва в Съдния ден, отблъсква сирачето и не подтиква към нахранване на бедния.','وَالْوَيْلُ لِلَّذِينَ لَا يُصَلُّونَ فِي الْوَقْتِ، أَوْ يُصَلُّونَ لِيَرَاهُمُ النَّاسُ، وَيَمْنَعُونَ النَّاسَ الشَّيْءَ الْقَلِيلَ.|Горко на онези, които не се молят навреме или се молят, за да ги видят хората, и отказват на хората и най-дребното.'],
 o:['يُسَاعِدُ|يَدُعُّ','غَافِلٌ|ذَاكِرٌ','يَمْنَعُ|يُعْطِي'],
 p:['الْمُسْلِمُ يُسَاعِدُ الْيَتِيمَ، وَالْكَافِرُ … (يَدُعُّ)|يَدُعُّ|وَالْكَافِرُ يَدُعُّ الْيَتِيمَ.|А неверникът отблъсква сирачето.|وَالْكَافِرُ يُسَاعِدُ الْيَتِيمَ.|وَالْكَافِرُ يَدُعُّ الْيَتِيمُ.','الْمُسْلِمُ يُطْعِمُ الْمِسْكِينَ، وَالْكَافِرُ … (لَا يُطْعِمُ)|لَا يُطْعِمُ|وَالْكَافِرُ لَا يُطْعِمُ الْمِسْكِينَ.|А неверникът не храни бедния.|وَالْكَافِرُ يُطْعِمُ الْمِسْكِينَ.|وَالْكَافِرُ لَا يُطْعِمُ الْمِسْكِينُ.'],
 f:['أَرَأَيْتَ الَّذِي يُكَذِّبُ ___|بِالدِّينِ|بِالْيَتِيمِ|بِالْمَاعُونِ','فَذٰلِكَ الَّذِي يَدُعُّ ___|الْيَتِيمَ|الْمِسْكِينَ|الْمَاعُونَ','وَلَا يَحُضُّ عَلَى طَعَامِ ___|الْمِسْكِينِ|الْيَتِيمِ|الدِّينِ','وَضَعَ خَالِدٌ ___ فِي الطَّعَامِ|الْمِلْحَ|الْقَلَمَ|الْمِسْطَرَةَ'],
 q:['هَلْ كَانَ الرَّسُولُ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ يَتِيمًا؟|نَعَمْ، مَاتَ أَبُوهُ وَهُوَ صَغِيرٌ|لَا|لَا نَعْرِفُ','مَنْ يَدُعُّ الْيَتِيمَ؟|الَّذِي يُكَذِّبُ بِالدِّينِ|الْمُسْلِمُ|الْمِسْكِينُ','مَنْ يُطْعِمُ الْمِسْكِينَ؟|الْمُسْلِمُ|الْكَافِرُ|الَّذِي يُرَائِي','مَا عَاقِبَةُ الْغَافِلِ عَنْ صَلَاتِهِ؟|الْوَيْلُ|الْخَيْرُ الْكَثِيرُ|الْمَالُ'],
 h:['سُئِلَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ عَنِ الَّذِينَ هُمْ عَنْ صَلَاتِهِمْ سَاهُونَ، فَقَالَ: هُمُ الَّذِينَ يُؤَخِّرُونَ الصَّلَاةَ عَنْ وَقْتِهَا.|Попитали Пратеника кои са „нехайните за молитвата си“ и той казал: „Онези, които отлагат молитвата след нейното време.“ (по тълкуванието на Ибн Касир)']},
8:{m:['الْكَوْثَرَ|الْخَيْرُ الْكَثِيرُ، وَهُوَ نَهْرٌ فِي الْجَنَّةِ|голямото благо — река в Рая','انْحَرْ|اذْبَحِ الْأُضْحِيَةَ لِلّٰهِ|заколи жертвеното животно за Аллах','شَانِئَكَ|الَّذِي يُبْغِضُكَ|мразещият те','الْأَبْتَرُ|الْمُنْقَطِعُ عَنِ الْخَيْرِ|откъснатият от всяко добро'],
 e:['إِنَّ اللّٰهَ تَعَالَى أَعْطَاكَ يَا مُحَمَّدُ خَيْرًا كَثِيرًا،|Аллах Всевишният ти дари, Мохамед, голямо благо,','فَصَلِّ لِرَبِّكَ وَاذْبَحْ لَهُ.|затова се моли на своя Господ и коли жертва за Него.','إِنَّ الَّذِي يُبْغِضُكَ هُوَ الْمُنْقَطِعُ عَنِ الْخَيْرِ.|Онзи, който те мрази, той е откъснатият от всяко добро.','وَسَبَبُ نُزُولِ السُّورَةِ أَنَّ مُشْرِكًا قَالَ: إِنَّ مُحَمَّدًا أَبْتَرُ، لَا وَلَدَ لَهُ.|Сурата била низпослана, защото един многобожник казал: „Мохамед е откъснат — няма син.“'],
 p:['ذَبَحَ الْمُسْلِمُ … (الْأُضْحِيَةُ)|الْأُضْحِيَةُ|ذَبَحَ الْمُسْلِمُ الْأُضْحِيَةَ.|Мюсюлманинът закла жертвеното животно.|ذَبَحَ الْمُسْلِمُ الْأُضْحِيَةُ.|ذَبَحَ الْمُسْلِمُ بِالْأُضْحِيَةِ.','أَعْطَى اللّٰهُ … خَيْرًا كَثِيرًا (أَنْتَ)|أَنْتَ|أَعْطَاكَ اللّٰهُ خَيْرًا كَثِيرًا.|Аллах ти даде голямо благо.|أَعْطَاكِ اللّٰهُ خَيْرًا كَثِيرًا.|أَعْطَاكَ اللّٰهُ خَيْرٌ كَثِيرٌ.'],
 f:['إِنَّا أَعْطَيْنَاكَ ___|الْكَوْثَرَ|الْأَبْتَرَ|الْأُضْحِيَةَ','فَصَلِّ لِرَبِّكَ وَ___|انْحَرْ|اقْرَأْ|اكْتُبْ','إِنَّ شَانِئَكَ هُوَ ___|الْأَبْتَرُ|الْكَوْثَرُ|الْمُسْلِمُ'],
 q:['مَا الْكَوْثَرُ؟|نَهْرٌ فِي الْجَنَّةِ، فِيهِ خَيْرٌ كَثِيرٌ|بَيْتٌ فِي مَكَّةَ|اسْمُ رَجُلٍ','مَا سَبَبُ نُزُولِ سُورَةِ الْكَوْثَرِ؟|قَالَ مُشْرِكٌ: إِنَّ مُحَمَّدًا أَبْتَرُ|سَأَلَ الْمُسْلِمُونَ عَنِ الصَّلَاةِ|جَاءَ جَيْشٌ إِلَى مَكَّةَ','بِمَاذَا أَمَرَ اللّٰهُ الرَّسُولَ فِي السُّورَةِ؟|بِالصَّلَاةِ وَالذَّبْحِ لِلّٰهِ|بِالسَّفَرِ|بِالتِّجَارَةِ','مَنِ الْأَبْتَرُ؟|الَّذِي يُبْغِضُ الرَّسُولَ|الرَّسُولُ|الْمُسْلِمُ'],
 h:['جَلَسَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ يَوْمًا مَعَ أَصْحَابِهِ، ثُمَّ رَفَعَ رَأْسَهُ مُبْتَسِمًا.|Един ден Пратеникът седял със сподвижниците си, после вдигнал глава усмихнат.','فَسَأَلُوهُ عَنْ ذٰلِكَ، فَقَالَ: نَزَلَتْ عَلَيَّ الْآنَ سُورَةٌ، وَقَرَأَ سُورَةَ الْكَوْثَرِ.|Попитали го защо и той казал: „Току-що ми беше низпослана сура“ и прочел сура Ал-Каусар.','ثُمَّ قَالَ: أَتَدْرُونَ مَا الْكَوْثَرُ؟ فَإِنَّهُ نَهْرٌ وَعَدَنِيهِ رَبِّي، عَلَيْهِ خَيْرٌ كَثِيرٌ.|После казал: „Знаете ли какво е Ал-Каусар? Това е река, която моят Господ ми обеща, и при нея има голямо благо.“ (по Муслим)']},
9:{m:['الْكَافِرُونَ|الَّذِينَ لَا يُؤْمِنُونَ بِاللّٰهِ|онези, които не вярват в Аллах','لَا أَعْبُدُ مَا تَعْبُدُونَ|لَا أَعْبُدُ الْأَصْنَامَ الَّتِي تَعْبُدُونَهَا|не служа на идолите, на които вие служите','عَابِدٌ|الَّذِي يَعْبُدُ|служещ, който служи','لَكُمْ دِينُكُمْ وَلِيَ دِينِ|لَكُمْ عَقِيدَتُكُمْ، وَلِيَ الْإِسْلَامُ|вие имате своята вяра, а аз — исляма'],
 e:['طَلَبَ الْكَافِرُونَ مِنْ رَسُولِ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ أَنْ يَعْبُدَ آلِهَتَهُمْ سَنَةً، وَيَعْبُدُوا إِلٰهَهُ سَنَةً.|Неверниците предложили на Пратеника една година той да служи на техните божества, а те една година — на неговия Бог.','فَأَنْزَلَ اللّٰهُ هٰذِهِ السُّورَةَ، وَأَمَرَهُ أَنْ يَقُولَ لَهُمْ: لَا أَعْبُدُ مَا تَعْبُدُونَ.|Тогава Аллах низпослал тази сура и му повелил да им каже: „Не служа на онова, на което вие служите.“','فَالْمُسْلِمُ يَعْبُدُ اللّٰهَ وَحْدَهُ، وَلَا يَعْبُدُ غَيْرَهُ.|Мюсюлманинът служи само на Аллах и на никой друг.'],
 p:['الْمُسْلِمُ دِينُهُ الْإِسْلَامُ. ← (الْمُسْلِمُونَ)|الْمُسْلِمُونَ|الْمُسْلِمُونَ دِينُهُمُ الْإِسْلَامُ.|Вярата на мюсюлманите е ислямът.|الْمُسْلِمُونَ دِينُهُ الْإِسْلَامُ.|الْمُسْلِمُونَ دِينُهُمَا الْإِسْلَامُ.','الْمُسْلِمُ دِينُهُ الْإِسْلَامُ. ← (الْمُسْلِمَانِ)|الْمُسْلِمَانِ|الْمُسْلِمَانِ دِينُهُمَا الْإِسْلَامُ.|Вярата на двамата мюсюлмани е ислямът.|الْمُسْلِمَانِ دِينُهُمُ الْإِسْلَامُ.|الْمُسْلِمَانِ دِينُهُ الْإِسْلَامُ.','الْمُسْلِمُ دِينُهُ الْإِسْلَامُ. ← (نَحْنُ)|نَحْنُ|نَحْنُ دِينُنَا الْإِسْلَامُ.|Нашата вяра е ислямът.|نَحْنُ دِينُهُمُ الْإِسْلَامُ.|نَحْنُ دِينِي الْإِسْلَامُ.','الْمُسْلِمُ دِينُهُ الْإِسْلَامُ. ← (الْمُسْلِمَةُ)|الْمُسْلِمَةُ|الْمُسْلِمَةُ دِينُهَا الْإِسْلَامُ.|Вярата на мюсюлманката е ислямът.|الْمُسْلِمَةُ دِينُهُ الْإِسْلَامُ.|الْمُسْلِمَةُ دِينُهُمُ الْإِسْلَامُ.'],
 f:['قُلْ يَا أَيُّهَا ___|الْكَافِرُونَ|الْمُسْلِمُونَ|الْعَابِدُونَ','لَا أَعْبُدُ مَا ___|تَعْبُدُونَ|أَعْبُدُ|عَابِدٌ','لَكُمْ دِينُكُمْ وَلِيَ ___|دِينِ|عَابِدٌ|أَعْبُدُ'],
 q:['مَاذَا طَلَبَ الْكَافِرُونَ مِنَ الرَّسُولِ؟|أَنْ يَعْبُدَ آلِهَتَهُمْ سَنَةً، وَيَعْبُدُوا إِلٰهَهُ سَنَةً|أَنْ يَتْرُكَ مَكَّةَ|أَنْ يُعْطِيَهُمْ مَالًا','هَلْ قَبِلَ الرَّسُولُ طَلَبَهُمْ؟|لَا|نَعَمْ|نَعَمْ، سَنَةً وَاحِدَةً','مَاذَا أَمَرَهُ اللّٰهُ أَنْ يَقُولَ لَهُمْ؟|لَا أَعْبُدُ مَا تَعْبُدُونَ|أَنَا أَعْبُدُ مَا تَعْبُدُونَ|أَنْتُمْ عَلَى الْحَقِّ'],
 h:['كَانَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ يَقْرَأُ هٰذِهِ السُّورَةَ وَسُورَةَ الْإِخْلَاصِ فِي رَكْعَتَيِ الطَّوَافِ.|Пратеникът четял тази сура и сура Ал-Ихлас в двата раката след обикалянето около Кааба.','وَجَاءَ فِي الْحَدِيثِ أَنَّ سُورَةَ الْكَافِرُونَ تَعْدِلُ رُبُعَ الْقُرْآنِ.|И в хадис се казва, че сура Ал-Кафирун се равнява на една четвърт от Корана. (ат-Тирмизи)']},
10:{m:['نَصْرُ اللّٰهِ|نَصَرَ اللّٰهُ نَبِيَّهُ عَلَى الْمُشْرِكِينَ|Аллах дари Пророка с победа над многобожниците','الْفَتْحُ|دُخُولُ الرَّسُولِ مَكَّةَ مُنْتَصِرًا|влизането на Пратеника в Мека като победител','أَفْوَاجًا|جَمَاعَاتٍ|на групи, тълпи','فَسَبِّحْ بِحَمْدِ رَبِّكَ|قُلْ: سُبْحَانَ اللّٰهِ، وَالْحَمْدُ لِلّٰهِ|казвай „Пречист е Аллах“ и „Хвала на Аллах“','اسْتَغْفِرْهُ|اطْلُبْ مِنْهُ الْمَغْفِرَةَ|моли Го за прошка','تَوَّابًا|يَقْبَلُ تَوْبَةَ التَّائِبِينَ|приема покаянието на каещите се'],
 e:['إِذَا أَتَى النَّصْرُ مِنَ اللّٰهِ، وَدَخَلْتَ مَكَّةَ مُنْتَصِرًا،|Когато дойде победата от Аллах и влезеш в Мека като победител,','وَدَخَلَ النَّاسُ فِي الْإِسْلَامِ جَمَاعَاتٍ كَثِيرَةً،|и хората влизат в исляма на големи групи,','فَقُلْ يَا مُحَمَّدُ: سُبْحَانَ اللّٰهِ وَالْحَمْدُ لِلّٰهِ، وَاسْأَلْ رَبَّكَ أَنْ يَغْفِرَ لَكَ؛ إِنَّ اللّٰهَ يَقْبَلُ تَوْبَةَ التَّائِبِ.|казвай, Мохамед, „Пречист е Аллах“ и „Хвала на Аллах“ и моли своя Господ за прошка — Аллах приема покаянието на каещия се.'],
 p:['إِذَا دَخَلَ الْوَقْتُ … (صَلِّ لِلّٰهِ)|صَلِّ لِلّٰهِ|إِذَا دَخَلَ الْوَقْتُ فَصَلِّ لِلّٰهِ.|Когато дойде времето, моли се на Аллах.|إِذَا دَخَلَ الْوَقْتَ فَصَلِّ لِلّٰهِ.|إِذَا دَخَلَ الْوَقْتُ فَيُصَلِّي لِلّٰهِ.','إِذَا جَاءَ نَصْرُ اللّٰهِ … (سَبِّحْ)|سَبِّحْ|إِذَا جَاءَ نَصْرُ اللّٰهِ فَسَبِّحْ.|Когато дойде помощта на Аллах, прославяй Го.|إِذَا جَاءَ نَصْرُ اللّٰهِ فَيُسَبِّحُ.|إِذَا جَاءَ نَصْرَ اللّٰهِ فَسَبِّحْ.','إِذَا أَخْطَأْتَ … (اسْتَغْفِرِ اللّٰهَ)|اسْتَغْفِرِ اللّٰهَ|إِذَا أَخْطَأْتَ فَاسْتَغْفِرِ اللّٰهَ.|Когато сгрешиш, моли Аллах за прошка.|إِذَا أَخْطَأْتَ فَيَسْتَغْفِرُ اللّٰهَ.|إِذَا أَخْطَأْتَ فَاسْتَغْفِرِ اللّٰهُ.'],
 f:['إِذَا جَاءَ نَصْرُ اللّٰهِ وَ___|الْفَتْحُ|النَّاسُ|التَّوَّابُ','وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللّٰهِ ___|أَفْوَاجًا|تَوَّابًا|نَصْرًا','فَسَبِّحْ بِحَمْدِ رَبِّكَ وَ___|اسْتَغْفِرْهُ|انْحَرْ|اقْرَأْ'],
 q:['عَنْ أَيِّ فَتْحٍ تَتَحَدَّثُ السُّورَةُ؟|فَتْحِ مَكَّةَ|فَتْحِ الْيَمَنِ|فَتْحِ الشَّامِ','كَيْفَ دَخَلَ النَّاسُ فِي الْإِسْلَامِ؟|جَمَاعَاتٍ كَثِيرَةً|وَاحِدًا وَاحِدًا|لَمْ يَدْخُلُوا','بِمَاذَا أَمَرَ اللّٰهُ الرَّسُولَ فِي هٰذِهِ السُّورَةِ؟|بِالتَّسْبِيحِ وَالْحَمْدِ وَالِاسْتِغْفَارِ|بِالسَّفَرِ إِلَى الْيَمَنِ|بِجَمْعِ الْمَالِ'],
 h:['قَالَتْ عَائِشَةُ أُمُّ الْمُؤْمِنِينَ: كَانَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ يُكْثِرُ فِي آخِرِ أَمْرِهِ مِنْ قَوْلِ: سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ، أَسْتَغْفِرُ اللّٰهَ وَأَتُوبُ إِلَيْهِ.|Аиша, майката на вярващите, казва: „В последните години Пратеникът често казваше: Пречист е Аллах и Нему хвала; моля Аллах за прошка и се покайвам пред Него.“ (Муслим)']},
11:{m:['تَبَّتْ|هَلَكَتْ وَخَسِرَتْ|да загинат, да пропаднат','مَا أَغْنَى عَنْهُ|مَا نَفَعَهُ|не му помогна','مَا كَسَبَ|مَا جَمَعَ مِنْ مَالٍ وَأَوْلَادٍ|онова, което спечели: имот и деца','سَيَصْلَى|سَيَدْخُلُ|ще влезе (ще гори)','ذَاتَ لَهَبٍ|مُشْتَعِلَةٌ|пламтящ','جِيدِهَا|عُنُقِهَا|шията ѝ','مَسَدٍ|لِيفٍ|палмови влакна'],
 e:['كَانَ أَبُو لَهَبٍ، عَمُّ رَسُولِ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ، لَا يُحِبُّ الْإِسْلَامَ، وَكَانَ يُؤْذِي الرَّسُولَ.|Абу Лахаб, чичото на Пратеника, не обичал исляма и тормозел Пратеника.','وَفِي أَحَدِ الْأَيَّامِ جَمَعَ النَّبِيُّ النَّاسَ، وَدَعَاهُمْ إِلَى عِبَادَةِ اللّٰهِ.|Един ден Пророкът събрал хората и ги призовал да служат на Аллах.','فَقَالَ أَبُو لَهَبٍ: تَبًّا لَكَ! أَلِهٰذَا جَمَعْتَنَا؟|Абу Лахаб казал: „Да пропаднеш! За това ли ни събра?“','فَأَنْزَلَ اللّٰهُ سُورَةَ الْمَسَدِ، وَبَيَّنَ فِيهَا أَنَّ أَبَا لَهَبٍ وَزَوْجَتَهُ سَيُعَذَّبَانِ فِي النَّارِ.|Тогава Аллах низпослал сура Ал-Масад и показал в нея, че Абу Лахаб и жена му ще бъдат наказани в огъня.'],
 p:['مَا يَنْفَعُهُ إِلَّا الْعَمَلُ الصَّالِحُ (هُوَ). ← (أَنَا)|أَنَا|مَا يَنْفَعُنِي إِلَّا الْعَمَلُ الصَّالِحُ.|Нищо не ми помага освен праведните дела.|مَا يَنْفَعُهُ إِلَّا الْعَمَلُ الصَّالِحُ.|مَا يَنْفَعُكَ إِلَّا الْعَمَلُ الصَّالِحُ.','مَا يَنْفَعُهُ إِلَّا الْعَمَلُ الصَّالِحُ (هُوَ). ← (هُمْ)|هُمْ|مَا يَنْفَعُهُمْ إِلَّا الْعَمَلُ الصَّالِحُ.|Нищо не им помага освен праведните дела.|مَا يَنْفَعُهُمَا إِلَّا الْعَمَلُ الصَّالِحُ.|مَا يَنْفَعُهُمْ إِلَّا الْعَمَلَ الصَّالِحَ.','الْمُشْرِكُ فِي النَّارِ. ← (الْمُشْرِكُونَ)|الْمُشْرِكُونَ|الْمُشْرِكُونَ فِي النَّارِ.|Многобожниците са в огъня.|الْمُشْرِكِينَ فِي النَّارِ.|الْمُشْرِكَانِ فِي النَّارِ.','الْمُشْرِكُ فِي النَّارِ. ← (الْمُشْرِكَاتُ)|الْمُشْرِكَاتُ|الْمُشْرِكَاتُ فِي النَّارِ.|Многобожниците (жени) са в огъня.|الْمُشْرِكَاتِ فِي النَّارِ.|الْمُشْرِكَتَانِ فِي النَّارِ.'],
 f:['تَبَّتْ يَدَا أَبِي ___ وَتَبَّ|لَهَبٍ|جَهْلٍ|مَسَدٍ','مَا أَغْنَى عَنْهُ مَالُهُ وَمَا ___|كَسَبَ|حَمَلَ|نَفَعَ','وَامْرَأَتُهُ حَمَّالَةَ ___|الْحَطَبِ|الْمَالِ|الْحَبْلِ','فِي جِيدِهَا حَبْلٌ مِنْ ___|مَسَدٍ|لَهَبٍ|حَطَبٍ'],
 q:['مَنْ كَانَ يُؤْذِي الرَّسُولَ؟|أَبُو لَهَبٍ عَمُّهُ|أَبُو بَكْرٍ صَاحِبُهُ|عَبْدُ الْمُطَّلِبِ جَدُّهُ','لِمَاذَا كَانَ يُؤْذِيهِ؟|لِأَنَّهُ لَا يُحِبُّ الْإِسْلَامَ|لِأَنَّهُ فَقِيرٌ|لِأَنَّهُ مَرِيضٌ','مَا سَبَبُ نُزُولِ سُورَةِ الْمَسَدِ؟|قَالَ أَبُو لَهَبٍ لِلرَّسُولِ: تَبًّا لَكَ!|جَاءَ جَيْشٌ إِلَى مَكَّةَ|طَلَبَ الْكَافِرُونَ أَنْ يَعْبُدَ آلِهَتَهُمْ','أَيْنَ سَيُعَذَّبُ أَبُو لَهَبٍ وَزَوْجَتُهُ؟|فِي النَّارِ|فِي الدُّنْيَا فَقَطْ|لَا يُعَذَّبَانِ']},
12:{m:['أَحَدٌ|وَاحِدٌ لَا شَرِيكَ لَهُ|Единен, без съдружник','الصَّمَدُ|الَّذِي يَحْتَاجُ إِلَيْهِ النَّاسُ وَلَا يَحْتَاجُ إِلَيْهِمْ، الدَّائِمُ الْبَاقِي|Онзи, от Когото всички се нуждаят, а Той не се нуждае от никого; Вечният','لَمْ يَلِدْ|لَيْسَ لَهُ وَلَدٌ|няма дете','لَمْ يُولَدْ|لَيْسَ لَهُ وَالِدٌ|няма родител','كُفُوًا|مِثْلًا، شَبِيهًا|равен, подобен'],
 e:['قَالَ الْكَافِرُونَ لِلنَّبِيِّ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ: يَا مُحَمَّدُ، صِفْ لَنَا رَبَّكَ.|Неверниците казали на Пророка: „Мохамед, опиши ни своя Господ.“','فَأَنْزَلَ اللّٰهُ: قُلْ يَا مُحَمَّدُ: اللّٰهُ وَاحِدٌ لَا شَرِيكَ لَهُ،|И Аллах низпослал: кажи, Мохамед: Аллах е един, без съдружник,','يَحْتَاجُ إِلَيْهِ النَّاسُ وَلَا يَحْتَاجُ إِلَيْهِمْ، لَيْسَ لَهُ وَلَدٌ وَلَا وَالِدٌ، وَلَيْسَ لَهُ شَبِيهٌ.|хората се нуждаят от Него, а Той — не от тях; няма дете, нито родител, и няма подобен на Него.'],
 p:['لَيْسَ لِلّٰهِ وَلَدٌ. ← (شَبِيهٌ)|شَبِيهٌ|لَيْسَ لِلّٰهِ شَبِيهٌ.|Аллах няма подобен.|لَيْسَ لِلّٰهِ شَبِيهًا.|لَيْسَ اللّٰهُ شَبِيهٌ.','اللّٰهُ لَا يَحْتَاجُ إِلَى النَّاسِ. ← (النَّاسُ / اللّٰهُ)|النَّاسُ / اللّٰهُ|النَّاسُ يَحْتَاجُونَ إِلَى اللّٰهِ.|Хората се нуждаят от Аллах.|النَّاسُ يَحْتَاجُ إِلَى اللّٰهِ.|النَّاسُ لَا يَحْتَاجُونَ إِلَى اللّٰهِ.','صِفْ لَنَا رَبَّكَ (أَنْتَ). ← (أَنْتُمْ)|أَنْتُمْ|صِفُوا لَنَا رَبَّكُمْ.|Опишете ни своя Господ.|صِفْ لَنَا رَبَّكُمْ.|صِفُوا لَنَا رَبَّكَ.'],
 f:['قُلْ هُوَ اللّٰهُ ___|أَحَدٌ|الصَّمَدُ|كُفُوًا','لَمْ يَلِدْ وَلَمْ ___|يُولَدْ|يَكُنْ|يَصِفْ','وَلَمْ يَكُنْ لَهُ ___ أَحَدٌ|كُفُوًا|وَلَدٌ|صَمَدٌ'],
 q:['مَاذَا طَلَبَ الْكَافِرُونَ مِنَ النَّبِيِّ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ؟|أَنْ يَصِفَ لَهُمْ رَبَّهُ|أَنْ يَعْبُدَ آلِهَتَهُمْ|أَنْ يَتْرُكَ مَكَّةَ','هَلْ لِلّٰهِ وَلَدٌ؟|لَا، لَمْ يَلِدْ وَلَمْ يُولَدْ|نَعَمْ|لَا نَعْرِفُ','هَلْ لِلّٰهِ شَبِيهٌ؟|لَا، لَيْسَ لَهُ شَبِيهٌ|نَعَمْ|نَعَمْ، الْمَلِكُ','مَا مَعْنَى «الصَّمَدِ»؟|الَّذِي يَحْتَاجُ إِلَيْهِ النَّاسُ وَلَا يَحْتَاجُ إِلَيْهِمْ|الَّذِي لَهُ وَلَدٌ|الَّذِي يَحْتَاجُ إِلَى النَّاسِ'],
 h:['قَالَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ: مَنْ قَرَأَ «قُلْ هُوَ اللّٰهُ أَحَدٌ» فَكَأَنَّمَا قَرَأَ ثُلُثَ الْقُرْآنِ.|Пратеникът казва: „Който прочете „Кажи: Той е Аллах, Единният“, все едно е прочел една трета от Корана.“ (Ахмад)']},
13:{m:['الْفَلَقِ|الصُّبْحُ|зората, утрото','خَلَقَ|أَوْجَدَ|сътвори','غَاسِقٍ|اللَّيْلُ إِذَا أَظْلَمَ|нощта, когато притъмнее','وَقَبَ|دَخَلَ|настъпи, навлезе','النَّفَّاثَاتِ فِي الْعُقَدِ|السَّاحِرَاتُ اللَّاتِي يَنْفُخْنَ فِي عُقَدِ الْحَبْلِ|магьосниците, които духат във възлите на въжето','حَاسِدٍ|الَّذِي يَتَمَنَّى زَوَالَ نِعْمَةِ اللّٰهِ عَنْ غَيْرِهِ|който желае другите да загубят благата от Аллах'],

 e:['أَقْسَمَ اللّٰهُ تَعَالَى بِالشَّمْسِ وَالْقَمَرِ، وَالنَّهَارِ وَاللَّيْلِ، وَالسَّمَاءِ وَالْأَرْضِ، وَالنَّفْسِ الَّتِي خَلَقَهَا.|Аллах Всевишният се кълне в слънцето и луната, в деня и нощта, в небето и земята и в душата, която е сътворил.','وَعَلَّمَ الْإِنْسَانَ الْخَيْرَ وَالشَّرَّ؛ فَمَنْ طَهَّرَ نَفْسَهُ فَازَ، وَمَنْ تَرَكَهَا تَفْعَلُ الشَّرَّ خَسِرَ.|Той научи човека на доброто и злото: който пречисти душата си, успява, а който я остави да върши зло, губи.','ثُمَّ ذَكَرَ قِصَّةَ ثَمُودَ قَوْمِ صَالِحٍ، كَذَّبُوا نَبِيَّهُمْ وَذَبَحُوا النَّاقَةَ، فَأَهْلَكَهُمُ اللّٰهُ.|После разказа за Самуд, народа на Салих: те отрекоха пророка си и заклаха камилата и Аллах ги унищожи.'],
