 p:['اللَّيْلُ يَتْلُو النَّهَارَ.|يَجِيءُ بَعْدَهُ|اللَّيْلُ يَجِيءُ بَعْدَ النَّهَارِ.|Нощта идва след деня.|اللَّيْلُ يَجِيءُ قَبْلَ النَّهَارِ.|اللَّيْلُ يَجِيءُ مَعَ النَّهَارِ.','أَلْهَمَ اللّٰهُ الْإِنْسَانَ الْفُجُورَ وَالتَّقْوَى.|الشَّرُّ وَالْخَيْرُ|أَلْهَمَ اللّٰهُ الْإِنْسَانَ الشَّرَّ وَالْخَيْرَ.|Аллах даде на човека да познава злото и доброто.|أَلْهَمَ اللّٰهُ الْإِنْسَانَ الشَّرُّ وَالْخَيْرُ.|أَلْهَمَ اللّٰهُ الْإِنْسَانَ الْخَيْرَ فَقَطْ.','سَوَّى اللّٰهُ الْإِنْسَ وَالْجِنَّ.|خَلَقَ|خَلَقَ اللّٰهُ الْإِنْسَ وَالْجِنَّ.|Аллах сътвори хората и джиновете.|خَلَقَ اللّٰهُ الْإِنْسُ وَالْجِنُّ.|خَلَقَتِ اللّٰهُ الْإِنْسَ وَالْجِنَّ.','غَشِيَ الظَّلَامُ الْأَرْضَ.|غَطَّى|غَطَّى الظَّلَامُ الْأَرْضَ.|Мракът покри земята.|غَطَّى الظَّلَامَ الْأَرْضُ.|كَشَفَ الظَّلَامُ الْأَرْضَ.'],
 f:['وَالْقَمَرِ إِذَا ___|تَلَاهَا|جَلَّاهَا|طَحَاهَا','قَدْ أَفْلَحَ مَنْ ___|زَكَّاهَا|دَسَّاهَا|سَوَّاهَا','كَذَّبَتْ ___ بِطَغْوَاهَا|ثَمُودُ|النَّاقَةُ|الشَّمْسُ','فَقَالَ لَهُمْ رَسُولُ اللّٰهِ نَاقَةَ اللّٰهِ وَ___|سُقْيَاهَا|عُقْبَاهَا|ضُحَاهَا'],
 k:['أَقْسَمَ اللّٰهُ بِالسَّمَاءِ وَمَنْ رَفَعَهَا.|5','فَازَ الَّذِي طَهَّرَ نَفْسَهُ مِنَ الذُّنُوبِ.|9','ذَبَحُوا النَّاقَةَ فَأَهْلَكَهُمُ اللّٰهُ.|14','عَلَّمَ اللّٰهُ النَّفْسَ الشَّرَّ وَالْخَيْرَ.|8'],
 q:['بِمَاذَا أَقْسَمَ اللّٰهُ فِي أَوَّلِ السُّورَةِ؟|بِالشَّمْسِ وَالْقَمَرِ وَالنَّهَارِ وَاللَّيْلِ|بِالْجِبَالِ وَالْبِحَارِ|بِالنَّاقَةِ','مَنِ الَّذِي أَفْلَحَ؟|الَّذِي طَهَّرَ نَفْسَهُ|الَّذِي جَمَعَ الْمَالَ|الَّذِي ذَبَحَ النَّاقَةَ','مَنِ الرَّسُولُ الَّذِي أَرْسَلَهُ اللّٰهُ إِلَى ثَمُودَ؟|صَالِحٌ|مُوسَى|إِبْرَاهِيمُ','مَا الدَّلِيلُ الَّذِي جَاءَ بِهِ صَالِحٌ؟|النَّاقَةُ|الْكِتَابُ|الْعَصَا','مَاذَا فَعَلَتْ ثَمُودُ فِي النَّاقَةِ؟|ذَبَحُوهَا|سَقَوْهَا|بَاعُوهَا']},
/* ---------- 3–4: الليل ---------- */
{u:'Сури от Джуз Амма',ar:'سُورَةُ اللَّيْلِ',t:'Сура Ал-Лейл',wk:[3,4],
 a:['وَاللَّيْلِ إِذَا يَغْشَىٰ|Кълна се в нощта, когато покрива всичко,','وَالنَّهَارِ إِذَا تَجَلَّىٰ|и в деня, когато се проясни,','وَمَا خَلَقَ الذَّكَرَ وَالْأُنْثَىٰ|и в Онзи, Който сътвори мъжкото и женското!','إِنَّ سَعْيَكُمْ لَشَتَّىٰ|Делата ви наистина са различни.','فَأَمَّا مَنْ أَعْطَىٰ وَاتَّقَىٰ|А който дава и се бои от Аллах','وَصَدَّقَ بِالْحُسْنَىٰ|и вярва в най-доброто (Рая),','فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ|на него ще му улесним пътя към лекото.','وَأَمَّا مَنْ بَخِلَ وَاسْتَغْنَىٰ|А който се скъпи и смята, че не се нуждае от Аллах,','وَكَذَّبَ بِالْحُسْنَىٰ|и отрича най-доброто,','فَسَنُيَسِّرُهُ لِلْعُسْرَىٰ|на него ще му улесним пътя към трудното.','وَمَا يُغْنِي عَنْهُ مَالُهُ إِذَا تَرَدَّىٰ|И богатството му няма да му помогне, когато пропадне.','إِنَّ عَلَيْنَا لَلْهُدَىٰ|На Нас е да покажем правия път.','وَإِنَّ لَنَا لَلْآخِرَةَ وَالْأُولَىٰ|И Наши са отвъдният и този свят.','فَأَنْذَرْتُكُمْ نَارًا تَلَظَّىٰ|Предупредих ви за огън, който пламти.','لَا يَصْلَاهَا إِلَّا الْأَشْقَى|В него ще гори само най-злочестият,','الَّذِي كَذَّبَ وَتَوَلَّىٰ|който отрече и се отвърна.','وَسَيُجَنَّبُهَا الْأَتْقَى|А ще бъде отдалечен от него най-богобоязливият,','الَّذِي يُؤْتِي مَالَهُ يَتَزَكَّىٰ|който дава богатството си, за да се пречисти,','وَمَا لِأَحَدٍ عِنْدَهُ مِنْ نِعْمَةٍ تُجْزَىٰ|без някой да му е направил добро, за което да се отплаща,','إِلَّا ابْتِغَاءَ وَجْهِ رَبِّهِ الْأَعْلَىٰ|а само за да търси лицето на своя Всевишен Господ.','وَلَسَوْفَ يَرْضَىٰ|И той непременно ще бъде доволен.'],
 w:['تَجَلَّى|появи се, проясни се','سَعْيٌ|дело, усилие','شَتَّى|различни','اتَّقَى|бои се от Аллах','الْحُسْنَى|най-доброто (Раят)','يَسَّرَ / يُيَسِّرُ|улесни','بَخِلَ|скъпи се','اسْتَغْنَى|смята, че не се нуждае','تَرَدَّى|пропадна, падна','أَنْذَرَ|предупреди','تَلَظَّى|пламти','تَوَلَّى|отвърна се','الْأَتْقَى|най-богобоязливият','ابْتِغَاءَ|търсейки','أَعْتَقَ|освободи (роб)','عَذَّبَ|измъчваше'],
 x:['Повод за низпославането: Умайя бин Халаф измъчвал Билал, защото приел исляма. Абу Бакр го купил и го освободил заради Аллах.'],
 m:['تَجَلَّى|ظَهَرَ عَلَى الْأَرْضِ|появи се над земята','سَعْيَكُمْ|عَمَلَكُمْ|делата ви','شَتَّى|مُخْتَلِفٌ|различни','بِالْحُسْنَى|بِالْجَنَّةِ|в Рая','فَسَنُيَسِّرُهُ لِلْيُسْرَى|يُيَسِّرُ اللّٰهُ لَهُ عَمَلَ الْخَيْرِ حَتَّى يَدْخُلَ الْجَنَّةَ|Аллах му улеснява доброто, докато влезе в Рая','بَخِلَ|لَمْ يُنْفِقْ مَالَهُ|не дава от богатството си','تَرَدَّى|سَقَطَ فِي النَّارِ|падна в огъня','تَلَظَّى|تَشْتَعِلُ بِشِدَّةٍ|пламти силно','الْأَتْقَى|الَّذِي يَخَافُ اللّٰهَ كَثِيرًا|който много се бои от Аллах'],
 e:['أَقْسَمَ اللّٰهُ بِاللَّيْلِ عِنْدَمَا يُغَطِّي الْأَرْضَ، وَبِالنَّهَارِ عِنْدَمَا يَظْهَرُ، أَنَّ أَعْمَالَ النَّاسِ مُخْتَلِفَةٌ.|Аллах се кълне в нощта, когато покрива земята, и в деня, когато се появи, че делата на хората са различни.','فَمَنْ أَنْفَقَ مَالَهُ فِي طَاعَةِ اللّٰهِ وَآمَنَ بِالْجَنَّةِ، يَسَّرَ اللّٰهُ لَهُ الْخَيْرَ.|Който харчи богатството си в покорство на Аллах и вярва в Рая, на него Аллах улеснява доброто.','وَمَنْ بَخِلَ وَتَكَبَّرَ لَا يَنْفَعُهُ مَالُهُ إِذَا سَقَطَ فِي النَّارِ.|А който се скъпи и се възгордява, богатството няма да му помогне, когато падне в огъня.','وَبَيَّنَتِ السُّورَةُ فَضْلَ أَبِي بَكْرٍ الصِّدِّيقِ؛ لِأَنَّهُ أَنْفَقَ مَالَهُ فِي سَبِيلِ اللّٰهِ.|Сурата показва достойнството на Абу Бакр ас-Сиддик, защото той харчеше богатството си по пътя на Аллах.'],
 o:['أَعْطَى|بَخِلَ','الْيُسْرَى|الْعُسْرَى','الْأَتْقَى|الْأَشْقَى','الذَّكَرُ|الْأُنْثَى'],
 p:['بَخِلَ الرَّجُلُ فَكَرِهَهُ النَّاسُ.|أَعْطَى / أَحَبَّ|أَعْطَى الرَّجُلُ فَأَحَبَّهُ النَّاسُ.|Мъжът даде и хората го обикнаха.|أَعْطَى الرَّجُلُ فَكَرِهَهُ النَّاسُ.|بَخِلَ الرَّجُلُ فَأَحَبَّهُ النَّاسُ.','حَذَّرَنَا اللّٰهُ مِنَ النَّارِ.|أَنْذَرَ|أَنْذَرَنَا اللّٰهُ مِنَ النَّارِ.|Аллах ни предупреди за огъня.|أَنْذَرْنَا اللّٰهُ مِنَ النَّارِ.|أَنْذَرَنَا اللّٰهُ النَّارُ.','ابْتَعَدَ الْجُنْدِيُّ خَوْفًا مِنَ الْمَعْرَكَةِ.|تَوَلَّى|تَوَلَّى الْجُنْدِيُّ خَوْفًا مِنَ الْمَعْرَكَةِ.|Войникът се отдръпна от страх от битката.|تَوَلَّتِ الْجُنْدِيُّ خَوْفًا مِنَ الْمَعْرَكَةِ.|تَوَلَّى الْجُنْدِيَّ خَوْفًا مِنَ الْمَعْرَكَةِ.'],
 f:['فَأَمَّا مَنْ أَعْطَى وَ___|اتَّقَى|بَخِلَ|تَوَلَّى','وَصَدَّقَ بِالْحُسْنَى فَسَنُيَسِّرُهُ ___|لِلْيُسْرَى|لِلْأُنْثَى|لِلْهُدَى','فَأَنْذَرْتُكُمْ نَارًا ___|تَلَظَّى|تَجَلَّى|تُجْزَى','عَذَّبَ أُمَيَّةُ ___ لِأَنَّهُ أَسْلَمَ|بِلَالًا|أَبَا بَكْرٍ|صَالِحًا'],
 k:['أَعْمَالُ النَّاسِ مُخْتَلِفَةٌ.|4','مَنْ بَخِلَ لَا يَنْفَعُهُ مَالُهُ إِذَا سَقَطَ فِي النَّارِ.|11','الْأَتْقَى يُنْفِقُ مَالَهُ لِيُطَهِّرَ نَفْسَهُ.|18','حَذَّرْتُكُمْ مِنْ نَارٍ تَشْتَعِلُ بِشِدَّةٍ.|14'],
 q:['بِمَاذَا أَقْسَمَ اللّٰهُ فِي أَوَّلِ السُّورَةِ؟|بِاللَّيْلِ وَالنَّهَارِ|بِالشَّمْسِ وَالْقَمَرِ|بِالتِّينِ وَالزَّيْتُونِ','مَنْ عَذَّبَ بِلَالًا؟|أُمَيَّةُ بْنُ خَلَفٍ|أَبُو بَكْرٍ|أَبُو لَهَبٍ','لِمَاذَا عَذَّبَهُ؟|لِأَنَّهُ أَسْلَمَ|لِأَنَّهُ سَرَقَ|لِأَنَّهُ كَانَ مَرِيضًا','مَاذَا فَعَلَ أَبُو بَكْرٍ؟|اشْتَرَى بِلَالًا وَأَعْتَقَهُ|عَذَّبَ بِلَالًا|سَافَرَ إِلَى الشَّامِ','مَنِ الْأَتْقَى فِي هٰذِهِ السُّورَةِ؟|أَبُو بَكْرٍ الصِّدِّيقُ|أُمَيَّةُ بْنُ خَلَفٍ|ثَمُودُ'],
 h:['كَانَ أُمَيَّةُ بْنُ خَلَفٍ يُخْرِجُ بِلَالًا وَقْتَ الظَّهِيرَةِ، وَيَضَعُ عَلَى صَدْرِهِ صَخْرَةً عَظِيمَةً.|Умайя бин Халаф изкарвал Билал по пладне и слагал на гърдите му голям камък.','وَيَقُولُ لَهُ: تَبْقَى هٰكَذَا حَتَّى تَمُوتَ أَوْ تَكْفُرَ بِمُحَمَّدٍ.|И му казвал: „Ще стоиш така, докато умреш или се отречеш от Мохамед.“','فَكَانَ بِلَالٌ يَقُولُ: أَحَدٌ، أَحَدٌ.|А Билал повтарял: „Един, Един (е Аллах).“','فَمَرَّ بِهِ أَبُو بَكْرٍ، فَاشْتَرَاهُ مِنْ أُمَيَّةَ ثُمَّ أَعْتَقَهُ.|Минал покрай него Абу Бакр, купил го от Умайя и после го освободил. (по „Сира“ на Ибн Хишам)']},
/* ---------- 5: الضحى ---------- */
{u:'Сури от Джуз Амма',ar:'سُورَةُ الضُّحَى',t:'Сура Ад-Духа',wk:5,
 a:['وَالضُّحَىٰ|Кълна се в утрото,','وَاللَّيْلِ إِذَا سَجَىٰ|и в нощта, когато утихне!','مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ|Твоят Господ не те е изоставил и не те е намразил.','وَلَلْآخِرَةُ خَيْرٌ لَكَ مِنَ الْأُولَىٰ|И отвъдното е по-добро за теб от този свят.','وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ|И твоят Господ ще ти даде, и ти ще бъдеш доволен.','أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ|Не те ли намери сирак и не ти ли даде подслон?','وَوَجَدَكَ ضَالًّا فَهَدَىٰ|И те намери незнаещ пътя и те напъти,','وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ|и те намери беден и те направи богат.','فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ|Затова сирака не потискай,','وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ|и молещия не отпъждай грубо,','وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ|а за благата на своя Господ разказвай.'],
 w:['سَجَا / يَسْجُو|утихна (нощта)','وَدَّعَ|изостави','قَلَى / يَقْلِي|намрази','يَتِيمٌ|сирак','آوَى / يُؤْوِي|даде подслон','ضَالٌّ|незнаещ пътя','عَائِلٌ|беден','أَغْنَى|направи богат','قَهَرَ / يَقْهَرُ|потиска','نَهَرَ / يَنْهَرُ|отпъжда грубо','السَّائِلُ|молещият','حَدَّثَ|разказа'],
 x:['Повод за низпославането: Пророкът се разболял и не станал за нощна молитва една-две нощи. Тогава казали, че Господ му го е изоставил, и Аллах низпослал сурата. (ал-Бухари и Муслим)'],
 m:['سَجَى|اشْتَدَّ ظَلَامُهُ وَسَكَنَ|мракът му се сгъсти и утихна','مَا وَدَّعَكَ|مَا تَرَكَكَ|не те е изоставил','وَمَا قَلَى|وَمَا أَبْغَضَكَ|и не те е намразил','فَآوَى|جَعَلَ لَكَ مَأْوًى|ти даде подслон','ضَالًّا|لَا تَعْرِفُ الْإِسْلَامَ|не познаваше исляма','عَائِلًا|فَقِيرًا|беден','فَلَا تَنْهَرْ|لَا تَرُدَّهُ رَدًّا شَدِيدًا|не го връщай грубо'],
 e:['أَقْسَمَ اللّٰهُ بِالضُّحَى وَبِاللَّيْلِ أَنَّهُ لَمْ يَتْرُكْ رَسُولَهُ وَلَمْ يُبْغِضْهُ.|Аллах се кълне в утрото и нощта, че не е изоставил Пратеника Си и не го е намразил.','وَذَكَّرَهُ بِنِعَمِهِ: كَانَ يَتِيمًا فَجَعَلَ لَهُ مَأْوًى، وَكَانَ فَقِيرًا فَجَعَلَهُ غَنِيًّا.|Напомни му Своите блага: беше сирак и Той му даде подслон, беше беден и Той го направи богат.','وَأَمَرَهُ أَلَّا يُغْضِبَ الْيَتِيمَ، وَأَلَّا يَرُدَّ الْفَقِيرَ رَدًّا شَدِيدًا، وَأَنْ يُحَدِّثَ النَّاسَ بِنِعْمَةِ اللّٰهِ.|И му повели да не наскърбява сирака, да не връща бедния грубо и да разказва на хората за благата на Аллах.'],
 o:['فَقِيرٌ|غَنِيٌّ','أَحَبَّ|أَبْغَضَ','الْأُولَى|الْآخِرَةُ'],
 p:['أَلَمْ يَجِدْكَ فَقِيرًا؟|أَغْنَى|أَلَمْ يَجِدْكَ فَقِيرًا فَأَغْنَى؟|Не те ли намери беден и не те ли направи богат?|أَلَمْ يَجِدْكَ فَقِيرًا فَآوَى؟|أَلَمْ يَجِدْكَ غَنِيًّا فَأَغْنَى؟','أَلَمْ يَجِدْكَ يَتِيمًا؟|آوَى|أَلَمْ يَجِدْكَ يَتِيمًا فَآوَى؟|Не те ли намери сирак и не ти ли даде подслон?|أَلَمْ يَجِدْكَ يَتِيمًا فَهَدَى؟|أَلَمْ يَجِدْكَ يَتِيمٌ فَآوَى؟','أَمَّا الْيَتِيمُ … (لَا تَقْهَرْ)|لَا تَقْهَرْ|فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ.|Сирака не потискай.|فَأَمَّا الْيَتِيمَ فَلَا تَنْهَرْ.|فَأَمَّا الْيَتِيمُ فَلَا يَقْهَرُ.'],
 f:['مَا وَدَّعَكَ رَبُّكَ وَمَا ___|قَلَى|سَجَى|هَدَى','وَوَجَدَكَ عَائِلًا ___|فَأَغْنَى|فَهَدَى|فَآوَى','وَأَمَّا السَّائِلَ فَلَا ___|تَنْهَرْ|تَقْهَرْ|تَرْضَى','أَطْعَمْتُ ___ لِأَنَّهُ فَقِيرٌ|الْعَائِلَ|الْغَنِيَّ|اللَّيْلَ'],
 k:['لَمْ يَتْرُكْكَ رَبُّكَ يَا مُحَمَّدُ وَلَمْ يُبْغِضْكَ.|3','كُنْتَ فَقِيرًا فَجَعَلَكَ اللّٰهُ غَنِيًّا.|8','لَا تَرُدَّ الْفَقِيرَ الَّذِي يَسْأَلُكَ رَدًّا شَدِيدًا.|10'],
 q:['لِمَاذَا لَمْ يَقُمِ الرَّسُولُ لِصَلَاةِ اللَّيْلِ؟|لِأَنَّهُ كَانَ مَرِيضًا|لِأَنَّهُ كَانَ مُسَافِرًا|لِأَنَّهُ نَسِيَ','مَا النِّعَمُ الَّتِي ذَكَّرَ اللّٰهُ بِهَا رَسُولَهُ؟|الْمَأْوَى وَالْهُدَى وَالْغِنَى|الْمَالُ وَالْأَوْلَادُ|الْمُلْكُ','عَمَّاذَا نَهَى اللّٰهُ رَسُولَهُ؟|عَنْ قَهْرِ الْيَتِيمِ وَنَهْرِ السَّائِلِ|عَنِ الصَّلَاةِ|عَنِ الصَّدَقَةِ','أَيُّهُمَا خَيْرٌ لِلرَّسُولِ: الْآخِرَةُ أَمِ الدُّنْيَا؟|الْآخِرَةُ|الدُّنْيَا|هُمَا سَوَاءٌ']},
/* ---------- 6: الشرح ---------- */
{u:'Сури от Джуз Амма',ar:'سُورَةُ الشَّرْحِ',t:'Сура Аш-Шарх',wk:6,
 a:['أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ|Не разширихме ли гърдите ти (за вярата)?','وَوَضَعْنَا عَنْكَ وِزْرَكَ|И снехме от теб товара ти,','الَّذِي أَنْقَضَ ظَهْرَكَ|който тежеше на гърба ти,','وَرَفَعْنَا لَكَ ذِكْرَكَ|и издигнахме споменаването ти.','فَإِنَّ مَعَ الْعُسْرِ يُسْرًا|Наистина с трудността идва облекчение.','إِنَّ مَعَ الْعُسْرِ يُسْرًا|Наистина с трудността идва облекчение.','فَإِذَا فَرَغْتَ فَانْصَبْ|И когато свършиш, усърдствай,','وَإِلَىٰ رَبِّكَ فَارْغَبْ|и към своя Господ се стреми!'],
 w:['شَرَحَ / يَشْرَحُ (الصَّدْرَ)|разшири (гърдите)','الْوِزْرُ|товарът, грехът','أَنْقَضَ|натежа','رَفَعَ الذِّكْرَ|издигна споменаването','الْعُسْرُ|трудността','الْيُسْرُ|облекчението','فَرَغَ / يَفْرُغُ|свърши','نَصِبَ / يَنْصَبُ|положи усилие','رَغِبَ / يَرْغَبُ|стреми се','ارْتِيَاحٌ|облекчение, спокойствие','أَثْقَلَ|натовари','حَزِنَ|натъжи се'],
 x:['Сурата утешава Пратеника: след всяка трудност идва облекчение, а името му се споменава в езана заедно с името на Аллах.'],
 m:['نَشْرَحْ لَكَ صَدْرَكَ|نَجْعَلْ صَدْرَكَ وَاسِعًا بِالْإِسْلَامِ وَالْقُرْآنِ|направим гърдите ти широки с исляма и Корана','وِزْرَكَ|ذَنْبَكَ|греха ти','أَنْقَضَ ظَهْرَكَ|أَثْقَلَ ظَهْرَكَ|натежа на гърба ти','وَرَفَعْنَا لَكَ ذِكْرَكَ|جَعَلْنَاكَ تُذْكَرُ فِي الْأَذَانِ مَعَ ذِكْرِ اللّٰهِ|направихме да се споменаваш в езана заедно с Аллах','الْعُسْرِ|الشِّدَّةِ|трудността','فَانْصَبْ|فَاجْتَهِدْ|усърдствай','فَارْغَبْ|اطْلُبْ مَا تُرِيدُ مِنْ رَبِّكَ|искай каквото желаеш от своя Господ'],
 e:['قَدْ شَرَحَ اللّٰهُ صَدْرَ مُحَمَّدٍ بِالْإِسْلَامِ وَالْقُرْآنِ، وَغَفَرَ لَهُ ذَنْبَهُ.|Аллах разшири гърдите на Мохамед с исляма и Корана и му прости греха.','وَجَعَلَ اسْمَهُ يُذْكَرُ فِي الْأَذَانِ مَعَ اسْمِ اللّٰهِ.|И направи името му да се споменава в езана заедно с името на Аллах.','وَبَيَّنَ أَنَّ الْيُسْرَ يَأْتِي بَعْدَ الشِّدَّةِ، فَلَا تَحْزَنْ.|И показа, че облекчението идва след трудността — затова не тъгувай.','وَإِذَا انْتَهَيْتَ مِنْ عَمَلٍ فَاتَّجِهْ إِلَى عَمَلٍ آخَرَ مِنْ أَعْمَالِ الْعِبَادَةِ أَوِ الدُّنْيَا.|И когато свършиш една работа, се залавяй за друга — от поклонението или от този свят.'],
 o:['الْعُسْرُ|الْيُسْرُ','حَزِنَ|فَرِحَ','أَثْقَلَ|خَفَّفَ'],
 p:['شَرَحَ اللّٰهُ صَدْرَكَ بِالْقُرْآنِ.|الْإِسْلَامُ|شَرَحَ اللّٰهُ صَدْرَكَ بِالْإِسْلَامِ.|Аллах разшири гърдите ти с исляма.|شَرَحَ اللّٰهُ صَدْرَكَ الْإِسْلَامَ.|شَرَحَ اللّٰهُ صَدْرَكَ بِالْإِسْلَامُ.','غَفَرَ اللّٰهُ لَكَ الذَّنْبَ.|الْوِزْرُ|غَفَرَ اللّٰهُ لَكَ الْوِزْرَ.|Аллах ти прости греха.|غَفَرَ اللّٰهُ لَكَ الْوِزْرُ.|غَفَرَ اللّٰهَ لَكَ الْوِزْرَ.','إِنَّ بَعْدَ الشِّدَّةِ فَرَجًا.|الْعُسْرُ / يُسْرٌ|إِنَّ بَعْدَ الْعُسْرِ يُسْرًا.|След трудността идва облекчение.|إِنَّ بَعْدَ الْعُسْرِ يُسْرٌ.|إِنَّ بَعْدَ الْيُسْرِ عُسْرًا.'],
 f:['أَلَمْ نَشْرَحْ لَكَ ___|صَدْرَكَ|ظَهْرَكَ|ذِكْرَكَ','فَإِنَّ مَعَ الْعُسْرِ ___|يُسْرًا|وِزْرًا|ذِكْرًا','فَإِذَا فَرَغْتَ ___|فَانْصَبْ|فَارْغَبْ|فَحَدِّثْ','شَعَرَ حَازِمٌ بِالـ___ بَعْدَ نَجَاحِهِ|ارْتِيَاحِ|حُزْنِ|عُسْرِ'],
 k:['جَعَلْنَاكَ تُذْكَرُ فِي الْأَذَانِ مَعَ اسْمِ اللّٰهِ.|4','غَفَرْنَا لَكَ ذَنْبَكَ.|2','إِذَا انْتَهَيْتَ مِنْ عَمَلِكَ فَاجْتَهِدْ فِي عَمَلٍ آخَرَ.|7'],
 q:['بِمَاذَا شَرَحَ اللّٰهُ صَدْرَ الرَّسُولِ؟|بِالْإِسْلَامِ وَالْقُرْآنِ|بِالْمَالِ|بِالْمُلْكِ','أَيْنَ يُذْكَرُ اسْمُ الرَّسُولِ مَعَ اسْمِ اللّٰهِ؟|فِي الْأَذَانِ|فِي السُّوقِ|فِي الشِّعْرِ','مَاذَا يَأْتِي بَعْدَ الْعُسْرِ؟|الْيُسْرُ|الْحُزْنُ|الْعُسْرُ','مَاذَا يَفْعَلُ الْمُسْلِمُ إِذَا انْتَهَى مِنْ عَمَلٍ؟|يَتَّجِهُ إِلَى عَمَلٍ آخَرَ|يَنَامُ دَائِمًا|يَتْرُكُ الْعَمَلَ'],
 h:['قَالَ حَسَّانُ بْنُ ثَابِتٍ يَمْدَحُ النَّبِيَّ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ: وَضَمَّ الْإِلٰهُ اسْمَ النَّبِيِّ إِلَى اسْمِهِ ... إِذَا قَالَ فِي الْخَمْسِ الْمُؤَذِّنُ: أَشْهَدُ|Хасан бин Сабит казва във възхвала на Пророка: „И Бог събра името на Пророка със Своето име, когато мюезинът казва в петте молитви: „Свидетелствам…“']},
/* ---------- 7: التين ---------- */
{u:'Сури от Джуз Амма',ar:'سُورَةُ التِّينِ',t:'Сура Ат-Тин',wk:7,
 a:['وَالتِّينِ وَالزَّيْتُونِ|Кълна се в смокинята и маслината,','وَطُورِ سِينِينَ|и в планината Синай,','وَهٰذَا الْبَلَدِ الْأَمِينِ|и в този безопасен град (Мека)!','لَقَدْ خَلَقْنَا الْإِنْسَانَ فِي أَحْسَنِ تَقْوِيمٍ|Сътворихме човека в най-хубав облик.','ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ|После го върнахме към най-ниското от ниското,','إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ|освен онези, които повярваха и вършеха праведни дела — за тях има награда, която не прекъсва.','فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ|Какво тогава те кара да отричаш Съдния ден?','أَلَيْسَ اللّٰهُ بِأَحْكَمِ الْحَاكِمِينَ|Нима Аллах не е Най-справедливият от съдниците?'],
 w:['التِّينُ|смокини','الزَّيْتُونُ|маслини','طُورُ سِينِينَ|планината Синай','الْبَلَدُ الْأَمِينُ|безопасният град (Мека)','تَقْوِيمٌ|облик, устройство','رَدَّ / يَرُدُّ|върна, превърна','أَسْفَلُ سَافِلِينَ|най-ниското от ниското','مَمْنُونٌ|прекъснат','أَحْكَمُ|най-мъдрият, най-справедливият','الدِّينُ|възмездието, Съдният ден'],
 x:['Аллах се кълне в местата, свързани с пророците, че е създал човека в най-хубав облик и че само вярата и добрите дела го пазят от падение.'],
 m:['التِّينِ وَالزَّيْتُونِ|بَلَدُ التِّينِ وَالزَّيْتُونِ: الشَّامُ|страната на смокините и маслините — Шам','طُورِ سِينِينَ|الْجَبَلُ الَّذِي كَلَّمَ اللّٰهُ عَلَيْهِ مُوسَى|планината, на която Аллах говори с Муса','الْبَلَدِ الْأَمِينِ|مَكَّةُ؛ يَأْمَنُ فِيهَا النَّاسُ|Мека, в която хората са в безопасност','أَحْسَنِ تَقْوِيمٍ|أَحْسَنِ صُورَةٍ|най-хубав облик','أَسْفَلَ سَافِلِينَ|فِي النَّارِ|в огъня','غَيْرُ مَمْنُونٍ|غَيْرُ مَقْطُوعٍ|непрекъсната','بِالدِّينِ|بِيَوْمِ الْحِسَابِ|в Деня на равносметката'],
 e:['أَقْسَمَ اللّٰهُ بِبَلَدِ التِّينِ وَالزَّيْتُونِ، وَبِالْجَبَلِ الَّذِي كَلَّمَ عَلَيْهِ مُوسَى، وَبِمَكَّةَ.|Аллах се кълне в страната на смокините и маслините, в планината, на която говори с Муса, и в Мека.','أَنَّهُ خَلَقَ الْإِنْسَانَ فِي أَحْسَنِ صُورَةٍ، ثُمَّ يَدْخُلُ النَّارَ مَنْ كَفَرَ.|Че е създал човека в най-хубав облик, а после онзи, който не вярва, влиза в огъня.','أَمَّا الْمُؤْمِنُونَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ فَلَهُمْ أَجْرٌ لَا يَنْقَطِعُ، وَاللّٰهُ أَعْدَلُ الْحَاكِمِينَ.|А вярващите, които вършат праведни дела, имат награда, която не прекъсва — и Аллах е най-справедливият съдник.'],
 o:['أَحْسَنُ|أَسْوَأُ','أَعْلَى|أَسْفَلُ','آمَنَ|كَفَرَ'],
 p:['الْمَسْجِدُ الْحَرَامُ فِي الْبَلَدِ الْأَمِينِ.|مَكَّةُ|الْمَسْجِدُ الْحَرَامُ فِي مَكَّةَ.|Свещената джамия е в Мека.|الْمَسْجِدُ الْحَرَامُ فِي مَكَّةُ.|الْمَسْجِدُ الْحَرَامُ مِنْ مَكَّةَ.','خَلَقَ اللّٰهُ الْإِنْسَانَ فِي أَحْسَنِ تَقْوِيمٍ.|صُورَةٌ|خَلَقَ اللّٰهُ الْإِنْسَانَ فِي أَحْسَنِ صُورَةٍ.|Аллах сътвори човека в най-хубав образ.|خَلَقَ اللّٰهُ الْإِنْسَانَ فِي أَحْسَنُ صُورَةٍ.|خَلَقَ اللّٰهُ الْإِنْسَانَ فِي أَحْسَنِ صُورَةً.','اللّٰهُ أَحْكَمُ الْحَاكِمِينَ.|أَعْدَلُ|اللّٰهُ أَعْدَلُ الْحَاكِمِينَ.|Аллах е най-справедливият съдник.|اللّٰهُ أَعْدَلَ الْحَاكِمِينَ.|اللّٰهُ أَعْدَلُ الْحَاكِمُونَ.'],
 f:['وَالتِّينِ وَ___|الزَّيْتُونِ|الْبَلَدِ|سِينِينَ','لَقَدْ خَلَقْنَا الْإِنْسَانَ فِي أَحْسَنِ ___|تَقْوِيمٍ|سَافِلِينَ|مَمْنُونٍ','أَلَيْسَ اللّٰهُ بِأَحْكَمِ ___|الْحَاكِمِينَ|سَافِلِينَ|الصَّالِحَاتِ'],
 k:['خَلَقَ اللّٰهُ الْإِنْسَانَ فِي أَحْسَنِ صُورَةٍ.|4','لِلْمُؤْمِنِينَ أَجْرٌ لَا يَنْقَطِعُ.|6','أَقْسَمَ اللّٰهُ بِمَكَّةَ.|3'],
 q:['مَا الْبَلَدُ الْأَمِينُ؟|مَكَّةُ الْمُكَرَّمَةُ|الْمَدِينَةُ الْمُنَوَّرَةُ|الشَّامُ','مَا طُورُ سِينِينَ؟|الْجَبَلُ الَّذِي كَلَّمَ اللّٰهُ عَلَيْهِ مُوسَى|بَلَدُ التِّينِ|نَهْرٌ فِي مِصْرَ','لِمَنِ الْأَجْرُ غَيْرُ الْمَمْنُونِ؟|لِلَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ|لِلْأَغْنِيَاءِ|لِكُلِّ النَّاسِ','مَاذَا يَقُولُ الْمُسْلِمُ إِذَا قَرَأَ آخِرَ السُّورَةِ؟|بَلَى، وَأَنَا عَلَى ذٰلِكَ مِنَ الشَّاهِدِينَ|آمِينَ|سُبْحَانَ اللّٰهِ'],
 h:['مَنْ قَرَأَ: «وَالتِّينِ وَالزَّيْتُونِ» فَانْتَهَى إِلَى «أَلَيْسَ اللّٰهُ بِأَحْكَمِ الْحَاكِمِينَ» فَلْيَقُلْ: بَلَى، وَأَنَا عَلَى ذٰلِكَ مِنَ الشَّاهِدِينَ.|Който чете „Кълна се в смокинята и маслината“ и стигне до „Нима Аллах не е Най-справедливият от съдниците?“, нека каже: „Да, и аз свидетелствам за това.“ (по ат-Тирмизи и Абу Дауд)']},
/* ---------- 8: العلق ---------- */
{u:'Сури от Джуз Амма',ar:'سُورَةُ الْعَلَقِ',t:'Сура Ал-Алак',wk:8,
 a:['اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ|Чети в името на своя Господ, Който сътвори,','خَلَقَ الْإِنْسَانَ مِنْ عَلَقٍ|сътвори човека от съсирек кръв!','اقْرَأْ وَرَبُّكَ الْأَكْرَمُ|Чети, а твоят Господ е Най-щедрият,','الَّذِي عَلَّمَ بِالْقَلَمِ|Който научи (да се пише) с перото,','عَلَّمَ الْإِنْسَانَ مَا لَمْ يَعْلَمْ|научи човека на онова, което не знаеше.','كَلَّا إِنَّ الْإِنْسَانَ لَيَطْغَىٰ|Не! Човекът наистина престъпва границите,','أَنْ رَآهُ اسْتَغْنَىٰ|щом се види богат.','إِنَّ إِلَىٰ رَبِّكَ الرُّجْعَىٰ|Към твоя Господ е връщането.','أَرَأَيْتَ الَّذِي يَنْهَىٰ|Видя ли онзи, който забранява','عَبْدًا إِذَا صَلَّىٰ|на раб (на Аллах), когато се моли?','أَرَأَيْتَ إِنْ كَانَ عَلَى الْهُدَىٰ|Видя ли, ако той е на правия път','أَوْ أَمَرَ بِالتَّقْوَىٰ|или призовава към богобоязън?','أَرَأَيْتَ إِنْ كَذَّبَ وَتَوَلَّىٰ|Видя ли, ако другият отрича и се отвръща —','أَلَمْ يَعْلَمْ بِأَنَّ اللّٰهَ يَرَىٰ|не знае ли той, че Аллах вижда?','كَلَّا لَئِنْ لَمْ يَنْتَهِ لَنَسْفَعًا بِالنَّاصِيَةِ|Не! Ако не престане, ще го повлечем за перчема —','نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍ|перчем лъжлив, грешен.','فَلْيَدْعُ نَادِيَهُ|Нека тогава повика събранието си,','سَنَدْعُ الزَّبَانِيَةَ|а Ние ще повикаме пазачите на Ада.','كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِبْ|Не! Не му се подчинявай, а падни на земен поклон и се приближи (до Аллах)!'],
 w:['اقْرَأْ|чети','عَلَقٌ|съсирек кръв','الْأَكْرَمُ|Най-щедрият','الْقَلَمُ|перото','طَغَى / يَطْغَى|престъпи границите','اسْتَغْنَى|стана богат','الرُّجْعَى|връщането','نَهَى / يَنْهَى|забрани','النَّاصِيَةُ|перчемът (предната част на главата)','كَاذِبٌ|лъжлив','خَاطِئٌ|грешен','النَّادِي|събранието','الزَّبَانِيَةُ|пазачите на Ада','اقْتَرَبَ|приближи се'],
 x:['Първите пет аята на тази сура са първото, което е низпослано от Корана — в пещерата Хира.','Абу Джахл заплашвал Пророка, когато се молел при Кааба, затова са низпослани аятите „Нека повика събранието си, а Ние ще повикаме пазачите на Ада“.'],
 m:['عَلَقٍ|دَمٍ جَامِدٍ|съсирена кръв','الْأَكْرَمُ|الْكَرِيمُ جِدًّا|много щедрият','لَيَطْغَى|يَتَجَاوَزُ الْحَدَّ وَيَتَكَبَّرُ|преминава границата и се възгордява','الرُّجْعَى|الرُّجُوعُ يَوْمَ الْقِيَامَةِ|връщането в Съдния ден','لَنَسْفَعًا بِالنَّاصِيَةِ|لَنَأْخُذَنَّهُ بِشِدَّةٍ مِنْ مُقَدَّمِ رَأْسِهِ|ще го хванем силно за предната част на главата','نَادِيَهُ|أَهْلَ مَجْلِسِهِ|хората от събранието му','الزَّبَانِيَةَ|مَلَائِكَةَ الْعَذَابِ|ангелите на наказанието'],
 e:['أَوَّلُ مَا نَزَلَ مِنَ الْقُرْآنِ: اقْرَأْ؛ فَاللّٰهُ الَّذِي خَلَقَ الْإِنْسَانَ عَلَّمَهُ الْكِتَابَةَ بِالْقَلَمِ وَعَلَّمَهُ مَا لَمْ يَعْلَمْ.|Първото низпослано от Корана е „Чети“: Аллах, Който сътвори човека, го научи да пише с перо и на онова, което не знаеше.','وَالْإِنْسَانُ يَتَكَبَّرُ إِذَا رَأَى نَفْسَهُ غَنِيًّا، وَسَيَرْجِعُ إِلَى اللّٰهِ يَوْمَ الْقِيَامَةِ.|А човекът се възгордява, когато се види богат, но ще се върне при Аллах в Съдния ден.','وَكَانَ أَبُو جَهْلٍ يَنْهَى النَّبِيَّ عَنِ الصَّلَاةِ، فَهَدَّدَهُ اللّٰهُ بِالْعَذَابِ، وَأَمَرَ نَبِيَّهُ أَنْ يَسْجُدَ وَيَقْتَرِبَ مِنْهُ.|Абу Джахл забранявал на Пророка да се моли; Аллах го заплашил с наказание и повелил на Пророка Си да пада на поклон и да се приближава към Него.'],
 o:['كَاذِبٌ|صَادِقٌ','اقْتَرَبَ|ابْتَعَدَ','الْهُدَى|الضَّلَالُ'],
 p:['عَلَّمَ اللّٰهُ الْإِنْسَانَ.|الْكِتَابَةُ|عَلَّمَ اللّٰهُ الْإِنْسَانَ الْكِتَابَةَ.|Аллах научи човека да пише.|عَلَّمَ اللّٰهُ الْإِنْسَانَ الْكِتَابَةُ.|عَلَّمَ اللّٰهَ الْإِنْسَانَ الْكِتَابَةَ.','اقْرَأْ يَا مُحَمَّدُ.|أَنْتُمْ|اقْرَءُوا يَا مُسْلِمُونَ.|Четете, мюсюлмани!|اقْرَأْ يَا مُسْلِمُونَ.|اقْرَأَا يَا مُسْلِمُونَ.','اسْجُدْ وَاقْتَرِبْ.|أَنْتِ|اسْجُدِي وَاقْتَرِبِي.|Падни на поклон и се приближи (към жена).|اسْجُدْ وَاقْتَرِبِي.|اسْجُدُوا وَاقْتَرِبُوا.'],
 f:['خَلَقَ الْإِنْسَانَ مِنْ ___|عَلَقٍ|قَلَمٍ|نَادٍ','الَّذِي عَلَّمَ بِـ___|الْقَلَمِ|النَّاصِيَةِ|الزَّبَانِيَةِ','إِنَّ إِلَى رَبِّكَ ___|الرُّجْعَى|الْهُدَى|التَّقْوَى','كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَ___|اقْتَرِبْ|اقْرَأْ|ارْغَبْ'],
 k:['اللّٰهُ عَلَّمَ الْإِنْسَانَ الْكِتَابَةَ.|4','يَتَكَبَّرُ الْإِنْسَانُ إِذَا رَأَى نَفْسَهُ غَنِيًّا.|7','نَرْجِعُ إِلَى اللّٰهِ يَوْمَ الْقِيَامَةِ.|8'],
 q:['مَا أَوَّلُ مَا نَزَلَ مِنَ الْقُرْآنِ؟|اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ|الْحَمْدُ لِلّٰهِ رَبِّ الْعَالَمِينَ|قُلْ هُوَ اللّٰهُ أَحَدٌ','أَيْنَ نَزَلَتْ هٰذِهِ الْآيَاتُ؟|فِي غَارِ حِرَاءٍ|فِي الْمَدِينَةِ|فِي الطَّائِفِ','مَتَى يَطْغَى الْإِنْسَانُ؟|إِذَا رَأَى نَفْسَهُ غَنِيًّا|إِذَا كَانَ مَرِيضًا|إِذَا صَلَّى','مَنِ الَّذِي كَانَ يَنْهَى النَّبِيَّ عَنِ الصَّلَاةِ؟|أَبُو جَهْلٍ|أَبُو بَكْرٍ|بِلَالٌ','مَتَى يَكُونُ الْعَبْدُ أَقْرَبَ إِلَى رَبِّهِ؟|وَهُوَ سَاجِدٌ|وَهُوَ نَائِمٌ|وَهُوَ فِي السُّوقِ'],
 h:['قَالَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ: «أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ، فَأَكْثِرُوا الدُّعَاءَ».|Пратеникът казва: „Рабът е най-близо до своя Господ, когато е на земен поклон, затова умножавайте молбите.“ (Муслим)']},
/* ---------- 9: القدر ---------- */
{u:'Сури от Джуз Амма',ar:'سُورَةُ الْقَدْرِ',t:'Сура Ал-Кадр',wk:9,
 a:['إِنَّا أَنْزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ|Низпослахме го (Корана) в Нощта на могъществото.','وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ|А откъде да знаеш какво е Нощта на могъществото?','لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ أَلْفِ شَهْرٍ|Нощта на могъществото е по-добра от хиляда месеца.','تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِمْ مِنْ كُلِّ أَمْرٍ|В нея слизат ангелите и Духът (Джибрил) с позволението на своя Господ с всяка повеля.','سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ|Мир е тя до изгрева на зората.'],
 w:['أَنْزَلَ|низпосла','لَيْلَةُ الْقَدْرِ|Нощта на могъществото','أَلْفُ شَهْرٍ|хиляда месеца','تَنَزَّلَ|слиза','الرُّوحُ|Духът (Джибрил)','بِإِذْنِ|с позволението на','مَطْلَعٌ|изгрев','الْفَجْرُ|зората','شَرَفٌ|чест, достойнство'],
 x:['Коранът е низпослан изцяло до най-близкото небе в Нощта на могъществото, а после е низпосылан на части в течение на 23 години.'],
 m:['أَنْزَلْنَاهُ|أَنْزَلْنَا الْقُرْآنَ|низпослахме Корана','لَيْلَةِ الْقَدْرِ|لَيْلَةِ الشَّرَفِ، وَهِيَ فِي رَمَضَانَ|нощта на честта — тя е в Рамадан','خَيْرٌ مِنْ أَلْفِ شَهْرٍ|الْعِبَادَةُ فِيهَا أَفْضَلُ مِنْ عِبَادَةِ أَلْفِ شَهْرٍ|поклонението в нея е по-добро от поклонението в хиляда месеца','الرُّوحُ|جِبْرِيلُ عَلَيْهِ السَّلَامُ|Джибрил','سَلَامٌ هِيَ|كُلُّهَا خَيْرٌ وَأَمْنٌ|цялата е добро и безопасност','مَطْلَعِ الْفَجْرِ|طُلُوعِ الْفَجْرِ|изгрева на зората'],
 e:['أَنْزَلَ اللّٰهُ الْقُرْآنَ فِي لَيْلَةِ الْقَدْرِ، وَهِيَ لَيْلَةٌ مِنْ لَيَالِي رَمَضَانَ.|Аллах низпосла Корана в Нощта на могъществото — една от нощите на Рамадан.','وَالْعِبَادَةُ فِيهَا خَيْرٌ مِنَ الْعِبَادَةِ فِي أَلْفِ شَهْرٍ.|Поклонението в нея е по-добро от поклонението в хиляда месеца.','وَتَنْزِلُ فِيهَا الْمَلَائِكَةُ وَجِبْرِيلُ، وَهِيَ خَيْرٌ وَأَمْنٌ حَتَّى طُلُوعِ الْفَجْرِ.|В нея слизат ангелите и Джибрил, и тя е добро и безопасност до изгрева на зората.'],
 o:['أَنْزَلَ|رَفَعَ','خَيْرٌ|شَرٌّ','اللَّيْلَةُ|الْيَوْمُ'],
 p:['أَنْزَلَ اللّٰهُ الْقُرْآنَ فِي رَمَضَانَ.|لَيْلَةُ الْقَدْرِ|أَنْزَلَ اللّٰهُ الْقُرْآنَ فِي لَيْلَةِ الْقَدْرِ.|Аллах низпосла Корана в Нощта на могъществото.|أَنْزَلَ اللّٰهُ الْقُرْآنَ فِي لَيْلَةُ الْقَدْرِ.|أَنْزَلَ اللّٰهُ الْقُرْآنُ فِي لَيْلَةِ الْقَدْرِ.','لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ أَلْفِ شَهْرٍ.|الصَّلَاةُ فِي الْمَسْجِدِ / الصَّلَاةُ فِي الْبَيْتِ|الصَّلَاةُ فِي الْمَسْجِدِ خَيْرٌ مِنَ الصَّلَاةِ فِي الْبَيْتِ.|Молитвата в джамията е по-добра от молитвата у дома.|الصَّلَاةُ فِي الْمَسْجِدِ خَيْرًا مِنَ الصَّلَاةِ فِي الْبَيْتِ.|الصَّلَاةُ فِي الْمَسْجِدِ خَيْرٌ مِنَ الصَّلَاةُ فِي الْبَيْتِ.'],
 f:['إِنَّا أَنْزَلْنَاهُ فِي لَيْلَةِ ___|الْقَدْرِ|الْفَجْرِ|الرُّوحِ','لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ أَلْفِ ___|شَهْرٍ|أَمْرٍ|فَجْرٍ','سَلَامٌ هِيَ حَتَّى مَطْلَعِ ___|الْفَجْرِ|الشَّهْرِ|الْقَدْرِ'],
 k:['الْعِبَادَةُ فِي هٰذِهِ اللَّيْلَةِ أَفْضَلُ مِنْ عِبَادَةِ أَلْفِ شَهْرٍ.|3','تَنْزِلُ الْمَلَائِكَةُ وَجِبْرِيلُ فِي هٰذِهِ اللَّيْلَةِ.|4','هٰذِهِ اللَّيْلَةُ أَمْنٌ وَخَيْرٌ حَتَّى طُلُوعِ الْفَجْرِ.|5'],
 q:['فِي أَيِّ لَيْلَةٍ نَزَلَ الْقُرْآنُ؟|فِي لَيْلَةِ الْقَدْرِ|فِي لَيْلَةِ الْعِيدِ|فِي لَيْلَةِ الْجُمُعَةِ','فِي أَيِّ شَهْرٍ لَيْلَةُ الْقَدْرِ؟|فِي رَمَضَانَ|فِي شَوَّالٍ|فِي ذِي الْحِجَّةِ','مَنِ الرُّوحُ؟|جِبْرِيلُ عَلَيْهِ السَّلَامُ|الْإِنْسَانُ|الْقَمَرُ','كَمْ سَنَةً نَزَلَ الْقُرْآنُ عَلَى الرَّسُولِ؟|ثَلَاثًا وَعِشْرِينَ سَنَةً|سَنَةً وَاحِدَةً|أَلْفَ شَهْرٍ'],
 h:['قَالَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ: «مَنْ قَامَ لَيْلَةَ الْقَدْرِ إِيمَانًا وَاحْتِسَابًا، غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ».|Пратеникът казва: „Който прекара Нощта на могъществото в молитва с вяра и в очакване на наградата, ще му бъдат простени предишните грехове.“ (ал-Бухари и Муслим)']},
/* ---------- 10: البينة ---------- */
{u:'Сури от Джуз Амма',ar:'سُورَةُ الْبَيِّنَةِ',t:'Сура Ал-Байина',wk:10,
 a:['لَمْ يَكُنِ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ مُنْفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ الْبَيِّنَةُ|Неверниците от хората на Писанието и многобожниците не се откъснаха (от неверието си), докато не им дойде ясното доказателство:','رَسُولٌ مِنَ اللّٰهِ يَتْلُو صُحُفًا مُطَهَّرَةً|пратеник от Аллах, който чете пречистени свитъци,','فِيهَا كُتُبٌ قَيِّمَةٌ|в които има правилни писания.','وَمَا تَفَرَّقَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِنْ بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَةُ|И онези, на които бе дадено Писанието, се разделиха едва след като им дойде ясното доказателство.','وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللّٰهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ وَذٰلِكَ دِينُ الْقَيِّمَةِ|А им бе повелено само да служат на Аллах, искрени във вярата към Него, отклонени от лъжата, да отслужват молитвата и да дават зекята — това е правилната вяра.','إِنَّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَالِدِينَ فِيهَا أُولٰئِكَ هُمْ شَرُّ الْبَرِيَّةِ|Неверниците от хората на Писанието и многобожниците са в огъня на Ада, вечно ще пребивават там — те са най-лошите създания.','إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولٰئِكَ هُمْ خَيْرُ الْبَرِيَّةِ|А онези, които повярваха и вършеха праведни дела, те са най-добрите създания.','جَزَاؤُهُمْ عِنْدَ رَبِّهِمْ جَنَّاتُ عَدْنٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا رَضِيَ اللّٰهُ عَنْهُمْ وَرَضُوا عَنْهُ ذٰلِكَ لِمَنْ خَشِيَ رَبَّهُ|Наградата им при техния Господ са Градините на Адн, под които текат реки — вечно ще пребивават там. Аллах е доволен от тях и те са доволни от Него. Това е за онзи, който се бои от своя Господ.'],
 w:['أَهْلُ الْكِتَابِ|хората на Писанието (юдеи и християни)','الْمُشْرِكُونَ|многобожниците','مُنْفَكِّينَ|откъснали се, престанали','الْبَيِّنَةُ|ясното доказателство','صُحُفٌ|свитъци','مُطَهَّرَةٌ|пречистени','قَيِّمَةٌ|правилни, прави','تَفَرَّقَ|разделиха се','مُخْلِصِينَ|искрени','حُنَفَاءُ|отклонени от лъжата към истината','الْبَرِيَّةُ|създанията','عَدْنٌ|вечно пребиваване (Рай)','خَشِيَ|бои се'],
 x:['Сурата показва, че Пратеникът е ясното доказателство, и разделя хората на най-лоши и най-добри създания според вярата и делата им.'],
 m:['مُنْفَكِّينَ|تَارِكِينَ لِكُفْرِهِمْ|оставящи неверието си','الْبَيِّنَةُ|الدَّلِيلُ الْوَاضِحُ، وَهُوَ الرَّسُولُ|ясното доказателство — Пратеникът','صُحُفًا مُطَهَّرَةً|الْقُرْآنَ|Корана','قَيِّمَةٌ|مُسْتَقِيمَةٌ|прави, правилни','حُنَفَاءَ|مَائِلِينَ عَنِ الشِّرْكِ إِلَى التَّوْحِيدِ|отклонени от многобожието към единобожието','الْبَرِيَّةِ|الْخَلْقِ|създанията','جَنَّاتُ عَدْنٍ|جَنَّاتُ إِقَامَةٍ دَائِمَةٍ|градини на вечно пребиваване'],
 e:['لَمْ يَتْرُكِ الْكُفَّارُ كُفْرَهُمْ حَتَّى جَاءَهُمُ الرَّسُولُ يَقْرَأُ عَلَيْهِمُ الْقُرْآنَ.|Неверниците не оставиха неверието си, докато не им дойде Пратеникът да им чете Корана.','وَأَمَرَهُمُ اللّٰهُ أَنْ يَعْبُدُوهُ وَحْدَهُ، وَيُقِيمُوا الصَّلَاةَ، وَيُؤْتُوا الزَّكَاةَ.|Аллах им повели да служат само на Него, да отслужват молитвата и да дават зекята.','فَالْكُفَّارُ شَرُّ الْخَلْقِ وَمَصِيرُهُمُ النَّارُ، وَالْمُؤْمِنُونَ خَيْرُ الْخَلْقِ وَجَزَاؤُهُمُ الْجَنَّةُ.|Неверниците са най-лошите създания и краят им е огънят, а вярващите са най-добрите създания и наградата им е Раят.'],
 o:['خَيْرُ الْبَرِيَّةِ|شَرُّ الْبَرِيَّةِ','آمَنَ|كَفَرَ','تَفَرَّقَ|اجْتَمَعَ'],
 p:['الْمُؤْمِنُونَ خَيْرُ الْبَرِيَّةِ.|الْكُفَّارُ / شَرٌّ|الْكُفَّارُ شَرُّ الْبَرِيَّةِ.|Неверниците са най-лошите създания.|الْكُفَّارُ شَرَّ الْبَرِيَّةِ.|الْكُفَّارُ شَرُّ الْبَرِيَّةُ.','أَمَرَ اللّٰهُ النَّاسَ أَنْ يَعْبُدُوهُ.|يُقِيمُوا الصَّلَاةَ|أَمَرَ اللّٰهُ النَّاسَ أَنْ يُقِيمُوا الصَّلَاةَ.|Аллах повели на хората да отслужват молитвата.|أَمَرَ اللّٰهُ النَّاسَ أَنْ يُقِيمُونَ الصَّلَاةَ.|أَمَرَ اللّٰهُ النَّاسَ أَنْ يُقِيمُوا الصَّلَاةُ.'],
 f:['رَسُولٌ مِنَ اللّٰهِ يَتْلُو صُحُفًا ___|مُطَهَّرَةً|قَيِّمَةً|حُنَفَاءَ','أُولٰئِكَ هُمْ خَيْرُ ___|الْبَرِيَّةِ|الْكِتَابِ|الزَّكَاةِ','جَزَاؤُهُمْ عِنْدَ رَبِّهِمْ جَنَّاتُ ___|عَدْنٍ|صُحُفٍ|كُتُبٍ','وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا ___|الزَّكَاةَ|الْبَيِّنَةَ|الدِّينَ'],
 k:['جَاءَهُمُ الرَّسُولُ يَقْرَأُ الْقُرْآنَ.|2','أَمَرَهُمُ اللّٰهُ أَنْ يَعْبُدُوهُ وَحْدَهُ.|5','الْمُؤْمِنُونَ خَيْرُ الْخَلْقِ.|7'],
 q:['مَنِ الْبَيِّنَةُ فِي هٰذِهِ السُّورَةِ؟|الرَّسُولُ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ|الْمَلَائِكَةُ|الْمُشْرِكُونَ','بِمَاذَا أُمِرَ النَّاسُ؟|أَنْ يَعْبُدُوا اللّٰهَ وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ|أَنْ يَجْمَعُوا الْمَالَ|أَنْ يَتَفَرَّقُوا','مَنْ شَرُّ الْبَرِيَّةِ؟|الْكُفَّارُ|الْمُؤْمِنُونَ|الْمَلَائِكَةُ','مَا جَزَاءُ الْمُؤْمِنِينَ؟|جَنَّاتُ عَدْنٍ|الْمَالُ الْكَثِيرُ|نَارُ جَهَنَّمَ']},
/* ---------- 11: الزلزلة ---------- */
{u:'Сури от Джуз Амма',ar:'سُورَةُ الزَّلْزَلَةِ',t:'Сура Аз-Залзала',wk:11,
 a:['إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا|Когато земята бъде разтърсена с нейното разтърсване,','وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا|и земята изкара товарите си (мъртвите),','وَقَالَ الْإِنْسَانُ مَا لَهَا|и човекът каже: „Какво ѝ е?“,','يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا|в онзи Ден тя ще разкаже новините си,','بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا|защото твоят Господ ѝ е повелил.','يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِيُرَوْا أَعْمَالَهُمْ|В онзи Ден хората ще излязат на разпръснати групи, за да им бъдат показани делата.','فَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ|И който е сторил добро колкото прашинка, ще го види.','وَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ|И който е сторил зло колкото прашинка, ще го види.'],
 w:['زُلْزِلَتْ|разтърси се','زِلْزَالٌ|земетресение','أَثْقَالٌ|товари','يَوْمَئِذٍ|в онзи ден','أَخْبَارٌ|новини','أَوْحَى|повеля, разкри','صَدَرَ / يَصْدُرُ|излезе, върна се','أَشْتَاتًا|разпръснати','مِثْقَالٌ|тежест','ذَرَّةٌ|прашинка','الْحِسَابُ|равносметката','الْأَمْوَاتُ|мъртвите'],
 x:['Сурата описва Съдния ден: земята ще се разтърси, ще изкара мъртвите и ще разкаже какво е ставало върху нея. Всяко дело, дори колкото прашинка, ще бъде видяно.'],
 m:['زُلْزِلَتِ|اهْتَزَّتْ بِشِدَّةٍ|се разтресе силно','أَثْقَالَهَا|الْأَمْوَاتَ الَّذِينَ فِيهَا|мъртвите в нея','تُحَدِّثُ أَخْبَارَهَا|تُخْبِرُ بِمَا عُمِلَ عَلَيْهَا|разказва какво е било вършено върху нея','يَصْدُرُ|يَرْجِعُ مِنَ الْحِسَابِ|се връщат от равносметката','أَشْتَاتًا|مُتَفَرِّقِينَ|разпръснати','مِثْقَالَ ذَرَّةٍ|شَيْئًا صَغِيرًا جِدًّا|нещо много малко'],
 e:['يَوْمَ الْقِيَامَةِ تَهْتَزُّ الْأَرْضُ بِشِدَّةٍ، وَيَخْرُجُ مِنْهَا الْأَمْوَاتُ.|В Съдния ден земята ще се разтърси силно и от нея ще излязат мъртвите.','وَتُخْبِرُ الْأَرْضُ بِمَا عَمِلَ النَّاسُ عَلَيْهَا؛ لِأَنَّ اللّٰهَ أَمَرَهَا بِذٰلِكَ.|Земята ще разкаже какво са вършили хората върху нея, защото Аллах ѝ е повелил това.','وَيَرْجِعُ النَّاسُ مِنَ الْحِسَابِ مُتَفَرِّقِينَ، وَيَرَى كُلُّ إِنْسَانٍ عَمَلَهُ وَلَوْ كَانَ صَغِيرًا.|Хората ще се връщат от равносметката разпръснати и всеки ще види делото си, дори да е малко.'],
 o:['خَيْرٌ|شَرٌّ','أَخْرَجَ|أَدْخَلَ','مُتَفَرِّقٌ|مُجْتَمِعٌ'],
 p:['تُحَدِّثُ الْأَرْضُ أَخْبَارَهَا.|الْأَرْضُ|الْأَرْضُ تُحَدِّثُ أَخْبَارَهَا.|Земята разказва новините си.|الْأَرْضَ تُحَدِّثُ أَخْبَارَهَا.|الْأَرْضُ يُحَدِّثُ أَخْبَارَهَا.','يَصْدُرُ النَّاسُ أَشْتَاتًا.|النَّاسُ|النَّاسُ يَصْدُرُونَ أَشْتَاتًا.|Хората излизат разпръснати.|النَّاسُ يَصْدُرُ أَشْتَاتًا.|النَّاسَ يَصْدُرُونَ أَشْتَاتًا.','أَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا.|الْأَرْضُ|الْأَرْضُ أَخْرَجَتْ أَثْقَالَهَا.|Земята изкара товарите си.|الْأَرْضُ أَخْرَجَ أَثْقَالَهَا.|الْأَرْضُ أَخْرَجَتْ أَثْقَالُهَا.'],
 f:['إِذَا زُلْزِلَتِ الْأَرْضُ ___|زِلْزَالَهَا|أَثْقَالَهَا|أَخْبَارَهَا','يَوْمَئِذٍ تُحَدِّثُ ___|أَخْبَارَهَا|أَثْقَالَهَا|أَعْمَالَهُمْ','فَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ ___ يَرَهُ|خَيْرًا|أَشْتَاتًا|زِلْزَالًا'],
 k:['يَخْرُجُ الْأَمْوَاتُ مِنَ الْأَرْضِ.|2','الْأَرْضُ تُخْبِرُ بِمَا عَمِلَ النَّاسُ عَلَيْهَا.|4','يَرَى الْإِنْسَانُ عَمَلَهُ الْحَسَنَ وَلَوْ كَانَ صَغِيرًا.|7'],
 q:['مَتَى تُزَلْزَلُ الْأَرْضُ زِلْزَالَهَا؟|يَوْمَ الْقِيَامَةِ|كُلَّ يَوْمٍ|فِي الشِّتَاءِ','مَا أَثْقَالُ الْأَرْضِ؟|الْأَمْوَاتُ|الْجِبَالُ|الْبِحَارُ','لِمَاذَا تُحَدِّثُ الْأَرْضُ أَخْبَارَهَا؟|لِأَنَّ اللّٰهَ أَمَرَهَا|لِأَنَّ النَّاسَ سَأَلُوهَا|لِأَنَّهَا تُحِبُّ الْكَلَامَ','هَلْ يَرَى الْإِنْسَانُ عَمَلَهُ الصَّغِيرَ؟|نَعَمْ، وَلَوْ كَانَ مِثْقَالَ ذَرَّةٍ|لَا|يَرَى الْكَبِيرَ فَقَطْ']},
/* ---------- 12–13: العاديات ---------- */
{u:'Сури от Джуз Амма',ar:'سُورَةُ الْعَادِيَاتِ',t:'Сура Ал-Адият',wk:[12,13],
 a:['وَالْعَادِيَاتِ ضَبْحًا|Кълна се в задъханите бегачи (конете),','فَالْمُورِيَاتِ قَدْحًا|които с копитата си вадят искри,','فَالْمُغِيرَاتِ صُبْحًا|които нападат призори','فَأَثَرْنَ بِهِ نَقْعًا|и вдигат тогава прах,','فَوَسَطْنَ بِهِ جَمْعًا|и навлизат с него в средата на вражеската войска!','إِنَّ الْإِنْسَانَ لِرَبِّهِ لَكَنُودٌ|Човекът наистина е неблагодарен към своя Господ,','وَإِنَّهُ عَلَىٰ ذٰلِكَ لَشَهِيدٌ|и сам е свидетел на това,','وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ|и много обича богатството.','أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ|Нима не знае, че когато бъде изровено онова, което е в гробовете,','وَحُصِّلَ مَا فِي الصُّدُورِ|и бъде извадено наяве онова, което е в гърдите,','إِنَّ رَبَّهُمْ بِهِمْ يَوْمَئِذٍ لَخَبِيرٌ|техният Господ в онзи Ден знае всичко за тях?'],
 w:['الْعَادِيَاتُ|бягащите (конете)','ضَبْحٌ|задъхване','الْمُورِيَاتُ|вадещите искри','قَدْحٌ|удар, от който излизат искри','الْمُغِيرَاتُ|нападащите','صُبْحًا|призори','أَثَارَ|вдигна','نَقْعٌ|прах','وَسَطَ|навлезе в средата','جَمْعٌ|войска, множество','كَنُودٌ|неблагодарен','الْخَيْرُ|богатството','بُعْثِرَ|изровено','حُصِّلَ|извадено наяве','خَبِيرٌ|Знаещият всичко','خَيْلٌ|коне','حَوَافِرُ|копита'],
 x:['Аллах се кълне в конете на воините, които тичат задъхани и нападат призори, че човекът е неблагодарен и прекалено обича богатството.'],
 m:['الْعَادِيَاتِ ضَبْحًا|الْخَيْلِ الَّتِي تَعْدُو وَيُسْمَعُ صَوْتُ نَفَسِهَا|конете, които тичат и се чува дишането им','الْمُورِيَاتِ قَدْحًا|الَّتِي تُخْرِجُ النَّارَ بِحَوَافِرِهَا مِنَ الْحِجَارَةِ|които с копитата си вадят искри от камъните','الْمُغِيرَاتِ صُبْحًا|الَّتِي تَهْجُمُ عَلَى الْعَدُوِّ فِي الصَّبَاحِ|които нападат врага сутрин','نَقْعًا|غُبَارًا|прах','لَكَنُودٌ|لَا يَشْكُرُ رَبَّهُ|не благодари на своя Господ','لِحُبِّ الْخَيْرِ|لِحُبِّ الْمَالِ|заради любовта към богатството','بُعْثِرَ|أُخْرِجَ مِنَ الْقُبُورِ|изведено от гробовете'],
 e:['أَقْسَمَ اللّٰهُ بِالْخَيْلِ الَّتِي تَعْدُو فِي الْجِهَادِ، وَتُخْرِجُ النَّارَ بِحَوَافِرِهَا، وَتَهْجُمُ عَلَى الْعَدُوِّ فِي الصَّبَاحِ.|Аллах се кълне в конете, които тичат в борбата по пътя Му, вадят искри с копитата си и нападат врага сутрин.','أَنَّ الْإِنْسَانَ لَا يَشْكُرُ رَبَّهُ، وَيُحِبُّ الْمَالَ كَثِيرًا.|Че човекът не благодари на своя Господ и много обича богатството.','وَيَوْمَ الْقِيَامَةِ يَخْرُجُ النَّاسُ مِنَ الْقُبُورِ، وَيُظْهِرُ اللّٰهُ مَا فِي الْقُلُوبِ، وَهُوَ خَبِيرٌ بِهِمْ.|В Съдния ден хората ще излязат от гробовете, Аллах ще покаже какво има в сърцата и Той знае всичко за тях.'],
 o:['يَشْكُرُ|يَكْفُرُ','أَخْرَجَ|أَدْخَلَ','الصَّبَاحُ|الْمَسَاءُ'],
 p:['الْخَيْلُ تَعْدُو.|الْعَادِيَاتُ|الْعَادِيَاتُ هِيَ الْخَيْلُ الَّتِي تَعْدُو.|„Ал-адият“ са конете, които тичат.|الْعَادِيَاتُ هُوَ الْخَيْلُ الَّتِي تَعْدُو.|الْعَادِيَاتِ هِيَ الْخَيْلُ الَّتِي تَعْدُو.','الْإِنْسَانُ لَا يَشْكُرُ رَبَّهُ.|كَنُودٌ|الْإِنْسَانُ كَنُودٌ لِرَبِّهِ.|Човекът е неблагодарен към своя Господ.|الْإِنْسَانُ كَنُودًا لِرَبِّهِ.|الْإِنْسَانَ كَنُودٌ لِرَبِّهِ.','الْإِنْسَانُ يُحِبُّ الْمَالَ.|الْخَيْرُ|الْإِنْسَانُ يُحِبُّ الْخَيْرَ.|Човекът обича богатството.|الْإِنْسَانُ يُحِبُّ الْخَيْرُ.|الْإِنْسَانُ تُحِبُّ الْخَيْرَ.'],
 f:['وَالْعَادِيَاتِ ___|ضَبْحًا|قَدْحًا|نَقْعًا','فَالْمُغِيرَاتِ ___|صُبْحًا|جَمْعًا|ضَبْحًا','إِنَّ الْإِنْسَانَ لِرَبِّهِ ___|لَكَنُودٌ|لَشَهِيدٌ|لَخَبِيرٌ','وَحُصِّلَ مَا فِي ___|الصُّدُورِ|الْقُبُورِ|الْخَيْلِ'],
 k:['الْإِنْسَانُ لَا يَشْكُرُ رَبَّهُ.|6','الْإِنْسَانُ يُحِبُّ الْمَالَ كَثِيرًا.|8','الْخَيْلُ تَهْجُمُ عَلَى الْعَدُوِّ فِي الصَّبَاحِ.|3'],
 q:['بِمَاذَا أَقْسَمَ اللّٰهُ فِي هٰذِهِ السُّورَةِ؟|بِالْخَيْلِ|بِالْإِبِلِ|بِالطُّيُورِ','مَتَى تَهْجُمُ الْخَيْلُ عَلَى الْعَدُوِّ؟|فِي الصَّبَاحِ|فِي اللَّيْلِ|فِي الْمَسَاءِ','مَا مَعْنَى «كَنُودٌ»؟|لَا يَشْكُرُ رَبَّهُ|يَشْكُرُ رَبَّهُ كَثِيرًا|يُحِبُّ النَّاسَ','مَا الْخَيْرُ فِي قَوْلِهِ «لِحُبِّ الْخَيْرِ»؟|الْمَالُ|الصَّلَاةُ|الْعِلْمُ']},
/* ---------- 14: القارعة ---------- */
{u:'Сури от Джуз Амма',ar:'سُورَةُ الْقَارِعَةِ',t:'Сура Ал-Кариа',wk:14,
 a:['الْقَارِعَةُ|Удрящото бедствие!','مَا الْقَارِعَةُ|Какво е удрящото бедствие?','وَمَا أَدْرَاكَ مَا الْقَارِعَةُ|И откъде да знаеш какво е удрящото бедствие?','يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوثِ|В Деня, когато хората ще са като разпръснати пеперуди','وَتَكُونُ الْجِبَالُ كَالْعِهْنِ الْمَنْفُوشِ|и планините ще са като разчесана вълна.','فَأَمَّا مَنْ ثَقُلَتْ مَوَازِينُهُ|Тогава онзи, чиито везни натежат (от добри дела),','فَهُوَ فِي عِيشَةٍ رَاضِيَةٍ|ще бъде в доволен живот.','وَأَمَّا مَنْ خَفَّتْ مَوَازِينُهُ|А онзи, чиито везни олекнат,','فَأُمُّهُ هَاوِيَةٌ|неговото убежище е пропастта.','وَمَا أَدْرَاكَ مَا هِيَهْ|И откъде да знаеш какво е тя?','نَارٌ حَامِيَةٌ|Пламтящ огън!'],
 w:['الْقَارِعَةُ|удрящото бедствие (Съдният ден)','الْفَرَاشُ|пеперуди, нощни пеперуди','الْمَبْثُوثُ|разпръснат','الْجِبَالُ|планините','الْعِهْنُ|вълна','الْمَنْفُوشُ|разчесан, раздърпан','ثَقُلَ|натежа','مَوَازِينُ|везни','عِيشَةٌ رَاضِيَةٌ|доволен живот','خَفَّ|олекна','هَاوِيَةٌ|пропаст (Адът)','حَامِيَةٌ|много горещ'],
 x:['„Ал-Кариа“ е едно от имената на Съдния ден: той удря сърцата със страх. В него делата се претеглят на везни.'],
 m:['الْقَارِعَةُ|يَوْمُ الْقِيَامَةِ؛ تَقْرَعُ الْقُلُوبَ بِالْخَوْفِ|Съдният ден — удря сърцата със страх','كَالْفَرَاشِ الْمَبْثُوثِ|كَالْحَشَرَاتِ الصَّغِيرَةِ الْمُتَفَرِّقَةِ|като малки разпръснати насекоми','كَالْعِهْنِ الْمَنْفُوشِ|كَالصُّوفِ الْمُتَفَرِّقِ|като разпиляна вълна','ثَقُلَتْ مَوَازِينُهُ|كَثُرَتْ حَسَنَاتُهُ|добрите му дела са много','خَفَّتْ مَوَازِينُهُ|قَلَّتْ حَسَنَاتُهُ وَكَثُرَتْ سَيِّئَاتُهُ|добрите му дела са малко, а лошите — много','فَأُمُّهُ هَاوِيَةٌ|مَسْكَنُهُ النَّارُ|жилището му е огънят','حَامِيَةٌ|شَدِيدَةُ الْحَرَارَةِ|много гореща'],
 e:['يَوْمُ الْقِيَامَةِ يَوْمٌ عَظِيمٌ، يَكُونُ فِيهِ النَّاسُ مُتَفَرِّقِينَ كَالْحَشَرَاتِ الصَّغِيرَةِ، وَتَكُونُ الْجِبَالُ كَالصُّوفِ.|Съдният ден е велик ден: в него хората ще са разпръснати като малки насекоми, а планините — като вълна.','فَمَنْ كَثُرَتْ حَسَنَاتُهُ فَهُوَ فِي حَيَاةٍ طَيِّبَةٍ فِي الْجَنَّةِ.|Който има много добри дела, ще живее хубав живот в Рая.','وَمَنْ قَلَّتْ حَسَنَاتُهُ فَمَسْكَنُهُ النَّارُ الشَّدِيدَةُ الْحَرَارَةِ.|А който има малко добри дела, жилището му ще е много горещият огън.'],
 o:['ثَقُلَ|خَفَّ','الْحَسَنَةُ|السَّيِّئَةُ','حَارٌّ|بَارِدٌ'],
 p:['مَنْ ثَقُلَتْ مَوَازِينُهُ فَهُوَ فِي الْجَنَّةِ.|خَفَّتْ / النَّارُ|مَنْ خَفَّتْ مَوَازِينُهُ فَهُوَ فِي النَّارِ.|Чиито везни олекнат, той е в огъня.|مَنْ خَفَّتْ مَوَازِينُهُ فَهُوَ فِي الْجَنَّةِ.|مَنْ خَفَّتْ مَوَازِينَهُ فَهُوَ فِي النَّارِ.','يَكُونُ النَّاسُ كَالْفَرَاشِ.|الْجِبَالُ / الْعِهْنُ|تَكُونُ الْجِبَالُ كَالْعِهْنِ.|Планините ще са като вълна.|يَكُونُ الْجِبَالُ كَالْعِهْنُ.|تَكُونُ الْجِبَالَ كَالْعِهْنِ.'],
 f:['يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ ___|الْمَبْثُوثِ|الْمَنْفُوشِ|حَامِيَةٍ','وَتَكُونُ الْجِبَالُ كَالْعِهْنِ ___|الْمَنْفُوشِ|الْمَبْثُوثِ|الرَّاضِيَةِ','فَهُوَ فِي عِيشَةٍ ___|رَاضِيَةٍ|حَامِيَةٍ|هَاوِيَةٍ','نَارٌ ___|حَامِيَةٌ|رَاضِيَةٌ|مَبْثُوثَةٌ'],
 k:['الْجِبَالُ تَكُونُ كَالصُّوفِ الْمُتَفَرِّقِ.|5','مَنْ كَثُرَتْ حَسَنَاتُهُ يَعِيشُ حَيَاةً طَيِّبَةً.|7','مَسْكَنُهُ النَّارُ.|9'],
 q:['مَا الْقَارِعَةُ؟|يَوْمُ الْقِيَامَةِ|نَهْرٌ|جَبَلٌ','كَيْفَ يَكُونُ النَّاسُ يَوْمَ الْقِيَامَةِ؟|كَالْفَرَاشِ الْمَبْثُوثِ|كَالْجِبَالِ|كَالصُّوفِ','أَيْنَ يَكُونُ مَنْ ثَقُلَتْ مَوَازِينُهُ؟|فِي عِيشَةٍ رَاضِيَةٍ|فِي النَّارِ|فِي الْهَاوِيَةِ','كَمْ جُزْءًا نَارُ الدُّنْيَا مِنْ نَارِ جَهَنَّمَ؟|جُزْءٌ مِنْ سَبْعِينَ جُزْءًا|نِصْفُهَا|مِثْلُهَا'],
 h:['قَالَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ: «نَارُكُمْ جُزْءٌ مِنْ سَبْعِينَ جُزْءًا مِنْ نَارِ جَهَنَّمَ».|Пратеникът казва: „Вашият огън е една седемдесета част от огъня на Ада.“ (ал-Бухари)']},
/* ---------- 15: التكاثر ---------- */
{u:'Сури от Джуз Амма',ar:'سُورَةُ التَّكَاثُرِ',t:'Сура Ат-Такасур',wk:15,
 a:['أَلْهَاكُمُ التَّكَاثُرُ|Надпреварата за повече ви отвлича,','حَتَّىٰ زُرْتُمُ الْمَقَابِرَ|докато посетите гробовете.','كَلَّا سَوْفَ تَعْلَمُونَ|Не! Ще узнаете!','ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ|И пак — не! Ще узнаете!','كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ|Не! Ако знаехте със сигурно знание…','لَتَرَوُنَّ الْجَحِيمَ|Непременно ще видите Ада!','ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِينِ|После ще го видите със сигурност, с очите си.','ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ|После в онзи Ден непременно ще бъдете питани за благата.'],
 w:['أَلْهَى / يُلْهِي|отвлече','التَّكَاثُرُ|надпреварата за повече','الْمَقَابِرُ|гробищата','الْيَقِينُ|сигурността','الْجَحِيمُ|Адът','النَّعِيمُ|благата','انْشَغَلَ|зае се, отвлече се','التَّفَاخُرُ|хвалбата'],
 x:['Сурата предупреждава хората, които се хвалят с богатство и деца и забравят Аллах, докато не умрат.'],
 m:['أَلْهَاكُمُ|شَغَلَكُمْ|ви отвлече','التَّكَاثُرُ|التَّفَاخُرُ بِكَثْرَةِ الْمَالِ وَالْأَوْلَادِ|хвалбата с много богатство и деца','زُرْتُمُ الْمَقَابِرَ|مُتُّمْ وَدُفِنْتُمْ|умряхте и бяхте погребани','عِلْمَ الْيَقِينِ|الْعِلْمَ الَّذِي لَا شَكَّ فِيهِ|знание без никакво съмнение','الْجَحِيمَ|النَّارَ|огъня','النَّعِيمِ|نِعَمِ اللّٰهِ فِي الدُّنْيَا|благата на Аллах в този свят'],
 e:['شَغَلَكُمُ التَّفَاخُرُ بِالْمَالِ وَالْأَوْلَادِ عَنْ طَاعَةِ اللّٰهِ حَتَّى مُتُّمْ.|Хвалбата с богатство и деца ви отвлече от покорството на Аллах, докато умряхте.','سَوْفَ تَعْلَمُونَ عَاقِبَةَ ذٰلِكَ، وَتَرَوْنَ النَّارَ بِأَعْيُنِكُمْ.|Ще узнаете последствията от това и ще видите огъня с очите си.','ثُمَّ يَسْأَلُكُمُ اللّٰهُ يَوْمَ الْقِيَامَةِ عَنْ نِعَمِهِ الَّتِي أَعْطَاكُمْ.|После Аллах ще ви попита в Съдния ден за благата, които ви е дал.'],
 o:['الدُّنْيَا|الْآخِرَةُ','الْيَقِينُ|الشَّكُّ','كَثْرَةٌ|قِلَّةٌ'],
 p:['هَلْ أَلْهَاكُمُ التَّكَاثُرُ؟|نَعَمْ|نَعَمْ، أَلْهَانَا التَّكَاثُرُ.|Да, надпреварата за повече ни отвлече.|نَعَمْ، أَلْهَاكُمُ التَّكَاثُرُ.|نَعَمْ، أَلْهَانَا التَّكَاثُرَ.','هَلْ سَتَرَوْنَ الْجَحِيمَ؟|نَعَمْ|نَعَمْ، سَنَرَى الْجَحِيمَ.|Да, ще видим Ада.|نَعَمْ، سَتَرَوْنَ الْجَحِيمَ.|نَعَمْ، سَنَرَى الْجَحِيمُ.','هَلْ سَتُسْأَلُونَ عَنِ النَّعِيمِ؟|نَعَمْ|نَعَمْ، سَنُسْأَلُ عَنِ النَّعِيمِ.|Да, ще бъдем питани за благата.|نَعَمْ، سَتُسْأَلُونَ عَنِ النَّعِيمِ.|نَعَمْ، سَنُسْأَلُ عَنِ النَّعِيمُ.'],
 f:['أَلْهَاكُمُ ___|التَّكَاثُرُ|النَّعِيمُ|الْيَقِينُ','حَتَّى زُرْتُمُ ___|الْمَقَابِرَ|الْجَحِيمَ|النَّعِيمَ','ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ ___|النَّعِيمِ|الْمَقَابِرِ|الْجَحِيمِ'],
 k:['شَغَلَكُمُ التَّفَاخُرُ بِالْمَالِ وَالْأَوْلَادِ.|1','يَسْأَلُكُمُ اللّٰهُ عَنْ نِعَمِهِ.|8','سَتَرَوْنَ النَّارَ بِأَعْيُنِكُمْ.|7'],
 q:['مَا التَّكَاثُرُ؟|التَّفَاخُرُ بِكَثْرَةِ الْمَالِ وَالْأَوْلَادِ|كَثْرَةُ الصَّلَاةِ|زِيَارَةُ الْأَصْدِقَاءِ','مَا مَعْنَى «زُرْتُمُ الْمَقَابِرَ»؟|مُتُّمْ وَدُفِنْتُمْ|ذَهَبْتُمْ إِلَى السُّوقِ|سَافَرْتُمْ','عَنْ أَيِّ شَيْءٍ يُسْأَلُ النَّاسُ يَوْمَ الْقِيَامَةِ؟|عَنِ النَّعِيمِ|عَنْ أَسْمَائِهِمْ فَقَطْ|عَنْ لَا شَيْءٍ','مَاذَا أَكَلَ الرَّسُولُ مَعَ أَبِي بَكْرٍ وَعُمَرَ؟|تَمْرًا وَلَحْمًا، وَشَرِبُوا مَاءً|خُبْزًا فَقَطْ|لَمْ يَأْكُلُوا شَيْئًا'],
 h:['خَرَجَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ وَمَعَهُ أَبُو بَكْرٍ وَعُمَرُ، وَكَانُوا جَائِعِينَ، فَذَهَبُوا إِلَى بَيْتِ رَجُلٍ مِنَ الْأَنْصَارِ.|Пратеникът излязъл заедно с Абу Бакр и Умар — били гладни — и отишли в дома на един човек от ансарите.','فَأَكَلُوا تَمْرًا وَلَحْمًا، وَشَرِبُوا مَاءً بَارِدًا.|Яли фурми и месо и пили студена вода.','فَقَالَ لَهُمُ الرَّسُولُ: «لَتُسْأَلُنَّ عَنْ هٰذَا النَّعِيمِ يَوْمَ الْقِيَامَةِ».|Тогава Пратеникът им казал: „Ще бъдете питани за това благо в Съдния ден.“ (по Муслим)']},
/* ================= Текстове за четене в края на книгата ================= */
{u:'Текстове за четене',ar:'مِنْ أَدِلَّةِ التَّوْحِيدِ',t:'Доказателства за единството на Аллах (Ал-Бакара 163–165)',n0:163,wk:2,
 a:['وَإِلٰهُكُمْ إِلٰهٌ وَاحِدٌ لَا إِلٰهَ إِلَّا هُوَ الرَّحْمٰنُ الرَّحِيمُ|Вашият Бог е един Бог. Няма друг бог освен Него, Всемилостивия, Милосърдния.','إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ وَالْفُلْكِ الَّتِي تَجْرِي فِي الْبَحْرِ بِمَا يَنْفَعُ النَّاسَ وَمَا أَنْزَلَ اللّٰهُ مِنَ السَّمَاءِ مِنْ مَاءٍ فَأَحْيَا بِهِ الْأَرْضَ بَعْدَ مَوْتِهَا وَبَثَّ فِيهَا مِنْ كُلِّ دَابَّةٍ وَتَصْرِيفِ الرِّيَاحِ وَالسَّحَابِ الْمُسَخَّرِ بَيْنَ السَّمَاءِ وَالْأَرْضِ لَآيَاتٍ لِقَوْمٍ يَعْقِلُونَ|В сътворяването на небесата и земята, в смяната на нощта и деня, в корабите, които плуват по морето с полезното за хората, във водата, която Аллах спуска от небето и с нея съживява земята след смъртта ѝ и разпръсва по нея всякакви животни, в посоките на ветровете и в облаците, подчинени между небето и земята — има знамения за хора, които разсъждават.','وَمِنَ النَّاسِ مَنْ يَتَّخِذُ مِنْ دُونِ اللّٰهِ أَنْدَادًا يُحِبُّونَهُمْ كَحُبِّ اللّٰهِ وَالَّذِينَ آمَنُوا أَشَدُّ حُبًّا لِلّٰهِ وَلَوْ يَرَى الَّذِينَ ظَلَمُوا إِذْ يَرَوْنَ الْعَذَابَ أَنَّ الْقُوَّةَ لِلّٰهِ جَمِيعًا وَأَنَّ اللّٰهَ شَدِيدُ الْعَذَابِ|А сред хората има такива, които приемат други освен Аллах за равни на Него и ги обичат, както се обича Аллах. Но вярващите обичат Аллах повече. Ако неправедните видят, когато видят наказанието, че цялата сила е на Аллах и че Аллах наказва сурово…'],
 w:['إِلٰهٌ|бог','الْفُلْكُ|корабите','أَحْيَا|съживи','بَثَّ|разпръсна','دَابَّةٌ|животно','تَصْرِيفُ الرِّيَاحِ|смяната на ветровете','السَّحَابُ|облаците','الْمُسَخَّرُ|подчиненият','أَنْدَادٌ|равни, съперници','الْقُوَّةُ|силата'],
 m:['وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ|مَجِيءِ اللَّيْلِ بَعْدَ النَّهَارِ وَالنَّهَارِ بَعْدَ اللَّيْلِ|идването на нощта след деня и на деня след нощта','الْفُلْكِ|السُّفُنِ|корабите','وَبَثَّ|وَنَشَرَ وَفَرَّقَ|и разпространи','أَنْدَادًا|أَمْثَالًا يَعْبُدُونَهُمْ|подобни, на които служат','لَآيَاتٍ|لَأَدِلَّةً عَلَى وَحْدَانِيَّةِ اللّٰهِ|доказателства за единството на Аллах'],
 e:['اللّٰهُ وَاحِدٌ لَا شَرِيكَ لَهُ، وَفِي خَلْقِهِ أَدِلَّةٌ كَثِيرَةٌ عَلَى ذٰلِكَ.|Аллах е един, без съдружник, и в творението Му има много доказателства за това.','مِنْهَا: السَّمَاوَاتُ وَالْأَرْضُ، وَاللَّيْلُ وَالنَّهَارُ، وَالسُّفُنُ فِي الْبَحْرِ، وَالْمَطَرُ الَّذِي يُحْيِي الْأَرْضَ.|Сред тях: небесата и земята, нощта и денят, корабите в морето и дъждът, който съживява земята.','وَالْمُؤْمِنُونَ يُحِبُّونَ اللّٰهَ أَكْثَرَ مِنْ كُلِّ شَيْءٍ.|А вярващите обичат Аллах повече от всичко.'],
 o:['أَحْيَا|أَمَاتَ','الْبَحْرُ|الْبَرُّ','الْقُوَّةُ|الضَّعْفُ'],
 f:['وَإِلٰهُكُمْ إِلٰهٌ ___|وَاحِدٌ|شَدِيدٌ|رَحِيمٌ','وَالْفُلْكِ الَّتِي تَجْرِي فِي ___|الْبَحْرِ|السَّمَاءِ|الْأَرْضِ','وَالَّذِينَ آمَنُوا أَشَدُّ ___ لِلّٰهِ|حُبًّا|عَذَابًا|قُوَّةً'],
 q:['كَمْ إِلٰهًا لِلنَّاسِ؟|إِلٰهٌ وَاحِدٌ|إِلٰهَانِ|آلِهَةٌ كَثِيرَةٌ','بِمَاذَا يُحْيِي اللّٰهُ الْأَرْضَ؟|بِالْمَاءِ الَّذِي يُنْزِلُهُ مِنَ السَّمَاءِ|بِالرِّيَاحِ|بِالسُّفُنِ','مَنْ أَشَدُّ حُبًّا لِلّٰهِ؟|الَّذِينَ آمَنُوا|الَّذِينَ ظَلَمُوا|الْمُشْرِكُونَ']},
{u:'Текстове за четене',ar:'الطَّرِيقُ الْأَقْوَمُ',t:'Най-правият път (Ал-Исра 9–12)',n0:9,wk:9,
 a:['إِنَّ هٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا كَبِيرًا|Този Коран води към най-правия път и известява на вярващите, които вършат праведни дела, че ще имат голяма награда,','وَأَنَّ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ أَعْتَدْنَا لَهُمْ عَذَابًا أَلِيمًا|а за онези, които не вярват в отвъдния свят, сме приготвили болезнено наказание.','وَيَدْعُ الْإِنْسَانُ بِالشَّرِّ دُعَاءَهُ بِالْخَيْرِ وَكَانَ الْإِنْسَانُ عَجُولًا|Човекът моли за злото, както моли за доброто — човекът е припрян.','وَجَعَلْنَا اللَّيْلَ وَالنَّهَارَ آيَتَيْنِ فَمَحَوْنَا آيَةَ اللَّيْلِ وَجَعَلْنَا آيَةَ النَّهَارِ مُبْصِرَةً لِتَبْتَغُوا فَضْلًا مِنْ رَبِّكُمْ وَلِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسَابَ وَكُلَّ شَيْءٍ فَصَّلْنَاهُ تَفْصِيلًا|Направихме нощта и деня две знамения: заличихме знамението на нощта и направихме знамението на деня светло, за да търсите благоволение от вашия Господ и да знаете броя на годините и сметката. И всичко сме разяснили подробно.'],
 w:['أَقْوَمُ|най-правият','بَشَّرَ / يُبَشِّرُ|известява радостна вест','أَعْتَدَ|приготви','أَلِيمٌ|болезнен','عَجُولٌ|припрян','مَحَا|заличи','مُبْصِرَةٌ|светла, с която се вижда','السِّنُونَ|годините','فَصَّلَ|разясни подробно'],
 m:['لِلَّتِي هِيَ أَقْوَمُ|لِلطَّرِيقِ الْمُسْتَقِيمِ|към правия път','أَعْتَدْنَا|أَعْدَدْنَا|приготвихме','عَجُولًا|يُسْرِعُ وَلَا يَصْبِرُ|бърза и не търпи','فَمَحَوْنَا آيَةَ اللَّيْلِ|جَعَلْنَا اللَّيْلَ مُظْلِمًا|направихме нощта тъмна','مُبْصِرَةً|مُضِيئَةً|светла'],
 e:['الْقُرْآنُ يُرْشِدُ النَّاسَ إِلَى الطَّرِيقِ الْمُسْتَقِيمِ، وَيُبَشِّرُ الْمُؤْمِنِينَ بِالْجَنَّةِ، وَيُنْذِرُ الْكُفَّارَ بِالنَّارِ.|Коранът води хората към правия път, известява на вярващите Рая и предупреждава неверниците за огъня.','وَالْإِنْسَانُ يَسْتَعْجِلُ، فَيَدْعُو أَحْيَانًا بِالشَّرِّ عَلَى نَفْسِهِ.|Човекът бърза и понякога моли за зло срещу себе си.','وَجَعَلَ اللّٰهُ اللَّيْلَ مُظْلِمًا لِلرَّاحَةِ، وَالنَّهَارَ مُضِيئًا لِلْعَمَلِ، وَلِنَعْرِفَ عَدَدَ السِّنِينَ.|Аллах направи нощта тъмна за почивка, а деня — светъл за работа и за да знаем броя на годините.'],
 o:['الْخَيْرُ|الشَّرُّ','مُظْلِمٌ|مُضِيءٌ','عَجُولٌ|صَبُورٌ'],
 f:['إِنَّ هٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ ___|أَقْوَمُ|عَجُولًا|أَلِيمًا','وَكَانَ الْإِنْسَانُ ___|عَجُولًا|أَقْوَمَ|مُبْصِرَةً','وَجَعَلْنَا اللَّيْلَ وَالنَّهَارَ ___|آيَتَيْنِ|أَجْرًا|عَذَابًا'],
 q:['إِلَى أَيِّ طَرِيقٍ يَهْدِي الْقُرْآنُ؟|إِلَى الطَّرِيقِ الْمُسْتَقِيمِ|إِلَى السُّوقِ|إِلَى الْبَحْرِ','لِمَاذَا جَعَلَ اللّٰهُ النَّهَارَ مُضِيئًا؟|لِنَعْمَلَ وَنَطْلُبَ فَضْلَ اللّٰهِ|لِنَنَامَ|لِنَلْعَبَ فَقَطْ','كَيْفَ وَصَفَ اللّٰهُ الْإِنْسَانَ فِي هٰذِهِ الْآيَاتِ؟|عَجُولًا|صَبُورًا|كَرِيمًا']},
{u:'Текстове за четене',ar:'ضَعُفَ الطَّالِبُ وَالْمَطْلُوبُ',t:'Притчата за мухата (Ал-Хадж 73–74)',n0:73,wk:10,
 a:['يَا أَيُّهَا النَّاسُ ضُرِبَ مَثَلٌ فَاسْتَمِعُوا لَهُ إِنَّ الَّذِينَ تَدْعُونَ مِنْ دُونِ اللّٰهِ لَنْ يَخْلُقُوا ذُبَابًا وَلَوِ اجْتَمَعُوا لَهُ وَإِنْ يَسْلُبْهُمُ الذُّبَابُ شَيْئًا لَا يَسْتَنْقِذُوهُ مِنْهُ ضَعُفَ الطَّالِبُ وَالْمَطْلُوبُ|О, хора, дава се притча, слушайте я! Онези, които призовавате освен Аллах, никога няма да сътворят дори муха, макар да се съберат за това. И ако мухата им отнеме нещо, не могат да си го върнат от нея. Слаби са и търсещият, и търсеното!','مَا قَدَرُوا اللّٰهَ حَقَّ قَدْرِهِ إِنَّ اللّٰهَ لَقَوِيٌّ عَزِيزٌ|Не оцениха Аллах, както подобава. Аллах е Всесилен, Всемогъщ.'],
 w:['مَثَلٌ|притча, пример','ذُبَابٌ|муха','اجْتَمَعَ|събра се','سَلَبَ / يَسْلُبُ|отне','اسْتَنْقَذَ|спаси, върна','ضَعُفَ|отслабна, слаб е','قَدَرَ|оцени','قَوِيٌّ|силен','عَزِيزٌ|могъщ'],
 m:['ضُرِبَ مَثَلٌ|ذُكِرَ مَثَلٌ لِلْبَيَانِ|дава се пример за разяснение','يَسْلُبْهُمُ|يَأْخُذْ مِنْهُمْ|им отнеме','لَا يَسْتَنْقِذُوهُ|لَا يَسْتَطِيعُونَ أَنْ يَأْخُذُوهُ مِنْهُ|не могат да си го вземат обратно','الطَّالِبُ وَالْمَطْلُوبُ|الْأَصْنَامُ وَالذُّبَابُ|идолите и мухата','مَا قَدَرُوا اللّٰهَ حَقَّ قَدْرِهِ|مَا عَظَّمُوهُ كَمَا يَجِبُ|не Го почетоха, както трябва'],
 e:['ضَرَبَ اللّٰهُ مَثَلًا لِلنَّاسِ: الْأَصْنَامُ الَّتِي يَعْبُدُهَا الْمُشْرِكُونَ لَا تَسْتَطِيعُ أَنْ تَخْلُقَ ذُبَابَةً صَغِيرَةً.|Аллах дава на хората пример: идолите, на които служат многобожниците, не могат да сътворят дори малка муха.','وَإِذَا أَخَذَ الذُّبَابُ مِنْهَا شَيْئًا لَا تَسْتَطِيعُ أَنْ تَأْخُذَهُ مِنْهُ.|И ако мухата вземе нещо от тях, не могат да си го вземат.','فَكَيْفَ يَعْبُدُونَهَا وَيَتْرُكُونَ اللّٰهَ الْقَوِيَّ الْعَزِيزَ؟|Как тогава им служат и оставят Аллах, Всесилния, Всемогъщия?'],
 o:['قَوِيٌّ|ضَعِيفٌ','اجْتَمَعَ|تَفَرَّقَ','أَخَذَ|أَعْطَى'],
 f:['لَنْ يَخْلُقُوا ___ وَلَوِ اجْتَمَعُوا لَهُ|ذُبَابًا|مَثَلًا|قَدْرًا','ضَعُفَ الطَّالِبُ وَ___|الْمَطْلُوبُ|الْعَزِيزُ|الذُّبَابُ','إِنَّ اللّٰهَ لَقَوِيٌّ ___|عَزِيزٌ|ضَعِيفٌ|مَطْلُوبٌ'],
 q:['مَاذَا لَا تَسْتَطِيعُ الْأَصْنَامُ أَنْ تَخْلُقَ؟|ذُبَابًا|جَبَلًا فَقَطْ|بَحْرًا فَقَطْ','مَنِ الطَّالِبُ وَالْمَطْلُوبُ؟|الْأَصْنَامُ وَالذُّبَابُ|النَّاسُ وَالْمَلَائِكَةُ|الْمُؤْمِنُونَ وَالْكُفَّارُ','مَا صِفَتَا اللّٰهِ فِي آخِرِ الْآيَةِ؟|قَوِيٌّ عَزِيزٌ|رَحْمٰنٌ رَحِيمٌ|غَفُورٌ رَحِيمٌ']},
{u:'Текстове за четене',ar:'تِجَارَةٌ رَابِحَةٌ',t:'Печеливша търговия (Ас-Сафф 10–13)',n0:10,wk:13,
 a:['يَا أَيُّهَا الَّذِينَ آمَنُوا هَلْ أَدُلُّكُمْ عَلَىٰ تِجَارَةٍ تُنْجِيكُمْ مِنْ عَذَابٍ أَلِيمٍ|О, вярващи, да ви посоча ли търговия, която ще ви спаси от болезнено наказание?','تُؤْمِنُونَ بِاللّٰهِ وَرَسُولِهِ وَتُجَاهِدُونَ فِي سَبِيلِ اللّٰهِ بِأَمْوَالِكُمْ وَأَنْفُسِكُمْ ذٰلِكُمْ خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ|Да вярвате в Аллах и в Неговия Пратеник и да се борите по пътя на Аллах с имотите и със себе си. Това е по-добро за вас, ако знаете.','يَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَيُدْخِلْكُمْ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ وَمَسَاكِنَ طَيِّبَةً فِي جَنَّاتِ عَدْنٍ ذٰلِكَ الْفَوْزُ الْعَظِيمُ|Той ще ви прости греховете и ще ви въведе в градини, под които текат реки, и в хубави жилища в Градините на Адн. Това е великото спасение.','وَأُخْرَىٰ تُحِبُّونَهَا نَصْرٌ مِنَ اللّٰهِ وَفَتْحٌ قَرِيبٌ وَبَشِّرِ الْمُؤْمِنِينَ|И още нещо, което обичате: помощ от Аллах и близка победа. И известѝ радостната вест на вярващите!'],
 w:['دَلَّ / يَدُلُّ|посочи','تِجَارَةٌ|търговия','أَنْجَى|спаси','جَاهَدَ|положи усилие, бори се','الْأَنْفُسُ|душите, себе си','مَسَاكِنُ|жилища','الْفَوْزُ|спасението, успехът','نَصْرٌ|помощ, победа','فَتْحٌ|победа, завоюване','رَابِحٌ|печеливш'],
 m:['أَدُلُّكُمْ|أُرْشِدُكُمْ|ви напътя','تِجَارَةٍ|عَمَلٍ رَابِحٍ|печелившо дело','تُنْجِيكُمْ|تُخَلِّصُكُمْ|ви спасява','تُجَاهِدُونَ|تَبْذُلُونَ جُهْدَكُمْ|полагате усилието си','الْفَوْزُ الْعَظِيمُ|النَّجَاحُ الْكَبِيرُ|големият успех'],
 e:['يُرْشِدُ اللّٰهُ الْمُؤْمِنِينَ إِلَى عَمَلٍ رَابِحٍ يُنْجِيهِمْ مِنَ النَّارِ.|Аллах напътва вярващите към печелившо дело, което ги спасява от огъня.','وَهُوَ الْإِيمَانُ بِاللّٰهِ وَرَسُولِهِ، وَالْجِهَادُ فِي سَبِيلِ اللّٰهِ بِالْمَالِ وَالنَّفْسِ.|То е вярата в Аллах и в Пратеника Му и усилието по пътя на Аллах с имот и със себе си.','وَجَزَاؤُهُمْ مَغْفِرَةُ الذُّنُوبِ وَالْجَنَّةُ، وَالنَّصْرُ فِي الدُّنْيَا.|Наградата им е прошка на греховете, Раят и победа в този свят.'],
 o:['رَابِحٌ|خَاسِرٌ','قَرِيبٌ|بَعِيدٌ','النَّصْرُ|الْهَزِيمَةُ'],
 f:['هَلْ أَدُلُّكُمْ عَلَى ___ تُنْجِيكُمْ مِنْ عَذَابٍ أَلِيمٍ|تِجَارَةٍ|مَسَاكِنَ|ذُنُوبٍ','ذٰلِكَ الْفَوْزُ ___|الْعَظِيمُ|الْقَرِيبُ|الْأَلِيمُ','نَصْرٌ مِنَ اللّٰهِ وَفَتْحٌ ___|قَرِيبٌ|عَظِيمٌ|طَيِّبٌ'],
 q:['مَا التِّجَارَةُ الَّتِي تُنْجِي مِنَ الْعَذَابِ؟|الْإِيمَانُ وَالْجِهَادُ فِي سَبِيلِ اللّٰهِ|بَيْعُ الطَّعَامِ|جَمْعُ الْمَالِ','بِمَاذَا يُجَاهِدُ الْمُؤْمِنُونَ؟|بِأَمْوَالِهِمْ وَأَنْفُسِهِمْ|بِأَلْسِنَتِهِمْ فَقَطْ|بِلَا شَيْءٍ','مَا الْأُخْرَى الَّتِي يُحِبُّهَا الْمُؤْمِنُونَ؟|نَصْرٌ مِنَ اللّٰهِ وَفَتْحٌ قَرِيبٌ|الْمَالُ الْكَثِيرُ|السَّفَرُ']},

 e:['يُعَلِّمُنَا الرَّسُولُ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ طَرِيقَةَ الشُّرْبِ.|Пратеникът ни учи как да пием.','فَلَا يَتَنَفَّسُ الْمُسْلِمُ فِي الْكُوبِ، بَلْ يُبْعِدُهُ عَنْ فَمِهِ ثُمَّ يَتَنَفَّسُ.|Мюсюлманинът не диша в чашата, а я отдалечава от устата си и тогава си поема въздух.','وَلَا يَنْفُخُ فِي الشَّرَابِ إِذَا كَانَ حَارًّا، بَلْ يَتْرُكُهُ حَتَّى يَبْرُدَ.|И не духа в питието, ако е горещо, а го оставя да изстине.'],
 l:['النَّفْخُ فِي الشَّرَابِ يَضُرُّ الصِّحَّةَ.|Духането в питието вреди на здравето.','الْإِسْلَامُ دِينُ النَّظَافَةِ.|Ислямът е религия на чистотата.','يَشْرَبُ الْمُسْلِمُ بِأَدَبٍ.|Мюсюлманинът пие възпитано.'],
 a:'وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ|Яжте и пийте, но не прахосвайте — Той не обича прахосниците.|Ал-Араф 31',
 o:['إِخْرَاجٌ|إِدْخَالٌ','حَارٌّ|بَارِدٌ','نَظِيفٌ|وَسِخٌ'],
 p:['نَهَى الرَّسُولُ عَنِ النَّفْخِ فِي الْإِنَاءِ.|التَّنَفُّسُ|نَهَى الرَّسُولُ عَنِ التَّنَفُّسِ فِي الْإِنَاءِ.|Пратеникът забрани да се диша в съда.|نَهَى الرَّسُولُ عَنِ التَّنَفُّسُ فِي الْإِنَاءِ.|نَهَى الرَّسُولَ عَنِ التَّنَفُّسِ فِي الْإِنَاءِ.','لَا تَنْفُخْ فِي الْإِنَاءِ يَا أَحْمَدُ.|يَا فَاطِمَةُ|لَا تَنْفُخِي فِي الْإِنَاءِ يَا فَاطِمَةُ.|Не духай в съда, Фатима.|لَا تَنْفُخْ فِي الْإِنَاءِ يَا فَاطِمَةُ.|لَا يَنْفُخُ فِي الْإِنَاءِ يَا فَاطِمَةُ.'],
 f:['نَهَى رَسُولُ اللّٰهِ أَنْ يُتَنَفَّسَ فِي ___|الْإِنَاءِ|الْبَيْتِ|الْمَسْجِدِ','أَوْ ___ فِيهِ|يُنْفَخَ|يُؤْكَلَ|يُكْتَبَ','يَدْخُلُ ___ إِلَى الرِّئَةِ|الْهَوَاءُ|الطَّعَامُ|الْإِنَاءُ'],
 q:['عَمَّاذَا نَهَى الرَّسُولُ فِي هٰذَا الْحَدِيثِ؟|عَنِ التَّنَفُّسِ وَالنَّفْخِ فِي الْإِنَاءِ|عَنِ الْأَكْلِ بِالْيَمِينِ|عَنِ الشُّرْبِ','مَاذَا يَفْعَلُ الْمُسْلِمُ إِذَا كَانَ الشَّرَابُ حَارًّا؟|يَتْرُكُهُ حَتَّى يَبْرُدَ|يَنْفُخُ فِيهِ|يَرْمِيهِ','مَنْ رَاوِي الْحَدِيثِ؟|ابْنُ عَبَّاسٍ|عُمَرُ بْنُ أَبِي سَلَمَةَ|أَبُو سَعِيدٍ']},
{u:'Етикет и поведение',ar:'آدَابُ الْمَجْلِسِ',t:'Етикет в събранието',wk:3,r:'عَبْدُ اللّٰهِ بْنُ عُمَرَ',src:'ал-Бухари и Муслим (думите са на Муслим)',
 hd:['قَالَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ:|Пратеникът на Аллах каза:','«لَا يُقِيمَنَّ أَحَدُكُمُ الرَّجُلَ مِنْ مَجْلِسِهِ ثُمَّ يَجْلِسُ فِيهِ|„Никой от вас да не вдига човек от мястото му, за да седне там,','وَلٰكِنْ تَفَسَّحُوا وَتَوَسَّعُوا»|а сторете място и се поразместете.“'],
 w:['أَقَامَ / يُقِيمُ|вдигна, накара да стане','الْمَجْلِسُ|мястото за сядане, събранието','الْمَقْعَدُ|седалка, място','تَفَسَّحَ|стори място','تَوَسَّعَ|поразмести се','اعْتِدَاءٌ|посегателство','حَقُّ الْغَيْرِ|правото на другия','مَشَاعِرُ|чувства','أَرْشَدَ / يُرْشِدُ|напътва'],
 m:['لَا يُقِيمَنَّ|لَا يَطْلُبْ مِنْهُ أَنْ يَقُومَ|да не му казва да стане','مَجْلِسِهِ|الْمَكَانِ الَّذِي يَجْلِسُ فِيهِ|мястото, където седи','تَفَسَّحُوا وَتَوَسَّعُوا|اتْرُكُوا مَكَانًا لِمَنْ يَأْتِي|оставете място за идващия'],
 e:['إِذَا دَخَلَ الْمُسْلِمُ مَجْلِسًا فَلَا يَطْلُبُ مِنْ أَحَدٍ أَنْ يَقُومَ لِيَجْلِسَ مَكَانَهُ.|Когато мюсюлманинът влезе в събрание, не кара никого да стане, за да седне на мястото му.','لِأَنَّ ذٰلِكَ اعْتِدَاءٌ عَلَى حَقِّ غَيْرِهِ، وَيُؤْذِي مَشَاعِرَهُ.|Защото това е посегателство върху правото на другия и наранява чувствата му.','وَعَلَى الْجَالِسِينَ أَنْ يَتْرُكُوا لَهُ مَكَانًا.|А седящите трябва да му сторят място.'],
 l:['مَنْ جَلَسَ فِي مَكَانٍ فَهُوَ أَحَقُّ بِهِ.|Който е седнал на някое място, има повече право на него.','الْإِسْلَامُ يُرْشِدُ إِلَى مَكَارِمِ الْأَخْلَاقِ.|Ислямът напътва към благородния нрав.','الْمُسْلِمُ يَحْتَرِمُ مَشَاعِرَ النَّاسِ.|Мюсюлманинът уважава чувствата на хората.'],
 a:'يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قِيلَ لَكُمْ تَفَسَّحُوا فِي الْمَجَالِسِ فَافْسَحُوا يَفْسَحِ اللّٰهُ لَكُمْ|О, вярващи, когато ви кажат: „Сторете място в събранията“, сторете място, и Аллах ще ви стори място.|Ал-Муджадала 11',
 o:['قَامَ|جَلَسَ','وَاسِعٌ|ضَيِّقٌ','دَخَلَ|خَرَجَ'],
 p:['لَا تُقِمِ الرَّجُلَ مِنْ مَجْلِسِهِ.|الْوَلَدُ / مَقْعَدٌ|لَا تُقِمِ الْوَلَدَ مِنْ مَقْعَدِهِ.|Не вдигай момчето от мястото му.|لَا تُقِمِ الْوَلَدُ مِنْ مَقْعَدِهِ.|لَا تُقِمِ الْوَلَدَ مِنْ مَقْعَدِهَا.','تَفَسَّحُوا فِي الْمَجْلِسِ يَا رِجَالُ.|يَا نِسَاءُ|تَفَسَّحْنَ فِي الْمَجْلِسِ يَا نِسَاءُ.|Сторете място в събранието, жени.|تَفَسَّحُوا فِي الْمَجْلِسِ يَا نِسَاءُ.|تَفَسَّحِي فِي الْمَجْلِسِ يَا نِسَاءُ.'],
 f:['لَا يُقِيمَنَّ أَحَدُكُمُ الرَّجُلَ مِنْ ___|مَجْلِسِهِ|بَيْتِهِ|عَمَلِهِ','وَلٰكِنْ تَفَسَّحُوا وَ___|تَوَسَّعُوا|تَفَرَّقُوا|قُومُوا','لَا تَجْلِسْ فِي ___ غَيْرِكَ|مَقْعَدِ|حَقِّ|مَشَاعِرِ'],
 k:['اتْرُكُوا مَكَانًا لِمَنْ يَأْتِي.|3'],
 q:['عَمَّاذَا نَهَى الرَّسُولُ فِي هٰذَا الْحَدِيثِ؟|أَنْ يُقِيمَ الرَّجُلُ غَيْرَهُ مِنْ مَجْلِسِهِ|عَنِ الْجُلُوسِ فِي الْمَسْجِدِ|عَنِ الْكَلَامِ','لِمَاذَا لَا يُقِيمُ الْمُسْلِمُ غَيْرَهُ مِنْ مَكَانِهِ؟|لِأَنَّهُ اعْتِدَاءٌ عَلَى حَقِّ غَيْرِهِ|لِأَنَّ الْمَكَانَ صَغِيرٌ|لِأَنَّهُ مُتْعَبٌ','مَاذَا يَفْعَلُ الْجَالِسُونَ إِذَا جَاءَ رَجُلٌ؟|يَتَفَسَّحُونَ لَهُ|يَخْرُجُونَ|يَقُومُونَ كُلُّهُمْ']},
{u:'Етикет и поведение',ar:'الْمُوَاسَاةُ وَالتَّعَاوُنُ',t:'Взаимопомощ',wk:4,r:'أَبُو سَعِيدٍ الْخُدْرِيُّ',src:'Муслим и Абу Дауд (думите са на Муслим)',
 hd:['بَيْنَمَا نَحْنُ فِي سَفَرٍ مَعَ النَّبِيِّ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ إِذْ جَاءَ رَجُلٌ عَلَى رَاحِلَةٍ لَهُ|Докато бяхме на път с Пророка, дойде един човек на своята камила','فَجَعَلَ يَصْرِفُ بَصَرَهُ يَمِينًا وَشِمَالًا|и започна да се оглежда наляво и надясно.','فَقَالَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ:|Тогава Пратеникът на Аллах каза:','«مَنْ كَانَ مَعَهُ فَضْلُ ظَهْرٍ فَلْيَعُدْ بِهِ عَلَى مَنْ لَا ظَهْرَ لَهُ|„Който има излишно животно за езда, нека го даде на онзи, който няма животно,','وَمَنْ كَانَ لَهُ فَضْلٌ مِنْ زَادٍ فَلْيَعُدْ بِهِ عَلَى مَنْ لَا زَادَ لَهُ»|и който има излишна храна за път, нека я даде на онзи, който няма храна.“','قَالَ: فَذَكَرَ مِنْ أَصْنَافِ الْمَالِ مَا ذَكَرَ|И той спомена още видове имущество,','حَتَّى رَأَيْنَا أَنَّهُ لَا حَقَّ لِأَحَدٍ مِنَّا فِي فَضْلٍ|докато разбрахме, че никой от нас няма право да задържа излишното.'],
 w:['رَاحِلَةٌ|камила за езда','صَرَفَ بَصَرَهُ|оглеждаше се','فَضْلٌ|излишък','ظَهْرٌ|животно за езда','زَادٌ|храна за път','عَادَ بِهِ عَلَى|даде го на','أَصْنَافٌ|видове','مُحْتَاجٌ|нуждаещ се','التَّعَاوُنُ|взаимопомощта','بَعِيرٌ|камила'],
 m:['رَاحِلَةٍ|بَعِيرٍ يَرْكَبُهُ|камила, на която язди','يَصْرِفُ بَصَرَهُ|يَنْظُرُ إِلَى النَّاسِ كَأَنَّهُ يَطْلُبُ الْمُسَاعَدَةَ|гледа хората, сякаш търси помощ','فَضْلُ ظَهْرٍ|دَابَّةٌ زَائِدَةٌ لِلرُّكُوبِ|излишно животно за езда','زَادٍ|طَعَامِ الْمُسَافِرِ|храната на пътника','فَلْيَعُدْ بِهِ|فَلْيُعْطِهِ|нека го даде'],
 e:['كَانَ الصَّحَابَةُ فِي سَفَرٍ، فَجَاءَ رَجُلٌ مُحْتَاجٌ يَنْظُرُ إِلَيْهِمْ.|Сподвижниците били на път и дошъл един нуждаещ се човек, който ги гледал.','فَأَمَرَ الرَّسُولُ مَنْ عِنْدَهُ شَيْءٌ زَائِدٌ أَنْ يُعْطِيَهُ لِمَنْ لَا يَمْلِكُ.|Пратеникът повелил на онзи, който има нещо в повече, да го даде на онзи, който няма.','فَالْمُسْلِمُونَ يَتَعَاوَنُونَ، وَيُسَاعِدُ الْغَنِيُّ الْفَقِيرَ.|Мюсюлманите си помагат и богатият помага на бедния.'],
 l:['التَّعَاوُنُ بَيْنَ الْمُسْلِمِينَ وَاجِبٌ.|Взаимопомощта между мюсюлманите е задължение.','يُعْطِي الْمُسْلِمُ مِمَّا زَادَ عَنْ حَاجَتِهِ.|Мюсюлманинът дава от онова, което е над нуждите му.','الرَّسُولُ يَهْتَمُّ بِالْمُحْتَاجِينَ.|Пратеникът се грижи за нуждаещите се.'],
 a:'وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ|Помагайте си в доброто и богобоязънта и не си помагайте в греха и враждата.|Ал-Маида 2',
 o:['غَنِيٌّ|فَقِيرٌ','يَمِينٌ|شِمَالٌ','زَائِدٌ|نَاقِصٌ'],
 p:['مَنْ كَانَ مَعَهُ فَضْلُ زَادٍ فَلْيُعْطِهِ لِلْمُحْتَاجِ.|مَالٌ|مَنْ كَانَ مَعَهُ فَضْلُ مَالٍ فَلْيُعْطِهِ لِلْمُحْتَاجِ.|Който има излишни пари, нека ги даде на нуждаещия се.|مَنْ كَانَ مَعَهُ فَضْلُ مَالٌ فَلْيُعْطِهِ لِلْمُحْتَاجِ.|مَنْ كَانَ مَعَهُ فَضْلَ مَالٍ فَلْيُعْطِهِ لِلْمُحْتَاجِ.','يُسَاعِدُ الْغَنِيُّ الْفَقِيرَ.|الْقَوِيُّ / الضَّعِيفُ|يُسَاعِدُ الْقَوِيُّ الضَّعِيفَ.|Силният помага на слабия.|يُسَاعِدُ الْقَوِيَّ الضَّعِيفُ.|يُسَاعِدُ الضَّعِيفُ الْقَوِيَّ.'],
 f:['جَاءَ رَجُلٌ عَلَى ___ لَهُ|رَاحِلَةٍ|زَادٍ|سَفَرٍ','فَجَعَلَ يَصْرِفُ ___ يَمِينًا وَشِمَالًا|بَصَرَهُ|زَادَهُ|مَالَهُ','وَمَنْ كَانَ لَهُ فَضْلٌ مِنْ ___ فَلْيَعُدْ بِهِ عَلَى مَنْ لَا زَادَ لَهُ|زَادٍ|ظَهْرٍ|سَفَرٍ'],

{u:'Етикет и поведение',ar:'حَقُّ الطَّرِيقِ',t:'Правото на пътя',wk:5,r:'أَبُو سَعِيدٍ الْخُدْرِيُّ',src:'ал-Бухари',
 hd:['«إِيَّاكُمْ وَالْجُلُوسَ بِالطُّرُقَاتِ»|„Пазете се от седене по пътищата!“','فَقَالُوا: يَا رَسُولَ اللّٰهِ، مَا لَنَا مِنْ مَجَالِسِنَا بُدٌّ نَتَحَدَّثُ فِيهَا|Казаха: „Пратенико на Аллах, нямаме друг избор освен тези наши места, където си говорим.“','فَقَالَ: «فَإِذَا أَبَيْتُمْ إِلَّا الْمَجْلِسَ فَأَعْطُوا الطَّرِيقَ حَقَّهُ»|Той каза: „Щом настоявате да седите, дайте на пътя полагащото му се.“','قَالُوا: وَمَا حَقُّ الطَّرِيقِ يَا رَسُولَ اللّٰهِ؟|Попитаха: „А какво е правото на пътя, Пратенико на Аллах?“','قَالَ: «غَضُّ الْبَصَرِ، وَكَفُّ الْأَذَى، وَرَدُّ السَّلَامِ، وَالْأَمْرُ بِالْمَعْرُوفِ، وَالنَّهْيُ عَنِ الْمُنْكَرِ»|Той каза: „Сведен поглед, никакво навреждане, отвръщане на поздрава, призоваване към доброто и възпиране от лошото.“'],
 w:['إِيَّاكُمْ|пазете се от','الطُّرُقَاتُ|пътищата, улиците','بُدٌّ|друг изход','أَبَى / يَأْبَى|отказа, настоя (да не)','غَضُّ الْبَصَرِ|свеждане на погледа','كَفُّ الْأَذَى|въздържане от навреждане','رَدُّ السَّلَامِ|отвръщане на поздрава','الْمَعْرُوفُ|доброто','الْمُنْكَرُ|лошото','جَوَانِبُ|страни','الْأَذَى|вредата'],
 m:['إِيَّاكُمْ وَالْجُلُوسَ|احْذَرُوا الْجُلُوسَ|пазете се от седене','مَا لَنَا بُدٌّ|لَا نَسْتَطِيعُ أَنْ نَتْرُكَ|не можем да оставим','أَبَيْتُمْ|رَفَضْتُمْ إِلَّا ذٰلِكَ|настоявате само на това','غَضُّ الْبَصَرِ|أَلَّا يَنْظُرَ إِلَى مَا حَرَّمَ اللّٰهُ|да не гледа забраненото от Аллах','كَفُّ الْأَذَى|أَلَّا يَضُرَّ النَّاسَ بِقَوْلٍ أَوْ فِعْلٍ|да не вреди на хората с думи или дела'],
 e:['نَهَى الرَّسُولُ عَنِ الْجُلُوسِ فِي الطُّرُقِ؛ لِأَنَّ فِيهِ أَذًى لِلنَّاسِ.|Пратеникът забрани седенето по пътищата, защото това пречи на хората.','فَلَمَّا قَالَ الصَّحَابَةُ إِنَّهُمْ يَحْتَاجُونَ إِلَى ذٰلِكَ، بَيَّنَ لَهُمْ حَقَّ الطَّرِيقِ.|Когато сподвижниците казаха, че имат нужда от това, той им обясни правото на пътя.','وَهُوَ خَمْسَةُ أُمُورٍ: غَضُّ الْبَصَرِ، وَكَفُّ الْأَذَى، وَرَدُّ السَّلَامِ، وَالْأَمْرُ بِالْمَعْرُوفِ، وَالنَّهْيُ عَنِ الْمُنْكَرِ.|То е пет неща: сведен поглед, въздържане от вреда, отвръщане на поздрава, призоваване към доброто и възпиране от лошото.'],
 l:['لِلطَّرِيقِ حُقُوقٌ يَجِبُ أَنْ نَحْفَظَهَا.|Пътят има права, които трябва да пазим.','الْمُسْلِمُ لَا يُؤْذِي النَّاسَ.|Мюсюлманинът не вреди на хората.','رَدُّ السَّلَامِ وَاجِبٌ.|Отвръщането на поздрава е задължение.'],

 q:['عَمَّاذَا نَهَى الرَّسُولُ؟|عَنِ الْجُلُوسِ بِالطُّرُقَاتِ|عَنِ الْمَشْيِ|عَنِ السَّفَرِ','لِمَاذَا يَجْلِسُ الصَّحَابَةُ فِي الطُّرُقَاتِ؟|لِيَتَحَدَّثُوا فِيهَا|لِيَبِيعُوا|لِيَنَامُوا','كَمْ حَقًّا لِلطَّرِيقِ فِي الْحَدِيثِ؟|خَمْسَةٌ|ثَلَاثَةٌ|عَشَرَةٌ','مَا مَعْنَى «كَفُّ الْأَذَى»؟|أَلَّا يَضُرَّ النَّاسَ|أَنْ يَرُدَّ السَّلَامَ|أَنْ يَجْلِسَ فِي الطَّرِيقِ']},
{u:'Нрав и вяра',ar:'الصِّدْقُ وَالْكَذِبُ',t:'Правдивост и лъжа',wk:6,r:'عَبْدُ اللّٰهِ بْنُ مَسْعُودٍ',src:'ал-Бухари и Муслим',
 hd:['«إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ|„Правдивостта води към добротата, а добротата води към Рая.','وَإِنَّ الرَّجُلَ لَيَصْدُقُ حَتَّى يَكُونَ صِدِّيقًا|Човек говори истината, докато стане правдив.','وَإِنَّ الْكَذِبَ يَهْدِي إِلَى الْفُجُورِ، وَإِنَّ الْفُجُورَ يَهْدِي إِلَى النَّارِ|А лъжата води към греха, а грехът води към огъня.','وَإِنَّ الرَّجُلَ لَيَكْذِبُ حَتَّى يُكْتَبَ عِنْدَ اللّٰهِ كَذَّابًا»|И човек лъже, докато бъде записан при Аллах като лъжец.“'],
 w:['الصِّدْقُ|правдивостта','الْبِرُّ|добротата, праведността','هَدَى / يَهْدِي|води към','صِدِّيقٌ|много правдив','الْكَذِبُ|лъжата','الْفُجُورُ|грехът, покварата','كَذَّابٌ|голям лъжец','حَمِيدَةٌ|похвална','الْمَعَاصِي|греховете'],

 e:['الصِّدْقُ صِفَةٌ حَمِيدَةٌ، تُوصِلُ صَاحِبَهَا إِلَى الْأَعْمَالِ الصَّالِحَةِ ثُمَّ إِلَى الْجَنَّةِ.|Правдивостта е похвално качество: води притежателя си към праведни дела, а после към Рая.','وَالْمُسْلِمُ يَصْدُقُ دَائِمًا حَتَّى يُكْتَبَ عِنْدَ اللّٰهِ صِدِّيقًا.|Мюсюлманинът винаги казва истината, докато бъде записан при Аллах като правдив.','وَالْكَذِبُ يُوصِلُ إِلَى الْمَعَاصِي ثُمَّ إِلَى النَّارِ.|А лъжата води към греховете, а после към огъня.'],
 l:['يَجِبُ عَلَى الْمُسْلِمِ أَنْ يَصْدُقَ فِي قَوْلِهِ وَعَمَلِهِ.|Мюсюлманинът трябва да е правдив в думите и делата си.','الْكَذِبُ مِنَ الْمَعَاصِي الْكَبِيرَةِ.|Лъжата е от големите грехове.','الْعَادَةُ الْحَسَنَةُ تَقُودُ إِلَى عَادَةٍ حَسَنَةٍ.|Добрият навик води към добър навик.'],
