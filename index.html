 {u:'Втора част',ar:'سُورَةُ الْهُمَزَةِ',t:'Сура Ал-Хумаза',a:['وَيْلٌ لِكُلِّ هُمَزَةٍ لُمَزَةٍ|Горко на всеки клеветник и присмехулник,','الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ|който е трупал имот и го е броил!','يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ|Мисли, че имотът му ще го направи вечен.','كَلَّا لَيُنْبَذَنَّ فِي الْحُطَمَةِ|Не! Той ще бъде хвърлен в Ал-Хутама.','وَمَا أَدْرَاكَ مَا الْحُطَمَةُ|А откъде да знаеш какво е Ал-Хутама?','نَارُ اللّٰهِ الْمُوقَدَةُ|Разпаленият огън на Аллах,','الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ|който достига до сърцата.','إِنَّهَا عَلَيْهِمْ مُؤْصَدَةٌ|Той ще ги обгради отвсякъде,','فِي عَمَدٍ مُمَدَّدَةٍ|в протегнати стълбове.'],w:['وَيْلٌ|горко','هُمَزَةٌ|клеветник','لُمَزَةٌ|присмехулник','جَمَعَ|събра','مَالٌ|имот, богатство','يَحْسَبُ|мисли, смята','الْحُطَمَةُ|Ал-Хутама (смазващият огън)','الْمُوقَدَةُ|разпаленият','الْأَفْئِدَةُ|сърцата','مُؤْصَدَةٌ|затворен отвсякъде','عَمَدٌ|стълбове']},
 {u:'Втора част',ar:'شَرْحُ سُورَةِ الْهُمَزَةِ',t:'Тълкуване на сура Ал-Хумаза',a:['وَيْلٌ لِكُلِّ هُمَزَةٍ لُمَزَةٍ|Горко на всеки клеветник и присмехулник,','الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ|който е трупал имот и го е броил!','يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ|Мисли, че имотът му ще го направи вечен.'],w:['وَيْلٌ|горко','هُمَزَةٌ|клеветник','لُمَزَةٌ|присмехулник','عَدَّدَهُ|преброи го','أَخْلَدَهُ|ще го направи вечен','كَلَّا|не! (решително отрицание)'],x:['Сурата предупреждава онзи, който злослови за хората зад гърба им и им се присмива в лицето.','Тя осъжда човека, който трупа богатство и мисли, че то ще го спаси от смъртта и от отговорността.','Наказанието е огън, който „смазва“ всичко и стига до сърцата, защото оттам започват гордостта и злобата.']},
 {u:'Втора част',ar:'سُورَةُ الْفِيلِ',t:'Сура Ал-Фил',a:['أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ|Не видя ли какво стори твоят Господ с хората на слона?','أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ|Не провали ли Той коварството им?','وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ|И изпрати срещу тях птици на ята,','تَرْمِيهِمْ بِحِجَارَةٍ مِنْ سِجِّيلٍ|които ги замеряха с камъни от печена глина,','فَجَعَلَهُمْ كَعَصْفٍ مَأْكُولٍ|и ги направи като изядена слама.'],w:['أَصْحَابُ الْفِيلِ|хората на слона','كَيْدٌ|коварство','تَضْلِيلٌ|провал','طَيْرٌ|птици','أَبَابِيلُ|ята','حِجَارَةٌ|камъни','سِجِّيلٌ|печена глина','عَصْفٌ|слама','مَأْكُولٌ|изяден'],x:['Сурата разказва за войската със слонове, тръгнала да разруши Кааба в годината, когато е роден Пророкът.']},
 {u:'Трета част',ar:'سُورَةُ قُرَيْشٍ',t:'Сура Курайш',a:['لِإِيلَافِ قُرَيْشٍ|Заради сигурността на курайшитите,','إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ|сигурността им при зимното и лятното пътуване,','فَلْيَعْبُدُوا رَبَّ هٰذَا الْبَيْتِ|нека служат на Господа на този Дом,','الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ|Който ги нахрани в глада и ги опази от страха.'],w:['إِيلَافٌ|сигурност, привичност','قُرَيْشٌ|Курайш (племето)','رِحْلَةٌ|пътуване','الشِّتَاءُ|зимата','الصَّيْفُ|лятото','الْبَيْتُ|Домът (Кааба)','أَطْعَمَهُمْ|нахрани ги','جُوعٌ|глад','خَوْفٌ|страх']},
 {u:'Трета част',ar:'سُورَةُ الْمَاعُونِ',t:'Сура Ал-Маун',a:['أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ|Видя ли онзи, който отрича възмездието?','فَذٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ|Той е онзи, който грубо отблъсква сирачето','وَلَا يَحُضُّ عَلَى طَعَامِ الْمِسْكِينِ|и не подтиква към нахранване на бедния.','فَوَيْلٌ لِلْمُصَلِّينَ|Горко на молещите се,','الَّذِينَ هُمْ عَنْ صَلَاتِهِمْ سَاهُونَ|които нехаят за молитвата си,','الَّذِينَ هُمْ يُرَاءُونَ|които се показват пред хората','وَيَمْنَعُونَ الْمَاعُونَ|и отказват дори дребна помощ.'],w:['يُكَذِّبُ|отрича','الدِّينُ|възмездието; вярата','يَدُعُّ|отблъсква грубо','الْيَتِيمُ|сирачето','يَحُضُّ|подтиква','الْمِسْكِينُ|бедният','سَاهُونَ|нехайни','يُرَاءُونَ|показват се пред хората','الْمَاعُونُ|дребна помощ']},
 {u:'Трета част',ar:'سُورَةُ الْكَوْثَرِ',t:'Сура Ал-Каусар',a:['إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ|Ние ти дарихме Ал-Каусар.','فَصَلِّ لِرَبِّكَ وَانْحَرْ|Затова се моли на своя Господ и принасяй жертва!','إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ|Онзи, който те мрази, той е откъснатият.'],w:['أَعْطَيْنَاكَ|дарихме те','الْكَوْثَرُ|Ал-Каусар (изобилие; река в Рая)','صَلِّ|моли се','انْحَرْ|принеси жертва','شَانِئَكَ|мразещият те','الْأَبْتَرُ|откъснатият, без следа'],x:['Това е най-кратката сура в Корана — само три аята.']},
 {u:'Четвърта част',ar:'سُورَةُ الْكَافِرُونَ',t:'Сура Ал-Кафирун',a:['قُلْ يَا أَيُّهَا الْكَافِرُونَ|Кажи: „О, неверници!','لَا أَعْبُدُ مَا تَعْبُدُونَ|Не служа на онова, на което вие служите,','وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ|нито вие служите на Онзи, на Когото служа аз.','وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ|Нито пък аз ще служа на онова, на което вие сте служили,','وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ|нито вие ще служите на Онзи, на Когото служа аз.','لَكُمْ دِينُكُمْ وَلِيَ دِينِ|Вие си имате своята вяра, а аз — моята.“'],w:['قُلْ|кажи','الْكَافِرُونَ|неверниците','أَعْبُدُ|служа','تَعْبُدُونَ|служите','عَابِدٌ|служещ','دِينٌ|вяра, религия']},
 {u:'Четвърта част',ar:'سُورَةُ النَّصْرِ',t:'Сура Ан-Наср',a:['إِذَا جَاءَ نَصْرُ اللّٰهِ وَالْفَتْحُ|Когато дойдат помощта на Аллах и победата','وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللّٰهِ أَفْوَاجًا|и видиш хората да влизат във вярата на Аллах на тълпи,','فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا|прославяй своя Господ с хвала и Го моли за прошка. Той винаги приема покаянието.'],w:['جَاءَ|дойде','نَصْرٌ|помощ, победа','الْفَتْحُ|победата (превземането на Мека)','النَّاسُ|хората','أَفْوَاجًا|на тълпи','سَبِّحْ|прославяй','اسْتَغْفِرْهُ|моли Го за прошка','تَوَّابٌ|Приемащ покаянието']},
 {u:'Четвърта част',ar:'سُورَةُ الْمَسَدِ',t:'Сура Ал-Масад',a:['تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ|Да загинат ръцете на Абу Лахаб, и загина той!','مَا أَغْنَى عَنْهُ مَالُهُ وَمَا كَسَبَ|Не му помогнаха нито имотът му, нито онова, което спечели.','سَيَصْلَى نَارًا ذَاتَ لَهَبٍ|Ще гори в пламтящ огън,','وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ|и жена му — носачката на дърва,','فِي جِيدِهَا حَبْلٌ مِنْ مَسَدٍ|с въже от палмови влакна на шията си.'],w:['تَبَّتْ|да загинат','يَدَا|двете ръце на','لَهَبٌ|пламък','أَغْنَى|помогна, послужи','كَسَبَ|спечели','امْرَأَتُهُ|жена му','الْحَطَبُ|дърва за огрев','جِيدٌ|шия','حَبْلٌ|въже','مَسَدٌ|палмови влакна']},
 {u:'Пета част',ar:'سُورَةُ الْإِخْلَاصِ',t:'Сура Ал-Ихлас',a:['قُلْ هُوَ اللّٰهُ أَحَدٌ|Кажи: „Той е Аллах, Единният,','اللّٰهُ الصَّمَدُ|Аллах, Вечният, към Когото всички се обръщат.','لَمْ يَلِدْ وَلَمْ يُولَدْ|Не е родил и не е роден,','وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ|и няма никой равен Нему.“'],w:['أَحَدٌ|Единен','الصَّمَدُ|Вечният, към Когото всички се обръщат','لَمْ يَلِدْ|не е родил','لَمْ يُولَدْ|не е роден','كُفُوًا|равен']},
 {u:'Пета част',ar:'سُورَةُ الْفَلَقِ',t:'Сура Ал-Фалак',a:['قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ|Кажи: „Търся закрила у Господа на зората','مِنْ شَرِّ مَا خَلَقَ|от злото на онова, което Той е сътворил,','وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ|и от злото на мрака, когато настъпи,','وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ|и от злото на духащите във възлите,','وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ|и от злото на завистника, когато завижда.“'],w:['الْفَلَقُ|зората','شَرٌّ|зло','خَلَقَ|сътвори','غَاسِقٌ|мракът на нощта','وَقَبَ|настъпи','النَّفَّاثَاتُ|духащите (магьосниците)','الْعُقَدُ|възлите','حَاسِدٌ|завистник']},
 {u:'Пета част',ar:'سُورَةُ النَّاسِ',t:'Сура Ан-Нас',a:['قُلْ أَعُوذُ بِرَبِّ النَّاسِ|Кажи: „Търся закрила у Господа на хората,','مَلِكِ النَّاسِ|Царя на хората,','إِلٰهِ النَّاسِ|Бога на хората,','مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ|от злото на нашепващия, който се оттегля,','الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ|който нашепва в гърдите на хората,','مِنَ الْجِنَّةِ وَالنَّاسِ|измежду джиновете и хората.“'],w:['مَلِكٌ|цар','إِلٰهٌ|бог','الْوَسْوَاسُ|нашепващият','الْخَنَّاسُ|който се оттегля','يُوَسْوِسُ|нашепва','صُدُورٌ|гърди','الْجِنَّةُ|джиновете']}
];

/* ================= СГЛОБЯВАНЕ ================= */
const NONCON='اأإآدذرزوؤء';
const POS=['самостоятелна','начало','среда','край'];
const forms=L=>L==='ء'?['ء']:NONCON.includes(L)?[L,L,'ـ'+L,'ـ'+L]:[L,L+'ـ','ـ'+L+'ـ','ـ'+L];
const parse=s=>{const p=s.split('|');return p.length===3?{ar:p[0],tr:p[1],bg:p[2]}:{ar:p[0],bg:p[1]}};
const plain=s=>s.replace(/[\u064B-\u0652\u0670]/g,'');

const rwLessons=[
 ...RW_LETTERS.map(([L,snd,w],i)=>({kind:'letter',L,u:i<10?'Първа група букви':i<20?'Втора група букви':'Трета група букви',ar:'حَرْفُ '+L,t:'Буквата '+L+' ('+NAMES[L]+')',snd,items:w.map(parse)})),
 ...RW_EXTRA.map(x=>({kind:'letter',L:x.sym,special:true,u:'Правопис и четене',ar:x.ar,t:x.t,note:x.note,items:x.w.map(parse)}))
];
const rwFind=L=>rwLessons.find(l=>l.L===L);

const ORDER='ءابتثجحخدذرزسشصضطظعغفقكلمنهوي';
const normAr=s=>plain(s).replace(/^ال/,'').replace(/[أإآ]/g,'ا').replace(/[ؤئ]/g,'ء');
function buildDict(){
  const src=[...picLessons.flatMap(l=>l.items),...rwLessons.flatMap(l=>l.items),...expLessons.filter(l=>l.kind!=='review').flatMap(l=>l.items),...expLessons.filter(l=>l.own).flatMap(l=>l.own),...quranLessons.flatMap(l=>l.items)];
  const seen=new Map();
  src.forEach(it=>{const p=plain(it.ar);if(p.split(' ').length>3||/[؟?]/.test(p))return;if(!seen.has(p))seen.set(p,it)});
  return [...seen.values()].map(it=>({...it,first:normAr(it.ar)[0]})).sort((a,b)=>{
    const x=normAr(a.ar),y=normAr(b.ar);for(let i=0;i<Math.min(x.length,y.length);i++){const d=ORDER.indexOf(x[i])-ORDER.indexOf(y[i]);if(d)return d}return x.length-y.length});
}

/* ================= НАПРЕДЪК ================= */
const done=new Set();
async function loadProgress(){try{if(window.storage){const r=await window.storage.get('alif-progress',false);if(r&&r.value)JSON.parse(r.value).forEach(k=>done.add(k))}}catch(e){}}
async function saveProgress(){try{if(window.storage)await window.storage.set('alif-progress',JSON.stringify([...done]),false)}catch(e){}}
function markDone(k){if(!done.has(k)){done.add(k);saveProgress()}}

/* ================= ЗВУК ================= */
function say(t){try{if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.8;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('ar'));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const sayBtn=t=>`<button class="say" data-say="${esc(t)}" aria-label="Чуй">🔊</button>`;
function bindSay(el){el.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();say(b.dataset.say)})}

const app=document.getElementById('app'),back=document.getElementById('back');
let stack=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const key=(b,i)=>b.id+'-'+i;
const isLong=s=>plain(s).length>14;
function bookStats(b){const n=b.lessons?b.lessons.length:0;let d=0;for(let i=0;i<n;i++)if(done.has(key(b,i)))d++;return[d,n]}
function levelStats(lv){let d=0,n=0;lv.books.forEach(b=>{if(b.lessons){const[x,y]=bookStats(b);d+=x;n+=y}});return[d,n]}
function go(v){stack.push(v);render()}
back.onclick=()=>{stack.pop();render()};

function render(){
  const v=stack[stack.length-1];back.hidden=stack.length<=1;window.scrollTo(0,0);
  if(v.t==='home')return home();
  if(v.t==='level')return level(v.l);
  if(v.t==='book')return book(v.l,v.b);
  if(v.t==='lesson')return lesson(v.l,v.b,v.i);
}

   return `<button class="level ${locked?'locked':''}" data-i="${i}" ${locked?'aria-disabled="true"':''}><div class="num">${lv.ar}</div><div><b>${lv.name}</b>

const TABS={rich:[['learn','Урок'],['cards','Карти'],['quiz','Тест'],['drill','Упражнения']],quran:[['learn','Урок'],['cards','Карти'],['quiz','Тест'],['drill','Упражнения']],letter:[['learn','Урок'],['cards','Карти'],['quiz','Тест']],dialog:[['learn','Урок'],['cards','Карти'],['quiz','Тест'],['drill','Упражнения']],phrases:[['learn','Урок'],['cards','Карти'],['quiz','Тест']],review:[['learn','Урок'],['cards','Карти'],['quiz','Тест'],['drill','Упражнения']],hand:[['write','Писане'],['quiz','Тест']],handintro:[['write','Писане']]};

  const v=stack[stack.length-1],lv=LEVELS[l],b=lv.books[bi],ls=b.lessons[i],tabs=TABS[ls.kind].filter(t=>t[0]!=='drill'||sentPool(ls).length>=2)&&TABS[ls.kind].filter(t=>t[0]!=='drill'||sentPool(ls).length>=2).filter(t=>t[0]!=='learn'||ls.kind!=='review'||ls.reading.length||ls.own.length),tab=v.tab||tabs[0][0],k=key(b,i);

function cards(el,items){
  let i=0,open=false;const deck=shuffle(items);
  const draw=()=>{const it=deck[i];
   el.innerHTML=`<button class="card" id="c"><div class="face ${isLong(it.ar)?'long':''}">${it.ar}</div>
    ${open?`<div class="ans">${esc(it.bg)}${it.tr?`<small>${esc(it.tr)}</small>`:''}</div>`:'<div class="hint">Докоснете, за да видите превода</div>'}</button>
    <div class="nav"><button class="btn ghost" id="p">Предишна</button>${sayBtn(it.ar)}<span class="count">${i+1} / ${deck.length}</span><button class="btn" id="n">Следваща</button></div>`;
   el.querySelector('#c').onclick=()=>{open=!open;draw()};
   el.querySelector('#p').onclick=()=>{i=(i-1+deck.length)%deck.length;open=false;draw()};
   el.querySelector('#n').onclick=()=>{i=(i+1)%deck.length;open=false;draw()};bindSay(el)};
  draw();
}

/* ---------- въпроси ---------- */
function pick(pool,ans,field,n=3){return shuffle([...new Set(pool.map(x=>x[field]).filter(v=>v!==ans[field]))]).slice(0,n)}
function makeQs(ls,b){
  const bookPool=b.lessons.flatMap(x=>x.kind==='dialog'?[...x.lines,...x.items]:(x.items||[]));
  let qs=[];
  if(ls.kind==='hand'){
    if(!NONCON.includes(ls.L)){const f=forms(ls.L);[1,2,3].forEach(p=>qs.push({p:'В коя позиция е тази форма?',show:f[p],ar:true,ans:POS[p],opts:POS}))}
    qs.push({p:'Как се казва тази буква?',show:ls.L,ar:true,ans:NAMES[ls.L],opts:[NAMES[ls.L],...shuffle(HAND_LETTERS.filter(x=>x!==ls.L)).slice(0,3).map(x=>NAMES[x])]});
    const others=shuffle(HAND_LETTERS.filter(x=>x!==ls.L)).slice(0,3);
    qs.push({p:'Коя е буквата „'+NAMES[ls.L]+'“?',showBg:'„'+NAMES[ls.L]+'“',ansAr:ls.L,ans:ls.L,opts:[ls.L,...others],optAr:true});
    return qs.map(q=>({...q,opts:shuffle([...new Set(q.opts)])}));
  }
  const items=ls.kind==='dialog'?[...ls.items,...ls.lines]:ls.kind==='rich'?[...ls.items,...ls.drills]:ls.items;
  if(ls.kind==='quran'&&ls.ayat.length>2){
    shuffle(ls.ayat.slice(0,-1).map((a,k)=>k)).slice(0,3).forEach(k=>{
      const nxt=ls.ayat[k+1],others=shuffle(ls.ayat.filter((x,j)=>j!==k+1&&j!==k&&x.ar!==nxt.ar)).slice(0,3).map(x=>x.ar);
      if(others.length)qs.push({p:'Кой аят следва?',show:ls.ayat[k].ar,ar:true,ans:nxt.ar,opts:shuffle([nxt.ar,...others]),optAr:true})});
  }
  if(ls.kind==='letter'&&!ls.special){
    const others=shuffle(RW_LETTERS.map(x=>x[0]).filter(x=>x!==ls.L)).slice(0,3);
    qs.push({p:'Как се казва тази буква?',show:ls.L,ar:true,ans:NAMES[ls.L],opts:shuffle([NAMES[ls.L],...others.map(x=>NAMES[x])])});
  }
  shuffle(items).slice(0,9).forEach((it,n)=>{
    const rev=n%2===1;
    if(rev)qs.push({p:'Изберете арабския превод',showBg:it.bg,ans:it.ar,opts:shuffle([it.ar,...pick(bookPool,it,'ar')]),optAr:true});
    else qs.push({p:'Какво означава?',show:it.ar,ar:true,ans:it.bg,opts:shuffle([it.bg,...pick(bookPool,it,'bg')])});
  });
  return qs;
}

function quiz(el,qs,k){
  let n=0,score=0;qs=shuffle(qs);
  const draw=()=>{
    if(n>=qs.length){const pass=score/qs.length>=.7;if(pass)markDone(k);
      el.innerHTML=`<div class="result"><div class="score">${score} / ${qs.length}</div><p>${pass?'Урокът е завършен.':'Нужни са поне 70%, за да завършите урока.'}</p><button class="btn" id="r">Започнете отново</button></div>`;
      el.querySelector('#r').onclick=()=>quiz(el,qs,k);return}
    const q=qs[n],long=q.opts.some(o=>(q.optAr?plain(o):o).length>(q.optAr?12:18));
    el.innerHTML=`<div class="q"><p>Въпрос ${n+1} от ${qs.length}. ${q.p}</p>
     ${q.showBg?`<div class="face bg">${esc(q.showBg)}</div>`:`<div class="face ${isLong(q.show)?'long':''}">${q.show}</div>${sayBtn(q.show)}`}</div>
     <div class="opts ${long?'one':''}">${q.opts.map((o,j)=>`<button class="opt ${q.optAr?'ar':''}" data-j="${j}">${q.optAr?o:esc(o)}</button>`).join('')}</div>`;
    bindSay(el);
    el.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
      const pick=q.opts[+btn.dataset.j];
      el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(q.opts[j]===q.ans)x.classList.add('ok')});
      if(pick===q.ans)score++;else btn.classList.add('bad');
      setTimeout(()=>{n++;draw()},900)});
  };draw();
}

/* ---------- писане с пръст ---------- */
/* ---------- упражнения: попълни и подреди ---------- */
const STOP=new Set(['في','من','إلى','على','هل','يا','و','لا','أنا','ما','عن']);
const PUNCT=/[؟?.!،,:«»]/g;
function sentPool(ls){
  if(ls.kind==='quran')return ls.ayat;
  if(ls.kind==='dialog')return ls.lines;
  if(ls.kind==='review')return ls.reading.length?ls.reading:expLessons.filter(x=>x.u===ls.u&&x.kind!=='review').flatMap(sentPool);
  return [...ls.lines.map(x=>({ar:stripSp(x.ar),bg:x.bg})),...ls.drills,...ls.reading];
}
const toks=s=>s.replace(PUNCT,' ').split(/\s+/).filter(Boolean);
function makeDrills(ls){
  const pool=sentPool(ls);if(pool.length<2)return[];
  const allW=[...new Set(pool.flatMap(x=>toks(x.ar)))];
  const fill=[],order=[];
  shuffle(pool).forEach(x=>{
    const t=toks(x.ar),cand=t.filter(w=>plain(w).length>=3&&!STOP.has(plain(w)));
    if(cand.length&&fill.length<5){const w=cand[Math.random()*cand.length|0];
      const others=shuffle(allW.filter(o=>plain(o)!==plain(w)&&plain(o).length>=2)).slice(0,3);
      if(others.length>=2)fill.push({type:'fill',x,w,opts:shuffle([w,...others])})}
    if(t.length>=3&&t.length<=7&&order.length<4)order.push({type:'order',x,t});
  });
  return shuffle([...fill,...order]);
}
function drill(el,ls,k){
  const qs=makeDrills(ls);
  if(!qs.length){el.innerHTML='<div class="note">За този урок няма достатъчно изречения за упражнения.</div>';return}
  let n=0,score=0;
  const next=ok=>{if(ok)score++;setTimeout(()=>{n++;draw()},ok?900:1600)};
  const draw=()=>{
    if(n>=qs.length){const pass=score/qs.length>=.7;if(pass)markDone(k);
      el.innerHTML=`<div class="result"><div class="score">${score} / ${qs.length}</div><p>${pass?'Браво! Упражненията са изпълнени.':'Опитайте отново, за да затвърдите изреченията.'}</p><button class="btn" id="r">Нови упражнения</button></div>`;
      el.querySelector('#r').onclick=()=>drill(el,ls,k);return}
    const q=qs[n];
    if(q.type==='fill'){
      const shown=q.x.ar.split(q.w).join('<span style="border-bottom:2px solid var(--gold);padding:0 22px;color:transparent">ـــ</span>');
      el.innerHTML=`<div class="q"><p>Упражнение ${n+1} от ${qs.length}. Попълнете липсващата дума</p><div class="face long" style="font-size:30px">${shown}</div><p style="margin-top:8px">${esc(q.x.bg)}</p></div>
       <div class="opts">${q.opts.map((o,j)=>`<button class="opt ar" data-j="${j}">${o}</button>`).join('')}</div>`;
      el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=q.opts[+b.dataset.j]===q.w;
        el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(q.opts[j]===q.w)x.classList.add('ok')});if(!ok)b.classList.add('bad');say(q.x.ar);next(ok)});
    }else{
      let picked=[];const chips=shuffle(q.t.map((w,i)=>({w,i})));
      const paint=()=>{
        el.innerHTML=`<div class="q"><p>Упражнение ${n+1} от ${qs.length}. Подредете думите в изречение</p><p style="font-size:15px;color:var(--ink);margin:6px 0 12px">${esc(q.x.bg)}</p>
         <div class="ar" style="min-height:56px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;direction:rtl" id="ans">${picked.map((c,j)=>`<button class="opt ar" style="min-height:0;padding:4px 10px" data-u="${j}">${c.w}</button>`).join('')}</div></div>
         <div class="ar" style="display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center">${chips.filter(c=>!picked.includes(c)).map(c=>`<button class="opt ar" style="min-height:0;padding:6px 12px" data-c="${c.i}">${c.w}</button>`).join('')}</div>`;
        el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{picked.push(chips.find(c=>c.i==b.dataset.c));
          if(picked.length===q.t.length){const ok=picked.map(c=>plain(c.w)).join(' ')===q.t.map(plain).join(' ');paint();
            const a=el.querySelector('#ans');a.style.borderColor=ok?'var(--ok)':'var(--bad)';a.style.background=ok?'#E6F3EB':'#F8E7E5';
            if(!ok)a.insertAdjacentHTML('afterend',`<p class="ar" style="font-size:22px;color:var(--ok);margin-top:8px">${q.x.ar}</p>`);
            el.querySelectorAll('button').forEach(x=>x.disabled=true);say(q.x.ar);next(ok)}else paint()});
        el.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.u,1);paint()});
      };paint();
    }
  };draw();
}

function write(el,ls,k){
  let i=0;const list=ls.trace;
  const intro=ls.kind==='handintro'?`<div class="note">${esc(ls.note)}</div>${ls.t.includes('геометрични')?`<div class="grid" style="margin-bottom:16px">${ALL_LETTERS.map(L=>`<div><span class="ar">${L}</span><small>${NAMES[L]}</small></div>`).join('')}</div>`:''}`:'<div class="note">Проследете сивата буква с пръст или мишка. Пише се отдясно наляво.</div>';
  const draw=()=>{
    el.innerHTML=intro+`<div class="pad"><canvas id="cv"></canvas><div class="padbar"><button class="btn ghost" id="clr">Изчисти</button><span>${i+1} / ${list.length}</span>${sayBtn(list[i])}</div></div>
     <div class="nav"><button class="btn ghost" id="p">Предишна</button><button class="btn" id="n">${i===list.length-1?'Готово':'Следваща'}</button></div>`;
    bindSay(el);
    const cv=el.querySelector('#cv'),dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
    const guide=()=>{c.clearRect(0,0,w,h);c.strokeStyle='#E6EBE9';c.lineWidth=1;c.beginPath();c.moveTo(16,h*.68);c.lineTo(w-16,h*.68);c.stroke();
      const txt=list[i],size=plain(txt).length>3?Math.min(h*.5,w/(plain(txt).length*.75)):h*.62;
      c.font=`${size}px Amiri, 'Noto Naskh Arabic', serif`;c.fillStyle='#D3E2DE';c.textAlign='center';c.direction='rtl';c.fillText(txt,w/2,h*.68)};
    guide();document.fonts&&document.fonts.ready.then(guide);
    let drawing=false;
    const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);const[x,y]=pos(e);c.beginPath();c.moveTo(x,y);c.strokeStyle='#0E5E57';c.lineWidth=7;c.lineCap='round';c.lineJoin='round'};
    cv.onpointermove=e=>{if(!drawing)return;const[x,y]=pos(e);c.lineTo(x,y);c.stroke()};
    cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
    el.querySelector('#clr').onclick=guide;
    el.querySelector('#p').onclick=()=>{if(i>0){i--;draw()}};
    el.querySelector('#n').onclick=()=>{if(i<list.length-1){i++;draw()}else{markDone(k);el.innerHTML=`<div class="result"><div class="score">✓</div><p>Упражнението по писане е завършено.</p><button class="btn" id="r">Отново</button></div>`;el.querySelector('#r').onclick=()=>write(el,ls,k)}};
  };draw();
}

stack=[{t:'home'}];
loadProgress().then(render);
if('speechSynthesis' in window)speechSynthesis.getVoices();
