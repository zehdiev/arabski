<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алиф — арабски по нива</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430; --muted:#5E6875; --paper:#F5F7F6; --white:#FFFFFF;
  --teal:#0E5E57; --teal-soft:#E3EFEC; --gold:#B8862A; --line:#D9DFDD;
  --ok:#2E7D4F; --bad:#B03A2E;
  --ar:'Amiri','Noto Naskh Arabic','Traditional Arabic','Geeza Pro',serif;
  --ui:'Noto Sans','Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);background:var(--paper);color:var(--ink);line-height:1.5;min-height:100vh}
.ar{font-family:var(--ar);direction:rtl}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{background:var(--teal);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{font-family:var(--ar);font-size:34px;line-height:1;width:44px;height:44px;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.5);border-radius:50%}
header h1{font-size:18px;font-weight:700}
header p{font-size:13px;opacity:.8}
.back{margin-left:auto;color:#fff;font-size:14px;padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:20px}
.back[hidden]{display:none}

main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
h2{font-size:22px;margin-bottom:2px}
.h2ar{font-family:var(--ar);font-size:26px;color:var(--teal);direction:rtl;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.unit{font-size:14px;font-weight:700;color:var(--gold);margin:20px 0 8px}
.unit:first-child{margin-top:0}

.levels{display:grid;gap:12px}
.level{display:flex;align-items:center;gap:16px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;width:100%}
.level .num{font-family:var(--ar);font-size:40px;color:var(--teal);width:56px;text-align:center;line-height:1}
.level b{display:block;font-size:17px}
.level span{font-size:13px;color:var(--muted)}
.level.locked{opacity:.55;cursor:default}
.level.locked .num{color:var(--muted)}
.bar{height:6px;background:var(--teal-soft);border-radius:3px;margin-top:8px;overflow:hidden;width:160px}
.bar i{display:block;height:100%;background:var(--teal)}

.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
.row .ic{width:40px;height:40px;border-radius:8px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:var(--ar);font-size:22px;flex-shrink:0}
.row .ic.n{font-family:var(--ui);font-size:15px;font-weight:700}
.row b{display:block;font-size:15px}
.row span{font-size:13px;color:var(--muted)}
.row .done{margin-left:auto;color:var(--ok);font-size:20px}
.row.empty{border-style:dashed;cursor:default}
.row.empty .ic{background:#EEF1F0;color:var(--muted)}

.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--teal);color:#fff}
.note{background:var(--white);border-left:4px solid var(--gold);padding:12px 14px;border-radius:6px;font-size:14px;margin-bottom:16px}
.hero{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;margin-bottom:14px}
.hero .big{font-family:var(--ar);font-size:96px;line-height:1.3;color:var(--teal)}
.hero b{font-size:18px}
.hero p{color:var(--muted);font-size:14px}
.forms{display:flex;gap:14px;direction:rtl;justify-content:center;flex-wrap:wrap;margin-top:10px}
.forms div{text-align:center;min-width:52px}
.forms .ar{font-size:34px;display:block;line-height:1.4}
.forms small{font-size:11px;color:var(--muted);direction:ltr;display:block}
.items{display:grid;gap:8px}
.item{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.item .w{font-family:var(--ar);font-size:30px;line-height:1.5;color:var(--teal);direction:rtl;flex:1;text-align:right}
.item .m{flex:1}
.item .m b{font-size:15px;display:block}
.item .tr{color:var(--muted);font-size:13px;font-style:italic}
.say{width:36px;height:36px;border-radius:50%;background:var(--teal-soft);color:var(--teal);font-size:16px;flex-shrink:0;display:grid;place-items:center}
.dlg{display:grid;gap:10px;margin-bottom:18px}
.bub{max-width:88%;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.bub.a{justify-self:end;border-top-right-radius:4px}
.bub.b{justify-self:start;background:var(--teal-soft);border-color:transparent;border-top-left-radius:4px}
.bub .ar{font-size:24px;line-height:1.6;display:block;text-align:right}
.bub small{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:space-between}
.bub .say{width:30px;height:30px;font-size:13px}
.label{font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 8px}

.card{background:var(--white);border:1px solid var(--line);border-radius:18px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;width:100%}
.card .face{font-family:var(--ar);font-size:56px;line-height:1.6;color:var(--teal);direction:rtl}
.card .face.long{font-size:34px}
.card .hint{font-size:13px;color:var(--muted);margin-top:8px}
.card .ans{font-size:22px;font-weight:700;margin-top:10px}
.card .ans small{display:block;font-size:15px;font-weight:400;color:var(--muted);font-style:italic}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.btn{background:var(--teal);color:#fff;padding:11px 18px;border-radius:24px;font-weight:600;font-size:15px}
.btn.ghost{background:var(--white);color:var(--teal);border:1.5px solid var(--teal)}
.count{font-size:14px;color:var(--muted)}

.q{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;margin-bottom:14px}
.q p{font-size:14px;color:var(--muted)}
.q .face{font-family:var(--ar);font-size:52px;line-height:1.6;color:var(--teal);direction:rtl}
.q .face.long{font-size:30px}
.q .face.bg{font-family:var(--ui);font-size:24px;font-weight:700;color:var(--ink);margin:14px 0;direction:ltr}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:12px 10px;font-size:15px;font-weight:600;min-height:56px}
.opt.ar{font-family:var(--ar);font-size:24px;font-weight:400;direction:rtl}
.opt.ok{border-color:var(--ok);background:#E6F3EB;color:var(--ok)}
.opt.bad{border-color:var(--bad);background:#F8E7E5;color:var(--bad)}
.result{text-align:center;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:30px 20px}
.result .score{font-size:48px;font-weight:700;color:var(--teal)}
.result p{color:var(--muted);margin:6px 0 18px}

.pad{background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pad canvas{display:block;width:100%;height:240px;touch-action:none;cursor:crosshair}
.padbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;direction:rtl}
.grid div{background:var(--white);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px}
.grid .ar{font-size:30px;color:var(--teal);display:block}
.grid small{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">ا</div>
  <div><h1>Алиф</h1><p>Арабски език по нива</p></div>
  <button class="back" id="back" hidden>Назад</button>
</header>
<main id="app"></main>

<script>
/* ================= СЪДЪРЖАНИЕ: НИВО 1 =================
   Формат на думите: 'арабски|транскрипция|превод' или 'арабски|превод' */

const NAMES={'ا':'алиф','ب':'ба','ت':'та','ث':'са','ج':'джим','ح':'ха','خ':'ха (хъ)','د':'дал','ذ':'зал','ر':'ра','ز':'зай','س':'син','ش':'шин','ص':'сад','ض':'дад','ط':'та (тежко)','ظ':'за (тежко)','ع':'айн','غ':'гайн','ف':'фа','ق':'каф','ك':'каф (кяф)','ل':'лам','م':'мим','ن':'нун','ه':'ха (лека)','و':'уау','ي':'йа','ء':'хамза'};

/* Четене и писане — 32 урока в реда на книгата */
const RW_LETTERS=[
 ['ب','като българското „б“',['بَابٌ|bābun|врата','كِتَابٌ|kitābun|книга','طَبِيبٌ|ṭabībun|лекар','طَالِبٌ|ṭālibun|ученик, студент','حُبُوبٌ|ḥubūbun|хапчета']],
 ['ت','като българското „т“',['تِينٌ|tīnun|смокини','زَيْتُونٌ|zaytūnun|маслини','دُرُوسٌ|durūsun|уроци','بَيْتٌ|baytun|къща','وَقْتٌ|waqtun|време']],
 ['م','като българското „м“',['مَاءٌ|māʾun|вода','قَلَمٌ|qalamun|химикалка, писалка','مَسْجِدٌ|masjidun|джамия','مُدَرِّسٌ|mudarrisun|учител']],
 ['ر','трептящо „р“',['رُزٌّ|ruzzun|ориз','سَرِيرٌ|sarīrun|легло','رَجُلٌ|rajulun|мъж','رِيَالٌ|riyālun|риал (пари)']],
 ['ف','като българското „ф“',['فَصْلٌ|faṣlun|класна стая','فُنْدُقٌ|funduqun|хотел','سَفَرٌ|safarun|пътуване','رَفٌّ|raffun|рафт']],
 ['د','като българското „д“',['دَرْسٌ|darsun|урок','مَدْرَسَةٌ|madrasatun|училище','وَلَدٌ|waladun|момче','يَدٌ|yadun|ръка']],
 ['ل','като българското „л“',['لَبَنٌ|labanun|мляко','لَيْلٌ|laylun|нощ','مِلْحٌ|milḥun|сол','جَمِيلٌ|jamīlun|красив']],
 ['ن','като българското „н“',['نُورٌ|nūrun|светлина','بِنْتٌ|bintun|момиче','عَيْنٌ|ʿaynun|око','لَوْنٌ|lawnun|цвят']],
 ['س','като българското „с“',['سُكَّرٌ|sukkarun|захар','كُرْسِيٌّ|kursiyyun|стол','رَأْسٌ|raʾsun|глава','سَمَكٌ|samakun|риба']],
 ['ش','като българското „ш“',['شَايٌ|shāyun|чай','شَمْسٌ|shamsun|слънце','شَارِعٌ|shāriʿun|улица','مِشْطٌ|mishṭun|гребен']],
 ['ز','като българското „з“',['زَيْتٌ|zaytun|олио','خُبْزٌ|khubzun|хляб','مَوْزٌ|mawzun|банани','زَمِيلٌ|zamīlun|съученик, колега']],
 ['ج','като „дж“',['جَمَلٌ|jamalun|камила','دَجَاجٌ|dajājun|пиле','جَامِعَةٌ|jāmiʿatun|университет','ثَلْجٌ|thaljun|лед, сняг']],
 ['ث','като английското „th“ в think — върхът на езика между зъбите',['ثَوْبٌ|thawbun|дреха (тоб)','ثَلَاثَةٌ|thalāthatun|три','حَدِيثٌ|ḥadīthun|разговор; хадис','مِثَالٌ|mithālun|пример']],
 ['ذ','като английското „th“ в this — звучно',['ذَهَبٌ|dhahabun|злато','هٰذَا|hādhā|това (м.р.)','تِلْمِيذٌ|tilmīdhun|ученик','أُسْتَاذٌ|ustādhun|преподавател']],
 ['ك','като българското „к“',['مَكْتَبٌ|maktabun|бюро, офис','كُوبٌ|kūbun|чаша','كَبِيرٌ|kabīrun|голям','سِكِّينٌ|sikkīnun|нож']],
 ['ق','дълбоко „к“, учленено в гърлото',['بَقَّالٌ|baqqālun|бакалин','طَرِيقٌ|ṭarīqun|път','قِطَارٌ|qiṭārun|влак','سُوقٌ|sūqun|пазар']],
 ['ص','тежко, плътно „с“',['صَابُونٌ|ṣābūnun|сапун','قَمِيصٌ|qamīṣun|риза','صَلَاةٌ|ṣalātun|молитва','مِصْبَاحٌ|miṣbāḥun|лампа']],
 ['ض','тежко, плътно „д“',['ضَيْفٌ|ḍayfun|гост','مَرِيضٌ|marīḍun|болен','بَيْضٌ|bayḍun|яйца','أَرْضٌ|arḍun|земя']],
 ['ط','тежко, плътно „т“',['طَعَامٌ|ṭaʿāmun|храна','مَطَارٌ|maṭārun|летище','خَطٌّ|khaṭṭun|почерк, линия','بَطَاطِسُ|baṭāṭisu|картофи']],
 ['ظ','тежко звучно „th“ (като ذ, но плътно)',['ظُهْرٌ|ẓuhrun|пладне','نَظِيفٌ|naẓīfun|чист','مُوَظَّفٌ|muwaẓẓafun|служител','ظَرْفٌ|ẓarfun|плик']],
 ['خ','като българското „х“, силно',['مَطْبَخٌ|maṭbakhun|кухня','أَخٌ|akhun|брат','خَرِيطَةٌ|kharīṭatun|карта','بَخِيلٌ|bakhīlun|скъперник']],
 ['غ','гърлено „г“, близко до френското „r“',['غُرْفَةٌ|ghurfatun|стая','صَغِيرٌ|ṣaghīrun|малък','غَدَاءٌ|ghadāʾun|обяд','مَغْرِبٌ|maghribun|залез']],
 ['ح','меко, дрезгаво „х“ от средата на гърлото',['حَقِيبَةٌ|ḥaqībatun|чанта','حَلِيبٌ|ḥalībun|прясно мляко','صَحْنٌ|ṣaḥnun|чиния','مِفْتَاحٌ|miftāḥun|ключ']],
 ['ه','леко издишано „х“, като в английското hello',['وَجْهٌ|wajhun|лице','نَهْرٌ|nahrun|река','مِهْنَةٌ|mihnatun|професия','شَهْرٌ|shahrun|месец']],
 ['ع','звук от стегнато гърло — няма българско съответствие',['مَطْعَمٌ|maṭʿamun|ресторант','سَاعَةٌ|sāʿatun|часовник','عَمَلٌ|ʿamalun|работа','شَارِعٌ|shāriʿun|улица']],
 ['ء','кратко спиране на гласа, като между „а“ и „а“ в „га-ага“',['أَبٌ|abun|баща','سُؤَالٌ|suʾālun|въпрос','مَاءٌ|māʾun|вода','أَنَا|anā|аз']],
 ['و','като английското „w“ или дълго „у“',['وَلَدٌ|waladun|момче','يَوْمٌ|yawmun|ден','نُورٌ|nūrun|светлина','دَلْوٌ|dalwun|кофа']],
 ['ي','като българското „й“ или дълго „и“',['يَدٌ|yadun|ръка','كَبِيرٌ|kabīrun|голям','بَيْتٌ|baytun|къща','يَمِينٌ|yamīnun|дясно']]
];
const RW_EXTRA=[
 {t:'Шада (ـّ)',ar:'التَّشْدِيدُ',sym:'ّ',note:'Шадата удвоява съгласната: буквата се произнася два пъти по-дълго. مُدَرِّسٌ се чете mudar-risun.',w:['مُدَرِّسٌ|mudarrisun|учител','سُكَّرٌ|sukkarun|захар','بَقَّالٌ|baqqālun|бакалин','أُمٌّ|ummun|майка','رُزٌّ|ruzzun|ориз']},
 {t:'Лунни и слънчеви букви',ar:'أَلْ الْقَمَرِيَّةُ وَالشَّمْسِيَّةُ',sym:'ال',note:'Определителният член ال се чете „ал-“ пред лунните букви (القمر – al-qamaru). Пред слънчевите букви „л“ не се чува, а следващата буква се удвоява (الشمس – ash-shamsu).',w:['الْقَمَرُ|al-qamaru|луната (лунна)','الْكِتَابُ|al-kitābu|книгата (лунна)','الْبَابُ|al-bābu|вратата (лунна)','الشَّمْسُ|ash-shamsu|слънцето (слънчева)','الدَّرْسُ|ad-darsu|урокът (слънчева)','النُّورُ|an-nūru|светлината (слънчева)']},
 {t:'Танвин',ar:'التَّنْوِينُ',sym:'ـٌ',note:'Танвинът е удвоена огласовка в края на думата и добавя „н“: ـٌ = -un, ـً = -an, ـٍ = -in. Той показва, че думата е неопределена.',w:['كِتَابٌ|kitābun|книга (-un)','كِتَابًا|kitāban|книга (-an)','كِتَابٍ|kitābin|книга (-in)','قَلَمٌ|qalamun|химикалка (-un)','بَيْتًا|baytan|къща (-an)']},
 {t:'Та марбута (ة)',ar:'التَّاءُ الْمَرْبُوطَةُ',sym:'ة',note:'Та марбута (ة/ـة) стои в края на думата и обикновено показва женски род. При пауза се чете като „а“, а при свързано четене — като „т“.',w:['مَدْرَسَةٌ|madrasatun|училище','سَيَّارَةٌ|sayyāratun|кола','طَالِبَةٌ|ṭālibatun|ученичка, студентка','مَكْتَبَةٌ|maktabatun|библиотека','غُرْفَةٌ|ghurfatun|стая']}
];

/* Книга с картини (етап на слушане) — 17 урока */

  r:['تَسَلَّمَ مَحْمُودٌ تَذَاكِرَ السَّفَرِ إِلَى الرِّيَاضِ.|Махмуд получи билетите за Рияд.','أَمَّا رَشِيدٌ فَلَمْ يَتَسَلَّمْ تَذْكِرَتَهُ.|А Рашид не получи билета си.','ذَهَبَ رَشِيدٌ إِلَى الْمَكْتَبِ لِاسْتِلَامِهَا.|Рашид отиде в бюрото да го получи.','وَذَهَبَ مَحْمُودٌ إِلَى السِّفَارَةِ لِاسْتِخْرَاجِ التَّأْشِيرَةِ.|А Махмуд отиде в посолството да извади визата.','حَصَلَ مَحْمُودٌ عَلَى تَأْشِيرَةِ الدُّخُولِ.|Махмуд получи входна виза.']},
 {u:'Пътуване',ar:'فِي مَكْتَبِ الْحَجْزِ',t:'В бюрото за резервации',
  d:['مَحْمُودٌ: السَّلَامُ عَلَيْكُمْ. أُرِيدُ أَنْ أَحْجِزَ مَكَانًا إِلَى الرِّيَاضِ.|Здравейте. Искам да запазя място до Рияд.','الْمُوَظَّفُ: وَعَلَيْكُمُ السَّلَامُ. مَتَى تُرِيدُ أَنْ تُسَافِرَ؟|Здравейте. Кога искате да пътувате?','مَحْمُودٌ: يَوْمَ السَّبْتِ الْقَادِمِ.|Следващата събота.','الْمُوَظَّفُ: بِالدَّرَجَةِ الْأُولَى أَمِ السِّيَاحِيَّةِ؟|Първа класа или икономична?','مَحْمُودٌ: بِالدَّرَجَةِ السِّيَاحِيَّةِ مِنْ فَضْلِكَ.|Икономична, моля.','الْمُوَظَّفُ: حَسَنًا، عَلَيْكَ أَنْ تُؤَكِّدَ الْحَجْزَ قَبْلَ السَّفَرِ بِيَوْمٍ.|Добре. Трябва да потвърдите резервацията ден преди пътуването.','مَحْمُودٌ: مَتَى تُقْلِعُ الطَّائِرَةُ؟|Кога излита самолетът?','الْمُوَظَّفُ: تُقْلِعُ فِي السَّاعَةِ الثَّامِنَةِ صَبَاحًا.|Излита в осем сутринта.','مَحْمُودٌ: وَمَتَى أَحْضُرُ إِلَى الْمَطَارِ؟|А кога да дойда на летището?','الْمُوَظَّفُ: قَبْلَ الْإِقْلَاعِ بِسَاعَتَيْنِ عَلَى الْأَقَلِّ.|Поне два часа преди излитането.'],
  w:['حَجَزَ / يَحْجِزُ|ḥajaza|запази / запазва','مَكَانٌ|makānun|място','الدَّرَجَةُ الْأُولَى|ad-darajatu al-ūlā|първа класа','الدَّرَجَةُ السِّيَاحِيَّةُ|ad-darajatu as-siyāḥiyyatu|икономична класа','أَكَّدَ / يُؤَكِّدُ|akkada|потвърди / потвърждава','أَقْلَعَ / يُقْلِعُ|aqlaʿa|излетя / излита','إِقْلَاعٌ|iqlāʿun|излитане','حَضَرَ / يَحْضُرُ|ḥaḍara|дойде / идва','الْمَطَارُ|al-maṭāru|летището','السَّبْتُ|as-sabtu|събота','الْقَادِمُ|al-qādimu|следващият','عَلَى الْأَقَلِّ|ʿalā al-aqalli|поне','السَّاعَةُ الْوَاحِدَةُ|as-sāʿatu al-wāḥidatu|един часа','السَّاعَةُ الثَّانِيَةُ|as-sāʿatu ath-thāniyatu|два часа','السَّاعَةُ الثَّالِثَةُ|as-sāʿatu ath-thālithatu|три часа'],
  g:'Заповедна форма: يَحْجِزُ → اِحْجِزْ „запази!“, يَدْخُلُ → اُدْخُلْ „влез!“, يَخْرُجُ → اُخْرُجْ „излез!“. Часът се казва с поредно числително: السَّاعَةُ الثَّانِيَةُ „два часа“.',
  s:['اِحْجِزْ مَكَانًا يَا مَحْمُودُ|Запази място, Махмуд','اُدْخُلْ مَكْتَبَ الْحَجْزِ يَا عَلِيُّ|Влез в бюрото за резервации, Али','اُخْرُجْ مِنَ الْمَكْتَبِ يَا عَلِيُّ|Излез от бюрото, Али','سَافِرْ إِلَى الرِّيَاضِ يَا إِبْرَاهِيمُ|Пътувай до Рияд, Ибрахим','تُقْلِعُ الطَّائِرَةُ فِي السَّاعَةِ الثَّامِنَةِ|Самолетът излита в осем часа','عَلَيْكَ أَنْ تُؤَكِّدَ الْحَجْزَ|Трябва да потвърдиш резервацията'],
  r:['ذَهَبَ مَحْمُودٌ إِلَى مَكْتَبِ الْحَجْزِ.|Махмуд отиде в бюрото за резервации.','حَجَزَ مَكَانًا فِي رِحْلَةِ يَوْمِ السَّبْتِ.|Запази място за полета в събота.','اخْتَارَ الدَّرَجَةَ السِّيَاحِيَّةَ.|Избра икономична класа.','سَأَلَ الْمُوَظَّفَ عَنْ مَوْعِدِ الْإِقْلَاعِ.|Попита служителя за часа на излитане.']},
 {u:'Пътуване',ar:'فِي صَالَةِ السَّفَرِ',t:'В залата за заминаващи',
  d:['مَحْمُودٌ: لَوْ سَمَحْتَ، أَنَا مُسَافِرٌ إِلَى الرِّيَاضِ.|Извинете, пътувам за Рияд.','الْمُوَظَّفُ: التَّذْكِرَةَ وَجَوَازَ السَّفَرِ مِنْ فَضْلِكَ.|Билета и паспорта, моля.','مَحْمُودٌ: تَفَضَّلْ.|Заповядайте.','الْمُوَظَّفُ: أَيْنَ حَقَائِبُكَ؟|Къде са куфарите ви?','مَحْمُودٌ: مَعِي حَقِيبَتَانِ.|Имам два куфара.','الْمُوَظَّفُ: ضَعْهُمَا عَلَى الْمِيزَانِ. الْوَزْنُ الزَّائِدُ عَشَرَةُ كِيلُوَاتٍ، اِدْفَعْ أَرْبَعِينَ رِيَالًا.|Сложете ги на кантара. Свръхтеглото е десет килограма, платете четиридесет риала.','الْمُوَظَّفُ: هٰذِهِ بِطَاقَةُ الصُّعُودِ. اِمْلَأْ بِطَاقَةَ الْمُغَادَرَةِ ثُمَّ اتَّجِهْ إِلَى الْجَوَازَاتِ.|Това е бордната карта. Попълнете картата за заминаване и се отправете към паспортния контрол.','مُوَظَّفُ الْجَوَازَاتِ: الْجَوَازَ وَالْبِطَاقَةَ مِنْ فَضْلِكَ.|Паспорта и картата, моля.','مُوَظَّفُ الْجَوَازَاتِ: تَفَضَّلْ، اُدْخُلْ إِلَى صَالَةِ الْمُغَادَرَةِ.|Заповядайте, влезте в залата за заминаващи.','مَحْمُودٌ: شُكْرًا، مَعَ السَّلَامَةِ.|Благодаря, довиждане.'],
  w:['حَقِيبَةٌ (ج) حَقَائِبُ|ḥaqībatun|куфар, чанта','الْمِيزَانُ|al-mīzānu|кантарът','الْوَزْنُ الزَّائِدُ|al-waznu az-zāʾidu|свръхтегло','دَفَعَ / يَدْفَعُ|dafaʿa|плати / плаща','بِطَاقَةُ الصُّعُودِ|biṭāqatu aṣ-ṣuʿūdi|бордна карта','بِطَاقَةُ الْمُغَادَرَةِ|biṭāqatu al-mughādarati|карта за заминаване','مَلَأَ / يَمْلَأُ|malaʾa|попълни / попълва','اتَّجَهَ / يَتَّجِهُ|ittajaha|отправи се / отправя се','الْجَوَازَاتُ|al-jawāzātu|паспортен контрол','صَالَةُ الْمُغَادَرَةِ|ṣālatu al-mughādarati|зала за заминаващи','بَوَّابَةٌ|bawwābatun|изход (гейт)','النِّدَاءُ|an-nidāʾu|съобщението','لَوْ سَمَحْتَ|law samaḥta|извинете, ако обичате','مُسَافِرٌ|musāfirun|пътник','أَرْبَعُونَ|arbaʿūna|четиридесет'],
  g:'Причастие „който прави“: ذَهَبَ → ذَاهِبٌ, قَدِمَ → قَادِمٌ, عَادَ → عَائِدٌ: أَنَا ذَاهِبٌ إِلَى الرِّيَاضِ „Отивам в Рияд“. „Имам (със себе си)“ се казва с مَعَ: مَعِي „с мен“, مَعَنَا „с нас“.',
  s:['أَنَا ذَاهِبٌ إِلَى الرِّيَاضِ|Отивам в Рияд','أَنَا قَادِمٌ مِنْ بَاكِسْتَانَ|Идвам от Пакистан','أَنَا عَائِدٌ إِلَى السَّكَنِ|Връщам се в общежитието','نَحْنُ مَعَنَا حَقَائِبُ|Ние имаме куфари','وَضَعَ الْمُسَافِرُ الْحَقِيبَةَ عَلَى الْمِيزَانِ|Пътникът сложи куфара на кантара','أَنَا جَالِسٌ عَلَى الْكُرْسِيِّ|Седя на стола'],
  r:['حَضَرَ مَحْمُودٌ إِلَى صَالَةِ السَّفَرِ.|Махмуд дойде в залата за заминаващи.','قَدَّمَ لِلْمُوَظَّفِ الْجَوَازَ وَالتَّذْكِرَةَ.|Даде на служителя паспорта и билета.','وَزَنَ حَقَائِبَهُ وَدَفَعَ قِيمَةَ الْوَزْنِ الزَّائِدِ.|Претегли куфарите си и плати свръхтеглото.','ثُمَّ مَرَّ عَلَى الْجَوَازَاتِ وَاتَّجَهَ إِلَى صَالَةِ الْمُغَادَرَةِ.|После мина през паспортния контрол и се отправи към залата.','بَعْدَ سَاعَةٍ سَمِعَ النِّدَاءَ فَاتَّجَهَ إِلَى الْبَوَّابَةِ.|След час чу съобщението и тръгна към изхода.']},
 {u:'Пътуване',ar:'اِقْرَأْ',t:'Прочети: Али пътува за умра',review:true,
  r:['قَرَّرَ عَلِيٌّ أَنْ يُسَافِرَ إِلَى مَكَّةَ لِلْعُمْرَةِ.|Али реши да пътува до Мека за умра.','اسْتَخْرَجَ جَوَازَ السَّفَرِ وَحَصَلَ عَلَى التَّأْشِيرَةِ.|Извади паспорт и получи виза.','ثُمَّ ذَهَبَ إِلَى مَكْتَبِ الْحَجْزِ وَحَجَزَ مَكَانًا بِالدَّرَجَةِ السِّيَاحِيَّةِ.|После отиде в бюрото и запази място в икономична класа.','قَبْلَ السَّفَرِ بِيَوْمٍ أَكَّدَ الْحَجْزَ.|Ден преди пътуването потвърди резервацията.','حَضَرَ إِلَى الْمَطَارِ قَبْلَ الْإِقْلَاعِ بِسَاعَتَيْنِ.|Дойде на летището два часа преди излитането.','وَزَنَ حَقِيبَتَهُ وَتَسَلَّمَ بِطَاقَةَ الصُّعُودِ.|Претегли куфара си и получи бордна карта.','وَأَقْلَعَتِ الطَّائِرَةُ فِي مَوْعِدِهَا.|И самолетът излетя навреме.']},
 {u:'Пътуване',ar:'فِي صَالَةِ الِاسْتِقْبَالِ',t:'В залата за пристигащи',
  d:['مُوَظَّفُ الْجَوَازَاتِ: مِنْ أَيْنَ أَنْتَ قَادِمٌ؟|Откъде идвате?','مَحْمُودٌ: أَنَا قَادِمٌ مِنْ تُرْكِيَا.|Идвам от Турция.','مُوَظَّفُ الْجَوَازَاتِ: أَهْلًا بِكَ. هَلْ تَسْمَحُ بِجَوَازِ السَّفَرِ وَبِطَاقَةِ الْوُصُولِ؟|Добре дошли. Паспорта и картата за пристигане, моля.','مَحْمُودٌ: تَفَضَّلْ.|Заповядайте.','مُوَظَّفُ الْجَوَازَاتِ: إِلَى أَيْنَ أَنْتَ مُتَّجِهٌ؟|Накъде се отправяте?','مَحْمُودٌ: أَنَا مُتَّجِهٌ إِلَى الْجَامِعَةِ لِلدِّرَاسَةِ.|Отивам в университета, за да уча.','مُوَظَّفُ الْجَوَازَاتِ: تَفَضَّلْ إِلَى صَالَةِ الْجَمَارِكِ.|Заповядайте към митницата.','مُوَظَّفُ الْجَمَارِكِ: اِفْتَحِ الْحَقِيبَةَ مِنْ فَضْلِكَ. مَاذَا فِيهَا؟|Отворете куфара, моля. Какво има в него?','مَحْمُودٌ: فِيهَا مَلَابِسُ وَكُتُبٌ.|Дрехи и книги.','مُوَظَّفُ الْجَمَارِكِ: شُكْرًا. يُمْكِنُكَ أَنْ تُقْفِلَ الْحَقِيبَةَ وَتَخْرُجَ.|Благодаря. Можете да затворите куфара и да излезете.'],
  w:['قَادِمٌ|qādimun|идващ, пристигащ','بِطَاقَةُ الْوُصُولِ|biṭāqatu al-wuṣūli|карта за пристигане','مُتَّجِهٌ|muttajihun|отправящ се','الْجَمَارِكُ|al-jamāriku|митницата','فَتَحَ / يَفْتَحُ|fataḥa|отвори / отваря','أَقْفَلَ / يُقْفِلُ|aqfala|затвори, заключи','مَلَابِسُ|malābisu|дрехи','فَحَصَ / يَفْحَصُ|faḥaṣa|провери / проверява','هَبَطَتِ الطَّائِرَةُ|habaṭati aṭ-ṭāʾiratu|самолетът кацна','صَالَةُ الْقُدُومِ|ṣālatu al-qudūmi|зала за пристигащи','يُمْكِنُكَ|yumkinuka|можеш','بَوَّابَةُ الْخُرُوجِ|bawwābatu al-khurūji|изходът','أَسْرَعَ / يُسْرِعُ|asraʿa|побърза / бърза','أَرْسَلَ / يُرْسِلُ|arsala|изпрати / изпраща','وَجَدَ / يَجِدُ|wajada|намери / намира'],
  g:'От сегашно време към причастие: يُسَافِرُ → مُسَافِرٌ, يُقْفِلُ → مُقْفِلٌ, يُرْسِلُ → مُرْسِلٌ. „Можеш да…“ се казва по два начина: يُمْكِنُكَ أَنْ تَخْرُجَ = يُمْكِنُكَ الْخُرُوجُ.',
  s:['رَشِيدٌ يُقْفِلُ الْحَقِيبَةَ|Рашид затваря куфара','فَاطِمَةُ مُسَافِرَةٌ إِلَى بَاكِسْتَانَ|Фатима пътува за Пакистан','الطَّائِرَةُ تُقْلِعُ فِي الصَّبَاحِ|Самолетът излита сутринта','يُمْكِنُكَ أَنْ تَخْرُجَ الْآنَ|Можеш да излезеш сега','يُمْكِنُكَ السَّفَرُ غَدًا|Можеш да пътуваш утре','وَجَدَ الْمُوَظَّفُ فِي الْحَقِيبَةِ كُتُبًا|Служителят намери книги в куфара'],
  r:['هَبَطَتِ الطَّائِرَةُ فِي مَطَارِ الرِّيَاضِ.|Самолетът кацна на летището в Рияд.','رَكِبَ مَحْمُودٌ الْحَافِلَةَ إِلَى صَالَةِ الْقُدُومِ.|Махмуд се качи на автобуса до залата за пристигащи.','قَدَّمَ لِمُوَظَّفِ الْجَوَازَاتِ الْجَوَازَ وَبِطَاقَةَ الْوُصُولِ.|Даде на служителя паспорта и картата за пристигане.','فَتَحَ مُوَظَّفُ الْجَمَارِكِ الْحَقِيبَةَ فَوَجَدَ مَلَابِسَ وَكُتُبًا.|Митничарят отвори куфара и намери дрехи и книги.','ثُمَّ اتَّجَهَ مَحْمُودٌ إِلَى بَوَّابَةِ الْخُرُوجِ.|После Махмуд се отправи към изхода.']},
 {u:'Пътуване',ar:'مَعَ سَائِقِ سَيَّارَةِ الْأُجْرَةِ',t:'С шофьора на таксито',
  d:['مَحْمُودٌ: السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ.|Мир на вас и милостта на Аллах.','السَّائِقُ: وَعَلَيْكُمُ السَّلَامُ وَرَحْمَةُ اللّٰهِ. إِلَى أَيِّ مَكَانٍ؟|И на вас. Накъде?','مَحْمُودٌ: هَلْ تَعْرِفُ السَّكَنَ الْجَامِعِيَّ؟|Знаете ли студентското общежитие?','السَّائِقُ: لَا، لَا أَعْرِفُهُ، وَلٰكِنْ أَعْرِفُ إِدَارَةَ الْجَامِعَةِ.|Не, не го знам, но знам ректората на университета.','مَحْمُودٌ: خُذْنِي إِلَى إِدَارَةِ الْجَامِعَةِ إِذَنْ.|Тогава ме закарайте до ректората.','السَّائِقُ: تَفَضَّلْ، ضَعِ الْحَقِيبَةَ هُنَا.|Заповядайте, сложете куфара тук.','مَحْمُودٌ: كَمْ تُكَلِّفُ الرِّحْلَةُ إِلَى هُنَاكَ؟|Колко струва курсът дотам?','السَّائِقُ: خَمْسُونَ رِيَالًا.|Петдесет риала.','مَحْمُودٌ: قِفْ هُنَا مِنْ فَضْلِكَ. تَفَضَّلِ الْأُجْرَةَ.|Спрете тук, моля. Ето таксата.','السَّائِقُ: شُكْرًا، مَعَ السَّلَامَةِ.|Благодаря, довиждане.'],
  w:['سَيَّارَةُ الْأُجْرَةِ|sayyāratu al-ujrati|такси','مَوْقِفُ سَيَّارَاتِ الْأُجْرَةِ|mawqifu sayyārāti al-ujrati|стоянка за таксита','سَائِقٌ|sāʾiqun|шофьор','عَرَفَ / يَعْرِفُ|ʿarafa|знае, познава','السَّكَنُ الْجَامِعِيُّ|as-sakanu al-jāmiʿiyyu|студентско общежитие','إِدَارَةُ الْجَامِعَةِ|idāratu al-jāmiʿati|ректоратът','كَلَّفَ / يُكَلِّفُ|kallafa|струва','أُجْرَةٌ|ujratun|такса, наем','خُذْنِي|khudhnī|вземи ме, закарай ме','قِفْ|qif|спри!','إِذَنْ|idhan|тогава','خَمْسُونَ|khamsūna|петдесет','شَكَرَ / يَشْكُرُ|shakara|благодари'],
  g:'„Колко струва…?“: كَمْ تُكَلِّفُ الرِّحْلَةُ؟ (ж.р.), كَمْ يُكَلِّفُ الْكِتَابُ؟ (м.р.) — глаголът се съгласува по род с подлога. „Знаеш ли…?“: هَلْ تَعْرِفُ …؟',
  s:['كَمْ تُكَلِّفُ التَّذْكِرَةُ؟|Колко струва билетът?','كَمْ يُكَلِّفُ الْكِتَابُ؟|Колко струва книгата?','هَلْ تَعْرِفُ الْمَطَارَ؟|Знаеш ли летището?','هَلْ تَعْرِفُ مَوْقِفَ الْحَافِلَاتِ؟|Знаеш ли автобусната спирка?','دَفَعَ مَحْمُودٌ الْأُجْرَةَ لِلسَّائِقِ|Махмуд плати таксата на шофьора','شَكَرَ مَحْمُودٌ السَّائِقَ|Махмуд благодари на шофьора'],
  r:['وَصَلَ مَحْمُودٌ إِلَى الْمَطَارِ وَأَرَادَ أَنْ يَذْهَبَ إِلَى السَّكَنِ.|Махмуд пристигна на летището и искаше да отиде в общежитието.','ذَهَبَ إِلَى مَوْقِفِ سَيَّارَاتِ الْأُجْرَةِ.|Отиде на стоянката за таксита.','السَّائِقُ لَا يَعْرِفُ السَّكَنَ، فَأَخَذَهُ إِلَى إِدَارَةِ الْجَامِعَةِ.|Шофьорът не знаеше общежитието и го закара до ректората.','دَفَعَ مَحْمُودٌ الْأُجْرَةَ وَشَكَرَ السَّائِقَ.|Махмуд плати и благодари на шофьора.']},
 {u:'Транспорт',ar:'الْوُصُولُ إِلَى الْمَكْتَبَةِ',t:'Как да стигна до библиотеката',
  d:['طَارِقٌ: أَهْلًا يَا مَالِكُ.|Здравей, Малик.','مَالِكٌ: أَهْلًا وَسَهْلًا يَا طَارِقُ.|Добре дошъл, Тарик.','طَارِقٌ: لِمَاذَا لَا تَحْضُرُ إِلَى الْمَكْتَبَةِ كُلَّ يَوْمٍ؟|Защо не идваш в библиотеката всеки ден?','مَالِكٌ: لِأَنِّي أَسْكُنُ بَعِيدًا، وَسَيَّارَاتُ الْأُجْرَةِ غَالِيَةٌ.|Защото живея далеч, а такситата са скъпи.','طَارِقٌ: لِمَاذَا لَا تَحْضُرُ بِالْحَافِلَةِ؟ لَهَا خُطُوطٌ كَثِيرَةٌ.|Защо не идваш с автобус? Има много линии.','مَالِكٌ: لِأَنِّي لَا أَعْرِفُ مِنْ أَيْنَ أَرْكَبُهَا.|Защото не знам откъде да се кача.','طَارِقٌ: فِي كُلِّ شَارِعٍ كَبِيرٍ مَوَاقِفُ لِلْحَافِلَاتِ.|На всяка голяма улица има спирки.','مَالِكٌ: وَلٰكِنَّ الْحَافِلَاتِ مُزْدَحِمَةٌ دَائِمًا.|Но автобусите винаги са претъпкани.','طَارِقٌ: يُمْكِنُكَ أَنْ تَشْتَرِيَ دَرَّاجَةً نَارِيَّةً.|Можеш да си купиш мотоциклет.','مَالِكٌ: هٰذَا أَفْضَلُ. شُكْرًا جَزِيلًا.|Това е по-добре. Много благодаря.'],
  w:['حَافِلَةٌ (ج) حَافِلَاتٌ|ḥāfilatun|автобус','مَوْقِفٌ (ج) مَوَاقِفُ|mawqifun|спирка','خَطٌّ (ج) خُطُوطٌ|khaṭṭun|линия','مُزْدَحِمٌ|muzdaḥimun|претъпкан','دَائِمًا|dāʾiman|винаги','غَالٍ / غَالِيَةٌ|ghālin|скъп / скъпа','وَسِيلَةُ مُوَاصَلَاتٍ|wasīlatu muwāṣalātin|превозно средство','دَرَّاجَةٌ|darrājatun|велосипед','دَرَّاجَةٌ نَارِيَّةٌ|darrājatun nāriyyatun|мотоциклет','رَكِبَ / يَرْكَبُ|rakiba|качи се / качва се','لِمَاذَا؟|limādhā|защо?','لِأَنَّ|li-anna|защото','أَفْضَلُ|afḍalu|по-добър','انْتَظَرَ / يَنْتَظِرُ|intaẓara|чака','فَكَّرَ / يُفَكِّرُ|fakkara|мисли'],
  g:'„Защо?“ е لِمَاذَا؟, а отговорът започва с لِأَنَّ „защото“: لِأَنِّي أَسْكُنُ بَعِيدًا. „Във всеки… има…“: فِي كُلِّ شَارِعٍ مَوَاقِفُ.',
  s:['فِي كُلِّ شَارِعٍ مَوَاقِفُ لِلْحَافِلَاتِ|На всяка улица има автобусни спирки','فِي كُلِّ مَكْتَبَةٍ رُفُوفٌ لِلْكُتُبِ|Във всяка библиотека има рафтове за книги','فِي كُلِّ مَطْعَمٍ مَقَاعِدُ لِلْجُلُوسِ|Във всеки ресторант има места за сядане','لِمَاذَا تَذْهَبُ إِلَى الْمَكْتَبَةِ؟|Защо отиваш в библиотеката?','أَذْهَبُ إِلَى الْمَكْتَبَةِ لِأَقْرَأَ|Отивам в библиотеката, за да чета','هَلْ تَنْتَظِرُ الْحَافِلَةَ؟|Чакаш ли автобуса?'],
  r:['مَالِكٌ لَا يَحْضُرُ إِلَى الْمَكْتَبَةِ كُلَّ يَوْمٍ.|Малик не идва в библиотеката всеки ден.','هُوَ يَسْكُنُ بَعِيدًا، وَسَيَّارَاتُ الْأُجْرَةِ غَالِيَةٌ.|Той живее далеч, а такситата са скъпи.','لَا يَعْرِفُ مَوَاقِفَ الْحَافِلَاتِ.|Не знае автобусните спирки.','يُفَكِّرُ مَالِكٌ فِي شِرَاءِ دَرَّاجَةٍ نَارِيَّةٍ.|Малик мисли да си купи мотоциклет.']},
 {u:'Транспорт',ar:'رِحْلَةٌ بِالْقِطَارِ',t:'Пътуване с влак',
  d:['مَالِكٌ: أَهْلًا يَا طَارِقُ.|Здравей, Тарик.','طَارِقٌ: أَهْلًا يَا مَالِكُ، حَيَّاكَ اللّٰهُ.|Здравей, Малик, Бог да те поживи.','مَالِكٌ: أَرَاكَ تَقْرَأُ كِتَابًا. هَلْ هِوَايَتُكَ الْقِرَاءَةُ؟|Виждам, че четеш книга. Четенето ли ти е хоби?','طَارِقٌ: نَعَمْ. وَمَا هِوَايَتُكَ أَنْتَ؟|Да. А твоето хоби какво е?','مَالِكٌ: هِوَايَتِي السَّفَرُ.|Моето хоби е пътуването.','طَارِقٌ: هَلْ تُفَضِّلُ السَّفَرَ بِالطَّائِرَةِ أَمْ بِالْقِطَارِ؟|Предпочиташ ли самолет или влак?','مَالِكٌ: أُفَضِّلُ الْقِطَارَ، لِأَنِّي أُشَاهِدُ الْمَنَاظِرَ الْجَمِيلَةَ.|Предпочитам влака, защото гледам красивите гледки.','طَارِقٌ: وَكَيْفَ إِجْرَاءَاتُ السَّفَرِ بِالْقِطَارِ؟|А какви са формалностите за влака?','مَالِكٌ: سَهْلَةٌ جِدًّا. تَذْهَبُ إِلَى الْمَحَطَّةِ وَتَشْتَرِي التَّذْكِرَةَ فَقَطْ.|Много лесни. Отиваш на гарата и само купуваш билет.','طَارِقٌ: مَا رَأْيُكَ فِي رِحْلَةٍ بِالْقِطَارِ إِلَى الدَّمَّامِ؟|Какво ще кажеш за пътуване с влак до Дамам?','مَالِكٌ: فِكْرَةٌ جَمِيلَةٌ!|Чудесна идея!'],
  w:['قِطَارٌ|qiṭārun|влак','مَحَطَّةٌ|maḥaṭṭatun|гара','هِوَايَةٌ|hiwāyatun|хоби','فَضَّلَ / يُفَضِّلُ|faḍḍala|предпочете / предпочита','شَاهَدَ / يُشَاهِدُ|shāhada|видя / гледа','مَنْظَرٌ (ج) مَنَاظِرُ|manẓarun|гледка','سَهْلٌ|sahlun|лесен','صَعْبٌ|ṣaʿbun|труден','فَقَطْ|faqaṭ|само','اشْتَرَى / يَشْتَرِي|ishtarā|купи / купува','مُبَكِّرًا|mubakkiran|рано','صَدِيقٌ|ṣadīqun|приятел','مَا رَأْيُكَ؟|mā raʾyuka|какво мислиш?','فِكْرَةٌ|fikratun|идея','عُطْلَةٌ|ʿuṭlatun|ваканция, почивка'],
  g:'Избор във въпрос с أَمْ „или“: هَلْ تُفَضِّلُ الطَّائِرَةَ أَمِ الْقِطَارَ؟ Местоимение като допълнение се слива с глагола: أَرَاكَ „виждам те“, أَعْرِفُهُ „знам го“.',
  s:['أُفَضِّلُ السَّفَرَ بِالْقِطَارِ|Предпочитам да пътувам с влак','هِوَايَتِي الْقِرَاءَةُ|Моето хоби е четенето','ذَهَبَ مَالِكٌ إِلَى الْمَحَطَّةِ مُبَكِّرًا|Малик отиде на гарата рано','شَاهَدْنَا الْمَنَاظِرَ الْجَمِيلَةَ مِنَ الْقِطَارِ|Гледахме красивите гледки от влака','إِجْرَاءَاتُ السَّفَرِ بِالْقِطَارِ سَهْلَةٌ|Формалностите за влака са лесни','مَا رَأْيُكَ فِي رِحْلَةٍ إِلَى الدَّمَّامِ؟|Какво ще кажеш за пътуване до Дамам?'],
  r:['فَضَّلَ مَالِكٌ السَّفَرَ بِالْقِطَارِ إِلَى مَدِينَةِ الدَّمَّامِ.|Малик предпочете да пътува с влак до Дамам.','اشْتَرَى التَّذْكِرَةَ وَذَهَبَ إِلَى الْمَحَطَّةِ مُبَكِّرًا.|Купи билет и отиде рано на гарата.','هُنَاكَ قَابَلَ صَدِيقَهُ طَارِقًا، فَرَكِبَا الْقِطَارَ مَعًا.|Там срещна приятеля си Тарик и двамата се качиха на влака.','شَاهَدَا مِنَ الْقِطَارِ مَنَاظِرَ جَمِيلَةً.|От влака видяха красиви гледки.']},
 {u:'Транспорт',ar:'الْوُصُولُ إِلَى الْمِينَاءِ',t:'Пристигане на пристанището',
  d:['مَالِكٌ: هَلْ هٰذِهِ الْمَدِينَةُ أَكْبَرُ مِنَ الرِّيَاضِ؟|Този град по-голям ли е от Рияд?','طَارِقٌ: لَا، هِيَ أَصْغَرُ مِنْهَا، وَلٰكِنَّ مِينَاءَهَا مِنْ أَكْبَرِ الْمَوَانِئِ.|Не, по-малък е, но пристанището му е от най-големите.','مَالِكٌ: مَا أَبْدَعَ هٰذَا الْمَنْظَرَ! سُفُنٌ دَاخِلَةٌ وَسُفُنٌ خَارِجَةٌ.|Колко прекрасна гледка! Кораби влизат и излизат.','طَارِقٌ: اُنْظُرْ إِلَى أَشْكَالِهَا وَأَحْجَامِهَا الْمُخْتَلِفَةِ.|Виж различните им форми и размери.','مَالِكٌ: هٰذِهِ السُّفُنُ تَحْمِلُ الرُّكَّابَ، وَتِلْكَ تَحْمِلُ الْبَضَائِعَ.|Тези превозват пътници, а онези – стоки.','طَارِقٌ: وَمَا هٰذِهِ السَّفِينَةُ الضَّخْمَةُ؟|А какъв е този огромен кораб?','مَالِكٌ: إِنَّهَا نَاقِلَةُ نِفْطٍ.|Това е петролен танкер.','طَارِقٌ: يَا لَهَا مِنْ رِحْلَةٍ مُمْتِعَةٍ!|Какво приятно пътуване!'],
  w:['مِينَاءٌ (ج) مَوَانِئُ|mīnāʾun|пристанище','سَفِينَةٌ (ج) سُفُنٌ|safīnatun|кораб','رَاكِبٌ (ج) رُكَّابٌ|rākibun|пътник','بَضَائِعُ|baḍāʾiʿu|стоки','نَاقِلَةُ نِفْطٍ|nāqilatu nifṭin|петролен танкер','ضَخْمٌ|ḍakhmun|огромен','شَكْلٌ (ج) أَشْكَالٌ|shaklun|форма','حَجْمٌ (ج) أَحْجَامٌ|ḥajmun|размер','مُخْتَلِفٌ|mukhtalifun|различен','حَمَلَ / يَحْمِلُ|ḥamala|носи, превозва','أَكْبَرُ|akbaru|по-голям','أَصْغَرُ|aṣgharu|по-малък','مُمْتِعٌ|mumtiʿun|приятен, интересен','الْعَاصِمَةُ|al-ʿāṣimatu|столицата','بَحْرٌ|baḥrun|море'],
  g:'Сравнителна степен по модела أَفْعَلُ: كَبِيرٌ → أَكْبَرُ, صَغِيرٌ → أَصْغَرُ, جَمِيلٌ → أَجْمَلُ. „По-… от“: أَكْبَرُ مِنْ. „От най-…“: مِنْ أَكْبَرِ الْمَوَانِئِ. Възклицание: مَا أَجْمَلَ هٰذَا الْمَكَانَ! „Колко красиво е това място!“',
  s:['الْبَابُ أَكْبَرُ مِنَ النَّافِذَةِ|Вратата е по-голяма от прозореца','الْقِرَاءَةُ أَسْهَلُ مِنَ الْكِتَابَةِ|Четенето е по-лесно от писането','هٰذَا الْمِينَاءُ مِنْ أَكْبَرِ الْمَوَانِئِ|Това пристанище е от най-големите','مَا أَجْمَلَ هٰذَا الْمَكَانَ!|Колко красиво е това място!','مَا أَثْقَلَ هٰذِهِ الْحَقِيبَةَ!|Колко тежък е този куфар!','بَعْضُ السُّفُنِ تَحْمِلُ الْبَضَائِعَ|Някои кораби превозват стоки'],
  r:['ذَهَبَ مَالِكٌ وَطَارِقٌ إِلَى الْمِينَاءِ.|Малик и Тарик отидоха на пристанището.','شَاهَدَا سُفُنًا كَثِيرَةً بِأَحْجَامٍ مُخْتَلِفَةٍ.|Видяха много кораби с различни размери.','بَعْضُ السُّفُنِ تَحْمِلُ الرُّكَّابَ، وَبَعْضُهَا يَحْمِلُ الْبَضَائِعَ.|Някои превозват пътници, други – стоки.','السَّفَرُ بِالسَّفِينَةِ يَأْخُذُ وَقْتًا طَوِيلًا، وَلٰكِنَّهُ مُمْتِعٌ.|Пътуването с кораб отнема дълго време, но е приятно.']},
 {u:'Транспорт',ar:'اِقْرَأْ',t:'Прочети: пътуването някога и днес',review:true,
  w:['قَدِيمًا|qadīman|в миналото','مَاشِيًا|māshiyan|пеша','ظَهْرٌ (ج) ظُهُورٌ|ẓahrun|гръб','حَيَوَانٌ|ḥayawānun|животно','وَسِيلَةٌ (ج) وَسَائِلُ|wasīlatun|средство','بَرِّيٌّ|barriyyun|сухопътен','بَحْرِيٌّ|baḥriyyun|морски','جَوِّيٌّ|jawwiyyun|въздушен','سَرِيعٌ|sarīʿun|бърз','الْيَوْمَ|al-yawma|днес'],
  r:['كَانَ الْإِنْسَانُ قَدِيمًا يُسَافِرُ مَاشِيًا أَوْ عَلَى ظُهُورِ الْحَيَوَانَاتِ.|В миналото човек пътувал пеша или на гърба на животни.','وَكَانَتِ الرِّحْلَةُ تَأْخُذُ وَقْتًا طَوِيلًا.|И пътуването отнемало дълго време.','أَمَّا الْيَوْمَ فَهُنَاكَ وَسَائِلُ كَثِيرَةٌ لِلسَّفَرِ.|А днес има много средства за пътуване.','هُنَاكَ وَسَائِلُ بَرِّيَّةٌ كَالسَّيَّارَةِ وَالْقِطَارِ.|Има сухопътни, като колата и влака.','وَوَسَائِلُ بَحْرِيَّةٌ كَالسَّفِينَةِ، وَوَسَائِلُ جَوِّيَّةٌ كَالطَّائِرَةِ.|Морски, като кораба, и въздушни, като самолета.','صَارَ السَّفَرُ الْيَوْمَ سَهْلًا وَسَرِيعًا.|Днес пътуването стана лесно и бързо.']},
 {u:'Поща и телеграф',ar:'فِي الطَّرِيقِ إِلَى مَكْتَبِ الْبَرِيدِ',t:'По пътя към пощата',
  d:['إِبْرَاهِيمُ: مَرْحَبًا يَا سَلِيمُ.|Здравей, Салим.','سَلِيمٌ: مَرْحَبًا يَا إِبْرَاهِيمُ.|Здравей, Ибрахим.','إِبْرَاهِيمُ: أَرَاكَ تَلْبَسُ مَلَابِسَ الْخُرُوجِ. إِلَى أَيْنَ أَنْتَ ذَاهِبٌ؟|Виждам, че си облечен за излизане. Къде отиваш?','سَلِيمٌ: إِلَى مَكْتَبِ الْبَرِيدِ لِأُرْسِلَ رِسَالَةً.|До пощата, за да изпратя писмо.','إِبْرَاهِيمُ: صُنْدُوقُ الْبَرِيدِ قَرِيبٌ مِنْ هُنَا. لِمَاذَا لَا تَضَعُهَا فِيهِ؟|Пощенската кутия е близо. Защо не го пуснеш в нея?','سَلِيمٌ: لِأَنِّي أُرِيدُ أَنْ أُرْسِلَهَا بِالْبَرِيدِ الْمُسَجَّلِ.|Защото искам да го изпратя препоръчано.','إِبْرَاهِيمُ: لِمَاذَا لَا تُرْسِلُهَا بِالْبَرِيدِ الْعَادِيِّ؟|Защо не го пратиш с обикновена поща?','سَلِيمٌ: لِأَنَّ فِيهَا أَوْرَاقًا مُهِمَّةً.|Защото в него има важни документи.','إِبْرَاهِيمُ: سَأَذْهَبُ مَعَكَ، فَأَنَا أُرِيدُ أَنْ أُرْسِلَ بَرْقِيَّةً.|Ще дойда с теб, и аз искам да пратя телеграма.','سَلِيمٌ: هَيَّا بِنَا مَشْيًا عَلَى الْأَقْدَامِ.|Хайде, да вървим пеша.'],
  w:['مَكْتَبُ الْبَرِيدِ|maktabu al-barīdi|поща','صُنْدُوقُ الْبَرِيدِ|ṣundūqu al-barīdi|пощенска кутия','الْبَرِيدُ الْمُسَجَّلُ|al-barīdu al-musajjalu|препоръчана поща','الْبَرِيدُ الْعَادِيُّ|al-barīdu al-ʿādiyyu|обикновена поща','رِسَالَةٌ (ج) رَسَائِلُ|risālatun|писмо','أَرْسَلَ / يُرْسِلُ|arsala|изпрати / изпраща','وَضَعَ / يَضَعُ|waḍaʿa|сложи / слага','لَبِسَ / يَلْبَسُ|labisa|облече / облича','بَرْقِيَّةٌ|barqiyyatun|телеграма','مُهِمٌّ|muhimmun|важен','وَرَقَةٌ (ج) أَوْرَاقٌ|waraqatun|лист; документ','مَشْيًا عَلَى الْأَقْدَامِ|mashyan ʿalā al-aqdāmi|пеша','قَرِيبٌ مِنْ|qarībun min|близо до','مَرْحَبًا|marḥaban|здравей'],
  g:'„Искам да…“: أُرِيدُ أَنْ + сегашно време с окончание -a: أُرِيدُ أَنْ أُرْسِلَ. Глаголът се променя по лице: هُوَ يُرِيدُ أَنْ يُرْسِلَ, أَنْتُمْ تُرِيدُونَ أَنْ تُرْسِلُوا, هُمْ يُرِيدُونَ أَنْ يُرْسِلُوا, أَنْتُمَا تُرِيدَانِ أَنْ تُرْسِلَا.',
  s:['أَنَا أُرِيدُ أَنْ أُرْسِلَ بَرْقِيَّةً|Искам да изпратя телеграма','أَنْتُمْ تُرِيدُونَ أَنْ تُرْسِلُوا بَرْقِيَّةً|Вие искате да изпратите телеграма','هُمْ يُرِيدُونَ أَنْ يُرْسِلُوا رِسَالَةً|Те искат да изпратят писмо','أَنْتُمَا تُرِيدَانِ أَنْ تَذْهَبَا إِلَى الْبَرِيدِ|Вие двамата искате да отидете до пощата','وَصَلَ الْمُوَظَّفُ إِلَى مَكْتَبِ الْبَرِيدِ مَشْيًا|Служителят стигна до пощата пеша','صُنْدُوقُ الْبَرِيدِ قَرِيبٌ مِنْ هُنَا|Пощенската кутия е близо оттук'],
  r:['قَابَلَ إِبْرَاهِيمُ صَدِيقَهُ سَلِيمًا فِي الطَّرِيقِ.|Ибрахим срещна приятеля си Салим по пътя.','سَلِيمٌ يُرِيدُ أَنْ يُرْسِلَ رِسَالَةً بِالْبَرِيدِ الْمُسَجَّلِ إِلَى الْهِنْدِ.|Салим иска да прати препоръчано писмо до Индия.','لَمْ يَضَعِ الرِّسَالَةَ فِي الصُّنْدُوقِ لِأَنَّ فِيهَا أَوْرَاقًا مُهِمَّةً.|Не го пусна в кутията, защото в него има важни документи.','ذَهَبَ إِبْرَاهِيمُ مَعَهُ لِيُرْسِلَ بَرْقِيَّةً.|Ибрахим тръгна с него, за да прати телеграма.']},
 {u:'Поща и телеграф',ar:'فِي مَكْتَبِ الْبَرِيدِ',t:'В пощата',
  d:['سَلِيمٌ: السَّلَامُ عَلَيْكُمْ.|Здравейте.','الْمُوَظَّفُ: وَعَلَيْكُمُ السَّلَامُ. أَيَّ خِدْمَةٍ؟|Здравейте. С какво да помогна?','سَلِيمٌ: لَدَيَّ رِسَالَةٌ أُرِيدُ تَسْجِيلَهَا إِلَى الْهِنْدِ.|Имам писмо, което искам да изпратя препоръчано до Индия.','الْمُوَظَّفُ: هَاتِ الرِّسَالَةَ. هَلْ كَتَبْتَ اسْمَ الْمُرْسِلِ وَعُنْوَانَهُ عَلَى الظَّرْفِ؟|Дайте писмото. Написахте ли името и адреса на подателя на плика?','سَلِيمٌ: نَعَمْ، كَتَبْتُهُمَا عَلَى الْجَانِبِ الْآخَرِ.|Да, написах ги от другата страна.','سَلِيمٌ: كَمْ قِيمَةُ الرِّسَالَةِ الْمُسَجَّلَةِ؟|Колко струва препоръчаното писмо?','الْمُوَظَّفُ: رِيَالَانِ. خُذِ الْإِيصَالَ.|Два риала. Вземете разписката.','سَلِيمٌ: وَمِنْ أَيْنَ أَشْتَرِي الطَّوَابِعَ؟|А откъде да купя марки?','الْمُوَظَّفُ: مِنَ الشُّبَّاكِ الْمُجَاوِرِ عَلَى يَمِينِكَ.|От съседното гише вдясно от вас.','سَلِيمٌ: شُكْرًا جَزِيلًا.|Много благодаря.'],
  w:['طَابَعٌ (ج) طَوَابِعُ|ṭābaʿun|пощенска марка','ظَرْفٌ|ẓarfun|плик','الْمُرْسِلُ|al-mursilu|подателят','الْمُرْسَلُ إِلَيْهِ|al-mursalu ilayhi|получателят','عُنْوَانٌ|ʿunwānun|адрес','تَسْجِيلٌ|tasjīlun|препоръчване, регистрация','إِيصَالٌ|īṣālun|разписка','شُبَّاكٌ|shubbākun|гише; прозорец','الْمُجَاوِرُ|al-mujāwiru|съседният','قِيمَةٌ|qīmatun|стойност, цена','طَرْدٌ (ج) طُرُودٌ|ṭardun|колет','لَدَيَّ|ladayya|имам','الْجَانِبُ الْآخَرُ|al-jānibu al-ākharu|другата страна','عَلَى يَمِينِكَ|ʿalā yamīnika|вдясно от теб','الْمَرْكَزِيُّ|al-markaziyyu|централният'],
  g:'„Имам“ може да се каже и с لَدَيَّ: لَدَيَّ رِسَالَةٌ = عِنْدِي رِسَالَةٌ. Местоимението-окончание замества съществително: أُرِيدُ إِرْسَالَ الرِّسَالَةِ → أُرِيدُ إِرْسَالَهَا „искам да го изпратя“.',
  s:['لَدَيَّ رِسَالَةٌ أُرِيدُ إِرْسَالَهَا|Имам писмо, което искам да изпратя','لَدَيَّ طَرْدٌ أُرِيدُ تَسْجِيلَهُ|Имам колет, който искам да изпратя препоръчано','كَمْ قِيمَةُ الرِّسَالَةِ الْمُسَجَّلَةِ؟|Колко струва препоръчаното писмо?','اُكْتُبِ اسْمَ الْمُرْسِلِ عَلَى الظَّرْفِ|Напиши името на подателя на плика','ضَعِ الطَّابَعَ عَلَى الْجَانِبِ الْأَعْلَى|Сложи марката горе','اشْتَرَيْتُ الطَّوَابِعَ مِنَ الشُّبَّاكِ الْمُجَاوِرِ|Купих марките от съседното гише'],
  r:['وَصَلَ سَلِيمٌ وَإِبْرَاهِيمُ إِلَى مَكْتَبِ الْبَرِيدِ الْمَرْكَزِيِّ.|Салим и Ибрахим стигнаха до централната поща.','طَلَبَ سَلِيمٌ مِنَ الْمُوَظَّفِ أَنْ يُسَجِّلَ رِسَالَتَهُ.|Салим помоли служителя да изпрати писмото му препоръчано.','دَفَعَ قِيمَةَ التَّسْجِيلِ وَأَخَذَ الْإِيصَالَ.|Плати таксата и взе разписката.','ثُمَّ اشْتَرَى طَوَابِعَ بِخَمْسَةِ رِيَالَاتٍ.|После купи марки за пет риала.']},
 {u:'Поща и телеграф',ar:'فِي مَكْتَبِ الْبَرْقِيَّاتِ',t:'В телеграфа',
  d:['إِبْرَاهِيمُ: مِنْ فَضْلِكَ، أَيْنَ مَكْتَبُ الْبَرْقِيَّاتِ؟|Моля, къде е телеграфът?','الْمُوَظَّفُ الْأَوَّلُ: أَمَامَ مَكْتَبِ الطُّرُودِ عَلَى الْيَسَارِ.|Срещу гишето за колети, вляво.','إِبْرَاهِيمُ: أُرِيدُ أَنْ أُرْسِلَ بَرْقِيَّةً إِلَى الْقَاهِرَةِ.|Искам да изпратя телеграма до Кайро.','الْمُوَظَّفُ الثَّانِي: هَلْ هِيَ بَرْقِيَّةٌ عَادِيَّةٌ أَمْ مُسْتَعْجِلَةٌ؟|Обикновена ли е, или спешна?','إِبْرَاهِيمُ: بَرْقِيَّةٌ عَادِيَّةٌ.|Обикновена.','الْمُوَظَّفُ الثَّانِي: خُذْ هٰذِهِ الْوَرَقَةَ الْبَيْضَاءَ وَامْلَأِ الْبَيَانَاتِ كَامِلَةً.|Вземете този бял формуляр и попълнете всички данни.','إِبْرَاهِيمُ: هَلْ أَكْتُبُ اسْمِي أَيْضًا؟|Да напиша ли и моето име?','الْمُوَظَّفُ الثَّانِي: نَعَمْ، اكْتُبِ اسْمَ الْمُرْسِلِ وَاسْمَ الْمُرْسَلِ إِلَيْهِ وَعُنْوَانَهُ.|Да, напишете името на подателя, на получателя и адреса му.','إِبْرَاهِيمُ: شُكْرًا، مَعَ السَّلَامَةِ.|Благодаря, довиждане.'],
  w:['مَكْتَبُ الْبَرْقِيَّاتِ|maktabu al-barqiyyāti|телеграф','بَرْقِيَّةٌ عَادِيَّةٌ|barqiyyatun ʿādiyyatun|обикновена телеграма','مُسْتَعْجِلٌ|mustaʿjilun|спешен','الْبَيَانَاتُ|al-bayānātu|данните','كَامِلٌ|kāmilun|пълен, цял','أَبْيَضُ / بَيْضَاءُ|abyaḍu / bayḍāʾu|бял / бяла','أَمَامَ|amāma|пред, срещу','خَلْفَ|khalfa|зад','تَحْتَ|taḥta|под','فَوْقَ|fawqa|над, върху','يَمِينٌ / يَسَارٌ|yamīnun / yasārun|дясно / ляво','أَشَارَ / يُشِيرُ|ashāra|посочи / посочва','الْقَاهِرَةُ|al-qāhiratu|Кайро'],
  g:'Предлози за място: أَمَامَ „пред“, خَلْفَ „зад“, فَوْقَ „над“, تَحْتَ „под“, عَلَى الْيَمِينِ „вдясно“, عَلَى الْيَسَارِ „вляво“. След тях съществителното е в родителен падеж: تَحْتَ الْمَقْعَدِ.',
  s:['ضَعِ الْكِتَابَ تَحْتَ الْمَقْعَدِ|Сложи книгата под чина','ضَعِ الطَّرْدَ فَوْقَ الرَّفِّ|Сложи колета на рафта','ضَعِ الْكُرْسِيَّ خَلْفَ الْبَابِ|Сложи стола зад вратата','ضَعِ الدَّفْتَرَ أَمَامَ الْمُدَرِّسِ|Сложи тетрадката пред учителя','مَكْتَبُ الْبَرْقِيَّاتِ عَلَى الْيَسَارِ|Телеграфът е вляво','أَشَارَ الْمُوَظَّفُ إِلَى الشُّبَّاكِ|Служителят посочи гишето'],
  r:['سَأَلَ إِبْرَاهِيمُ الْمُوَظَّفَ عَنْ مَكْتَبِ الْبَرْقِيَّاتِ.|Ибрахим попита служителя за телеграфа.','أَشَارَ الْمُوَظَّفُ إِلَى أَنَّهُ أَمَامَ مَكْتَبِ الطُّرُودِ.|Служителят посочи, че е срещу гишето за колети.','أَخَذَ إِبْرَاهِيمُ وَرَقَةً بَيْضَاءَ وَمَلَأَ الْبَيَانَاتِ.|Ибрахим взе бял формуляр и попълни данните.','ثُمَّ أَرْسَلَ الْبَرْقِيَّةَ إِلَى صَدِيقِهِ فِي الْقَاهِرَةِ.|После изпрати телеграмата на приятеля си в Кайро.']},
 {u:'В болницата',ar:'عُمَرُ مَرِيضٌ',t:'Омар е болен',
  d:['عُثْمَانُ: أَهْلًا يَا عَلِيُّ، أَيْنَ صَدِيقُكَ عُمَرُ؟|Здравей, Али, къде е приятелят ти Омар?','عَلِيٌّ: عُمَرُ مَرِيضٌ.|Омар е болен.','عُثْمَانُ: مَتَى حَدَثَ ذٰلِكَ؟|Кога стана това?','عَلِيٌّ: كَانَ عُمَرُ يَجْلِسُ مَعَنَا أَمْسِ، وَفِي مُنْتَصَفِ اللَّيْلِ شَعَرَ بِأَلَمٍ شَدِيدٍ فِي بَطْنِهِ.|Вчера Омар седеше с нас, а в полунощ го заболя силно коремът.','عُثْمَانُ: وَهَلْ ذَهَبْتُمْ بِهِ إِلَى الطَّبِيبِ؟|Заведохте ли го на лекар?','عَلِيٌّ: اتَّصَلْنَا بِالْإِسْعَافِ هَاتِفِيًّا، فَأَخَذَتْهُ إِلَى الطَّبِيبِ.|Обадихме се на линейката по телефона и тя го закара на лекар.','عُثْمَانُ: مَاذَا قَالَ الطَّبِيبُ؟|Какво каза лекарят?','عَلِيٌّ: فَحَصَهُ وَأَعْطَاهُ دَوَاءً.|Прегледа го и му даде лекарство.','عُثْمَانُ: شَفَاهُ اللّٰهُ.|Бог да го изцери.'],
  w:['مَرِيضٌ|marīḍun|болен','مَرَضٌ|maraḍun|болест','أَلَمٌ|alamun|болка','شَدِيدٌ|shadīdun|силен','بَطْنٌ|baṭnun|корем','رَأْسٌ|raʾsun|глава','شَعَرَ / يَشْعُرُ بِـ|shaʿara|почувства / чувства','حَدَثَ / يَحْدُثُ|ḥadatha|случи се','مُنْتَصَفُ اللَّيْلِ|muntaṣafu al-layli|полунощ','الْإِسْعَافُ|al-isʿāfu|линейката, бърза помощ','اتَّصَلَ / يَتَّصِلُ بِـ|ittaṣala|обади се на','هَاتِفِيًّا|hātifiyyan|по телефона','فَحَصَ / يَفْحَصُ|faḥaṣa|прегледа','دَوَاءٌ (ج) أَدْوِيَةٌ|dawāʾun|лекарство','أَمْسِ|amsi|вчера'],
  g:'„Беше (правеше)…“ за продължително действие в миналото: كَانَ + сегашно време: كَانَ عُمَرُ يَجْلِسُ مَعَنَا „Омар седеше с нас“, كَانَ إِبْرَاهِيمُ يَتَكَلَّمُ بِالْهَاتِفِ „Ибрахим говореше по телефона“.',
  s:['كَانَ عُمَرُ يَجْلِسُ مَعَنَا|Омар седеше с нас','كَانَ إِبْرَاهِيمُ يَتَكَلَّمُ بِالْهَاتِفِ|Ибрахим говореше по телефона','كَانَ سَلِيمٌ يَكْتُبُ الدَّرْسَ|Салим пишеше урока','كَانَ مُحَمَّدٌ يَقْرَأُ فِي الْمَكْتَبَةِ|Мохамед четеше в библиотеката','شَعَرَ عُمَرُ بِأَلَمٍ فِي رَأْسِهِ|Омар почувства болка в главата си','اتَّصَلْنَا بِالْإِسْعَافِ هَاتِفِيًّا|Обадихме се на бърза помощ по телефона'],
  r:['كَانَ عُمَرُ يَجْلِسُ مَعَ أَصْدِقَائِهِ فِي السَّكَنِ.|Омар седеше с приятелите си в общежитието.','فِي مُنْتَصَفِ اللَّيْلِ شَعَرَ بِأَلَمٍ شَدِيدٍ.|В полунощ почувства силна болка.','اتَّصَلَ عَلِيٌّ بِالْإِسْعَافِ، فَجَاءَتْ سَيَّارَةُ الْإِسْعَافِ بِسُرْعَةٍ.|Али се обади на бърза помощ и линейката дойде бързо.','فَحَصَ الطَّبِيبُ عُمَرَ وَأَعْطَاهُ دَوَاءً.|Лекарят прегледа Омар и му даде лекарство.']},
 {u:'В болницата',ar:'عُمَرُ يَلْزَمُ سَرِيرَ الْمُسْتَشْفَى',t:'Омар остава на легло в болницата',
  d:['عُثْمَانُ: مَاذَا قَرَّرَ الطَّبِيبُ لِعُمَرَ أَمْسِ؟|Какво реши лекарят за Омар вчера?','عَلِيٌّ: فَحَصَهُ وَحَوَّلَهُ إِلَى الْمُسْتَشْفَى.|Прегледа го и го насочи към болницата.','عُثْمَانُ: وَهَلْ رَجَعَ إِلَى السَّكَنِ؟|Върна ли се в общежитието?','عَلِيٌّ: لَا، فَقَدْ لَزِمَ سَرِيرَ الْمُسْتَشْفَى.|Не, остана на легло в болницата.','عُثْمَانُ: فِي أَيِّ قِسْمٍ هُوَ؟|В кое отделение е?','عَلِيٌّ: فِي قِسْمِ الْبَاطِنِيَّةِ، فِي الطَّابِقِ الثَّالِثِ، الْحُجْرَةِ الرَّابِعَةِ.|Във вътрешното отделение, на третия етаж, стая четири.','عُثْمَانُ: مَتَى مَوْعِدُ الزِّيَارَةِ؟|Кога са часовете за посещение?','عَلِيٌّ: مِنَ السَّاعَةِ الرَّابِعَةِ إِلَى السَّاعَةِ السَّادِسَةِ مَسَاءً.|От четири до шест вечерта.','عُثْمَانُ: سَنَزُورُهُ الْيَوْمَ إِنْ شَاءَ اللّٰهُ.|Ще го посетим днес, ако е рекъл Бог.'],
  w:['مُسْتَشْفًى (ج) مُسْتَشْفَيَاتٌ|mustashfan|болница','لَزِمَ / يَلْزَمُ السَّرِيرَ|lazima as-sarīra|остана / остава на легло','قَرَّرَ / يُقَرِّرُ|qarrara|реши / решава','حَوَّلَ / يُحَوِّلُ|ḥawwala|насочи, прехвърли','رَجَعَ / يَرْجِعُ|rajaʿa|върна се','قِسْمٌ (ج) أَقْسَامٌ|qismun|отделение','قِسْمُ الْبَاطِنِيَّةِ|qismu al-bāṭiniyyati|вътрешно отделение','الطَّابِقُ|aṭ-ṭābiqu|етажът','مَوْعِدُ الزِّيَارَةِ|mawʿidu az-ziyārati|час за посещение','مُمَرِّضٌ / مُمَرِّضَةٌ|mumarriḍun|медицински брат / сестра','رَاحَةٌ|rāḥatun|почивка','مَسَاءً|masāʾan|вечерта','زَارَ / يَزُورُ|zāra|посети / посещава'],
  g:'Поредни числителни: الْأَوَّلُ, الثَّانِي, الثَّالِثُ, الرَّابِعُ, الْخَامِسُ, السَّادِسُ. Съгласуват се по род: الطَّابِقُ الثَّالِثُ (м.р.), الْحُجْرَةُ الرَّابِعَةُ (ж.р.).',
  s:['حَوَّلَ الطَّبِيبُ عُمَرَ إِلَى الْمُسْتَشْفَى|Лекарят насочи Омар към болницата','يُحَوِّلُ الطَّبِيبُ الْمَرِيضَ إِلَى الْمُسْتَشْفَى|Лекарят насочва болния към болницата','عُمَرُ فِي الطَّابِقِ الثَّالِثِ|Омар е на третия етаж','الْحُجْرَةُ الرَّابِعَةُ عَلَى الْيَمِينِ|Четвърта стая е вдясно','لَزِمَ الْمَرِيضُ السَّرِيرَ ثَلَاثَةَ أَيَّامٍ|Болният остана на легло три дни','سَنَزُورُ عُمَرَ فِي الْمَسَاءِ|Ще посетим Омар вечерта'],
  r:['قَرَّرَ الطَّبِيبُ أَنْ يَلْزَمَ عُمَرُ سَرِيرَ الْمُسْتَشْفَى.|Лекарят реши Омар да остане на легло в болницата.','عُمَرُ الْآنَ فِي قِسْمِ الْبَاطِنِيَّةِ فِي الطَّابِقِ الثَّالِثِ.|Сега Омар е във вътрешното отделение на третия етаж.','الْمُمَرِّضَةُ تُعْطِيهِ الدَّوَاءَ فِي مَوْعِدِهِ.|Сестрата му дава лекарството навреме.','يُرِيدُ أَصْدِقَاؤُهُ أَنْ يَزُورُوهُ فِي الْمَسَاءِ.|Приятелите му искат да го посетят вечерта.']},
 {u:'В болницата',ar:'زِيَارَةُ عُمَرَ بِالْمُسْتَشْفَى',t:'Посещение при Омар в болницата',
  d:['عُثْمَانُ: السَّلَامُ عَلَيْكُمْ يَا عُمَرُ. سَلَامَتُكَ!|Здравей, Омар. Оздравявай!','عُمَرُ: وَعَلَيْكُمُ السَّلَامُ. اللّٰهُ يُسَلِّمُكَ.|Здравей. Бог да те пази.','عُثْمَانُ: كَيْفَ صِحَّتُكَ الْآنَ؟|Как е здравето ти сега?','عُمَرُ: أَنَا أَحْسَنُ الْآنَ، وَالْحَمْدُ لِلّٰهِ.|По-добре съм сега, слава на Бога.','عُثْمَانُ: هَلْ أَجْرَيْتَ بَعْضَ التَّحَالِيلِ؟|Направи ли някакви изследвания?','عُمَرُ: نَعَمْ، وَظَهَرَتْ عِنْدِي مَلَارِيَا فِي الدَّمِ.|Да, и се оказа, че имам малария в кръвта.','عُثْمَانُ: وَأَيَّ دَوَاءٍ قَرَّرَ الطَّبِيبُ؟|И какво лекарство назначи лекарят?','عُمَرُ: حُبُوبًا وَحُقْنَةً.|Хапчета и инжекция.','عُثْمَانُ: وَكَيْفَ تَسْتَعْمِلُهَا؟|И как ги приемаш?','عُمَرُ: آخُذُ حَبَّتَيْنِ ثَلَاثَ مَرَّاتٍ يَوْمِيًّا، وَحُقْنَةً وَاحِدَةً كُلَّ يَوْمٍ.|Вземам по две хапчета три пъти дневно и по една инжекция всеки ден.','عُثْمَانُ: شَفَاكَ اللّٰهُ. هٰذِهِ هَدِيَّةٌ صَغِيرَةٌ لَكَ.|Бог да те изцери. Това е малък подарък за теб.'],
  w:['زِيَارَةٌ|ziyāratun|посещение','سَلَامَتُكَ|salāmatuka|оздравявай!','صِحَّةٌ|ṣiḥḥatun|здраве','أَحْسَنُ|aḥsanu|по-добре','تَحْلِيلٌ (ج) تَحَالِيلُ|taḥlīlun|изследване','أَجْرَى / يُجْرِي|ajrā|направи (изследване)','ظَهَرَ / يَظْهَرُ|ẓahara|появи се, оказа се','الدَّمُ|ad-damu|кръвта','حَبَّةٌ (ج) حُبُوبٌ|ḥabbatun|хапче','حُقْنَةٌ|ḥuqnatun|инжекция','اسْتَعْمَلَ / يَسْتَعْمِلُ|istaʿmala|използва, приема','مَرَّةٌ (ج) مَرَّاتٌ|marratun|път (пъти)','يَوْمِيًّا|yawmiyyan|дневно','شَفَاكَ اللّٰهُ|shafāka allāhu|Бог да те изцери','هَدِيَّةٌ|hadiyyatun|подарък'],
  g:'Двойствено число: прибавя се ـَانِ (именителен) или ـَيْنِ (след глагол или предлог): حَبَّةٌ → حَبَّتَانِ / حَبَّتَيْنِ „две хапчета“, رِيَالٌ → رِيَالَانِ „два риала“. Честота: ثَلَاثَ مَرَّاتٍ يَوْمِيًّا „три пъти дневно“.',
  s:['آخُذُ حَبَّتَيْنِ ثَلَاثَ مَرَّاتٍ يَوْمِيًّا|Вземам две хапчета три пъти дневно','أَنَا أَحْسَنُ الْآنَ وَالْحَمْدُ لِلّٰهِ|Сега съм по-добре, слава на Бога','أَجْرَى الْمَرِيضُ بَعْضَ التَّحَالِيلِ|Болният направи някои изследвания','ظَهَرَتْ عِنْدَهُ مَلَارِيَا فِي الدَّمِ|Оказа се, че има малария в кръвта','قِيمَةُ الدَّوَاءِ رِيَالَانِ|Лекарството струва два риала','زُرْنَا عُمَرَ فِي الْمُسْتَشْفَى|Посетихме Омар в болницата'],
  r:['زَارَ عُثْمَانُ وَعَلِيٌّ صَدِيقَهُمَا عُمَرَ فِي الْمُسْتَشْفَى.|Осман и Али посетиха приятеля си Омар в болницата.','وَجَدَاهُ أَحْسَنَ مِنْ أَمْسِ.|Намериха го по-добре от вчера.','أَخْبَرَهُمَا أَنَّ التَّحَالِيلَ أَظْهَرَتْ مَلَارِيَا.|Той им каза, че изследванията са показали малария.','أَعْطَاهُ عُثْمَانُ هَدِيَّةً وَدَعَا لَهُ بِالشِّفَاءِ.|Осман му даде подарък и му пожела оздравяване.']},
 {u:'В болницата',ar:'اِقْرَأْ',t:'Прочети: в болницата',review:true,
  w:['عِلَاجٌ|ʿilājun|лечение','قِسْمُ الْعُيُونِ|qismu al-ʿuyūni|очно отделение','عَمَلِيَّةٌ جِرَاحِيَّةٌ|ʿamaliyyatun jirāḥiyyatun|хирургическа операция','مُصَابٌ بِـ|muṣābun bi|болен от','صَيْدَلِيَّةٌ|ṣaydaliyyatun|аптека','يَشْكُو مِنْ|yashkū min|оплаква се от','بِإِذْنِ اللّٰهِ|bi-idhni allāhi|с позволението на Бога','عَيْنٌ (ج) عُيُونٌ|ʿaynun|око'],
  r:['فِي الْمُسْتَشْفَى يَجِدُ الْإِنْسَانُ عِلَاجًا مِنَ الْمَرَضِ بِإِذْنِ اللّٰهِ.|В болницата човек намира лечение от болестта, с позволението на Бога.','مَنْ يَشْعُرُ بِأَلَمٍ فِي بَطْنِهِ يَذْهَبُ إِلَى قِسْمِ الْبَاطِنِيَّةِ.|Който го боли коремът, отива във вътрешното отделение.','وَمَنْ يَشْكُو مِنْ أَلَمٍ فِي عَيْنَيْهِ يَذْهَبُ إِلَى قِسْمِ الْعُيُونِ.|Който се оплаква от болка в очите, отива в очното отделение.','وَإِذَا قَرَّرَ الطَّبِيبُ عَمَلِيَّةً جِرَاحِيَّةً، يَذْهَبُ الْمَرِيضُ إِلَى قِسْمِ الْعَمَلِيَّاتِ.|Ако лекарят реши операция, болният отива в хирургията.','قَدْ تُظْهِرُ التَّحَالِيلُ أَنَّ الْمَرِيضَ مُصَابٌ بِمَرَضٍ فِي الدَّمِ.|Изследванията може да покажат, че болният има болест на кръвта.','وَيَأْخُذُ الْمَرِيضُ الدَّوَاءَ مِنْ صَيْدَلِيَّةِ الْمُسْتَشْفَى.|А болният взема лекарството от аптеката на болницата.']},
 {u:'В хотела',ar:'السُّؤَالُ عَنِ الْفُنْدُقِ',t:'Въпрос за хотел',
  d:['خَالِدٌ: مِنْ فَضْلِكَ، هَلْ تَعْرِفُ فُنْدُقًا مُنَاسِبًا قَرِيبًا مِنْ هُنَا؟|Моля, знаете ли подходящ хотел наблизо?','الرَّجُلُ: نَعَمْ، فُنْدُقُ الصَّدَاقَةِ. هُوَ الْفُنْدُقُ الَّذِي أَمَامَ الْمَسْجِدِ.|Да, хотел „Приятелство“. Това е хотелът срещу джамията.','خَالِدٌ: هَلْ هُوَ غَالٍ؟|Скъп ли е?','الرَّجُلُ: لَا، أُجْرَتُهُ مُنَاسِبَةٌ، وَغُرَفُهُ وَاسِعَةٌ وَنَظِيفَةٌ.|Не, цената му е подходяща, а стаите са просторни и чисти.','خَالِدٌ: وَكَيْفَ أَصِلُ إِلَيْهِ؟|А как да стигна до него?','الرَّجُلُ: يُمْكِنُكَ أَنْ تَرْكَبَ الْحَافِلَةَ الَّتِي تَمُرُّ أَمَامَ الْفُنْدُقِ.|Можете да се качите на автобуса, който минава пред хотела.','خَالِدٌ: حَقًّا؟ إِذَنْ هَيَّا أَذْهَبْ إِلَيْهِ الْآنَ. شُكْرًا.|Наистина? Тогава ще отида веднага. Благодаря.'],
  w:['فُنْدُقٌ (ج) فَنَادِقُ|funduqun|хотел','مُنَاسِبٌ|munāsibun|подходящ','وَاسِعٌ|wāsiʿun|просторен','نَظِيفٌ|naẓīfun|чист','غَالٍ|ghālin|скъп','رَخِيصٌ|rakhīṣun|евтин','الَّذِي / الَّتِي|alladhī / allatī|който / която','مَرَّ / يَمُرُّ|marra|мина / минава','بِجِوَارِ|bijiwāri|до, в съседство с','وَسَطُ الْمَدِينَةِ|wasaṭu al-madīnati|центърът на града','حَقًّا|ḥaqqan|наистина','الصَّدَاقَةُ|aṣ-ṣadāqatu|приятелството'],
  g:'Относителни местоимения: الَّذِي (м.р.) и الَّتِي (ж.р.) „който/която“: هٰذَا هُوَ الطَّبِيبُ الَّذِي يُعَالِجُ الْمَرِيضَ, هٰذِهِ هِيَ الدَّرَّاجَةُ الَّتِي تُنَاسِبُ الطُّلَّابَ. С тях две изречения стават едно.',
  s:['ذَهَبَ مُحَمَّدٌ إِلَى مَكْتَبِ الْبَرِيدِ الَّذِي بِجِوَارِ الْمَعْهَدِ|Мохамед отиде в пощата, която е до института','ذَهَبَ إِبْرَاهِيمُ إِلَى الْمَكْتَبَةِ الَّتِي بِجِوَارِ الْجَامِعَةِ|Ибрахим отиде в библиотеката до университета','هٰذَا هُوَ الطَّبِيبُ الَّذِي يُعَالِجُ الْمَرِيضَ|Това е лекарят, който лекува болния','هٰذَا هُوَ الْمُهَنْدِسُ الَّذِي يَرْسُمُ الْخَرِيطَةَ|Това е инженерът, който чертае картата','اشْتَرَيْتُ مِنَ الْبَقَّالَةِ الَّتِي أَمَامَ الْمَوْقِفِ|Купих от бакалията срещу спирката','غُرَفُ الْفُنْدُقِ وَاسِعَةٌ وَنَظِيفَةٌ|Стаите на хотела са просторни и чисти'],
  r:['وَصَلَ خَالِدٌ إِلَى مَدِينَةٍ جَدِيدَةٍ وَأَرَادَ فُنْدُقًا.|Халид пристигна в нов град и търсеше хотел.','سَأَلَ رَجُلًا فِي الشَّارِعِ عَنْ فُنْدُقٍ مُنَاسِبٍ.|Попита един мъж на улицата за подходящ хотел.','دَلَّهُ الرَّجُلُ عَلَى فُنْدُقِ الصَّدَاقَةِ الَّذِي أَمَامَ الْمَسْجِدِ.|Мъжът го упъти към хотел „Приятелство“ срещу джамията.','رَكِبَ خَالِدٌ الْحَافِلَةَ الَّتِي تَمُرُّ أَمَامَ الْفُنْدُقِ.|Халид се качи на автобуса, който минава пред хотела.']},
 {u:'В хотела',ar:'فِي الْفُنْدُقِ',t:'В хотела',
  d:['خَالِدٌ: أَيْنَ مَكْتَبُ الِاسْتِقْبَالِ مِنْ فَضْلِكَ؟|Къде е рецепцията, моля?','الْمُوَظَّفُ: هُنَا. أَهْلًا وَسَهْلًا، أَيَّ خِدْمَةٍ؟|Тук. Добре дошли, с какво да помогна?','خَالِدٌ: أُرِيدُ غُرْفَةً لِشَخْصٍ وَاحِدٍ لِمُدَّةِ ثَلَاثِ لَيَالٍ.|Искам единична стая за три нощи.','الْمُوَظَّفُ: الْأُجْرَةُ مِئَةُ رِيَالٍ لِلَّيْلَةِ، وَالدَّفْعُ مُقَدَّمًا.|Цената е сто риала на нощ, плащането е предварително.','خَالِدٌ: لَا بَأْسَ. تَفَضَّلْ.|Няма проблем. Заповядайте.','الْمُوَظَّفُ: لَوْ سَمَحْتَ، الْبِطَاقَةَ الشَّخْصِيَّةَ.|Личната карта, моля.','خَالِدٌ: تَفَضَّلْ.|Заповядайте.','الْمُوَظَّفُ: رَقْمُ غُرْفَتِكَ ثَلَاثَةٌ وَعِشْرُونَ، فِي الطَّابِقِ الْحَادِي عَشَرَ. هٰذَا هُوَ الْمِفْتَاحُ.|Стаята ви е номер двадесет и три, на единадесетия етаж. Ето ключа.','خَالِدٌ: أَيْنَ الْمِصْعَدُ؟|Къде е асансьорът?','الْمُوَظَّفُ: عَلَى يَسَارِكَ.|Вляво от вас.'],
  w:['مَكْتَبُ الِاسْتِقْبَالِ|maktabu al-istiqbāli|рецепция','غُرْفَةٌ (ج) غُرَفٌ|ghurfatun|стая','لِشَخْصٍ وَاحِدٍ|li-shakhṣin wāḥidin|за един човек','لَيْلَةٌ (ج) لَيَالٍ|laylatun|нощ, нощувка','مُدَّةٌ|muddatun|срок, период','مِئَةٌ|miʾatun|сто','مُقَدَّمًا|muqaddaman|предварително','الْبِطَاقَةُ الشَّخْصِيَّةُ|al-biṭāqatu ash-shakhṣiyyatu|лична карта','رَقْمٌ|raqmun|номер','الطَّابِقُ الْحَادِي عَشَرَ|aṭ-ṭābiqu al-ḥādī ʿashara|единадесетият етаж','مِفْتَاحٌ|miftāḥun|ключ','الْمِصْعَدُ|al-miṣʿadu|асансьорът','لَا بَأْسَ|lā baʾsa|няма проблем','خِدْمَةٌ|khidmatun|услуга'],
  g:'„Колко?“ с كَمْ: съществителното след него е в единствено число и винителен падеж: كَمْ غُرْفَةً فِي الْفُنْدُقِ؟ „Колко стаи има в хотела?“, كَمْ طَالِبَةً فِي الْفَصْلِ؟',
  s:['كَمْ غُرْفَةً فِي الْفُنْدُقِ؟|Колко стаи има в хотела?','كَمْ مُمَرِّضَةً فِي الْمُسْتَشْفَى؟|Колко медицински сестри има в болницата?','كَمْ طَالِبَةً فِي الْفَصْلِ؟|Колко ученички има в класа?','كَمْ حَافِلَةً فِي الْمَوْقِفِ؟|Колко автобуса има на спирката?','يَسْكُنُ سَلِيمٌ فِي الطَّابِقِ الثَّانِي عَشَرَ|Салим живее на дванадесетия етаж','الدَّفْعُ مُقَدَّمًا مِنْ فَضْلِكَ|Плащането е предварително, моля'],
  r:['فَضَّلَ خَالِدٌ فُنْدُقَ الصَّدَاقَةِ لِأَنَّ غُرَفَهُ وَاسِعَةٌ وَأُجْرَتَهُ مُنَاسِبَةٌ.|Халид предпочете хотел „Приятелство“, защото стаите са просторни, а цената подходяща.','قَابَلَ مُوَظَّفَ الِاسْتِقْبَالِ وَطَلَبَ غُرْفَةً لِشَخْصٍ وَاحِدٍ.|Срещна рецепциониста и поиска единична стая.','دَفَعَ الْأُجْرَةَ مُقَدَّمًا وَأَعْطَاهُ بِطَاقَتَهُ الشَّخْصِيَّةَ.|Плати предварително и му даде личната си карта.','أَخَذَ الْمِفْتَاحَ وَصَعِدَ بِالْمِصْعَدِ إِلَى غُرْفَتِهِ.|Взе ключа и се качи с асансьора до стаята си.']},
 {u:'В хотела',ar:'مُغَادَرَةُ الْفُنْدُقِ',t:'Напускане на хотела',
  d:['خَالِدٌ: كَمِ السَّاعَةُ الْآنَ؟|Колко е часът сега?','الْمُوَظَّفُ: السَّاعَةُ الْآنَ التَّاسِعَةُ وَالنِّصْفُ.|Сега е девет и половина.','خَالِدٌ: سَأُغَادِرُ الْفُنْدُقَ فِي السَّاعَةِ الْعَاشِرَةِ تَمَامًا. هَلْ جَهَّزْتَ فَاتُورَةَ الْحِسَابِ؟|Ще напусна хотела точно в десет. Приготвихте ли сметката?','الْمُوَظَّفُ: بَعْدَ عَشْرِ دَقَائِقَ مِنَ الْآنَ.|След десет минути.','الْمُوَظَّفُ: هَا هِيَ الْفَاتُورَةُ. أَرْجُو أَنْ يَكُونَ الْفُنْدُقُ قَدْ أَعْجَبَكَ.|Ето сметката. Надявам се хотелът да ви е харесал.','خَالِدٌ: لَقَدْ أَعْجَبَنِي كَثِيرًا، فَالْخِدْمَةُ فِيهِ مُمْتَازَةٌ.|Много ми хареса, обслужването е отлично.','الْمُوَظَّفُ: فُرْصَةٌ سَعِيدَةٌ، نَرْجُو أَنْ نَرَاكَ مَرَّةً أُخْرَى.|Беше ни приятно, надяваме се да ви видим пак.','خَالِدٌ: إِنْ شَاءَ اللّٰهُ. مَعَ السَّلَامَةِ.|Ако е рекъл Бог. Довиждане.'],
  w:['غَادَرَ / يُغَادِرُ|ghādara|напусна / напуска','فَاتُورَةُ الْحِسَابِ|fātūratu al-ḥisābi|сметката','جَهَّزَ / يُجَهِّزُ|jahhaza|приготви','دَقِيقَةٌ (ج) دَقَائِقُ|daqīqatun|минута','تَمَامًا|tamāman|точно','وَالنِّصْفُ|wa-n-niṣfu|и половина','وَالرُّبْعُ|wa-r-rubʿu|и четвърт','إِلَّا رُبْعًا|illā rubʿan|без четвърт','أَعْجَبَ / يُعْجِبُ|aʿjaba|хареса / харесва','مُمْتَازٌ|mumtāzun|отличен','أَرْجُو|arjū|надявам се; моля','فُرْصَةٌ سَعِيدَةٌ|furṣatun saʿīdatun|приятно ми беше','مَرَّةً أُخْرَى|marratan ukhrā|още веднъж'],
  g:'Часът: كَمِ السَّاعَةُ؟ „Колко е часът?“ – السَّاعَةُ الْخَامِسَةُ تَمَامًا „точно пет“, السَّاعَةُ الْخَامِسَةُ وَالرُّبْعُ „пет и четвърт“, وَالنِّصْفُ „и половина“, إِلَّا رُبْعًا „без четвърт“.',
  s:['السَّاعَةُ الْآنَ الْخَامِسَةُ تَمَامًا|Сега е точно пет часа','السَّاعَةُ الْآنَ السَّابِعَةُ وَالنِّصْفُ|Сега е седем и половина','السَّاعَةُ الْآنَ الثَّامِنَةُ وَالرُّبْعُ|Сега е осем и четвърт','السَّاعَةُ الْآنَ الْعَاشِرَةُ إِلَّا رُبْعًا|Сега е десет без четвърт','غَادَرَ خَالِدٌ الْفُنْدُقَ فِي السَّاعَةِ الْعَاشِرَةِ|Халид напусна хотела в десет часа','الْخِدْمَةُ فِي الْفُنْدُقِ مُمْتَازَةٌ|Обслужването в хотела е отлично'],
  r:['أَرَادَ خَالِدٌ أَنْ يُغَادِرَ الْفُنْدُقَ فِي السَّاعَةِ الْعَاشِرَةِ.|Халид искаше да напусне хотела в десет часа.','طَلَبَ مِنَ الْمُوَظَّفِ أَنْ يُجَهِّزَ فَاتُورَةَ الْحِسَابِ.|Помоли служителя да приготви сметката.','دَفَعَ الْحِسَابَ وَشَكَرَ الْمُوَظَّفَ.|Плати сметката и благодари на служителя.','قَالَ لَهُ الْمُوَظَّفُ: نَرْجُو أَنْ نَرَاكَ مَرَّةً أُخْرَى.|Служителят му каза: Надяваме се да ви видим пак.']},
 {u:'В хотела',ar:'اِقْرَأْ',t:'Прочети: хотелите',review:true,
  w:['الدَّرَجَةُ الْأُولَى|ad-darajatu al-ūlā|първа категория','نَزَلَ / يَنْزِلُ فِي|nazala|отседна / отсяда','مَطْعَمٌ|maṭʿamun|ресторант','مُرِيحٌ|murīḥun|удобен','الْفَرْقُ بَيْنَ|al-farqu bayna|разликата между','نَزِيلٌ|nazīlun|гост на хотел'],
  r:['فِي الْمُدُنِ الْكَبِيرَةِ فَنَادِقُ كَثِيرَةٌ.|В големите градове има много хотели.','بَعْضُهَا مِنَ الدَّرَجَةِ الْأُولَى، وَبَعْضُهَا مِنَ الدَّرَجَةِ الثَّانِيَةِ.|Някои са първа категория, други – втора.','فَنَادِقُ الدَّرَجَةِ الْأُولَى غَالِيَةٌ، وَلٰكِنَّهَا مُرِيحَةٌ جِدًّا.|Хотелите първа категория са скъпи, но много удобни.','فِي الْفُنْدُقِ مَطْعَمٌ وَمِصْعَدٌ وَمَكْتَبٌ لِلِاسْتِقْبَالِ.|В хотела има ресторант, асансьор и рецепция.','يَطْلُبُ مُوَظَّفُ الِاسْتِقْبَالِ الْبِطَاقَةَ الشَّخْصِيَّةَ مِنْ كُلِّ نَزِيلٍ.|Рецепционистът иска лична карта от всеки гост.','وَقَبْلَ الْمُغَادَرَةِ يَدْفَعُ النَّزِيلُ الْحِسَابَ.|А преди напускане гостът плаща сметката.']},
 {u:'Абдест и теяммум',ar:'كَيْفَ أَتَوَضَّأُ؟',t:'Как да взема абдест?',
  d:['يُوسُفُ: يَا أُسْتَاذُ، كَيْفَ أَتَوَضَّأُ؟|Учителю, как да взема абдест?','الْأُسْتَاذُ: أَوَّلًا تَنْوِي الْوُضُوءَ وَتَقُولُ: بِسْمِ اللّٰهِ.|Първо имаш намерение за абдест и казваш „Бисмиллах“.','الْأُسْتَاذُ: ثُمَّ تَغْسِلُ كَفَّيْكَ ثَلَاثَ مَرَّاتٍ.|После измиваш дланите си три пъти.','الْأُسْتَاذُ: ثُمَّ تَتَمَضْمَضُ وَتَسْتَنْشِقُ ثَلَاثًا.|После изплакваш устата и носа по три пъти.','الْأُسْتَاذُ: ثُمَّ تَغْسِلُ وَجْهَكَ، ثُمَّ يَدَيْكَ إِلَى الْمِرْفَقَيْنِ.|После измиваш лицето, после ръцете до лактите.','الْأُسْتَاذُ: ثُمَّ تَمْسَحُ رَأْسَكَ وَأُذُنَيْكَ.|После обтриваш главата и ушите си.','الْأُسْتَاذُ: ثُمَّ تَغْسِلُ رِجْلَيْكَ إِلَى الْكَعْبَيْنِ.|После измиваш краката до глезените.','يُوسُفُ: وَهَلْ أَبْدَأُ بِالْيَمِينِ؟|Започвам ли с дясното?','الْأُسْتَاذُ: نَعَمْ، تَبْدَأُ بِالْيَمِينِ ثُمَّ الْيَسَارِ.|Да, започваш с дясното, после с лявото.'],
  w:['الْوُضُوءُ|al-wuḍūʾu|абдест','تَوَضَّأَ / يَتَوَضَّأُ|tawaḍḍaʾa|взе / взема абдест','نَوَى / يَنْوِي|nawā|има намерение','غَسَلَ / يَغْسِلُ|ghasala|изми / мие','مَسَحَ / يَمْسَحُ|masaḥa|обтри / обтрива','كَفٌّ (مثنى) كَفَّانِ|kaffun|длан','وَجْهٌ|wajhun|лице','يَدٌ (مثنى) يَدَانِ|yadun|ръка','الْمِرْفَقُ|al-mirfaqu|лакът','أُذُنٌ|udhunun|ухо','رِجْلٌ (مثنى) رِجْلَانِ|rijlun|крак','الْكَعْبُ|al-kaʿbu|глезен','تَمَضْمَضَ|tamaḍmaḍa|изплакна устата','اسْتَنْشَقَ|istanshaqa|вкара вода в носа','بَدَأَ / يَبْدَأُ|badaʾa|започна / започва'],
  g:'Последователност с ثُمَّ „после“: تَغْسِلُ وَجْهَكَ ثُمَّ يَدَيْكَ. Двойствено число на части от тялото: يَدَانِ / يَدَيْنِ, رِجْلَانِ / رِجْلَيْنِ, а с притежание: يَدَيْكَ „ръцете ти“, رِجْلَيْهِ „краката му“.',
  s:['يَغْسِلُ الْمُسْلِمُ وَجْهَهُ ثَلَاثَ مَرَّاتٍ|Мюсюлманинът измива лицето си три пъти','تَغْسِلُ يَدَيْكَ إِلَى الْمِرْفَقَيْنِ|Измиваш ръцете си до лактите','يَمْسَحُ رَأْسَهُ وَأُذُنَيْهِ|Обтрива главата и ушите си','يَبْدَأُ بِالْيَمِينِ ثُمَّ الْيَسَارِ|Започва с дясното, после с лявото','نَتَوَضَّأُ قَبْلَ الصَّلَاةِ|Вземаме абдест преди молитва','أَغْسِلُ رِجْلَيَّ إِلَى الْكَعْبَيْنِ|Измивам краката си до глезените'],
  r:['الْوُضُوءُ شَرْطٌ لِلصَّلَاةِ.|Абдестът е условие за молитвата.','يَنْوِي الْمُسْلِمُ الْوُضُوءَ وَيَقُولُ: بِسْمِ اللّٰهِ.|Мюсюлманинът има намерение за абдест и казва „Бисмиллах“.','يَغْسِلُ كَفَّيْهِ وَوَجْهَهُ وَيَدَيْهِ، وَيَمْسَحُ رَأْسَهُ.|Измива дланите, лицето и ръцете си и обтрива главата си.','ثُمَّ يَغْسِلُ رِجْلَيْهِ إِلَى الْكَعْبَيْنِ.|После измива краката си до глезените.']},
 {u:'Абдест и теяммум',ar:'كَيْفَ أَتَيَمَّمُ؟',t:'Как да направя теяммум?',
  d:['يُوسُفُ: يَا أُسْتَاذُ، مَاذَا أَفْعَلُ إِذَا لَمْ أَجِدِ الْمَاءَ؟|Учителю, какво да правя, ако не намеря вода?','الْأُسْتَاذُ: تَتَيَمَّمُ بِالتُّرَابِ الطَّاهِرِ.|Правиш теяммум с чиста пръст.','يُوسُفُ: وَمَتَى يَجُوزُ التَّيَمُّمُ؟|А кога е позволен теяммумът?','الْأُسْتَاذُ: إِذَا لَمْ يُوجَدْ مَاءٌ، أَوْ كَانَ الْمَاءُ يَضُرُّ الْمَرِيضَ.|Когато няма вода или водата вреди на болния.','يُوسُفُ: وَكَيْفَ أَتَيَمَّمُ؟|И как да направя теяммум?','الْأُسْتَاذُ: تَنْوِي، ثُمَّ تَضْرِبُ التُّرَابَ بِكَفَّيْكَ ضَرْبَةً وَاحِدَةً.|Имаш намерение, после удряш пръстта с длани веднъж.','الْأُسْتَاذُ: ثُمَّ تَمْسَحُ وَجْهَكَ وَكَفَّيْكَ.|После обтриваш лицето и дланите си.','يُوسُفُ: الْحَمْدُ لِلّٰهِ، الدِّينُ يُسْرٌ.|Слава на Бога, религията е лекота.'],
  w:['التَّيَمُّمُ|at-tayammumu|теяммум','تَيَمَّمَ / يَتَيَمَّمُ|tayammama|направи теяммум','التُّرَابُ|at-turābu|пръстта, прахта','طَاهِرٌ|ṭāhirun|чист (ритуално)','ضَرَبَ / يَضْرِبُ|ḍaraba|удари / удря','ضَرْبَةٌ|ḍarbatun|удар','جَازَ / يَجُوزُ|jāza|позволено е','ضَرَّ / يَضُرُّ|ḍarra|навреди / вреди','إِذَا|idhā|ако, когато','لَمْ يُوجَدْ|lam yūjad|няма, не се намира','يُسْرٌ|yusrun|лекота','فَعَلَ / يَفْعَلُ|faʿala|направи / прави'],
  g:'Условие с إِذَا „ако, когато“: إِذَا لَمْ تَجِدِ الْمَاءَ تَتَيَمَّمُ „Ако не намериш вода, правиш теяммум“. След إِذَا обикновено стои глагол в минало време или لَمْ + сегашно.',
  s:['إِذَا لَمْ تَجِدِ الْمَاءَ تَتَيَمَّمُ|Ако не намериш вода, правиш теяммум','يَضْرِبُ التُّرَابَ بِكَفَّيْهِ|Удря пръстта с дланите си','يَمْسَحُ وَجْهَهُ وَكَفَّيْهِ|Обтрива лицето и дланите си','الْمَاءُ يَضُرُّ الْمَرِيضَ|Водата вреди на болния','يَجُوزُ التَّيَمُّمُ لِلْمَرِيضِ|Теяммумът е позволен за болния','الدِّينُ يُسْرٌ|Религията е лекота'],
  r:['قَدْ لَا يَجِدُ الْمُسَافِرُ الْمَاءَ فِي الطَّرِيقِ.|Пътникът може да не намери вода по пътя.','وَقَدْ يَكُونُ الْمَاءُ ضَارًّا لِلْمَرِيضِ.|А водата може да е вредна за болния.','فِي هٰذِهِ الْحَالَةِ يَتَيَمَّمُ الْمُسْلِمُ بِالتُّرَابِ الطَّاهِرِ.|В такъв случай мюсюлманинът прави теяммум с чиста пръст.','يَضْرِبُ التُّرَابَ بِكَفَّيْهِ وَيَمْسَحُ وَجْهَهُ وَكَفَّيْهِ.|Удря пръстта с длани и обтрива лицето и дланите си.']},
 {u:'В джамията',ar:'أَيْنَ تُصَلِّي؟',t:'Къде се молиш?',
  d:['أَحْمَدُ: أَيْنَ تُصَلِّي يَا بِلَالُ؟|Къде се молиш, Билал?','بِلَالٌ: أُصَلِّي فِي مَسْجِدِ الْحَيِّ.|Моля се в джамията на квартала.','أَحْمَدُ: هَلْ تُصَلِّي فِيهِ الصَّلَوَاتِ الْخَمْسَ؟|Там ли изпълняваш петте молитви?','بِلَالٌ: أُصَلِّي فِيهِ الْفَجْرَ وَالْمَغْرِبَ وَالْعِشَاءَ.|Там изпълнявам зорната, вечерната и нощната.','أَحْمَدُ: وَأَيْنَ تُصَلِّي الظُّهْرَ وَالْعَصْرَ؟|А къде изпълняваш обедната и следобедната?','بِلَالٌ: فِي مَسْجِدِ الْجَامِعَةِ، لِأَنِّي أَكُونُ هُنَاكَ.|В джамията на университета, защото тогава съм там.','أَحْمَدُ: صَلَاةُ الْجَمَاعَةِ أَفْضَلُ مِنْ صَلَاةِ الْفَرْدِ.|Колективната молитва е по-добра от индивидуалната.','بِلَالٌ: صَدَقْتَ.|Прав си.'],
  w:['صَلَّى / يُصَلِّي|ṣallā|моли се','الصَّلَوَاتُ الْخَمْسُ|aṣ-ṣalawātu al-khamsu|петте молитви','الْفَجْرُ|al-fajru|зорната молитва','الظُّهْرُ|aẓ-ẓuhru|обедната молитва','الْعَصْرُ|al-ʿaṣru|следобедната молитва','الْمَغْرِبُ|al-maghribu|вечерната молитва','الْعِشَاءُ|al-ʿishāʾu|нощната молитва','الْحَيُّ|al-ḥayyu|кварталът','صَلَاةُ الْجَمَاعَةِ|ṣalātu al-jamāʿati|колективна молитва','الْفَرْدُ|al-fardu|отделният човек','صَدَقْتَ|ṣadaqta|прав си','رَكْعَةٌ|rakʿatun|ракат'],
  g:'Глаголи, завършващи на ي/ى: صَلَّى → يُصَلِّي „моли се“, أُصَلِّي „моля се“, نُصَلِّي „молим се“. Бройни числа с мъжки и женски род: خَمْسُ صَلَوَاتٍ „пет молитви“, أَرْبَعُ رَكَعَاتٍ „четири раката“.',
  s:['أُصَلِّي فِي مَسْجِدِ الْحَيِّ|Моля се в джамията на квартала','نُصَلِّي الظُّهْرَ فِي الْجَامِعَةِ|Изпълняваме обедната молитва в университета','صَلَاةُ الْفَجْرِ رَكْعَتَانِ|Зорната молитва е два раката','صَلَاةُ الْمَغْرِبِ ثَلَاثُ رَكَعَاتٍ|Вечерната молитва е три раката','صَلَاةُ الْعِشَاءِ أَرْبَعُ رَكَعَاتٍ|Нощната молитва е четири раката','صَلَاةُ الْجَمَاعَةِ أَفْضَلُ|Колективната молитва е по-добра'],
  r:['يُصَلِّي الْمُسْلِمُ خَمْسَ صَلَوَاتٍ فِي الْيَوْمِ.|Мюсюлманинът се моли пет пъти на ден.','صَلَاةُ الْفَجْرِ رَكْعَتَانِ، وَالظُّهْرُ أَرْبَعٌ، وَالْعَصْرُ أَرْبَعٌ.|Зорната е два раката, обедната – четири, следобедната – четири.','وَالْمَغْرِبُ ثَلَاثٌ، وَالْعِشَاءُ أَرْبَعٌ.|Вечерната е три, нощната – четири.','وَصَلَاةُ الْجَمَاعَةِ فِي الْمَسْجِدِ أَفْضَلُ مِنْ صَلَاةِ الْفَرْدِ.|Колективната молитва в джамията е по-добра от индивидуалната.']},
 {u:'В джамията',ar:'إِلَى الْمَسْجِدِ',t:'Към джамията',
  d:['بِلَالٌ: اِسْمَعْ يَا أَحْمَدُ، هٰذَا هُوَ الْأَذَانُ.|Чуй, Ахмед, това е езанът.','أَحْمَدُ: نَعَمْ، صَوْتُ الْمُؤَذِّنِ جَمِيلٌ.|Да, гласът на мюезина е красив.','بِلَالٌ: هَيَّا إِلَى الصَّلَاةِ.|Хайде на молитва.','أَحْمَدُ: اِنْتَظِرْنِي قَلِيلًا، سَأَتَوَضَّأُ.|Почакай ме малко, ще взема абдест.','بِلَالٌ: أَسْرِعْ، الْإِمَامُ سَيَبْدَأُ الصَّلَاةَ.|Побързай, имамът ще започне молитвата.','أَحْمَدُ: أَيْنَ أَقِفُ فِي الصَّفِّ؟|Къде да застана в редицата?','بِلَالٌ: قِفْ بِجَانِبِي فِي الصَّفِّ الْأَوَّلِ، وَاتَّجِهْ إِلَى الْقِبْلَةِ.|Застани до мен на първата редица и се обърни към киблата.'],
  w:['الْأَذَانُ|al-adhānu|езанът','الْمُؤَذِّنُ|al-muʾadhdhinu|мюезинът','الْإِمَامُ|al-imāmu|имамът','الْقِبْلَةُ|al-qiblatu|киблата (посоката на молитвата)','صَفٌّ (ج) صُفُوفٌ|ṣaffun|редица','صَوْتٌ|ṣawtun|глас','سَمِعَ / يَسْمَعُ|samiʿa|чу / чува','وَقَفَ / يَقِفُ|waqafa|застана / стои','هَيَّا|hayyā|хайде','قَلِيلًا|qalīlan|малко','الْمِحْرَابُ|al-miḥrābu|михрабът','الْمِئْذَنَةُ|al-miʾdhanatu|минарето'],
  g:'Заповедна форма към приятел: اِسْمَعْ „чуй!“, اِنْتَظِرْنِي „почакай ме!“, أَسْرِعْ „побързай!“, قِفْ „застани!“. Към жена се прибавя ـِي: اِسْمَعِي, أَسْرِعِي, قِفِي.',
  s:['اِسْمَعْ صَوْتَ الْأَذَانِ|Чуй звука на езана','اِنْتَظِرْنِي قَلِيلًا|Почакай ме малко','أَسْرِعْ إِلَى الصَّلَاةِ|Побързай за молитвата','قِفْ فِي الصَّفِّ الْأَوَّلِ|Застани на първата редица','يَتَّجِهُ الْمُصَلِّي إِلَى الْقِبْلَةِ|Молещият се се обръща към киблата','يُؤَذِّنُ الْمُؤَذِّنُ مِنَ الْمِئْذَنَةِ|Мюезинът призовава от минарето'],
  r:['سَمِعَ بِلَالٌ وَأَحْمَدُ الْأَذَانَ فَذَهَبَا إِلَى الْمَسْجِدِ.|Билал и Ахмед чуха езана и отидоха в джамията.','تَوَضَّأَ أَحْمَدُ ثُمَّ دَخَلَ الْمَسْجِدَ.|Ахмед взе абдест и влезе в джамията.','وَقَفَا فِي الصَّفِّ الْأَوَّلِ خَلْفَ الْإِمَامِ.|Застанаха на първата редица зад имама.','صَلَّيَا مَعَ الْجَمَاعَةِ ثُمَّ رَجَعَا إِلَى السَّكَنِ.|Помолиха се заедно с общността и се върнаха в общежитието.']},
 {u:'В джамията',ar:'هَيَّا نَذْهَبْ لِصَلَاةِ الْجُمُعَةِ',t:'Хайде на петъчна молитва',
  d:['أَحْمَدُ: الْيَوْمُ يَوْمُ الْجُمُعَةِ يَا بِلَالُ.|Днес е петък, Билал.','بِلَالٌ: نَعَمْ، هَيَّا نَذْهَبْ لِصَلَاةِ الْجُمُعَةِ مُبَكِّرِينَ.|Да, хайде да отидем рано на петъчната молитва.','أَحْمَدُ: سَأَغْتَسِلُ وَأَلْبَسُ ثِيَابًا نَظِيفَةً أَوَّلًا.|Първо ще се изкъпя и ще облека чисти дрехи.','بِلَالٌ: هٰذِهِ سُنَّةٌ جَمِيلَةٌ.|Това е хубава сунна.','أَحْمَدُ: فِي أَيِّ مَسْجِدٍ نُصَلِّي؟|В коя джамия ще се молим?','بِلَالٌ: فِي الْجَامِعِ الْكَبِيرِ، فَخَطِيبُهُ مُمْتَازٌ.|В голямата джамия, проповедникът там е отличен.','أَحْمَدُ: وَهَلْ نَسْتَمِعُ إِلَى الْخُطْبَةِ كُلِّهَا؟|И ще слушаме ли цялата проповед?','بِلَالٌ: طَبْعًا، وَلَا نَتَكَلَّمُ أَثْنَاءَ الْخُطْبَةِ.|Разбира се, и не говорим по време на проповедта.'],
  w:['يَوْمُ الْجُمُعَةِ|yawmu al-jumuʿati|петък','صَلَاةُ الْجُمُعَةِ|ṣalātu al-jumuʿati|петъчната молитва','الْجَامِعُ|al-jāmiʿu|голямата (съборна) джамия','الْخُطْبَةُ|al-khuṭbatu|проповедта','الْخَطِيبُ|al-khaṭību|проповедникът','اغْتَسَلَ / يَغْتَسِلُ|ightasala|изкъпа се','ثِيَابٌ|thiyābun|дрехи','سُنَّةٌ|sunnatun|сунна (пророческа практика)','اسْتَمَعَ / يَسْتَمِعُ إِلَى|istamaʿa|слуша','تَكَلَّمَ / يَتَكَلَّمُ|takallama|говори','أَثْنَاءَ|athnāʾa|по време на','طَبْعًا|ṭabʿan|разбира се','مُبَكِّرِينَ|mubakkirīna|рано (за мн.ч.)'],
  g:'Покана „хайде да…“: هَيَّا + сегашно време в 1 л. мн.ч. със сукун: هَيَّا نَذْهَبْ „хайде да отидем“, هَيَّا نُصَلِّ „хайде да се помолим“. Отрицателна заповед: لَا + сегашно време: لَا تَتَكَلَّمْ „не говори!“.',
  s:['هَيَّا نَذْهَبْ إِلَى الْمَسْجِدِ|Хайде да отидем в джамията','لَا تَتَكَلَّمْ أَثْنَاءَ الْخُطْبَةِ|Не говори по време на проповедта','نَسْتَمِعُ إِلَى الْخُطْبَةِ|Слушаме проповедта','يَلْبَسُ الْمُسْلِمُ ثِيَابًا نَظِيفَةً|Мюсюлманинът облича чисти дрехи','ذَهَبْنَا إِلَى الْجَامِعِ مُبَكِّرِينَ|Отидохме рано в голямата джамия','الْخَطِيبُ يَخْطُبُ عَلَى الْمِنْبَرِ|Проповедникът говори от минбера'],
  r:['يَوْمُ الْجُمُعَةِ يَوْمٌ عَظِيمٌ عِنْدَ الْمُسْلِمِينَ.|Петък е велик ден за мюсюлманите.','يَغْتَسِلُ الْمُسْلِمُ وَيَلْبَسُ ثِيَابًا نَظِيفَةً.|Мюсюлманинът се къпе и облича чисти дрехи.','ثُمَّ يَذْهَبُ إِلَى الْجَامِعِ مُبَكِّرًا.|После отива рано в голямата джамия.','يَسْتَمِعُ إِلَى الْخُطْبَةِ وَلَا يَتَكَلَّمُ، ثُمَّ يُصَلِّي رَكْعَتَيْنِ مَعَ الْإِمَامِ.|Слуша проповедта, без да говори, и после се моли два раката с имама.']},
 {u:'В джамията',ar:'اِقْرَأْ',t:'Прочети: джамията',review:true,
  w:['بَيْتُ اللّٰهِ|baytu allāhi|Божият дом','الْمِنْبَرُ|al-minbaru|минберът','هَادِئٌ|hādiʾun|тих, спокоен','احْتَرَمَ / يَحْتَرِمُ|iḥtarama|уважава','اجْتَمَعَ / يَجْتَمِعُ|ijtamaʿa|събира се','الْمُصَلُّونَ|al-muṣallūna|молещите се'],
  r:['الْمَسْجِدُ بَيْتُ اللّٰهِ فِي الْأَرْضِ.|Джамията е Божият дом на земята.','يَجْتَمِعُ فِيهِ الْمُسْلِمُونَ لِلصَّلَاةِ خَمْسَ مَرَّاتٍ فِي الْيَوْمِ.|В нея мюсюлманите се събират за молитва пет пъти на ден.','فِي الْمَسْجِدِ مِحْرَابٌ وَمِنْبَرٌ، وَلَهُ مِئْذَنَةٌ عَالِيَةٌ.|В джамията има михраб и минбер, а тя има високо минаре.','يَدْخُلُ الْمُسْلِمُ الْمَسْجِدَ بِرِجْلِهِ الْيُمْنَى، وَيَكُونُ هَادِئًا.|Мюсюлманинът влиза в джамията с десния крак и е тих.','وَيَحْتَرِمُ الْمُصَلُّونَ الْمَسْجِدَ وَيُحَافِظُونَ عَلَى نَظَافَتِهِ.|Молещите се уважават джамията и я пазят чиста.']},
 {u:'Как прекарваме ваканцията',ar:'رَمَضَانُ وَالْعُمْرَةُ: الصَّوْمُ',t:'Рамадан: постът',
  d:['عَلِيٌّ: كَيْفَ تَقْضِي إِجَازَتَكَ يَا يُوسُفُ؟|Как ще прекараш ваканцията си, Юсуф?','يُوسُفُ: الْإِجَازَةُ فِي رَمَضَانَ، فَسَأَصُومُ هُنَا ثُمَّ أَذْهَبُ لِلْعُمْرَةِ.|Ваканцията е през Рамадан, ще постя тук и после ще отида на умра.','عَلِيٌّ: مَتَى تَتَسَحَّرُ؟|Кога ще се храниш преди зазоряване?','يُوسُفُ: قَبْلَ الْفَجْرِ، ثُمَّ أَصُومُ حَتَّى الْمَغْرِبِ.|Преди зората, после постя до залеза.','عَلِيٌّ: وَعَلَى أَيِّ شَيْءٍ تُفْطِرُ؟|А с какво прекъсваш поста?','يُوسُفُ: عَلَى التَّمْرِ وَالْمَاءِ، كَمَا كَانَ يَفْعَلُ الرَّسُولُ ﷺ.|С фурми и вода, както правеше Пратеникът ﷺ.','عَلِيٌّ: وَفِي اللَّيْلِ؟|А през нощта?','يُوسُفُ: أُصَلِّي التَّرَاوِيحَ فِي الْمَسْجِدِ وَأَقْرَأُ الْقُرْآنَ.|Изпълнявам теравих в джамията и чета Корана.'],
  w:['رَمَضَانُ|ramaḍānu|Рамадан','الصَّوْمُ / الصِّيَامُ|aṣ-ṣawmu|постът','صَامَ / يَصُومُ|ṣāma|пости','صَائِمٌ|ṣāʾimun|постещ','السُّحُورُ|as-suḥūru|предзорното хранене','تَسَحَّرَ / يَتَسَحَّرُ|tasaḥḥara|хранеше се преди зората','الْإِفْطَارُ|al-ifṭāru|ифтар','أَفْطَرَ / يُفْطِرُ|afṭara|прекъсна поста','التَّمْرُ|at-tamru|фурми','التَّرَاوِيحُ|at-tarāwīḥu|теравих (нощни молитви в Рамадан)','الْإِجَازَةُ|al-ijāzatu|ваканцията','قَضَى / يَقْضِي|qaḍā|прекара','حَتَّى|ḥattā|до'],
  g:'Кухи глаголи (със средна ا): صَامَ → يَصُومُ „пости“, قَالَ → يَقُولُ „казва“, زَارَ → يَزُورُ „посещава“. В минало време с окончание средната буква пада: صُمْتُ „постих“, قُلْتُ „казах“.',
  s:['أَصُومُ شَهْرَ رَمَضَانَ|Постя месец Рамадан','يَتَسَحَّرُ الصَّائِمُ قَبْلَ الْفَجْرِ|Постещият се храни преди зората','نُفْطِرُ عَلَى التَّمْرِ وَالْمَاءِ|Прекъсваме поста с фурми и вода','صُمْتُ رَمَضَانَ فِي الرِّيَاضِ|Постих Рамадан в Рияд','نُصَلِّي التَّرَاوِيحَ فِي الْمَسْجِدِ|Изпълняваме теравих в джамията','رَمَضَانُ كَرِيمٌ|Рамадан е щедър'],
