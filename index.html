 q:['إِلَى أَيْنَ يَهْدِي الصِّدْقُ؟|إِلَى الْبِرِّ ثُمَّ إِلَى الْجَنَّةِ|إِلَى النَّارِ|إِلَى الْمَالِ','إِلَى أَيْنَ يَهْدِي الْكَذِبُ؟|إِلَى الْفُجُورِ ثُمَّ إِلَى النَّارِ|إِلَى الْجَنَّةِ|إِلَى الْبِرِّ','مَتَى يُكْتَبُ الرَّجُلُ صِدِّيقًا؟|إِذَا صَدَقَ دَائِمًا|إِذَا صَدَقَ مَرَّةً وَاحِدَةً|إِذَا كَانَ غَنِيًّا','مَا الْآيَةُ الَّتِي يَتَّصِلُ مَعْنَاهَا بِهٰذَا الْحَدِيثِ؟|اتَّقُوا اللّٰهَ وَكُونُوا مَعَ الصَّادِقِينَ|قُلْ هُوَ اللّٰهُ أَحَدٌ|إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ']},
{u:'Нрав и вяра',ar:'الرَّحْمَةُ بِالْحَيَوَانِ',t:'Милост към животните',wk:7,r:'أَبُو هُرَيْرَةَ',src:'ал-Бухари',
 hd:['«بَيْنَا رَجُلٌ يَمْشِي فَاشْتَدَّ عَلَيْهِ الْعَطَشُ|„Един човек вървял и силно ожаднял.','فَنَزَلَ بِئْرًا فَشَرِبَ مِنْهَا|Слязъл в един кладенец и пил от него.','ثُمَّ خَرَجَ فَإِذَا هُوَ بِكَلْبٍ يَلْهَثُ يَأْكُلُ الثَّرَى مِنَ الْعَطَشِ|После излязъл и видял куче, което дишало тежко с изплезен език и ядяло влажната пръст от жажда.','فَقَالَ: لَقَدْ بَلَغَ هٰذَا مِثْلُ الَّذِي بَلَغَ بِي|Казал си: „Това куче е стигнало до същото, до което стигнах и аз.“','فَمَلَأَ خُفَّهُ ثُمَّ أَمْسَكَهُ بِفِيهِ، ثُمَّ رَقِيَ فَسَقَى الْكَلْبَ|Напълнил обувката си с вода, хванал я със зъби, изкачил се и напоил кучето.','فَشَكَرَ اللّٰهُ لَهُ فَغَفَرَ لَهُ»|Аллах му благодарил и му простил.“','قَالُوا: يَا رَسُولَ اللّٰهِ، وَإِنَّ لَنَا فِي الْبَهَائِمِ أَجْرًا؟|Попитали: „Пратенико на Аллах, нима имаме награда и за животните?“','قَالَ: «فِي كُلِّ كَبِدٍ رَطْبَةٍ أَجْرٌ»|Той казал: „За всяко живо същество има награда.“'],
 w:['الْعَطَشُ|жаждата','بِئْرٌ|кладенец','لَهَثَ / يَلْهَثُ|диша тежко с изплезен език','الثَّرَى|влажната пръст','خُفٌّ|кожена обувка','أَمْسَكَ|хвана, задържа','رَقِيَ|изкачи се','الْبَهَائِمُ|животните','كَبِدٌ|черен дроб','رَطْبَةٌ|влажна, жива','عَطَفَ|прояви милост'],
 m:['يَلْهَثُ|يُخْرِجُ لِسَانَهُ مِنْ شِدَّةِ الْعَطَشِ|изплезва език от силна жажда','الثَّرَى|التُّرَابَ الرَّطْبَ|влажната пръст','خُفَّهُ|حِذَاءَهُ مِنَ الْجِلْدِ|кожената си обувка','بِفِيهِ|بِفَمِهِ|с устата си','رَقِيَ|صَعِدَ|изкачи се','كَبِدٍ رَطْبَةٍ|حَيَوَانٍ حَيٍّ|живо същество'],
 e:['رَجُلٌ شَعَرَ بِعَطَشٍ شَدِيدٍ، فَنَزَلَ فِي بِئْرٍ وَشَرِبَ.|Един човек усетил силна жажда, слязъл в кладенец и пил.','ثُمَّ رَأَى كَلْبًا عَطْشَانَ، فَعَطَفَ عَلَيْهِ وَسَقَاهُ بِخُفِّهِ.|После видял жадно куче, смилил се над него и го напоил с обувката си.','فَغَفَرَ اللّٰهُ لَهُ ذُنُوبَهُ بِسَبَبِ رَحْمَتِهِ بِالْحَيَوَانِ.|И Аллах му простил греховете заради милостта му към животното.'],
 l:['الرَّحْمَةُ بِالْحَيَوَانِ سَبَبٌ لِمَغْفِرَةِ الذُّنُوبِ.|Милостта към животните е причина за прошка на греховете.','فِي كُلِّ عَمَلٍ صَالِحٍ أَجْرٌ وَلَوْ كَانَ صَغِيرًا.|Всяко добро дело има награда, дори да е малко.','الْإِسْلَامُ دِينُ الرَّحْمَةِ.|Ислямът е религия на милостта.'],
 a:'وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ|И те изпратихме само като милост за световете.|Ал-Анбия 107',
 o:['عَطْشَانُ|رَيَّانُ','نَزَلَ|صَعِدَ','رَحْمَةٌ|قَسْوَةٌ'],
 p:['سَقَى الرَّجُلُ الْكَلْبَ.|الْمَرْأَةُ / الْقِطَّةُ|سَقَتِ الْمَرْأَةُ الْقِطَّةَ.|Жената напои котката.|سَقَى الْمَرْأَةُ الْقِطَّةَ.|سَقَتِ الْمَرْأَةَ الْقِطَّةُ.','نَزَلَ الرَّجُلُ الْبِئْرَ فَشَرِبَ.|الرِّجَالُ|نَزَلَ الرِّجَالُ الْبِئْرَ فَشَرِبُوا.|Мъжете слязоха в кладенеца и пиха.|نَزَلَ الرِّجَالُ الْبِئْرَ فَشَرِبَ.|نَزَلُوا الرِّجَالُ الْبِئْرَ فَشَرِبُوا.'],
 f:['بَيْنَا رَجُلٌ يَمْشِي فَاشْتَدَّ عَلَيْهِ ___|الْعَطَشُ|الْبَرْدُ|الْمَطَرُ','فَإِذَا هُوَ بِكَلْبٍ ___|يَلْهَثُ|يَنَامُ|يَلْعَبُ','فِي كُلِّ كَبِدٍ رَطْبَةٍ ___|أَجْرٌ|عَطَشٌ|بِئْرٌ'],
 k:['سَقَى الرَّجُلُ الْكَلْبَ بِحِذَائِهِ.|5','غَفَرَ اللّٰهُ لَهُ ذُنُوبَهُ.|6','لَنَا أَجْرٌ فِي كُلِّ حَيَوَانٍ حَيٍّ.|8'],
 q:['مَاذَا شَعَرَ الرَّجُلُ؟|بِعَطَشٍ شَدِيدٍ|بِجُوعٍ|بِبَرْدٍ','مَاذَا رَأَى بَعْدَ أَنْ خَرَجَ مِنَ الْبِئْرِ؟|كَلْبًا يَلْهَثُ مِنَ الْعَطَشِ|قِطَّةً تَأْكُلُ|رَجُلًا مَرِيضًا','بِمَاذَا سَقَى الْكَلْبَ؟|بِخُفِّهِ|بِيَدِهِ|بِإِنَاءٍ كَبِيرٍ','مَاذَا كَانَ جَزَاؤُهُ؟|غَفَرَ اللّٰهُ لَهُ|أَخَذَ مَالًا|لَا شَيْءَ']},
{u:'Нрав и вяра',ar:'مِنْ عَلَامَاتِ الْمُنَافِقِ',t:'Белезите на лицемера',wk:8,r:'أَبُو هُرَيْرَةَ',src:'ал-Бухари, Муслим и ат-Тирмизи',
 hd:['«آيَةُ الْمُنَافِقِ ثَلَاثٌ:|„Белезите на лицемера са три:','إِذَا حَدَّثَ كَذَبَ|когато говори, лъже,','وَإِذَا وَعَدَ أَخْلَفَ|когато обещае, не изпълнява,','وَإِذَا اؤْتُمِنَ خَانَ»|и когато му се повери нещо, предава доверието.“'],
 w:['آيَةٌ|знак, белег','الْمُنَافِقُ|лицемерът','النِّفَاقُ|лицемерието','حَدَّثَ|заговори','وَعَدَ|обеща','أَخْلَفَ|не изпълни','اؤْتُمِنَ|бе му поверено','خَانَ|предаде доверието','وَفَى / يَفِي|изпълни','أَظْهَرَ|показа','أَخْفَى|скри','خِصَالٌ|качества'],
 m:['آيَةُ|عَلَامَةُ|белегът на','الْمُنَافِقِ|الَّذِي يُظْهِرُ الْإِسْلَامَ وَيُخْفِي الْكُفْرَ|който показва исляма, а крие неверието','أَخْلَفَ|لَمْ يَفِ بِوَعْدِهِ|не изпълни обещанието си','اؤْتُمِنَ|أُعْطِيَ شَيْئًا لِيَحْفَظَهُ|му бе дадено нещо да го пази','خَانَ|لَمْ يَحْفَظِ الْأَمَانَةَ|не опази повереното'],
 e:['الْمُنَافِقُ يُظْهِرُ أَنَّهُ مُسْلِمٌ، وَيُخْفِي الْكُفْرَ فِي قَلْبِهِ.|Лицемерът показва, че е мюсюлманин, а крие неверието в сърцето си.','وَلَهُ ثَلَاثُ عَلَامَاتٍ: يَكْذِبُ فِي كَلَامِهِ، وَلَا يَفِي بِوَعْدِهِ، وَلَا يَحْفَظُ الْأَمَانَةَ.|Той има три белега: лъже, когато говори, не изпълнява обещанията си и не пази повереното.','فَعَلَى الْمُسْلِمِ أَنْ يَحْذَرَ مِنْ هٰذِهِ الْخِصَالِ.|Мюсюлманинът трябва да се пази от тези качества.'],
 l:['الْمُسْلِمُ يَصْدُقُ فِي كَلَامِهِ.|Мюсюлманинът говори истината.','الْمُسْلِمُ يَفِي بِوَعْدِهِ.|Мюсюлманинът изпълнява обещанията си.','الْمُسْلِمُ يَحْفَظُ الْأَمَانَةَ.|Мюсюлманинът пази повереното му.'],
 a:'إِنَّ الْمُنَافِقِينَ فِي الدَّرْكِ الْأَسْفَلِ مِنَ النَّارِ|Лицемерите ще са в най-долното ниво на огъня.|Ан-Ниса 145',
 o:['كَذَبَ|صَدَقَ','أَخْلَفَ|وَفَى','خَانَ|حَفِظَ','أَظْهَرَ|أَخْفَى'],
 p:['إِذَا حَدَّثَ كَذَبَ.|الْمُسْلِمُ / صَدَقَ|الْمُسْلِمُ إِذَا حَدَّثَ صَدَقَ.|Мюсюлманинът, когато говори, казва истината.|الْمُسْلِمُ إِذَا حَدَّثَ كَذَبَ.|الْمُسْلِمَ إِذَا حَدَّثَ صَدَقَ.','إِذَا وَعَدَ أَخْلَفَ.|الْمُسْلِمُ / وَفَى|الْمُسْلِمُ إِذَا وَعَدَ وَفَى.|Мюсюлманинът, когато обещае, изпълнява.|الْمُسْلِمُ إِذَا وَعَدَ أَخْلَفَ.|الْمُسْلِمُ إِذَا وَعَدَتْ وَفَى.','إِذَا اؤْتُمِنَ خَانَ.|الْمُسْلِمُ / حَفِظَ الْأَمَانَةَ|الْمُسْلِمُ إِذَا اؤْتُمِنَ حَفِظَ الْأَمَانَةَ.|Мюсюлманинът пази повереното му.|الْمُسْلِمُ إِذَا اؤْتُمِنَ خَانَ.|الْمُسْلِمُ إِذَا اؤْتُمِنَ حَفِظَ الْأَمَانَةُ.'],
 f:['آيَةُ الْمُنَافِقِ ___|ثَلَاثٌ|خَمْسٌ|عَشْرٌ','إِذَا حَدَّثَ ___|كَذَبَ|خَانَ|أَخْلَفَ','وَإِذَا وَعَدَ ___|أَخْلَفَ|كَذَبَ|صَدَقَ','وَإِذَا اؤْتُمِنَ ___|خَانَ|وَفَى|حَدَّثَ'],
 k:['لَا يَحْفَظُ مَا يُعْطَى لَهُ لِيَحْفَظَهُ.|4','لَا يَفِي بِوَعْدِهِ.|3'],
 q:['كَمْ عَلَامَةً لِلْمُنَافِقِ فِي الْحَدِيثِ؟|ثَلَاثٌ|اثْنَتَانِ|خَمْسٌ','مَنِ الْمُنَافِقُ؟|الَّذِي يُظْهِرُ الْإِسْلَامَ وَيُخْفِي الْكُفْرَ|الَّذِي يُصَلِّي كَثِيرًا|الَّذِي يُسَافِرُ','مَاذَا يَفْعَلُ الْمُنَافِقُ إِذَا وَعَدَ؟|يُخْلِفُ|يَفِي|يَصْدُقُ','أَيْنَ يَكُونُ الْمُنَافِقُونَ يَوْمَ الْقِيَامَةِ؟|فِي الدَّرْكِ الْأَسْفَلِ مِنَ النَّارِ|فِي الْجَنَّةِ|فِي الْمَسْجِدِ']},
{u:'Нрав и вяра',ar:'التَّحْذِيرُ مِنَ الْكِبْرِ',t:'Предупреждение срещу високомерието',wk:9,r:'عَبْدُ اللّٰهِ بْنُ مَسْعُودٍ',src:'Муслим',
 hd:['«لَا يَدْخُلُ الْجَنَّةَ مَنْ كَانَ فِي قَلْبِهِ مِثْقَالُ ذَرَّةٍ مِنْ كِبْرٍ»|„Няма да влезе в Рая онзи, в чието сърце има високомерие колкото прашинка.“','قَالَ رَجُلٌ: إِنَّ الرَّجُلَ يُحِبُّ أَنْ يَكُونَ ثَوْبُهُ حَسَنًا وَنَعْلُهُ حَسَنَةً|Един човек каза: „Човек обича дрехата му да е хубава и обувките му да са хубави.“','قَالَ: «إِنَّ اللّٰهَ جَمِيلٌ يُحِبُّ الْجَمَالَ|Той каза: „Аллах е красив и обича красотата.','الْكِبْرُ بَطَرُ الْحَقِّ وَغَمْطُ النَّاسِ»|Високомерието е отхвърляне на истината и презиране на хората.“'],
 w:['الْكِبْرُ|високомерието','مِثْقَالٌ|тежест','ذَرَّةٌ|прашинка','ثَوْبٌ|дреха','نَعْلٌ|обувка','جَمِيلٌ|красив','الْجَمَالُ|красотата','بَطَرٌ|отхвърляне от гордост','غَمْطٌ|презиране','احْتِقَارٌ|презрение','التَّوَاضُعُ|скромността','تَعَاظَمَ|възгордя се'],
 m:['مِثْقَالُ ذَرَّةٍ|شَيْءٌ قَلِيلٌ جِدًّا|нещо съвсем малко','الْكِبْرُ|أَنْ يَرَى الْإِنْسَانُ نَفْسَهُ أَفْضَلَ مِنْ غَيْرِهِ|човек да се смята за по-добър от другите','بَطَرُ الْحَقِّ|رَفْضُ الْحَقِّ وَعَدَمُ قَبُولِهِ|отхвърляне на истината','غَمْطُ النَّاسِ|احْتِقَارُهُمْ|презирането им'],
 e:['الْمُتَكَبِّرُ لَا يَدْخُلُ الْجَنَّةَ وَلَوْ كَانَ كِبْرُهُ قَلِيلًا.|Високомерният не влиза в Рая, дори високомерието му да е малко.','وَلَيْسَ مِنَ الْكِبْرِ أَنْ يَلْبَسَ الْإِنْسَانُ ثَوْبًا جَمِيلًا؛ لِأَنَّ اللّٰهَ يُحِبُّ الْجَمَالَ.|Не е високомерие човек да носи хубава дреха, защото Аллах обича красотата.','الْكِبْرُ أَنْ يَرْفُضَ الْإِنْسَانُ الْحَقَّ، وَيَحْتَقِرَ النَّاسَ.|Високомерие е човек да отхвърля истината и да презира хората.'],

 hd:['«انْصُرْ أَخَاكَ ظَالِمًا أَوْ مَظْلُومًا»|„Помагай на брат си, независимо дали е угнетител, или угнетен.“','فَقَالَ رَجُلٌ: يَا رَسُولَ اللّٰهِ، أَنْصُرُهُ إِذَا كَانَ مَظْلُومًا|Един човек каза: „Пратенико на Аллах, ще му помогна, когато е угнетен,','أَفَرَأَيْتَ إِذَا كَانَ ظَالِمًا كَيْفَ أَنْصُرُهُ؟|но кажи ми — когато е угнетител, как да му помогна?“','قَالَ: «تَحْجُزُهُ أَوْ تَمْنَعُهُ مِنَ الظُّلْمِ، فَإِنَّ ذٰلِكَ نَصْرُهُ»|Той каза: „Възпираш го или му пречиш да угнетява — това е помощта за него.“'],

 m:['انْصُرْ أَخَاكَ|سَاعِدْ أَخَاكَ الْمُسْلِمَ|помагай на брат си мюсюлманина','ظَالِمًا|يَعْتَدِي عَلَى غَيْرِهِ|посяга на другите','مَظْلُومًا|يَعْتَدِي عَلَيْهِ غَيْرُهُ|други посягат на него','تَحْجُزُهُ|تَمْنَعُهُ وَتَرُدُّهُ|го спираш и връщаш'],
 e:['أَمَرَ الرَّسُولُ الْمُسْلِمَ أَنْ يَنْصُرَ أَخَاهُ فِي كُلِّ حَالٍ.|Пратеникът повели на мюсюлманина да помага на брат си във всяко положение.','فَإِذَا كَانَ مَظْلُومًا سَاعَدَهُ حَتَّى يَأْخُذَ حَقَّهُ.|Ако е угнетен, му помага, докато си вземе правото.','وَإِذَا كَانَ ظَالِمًا مَنَعَهُ مِنَ الظُّلْمِ، وَهٰذَا نَصْرٌ لَهُ.|А ако той угнетява, го възпира от неправдата — и това е помощ за него.'],
 l:['الظُّلْمُ حَرَامٌ.|Неправдата е забранена.','الْمُسْلِمُ يُسَاعِدُ أَخَاهُ وَيَنْصَحُهُ.|Мюсюлманинът помага на брат си и го съветва.','مَنْعُ الظَّالِمِ مِنَ الظُّلْمِ نَصْرٌ لَهُ.|Да спреш угнетителя е помощ за него.'],
 a:'وَمَنْ يَظْلِمْ مِنْكُمْ نُذِقْهُ عَذَابًا كَبِيرًا|А който от вас върши неправда, ще му дадем да вкуси голямо наказание.|Ал-Фуркан 19',
 o:['ظَالِمٌ|مَظْلُومٌ','مَنَعَ|سَمَحَ','نَصَرَ|خَذَلَ'],
 p:['انْصُرْ أَخَاكَ.|أَنْتُمْ|انْصُرُوا إِخْوَانَكُمْ.|Помагайте на братята си.|انْصُرْ إِخْوَانَكُمْ.|انْصُرُوا أَخَاكَ.','تَمْنَعُهُ مِنَ الظُّلْمِ.|هُوَ|يَمْنَعُهُ مِنَ الظُّلْمِ.|Той го възпира от неправдата.|نَمْنَعُهُ مِنَ الظُّلْمِ.|يَمْنَعُونَهُ مِنَ الظُّلْمِ.'],
 f:['انْصُرْ أَخَاكَ ظَالِمًا أَوْ ___|مَظْلُومًا|غَنِيًّا|مَرِيضًا','تَحْجُزُهُ أَوْ تَمْنَعُهُ مِنَ ___|الظُّلْمِ|الصَّلَاةِ|الْعَمَلِ','فَإِنَّ ذٰلِكَ ___|نَصْرُهُ|ظُلْمُهُ|مَالُهُ'],
 k:['كَيْفَ أُسَاعِدُ أَخِي إِذَا كَانَ هُوَ الظَّالِمَ؟|3'],
 q:['بِمَاذَا أَمَرَ الرَّسُولُ فِي هٰذَا الْحَدِيثِ؟|بِنَصْرِ الْأَخِ ظَالِمًا أَوْ مَظْلُومًا|بِتَرْكِ الْأَخِ|بِالسَّفَرِ','كَيْفَ يُنْصَرُ الظَّالِمُ؟|بِمَنْعِهِ مِنَ الظُّلْمِ|بِمُسَاعَدَتِهِ عَلَى الظُّلْمِ|بِإِعْطَائِهِ مَالًا','كَيْفَ يُنْصَرُ الْمَظْلُومُ؟|بِمُسَاعَدَتِهِ حَتَّى يَأْخُذَ حَقَّهُ|بِتَرْكِهِ|بِالضَّحِكِ عَلَيْهِ']},
{u:'Знание и поклонение',ar:'فَضْلُ تِلَاوَةِ الْقُرْآنِ وَمُدَارَسَتِهِ',t:'Достойнството на четенето на Корана',wk:13,r:'أَبُو هُرَيْرَةَ',src:'Абу Дауд',
 hd:['«مَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللّٰهِ|„Не се събират хора в някой от домовете на Аллах','يَتْلُونَ كِتَابَ اللّٰهِ وَيَتَدَارَسُونَهُ بَيْنَهُمْ|да четат Книгата на Аллах и да я изучават помежду си,','إِلَّا نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ، وَغَشِيَتْهُمُ الرَّحْمَةُ|без над тях да слезе спокойствие и да ги обгърне милост,','وَحَفَّتْهُمُ الْمَلَائِكَةُ، وَذَكَرَهُمُ اللّٰهُ فِيمَنْ عِنْدَهُ»|без ангелите да ги заобиколят и без Аллах да ги спомене пред онези, които са при Него.“'],
 w:['تَلَا / يَتْلُو|чете (Корана)','تَدَارَسَ|изучаваха заедно','السَّكِينَةُ|спокойствието','غَشِيَ|обгърна','حَفَّ / يَحُفُّ|заобиколи','بُيُوتُ اللّٰهِ|джамиите','مَدَحَ|похвали','مَوَاعِظُ|поучения','أَحَاطَ / يُحِيطُ|обгради'],
 m:['بَيْتٍ مِنْ بُيُوتِ اللّٰهِ|مَسْجِدٍ|джамия','يَتْلُونَ|يَقْرَءُونَ|четат','يَتَدَارَسُونَهُ|يَتَعَلَّمُونَ مَعَانِيَهُ مَعًا|изучават заедно значенията му','السَّكِينَةُ|الطُّمَأْنِينَةُ وَرَاحَةُ الْقَلْبِ|спокойствието на сърцето','حَفَّتْهُمُ|أَحَاطَتْ بِهِمْ|ги заобиколиха'],
 e:['إِذَا اجْتَمَعَ الْمُسْلِمُونَ فِي الْمَسْجِدِ لِيَقْرَءُوا الْقُرْآنَ وَيَتَعَلَّمُوا مَعَانِيَهُ،|Когато мюсюлманите се съберат в джамията да четат Корана и да изучават значенията му,','نَزَلَتْ عَلَيْهِمُ الطُّمَأْنِينَةُ، وَأَحَاطَتْ بِهِمُ الرَّحْمَةُ وَالْمَلَائِكَةُ.|над тях слиза спокойствие и ги обгръщат милостта и ангелите.','وَذَكَرَهُمُ اللّٰهُ عِنْدَ الْمَلَائِكَةِ وَمَدَحَهُمْ.|И Аллах ги споменава пред ангелите и ги хвали.'],
 l:['لِتِلَاوَةِ الْقُرْآنِ فِي الْمَسْجِدِ فَضْلٌ عَظِيمٌ.|Четенето на Корана в джамията има голямо достойнство.','يَتَعَلَّمُ الْمُسْلِمُ مَعَانِيَ الْقُرْآنِ مَعَ إِخْوَانِهِ.|Мюсюлманинът изучава значенията на Корана заедно с братята си.','الْقُرْآنُ يُعْطِي الْقَلْبَ رَاحَةً.|Коранът дава покой на сърцето.'],
 a:'إِنَّ الَّذِينَ يَتْلُونَ كِتَابَ اللّٰهِ وَأَقَامُوا الصَّلَاةَ وَأَنْفَقُوا مِمَّا رَزَقْنَاهُمْ سِرًّا وَعَلَانِيَةً يَرْجُونَ تِجَارَةً لَنْ تَبُورَ|Онези, които четат Книгата на Аллах, отслужват молитвата и раздават тайно и явно от онова, с което ги дарихме, се надяват на търговия, която няма да пропадне.|Фатир 29',
 o:['اجْتَمَعَ|تَفَرَّقَ','نَزَلَ|صَعِدَ','الرَّحْمَةُ|الْعَذَابُ'],
 p:['يَتْلُونَ كِتَابَ اللّٰهِ.|هُوَ|يَتْلُو كِتَابَ اللّٰهِ.|Той чете Книгата на Аллах.|يَتْلُونَ كِتَابَ اللّٰهِ.|تَتْلُو كِتَابَ اللّٰهِ.','اجْتَمَعَ قَوْمٌ فِي الْمَسْجِدِ.|الطُّلَّابُ|اجْتَمَعَ الطُّلَّابُ فِي الْمَسْجِدِ.|Учениците се събраха в джамията.|اجْتَمَعُوا الطُّلَّابُ فِي الْمَسْجِدِ.|اجْتَمَعَ الطُّلَّابَ فِي الْمَسْجِدِ.'],
 f:['مَا اجْتَمَعَ قَوْمٌ فِي ___ مِنْ بُيُوتِ اللّٰهِ|بَيْتٍ|سُوقٍ|طَرِيقٍ','إِلَّا نَزَلَتْ عَلَيْهِمُ ___|السَّكِينَةُ|الْمَلَائِكَةُ|الرَّحْمَةُ وَالْمَالُ','وَحَفَّتْهُمُ ___|الْمَلَائِكَةُ|السَّكِينَةُ|الْكُتُبُ'],
 k:['يَقْرَءُونَ الْقُرْآنَ وَيَتَعَلَّمُونَ مَعَانِيَهُ مَعًا.|2'],
 q:['أَيْنَ يَجْتَمِعُ الْقَوْمُ فِي الْحَدِيثِ؟|فِي بَيْتٍ مِنْ بُيُوتِ اللّٰهِ|فِي السُّوقِ|فِي الطَّرِيقِ','مَاذَا يَفْعَلُونَ؟|يَتْلُونَ كِتَابَ اللّٰهِ وَيَتَدَارَسُونَهُ|يَأْكُلُونَ|يَبِيعُونَ','كَمْ جَزَاءً ذَكَرَ الْحَدِيثُ؟|أَرْبَعَةً|اثْنَيْنِ|عَشَرَةً','مَا السَّكِينَةُ؟|الطُّمَأْنِينَةُ وَرَاحَةُ الْقَلْبِ|الْخَوْفُ|الْمَالُ']},
{u:'Знание и поклонение',ar:'فَضْلُ ذِكْرِ اللّٰهِ',t:'Достойнството на споменаването на Аллах',wk:14,r:'أَبُو هُرَيْرَةَ',src:'ал-Бухари и Муслим',
 hd:['«مَنْ قَالَ: لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، فِي يَوْمٍ مِائَةَ مَرَّةٍ|„Който казва сто пъти на ден: „Няма друг бог освен Аллах, Единствения, Който няма съдружник; Негова е властта и Нему е хвалата, и Той над всяко нещо има сила“,','كَانَتْ لَهُ عَدْلَ عَشْرِ رِقَابٍ|за него това е равно на освобождаването на десет роби,','وَكُتِبَتْ لَهُ مِائَةُ حَسَنَةٍ، وَمُحِيَتْ عَنْهُ مِائَةُ سَيِّئَةٍ|записват му се сто добри дела и му се изтриват сто лоши,','وَكَانَتْ لَهُ حِرْزًا مِنَ الشَّيْطَانِ يَوْمَهُ ذٰلِكَ حَتَّى يُمْسِيَ|и това е закрила за него от шейтана през този ден до вечерта.','وَلَمْ يَأْتِ أَحَدٌ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلَّا أَحَدٌ عَمِلَ أَكْثَرَ مِنْ ذٰلِكَ»|И никой не идва с нещо по-добро от това, освен онзи, който е направил повече от това.“'],
 w:['شَرِيكٌ|съдружник','الْمُلْكُ|властта','قَدِيرٌ|всесилен','عَدْلٌ|равностойно','رِقَابٌ|роби (букв. „вратове“)','حَسَنَةٌ|добро дело','سَيِّئَةٌ|лошо дело','مُحِيَتْ|изтри се','حِرْزٌ|закрила','أَمْسَى / يُمْسِي|настъпи вечерта'],
 m:['لَا شَرِيكَ لَهُ|لَيْسَ لَهُ مِثْلٌ يُشَارِكُهُ|няма подобен, който да Му е съдружник','قَدِيرٌ|يَقْدِرُ عَلَى كُلِّ شَيْءٍ|може всичко','عَدْلَ عَشْرِ رِقَابٍ|مِثْلَ أَجْرِ مَنْ أَعْتَقَ عَشَرَةَ عَبِيدٍ|колкото наградата на освободилия десет роби','حِرْزًا|حِمَايَةً|закрила','حَتَّى يُمْسِيَ|حَتَّى يَأْتِيَ الْمَسَاءُ|до вечерта'],
 e:['ذِكْرُ اللّٰهِ مِنْ أَفْضَلِ مَا يَقُولُهُ الْإِنْسَانُ.|Споменаването на Аллах е от най-добрите неща, които човек казва.','فَمَنْ قَالَ هٰذَا الذِّكْرَ مِائَةَ مَرَّةٍ فِي يَوْمٍ أَخَذَ أَجْرًا كَبِيرًا: مِائَةَ حَسَنَةٍ، وَمَحْوَ مِائَةِ سَيِّئَةٍ.|Който каже това споменаване сто пъти на ден, получава голяма награда: сто добри дела и изтриване на сто лоши.','وَيَحْفَظُهُ اللّٰهُ مِنَ الشَّيْطَانِ إِلَى الْمَسَاءِ.|И Аллах го пази от шейтана до вечерта.'],
 l:['ذِكْرُ اللّٰهِ سَهْلٌ وَأَجْرُهُ عَظِيمٌ.|Споменаването на Аллах е лесно, а наградата му е голяма.','الذِّكْرُ يَحْفَظُ الْمُسْلِمَ مِنَ الشَّيْطَانِ.|Споменаването пази мюсюлманина от шейтана.','اللّٰهُ وَاحِدٌ لَا شَرِيكَ لَهُ.|Аллах е един, без съдружник.'],
 a:'فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ|Споменавайте Ме и Аз ще ви споменавам. Благодарете Ми и не бъдете неблагодарни!|Ал-Бакара 152',
 o:['حَسَنَةٌ|سَيِّئَةٌ','أَصْبَحَ|أَمْسَى','كُتِبَ|مُحِيَ'],

 r:['اسْتَيْقَظَ أَحْمَدُ مِنَ النَّوْمِ فِي اللَّيْلِ، وَقَدْ أَحَسَّ بِأَلَمٍ شَدِيدٍ فِي بَطْنِهِ.|Ахмад се събуди през нощта, като усещаше силна болка в корема си.',
  'فَأَيْقَظَ خَالَهُ، فَلَبِسَا مَلَابِسَهُمَا، وَخَرَجَا مَعًا إِلَى الْمُسْتَشْفَى.|Той събуди вуйчо си; двамата се облякоха и излязоха заедно към болницата.',

  'أَذْهَبُ كُلَّ أُسْبُوعٍ إِلَى السُّوقِ.|لَا|لَا أَذْهَبُ كُلَّ أُسْبُوعٍ إِلَى السُّوقِ.|Не ходя на пазара всяка седмица.|لَيْسَ أَذْهَبُ كُلَّ أُسْبُوعٍ إِلَى السُّوقِ.|لَا ذَهَبْتُ كُلَّ أُسْبُوعٍ إِلَى السُّوقِ.',

 tk:['مَتَى ذَهَبْتَ إِلَى السُّوقِ؟|Кога отиде на пазара?','لِمَاذَا ذَهَبْتَ إِلَى السُّوقِ؟|Защо отиде на пазара?','كَيْفَ وَجَدْتَ السُّوقَ؟|Как намери пазара?','مَاذَا اشْتَرَيْتَ مِنَ السُّوقِ؟|Какво купи от пазара?']
},
{u:'Част 2',ar:'الْمَمْلَكَةُ الْعَرَبِيَّةُ السُّعُودِيَّةُ (١)',t:'Кралство Саудитска Арабия (1)',wk:2,
 r:['تَقَعُ الْمَمْلَكَةُ الْعَرَبِيَّةُ السُّعُودِيَّةُ فِي قَارَّةِ آسِيَا.|Кралство Саудитска Арабия се намира на континента Азия.',
  'يَحُدُّهَا مِنَ الشَّمَالِ الْأُرْدُنُّ وَالْعِرَاقُ، وَمِنَ الشَّرْقِ الْكُوَيْتُ وَقَطَرُ وَالْإِمَارَاتُ وَالْخَلِيجُ الْعَرَبِيُّ.|На север граничи с Йордания и Ирак, а на изток – с Кувейт, Катар, Емирствата и Арабския залив.',
  'وَيَحُدُّهَا مِنَ الْجَنُوبِ الْيَمَنُ وَعُمَانُ، وَمِنَ الْغَرْبِ الْبَحْرُ الْأَحْمَرُ.|На юг граничи с Йемен и Оман, а на запад – с Червено море.',
  'وَمِنْ أَكْبَرِ مُدُنِهَا: مَكَّةُ الْمُكَرَّمَةُ، وَالْمَدِينَةُ الْمُنَوَّرَةُ، وَالرِّيَاضُ وَهِيَ الْعَاصِمَةُ، وَجُدَّةُ، وَالطَّائِفُ، وَالدَّمَّامُ، وَبُرَيْدَةُ.|Сред най-големите ѝ градове са: почитаната Мека, озарената Медина, Рияд, който е столицата, Джида, Таиф, Дамам и Бурайда.',
  'تَنْزِلُ الْأَمْطَارُ عَلَى الْمَمْلَكَةِ فِي الشِّتَاءِ.|Дъждовете в кралството падат през зимата.',
  'وَالزِّرَاعَةُ فِيهَا بِالْآلَاتِ الْحَدِيثَةِ، فَالْفَلَّاحُ يَسْتَعْمِلُ الْآلَاتِ فِي عَمَلِهِ.|Земеделието там е със съвременни машини – земеделецът използва машини в работата си.',
  'وَقَامَتِ الْمَمْلَكَةُ بِتَحْلِيَةِ مِيَاهِ الْبَحْرِ؛ لِلِاسْتِفَادَةِ مِنْهَا فِي الشُّرْبِ وَالزِّرَاعَةِ.|Кралството обезсолява морска вода, за да я използва за пиене и земеделие.',
  'فَصَارَ جُزْءٌ كَبِيرٌ مِنَ الصَّحْرَاءِ مَزَارِعَ خَضْرَاءَ.|Така голяма част от пустинята се превърна в зелени ферми.',
  'وَانْتَشَرَتْ فِيهَا زِرَاعَةُ الْقَمْحِ وَالْخُضَارِ كَالطَّمَاطِمِ وَالْخِيَارِ.|И там се разпространи отглеждането на пшеница и зеленчуци като домати и краставици.'],
 w:['حَدَّ / يَحُدُّ|ḥadda / yaḥuddu|граничи с',

  'مَا الْبَلَدُ الَّذِي يَحُدُّ الْمَمْلَكَةَ مِنَ الْجَنُوبِ؟|الْيَمَنُ|الْأُرْدُنُّ|الْعِرَاقُ',

  'تَنْزِلُ الْأَمْطَارُ عَلَى الْمَمْلَكَةِ فِي الصَّيْفِ.|0|Дъждовете в кралството падат през лятото.',

 o:['الشَّمَالُ|الْجَنُوبُ','الشَّرْقُ|الْغَرْبُ','الْحَدِيثَةُ|الْقَدِيمَةُ'],
 sp:['مَزْرَعَةٌ|مَزَارِعُ','مَطَرٌ|أَمْطَارٌ'],
 p:['تَقَعُ الْمَمْلَكَةُ فِي آسِيَا.|أَيْنَ|أَيْنَ تَقَعُ الْمَمْلَكَةُ؟|Къде се намира кралството?|مَتَى تَقَعُ الْمَمْلَكَةُ؟|أَيْنَ تَقَعُ الْمَمْلَكَةَ؟',

 tk:['أَيْنَ يَقَعُ بَلَدُكَ؟|Къде се намира твоята страна?','مَا الْبِلَادُ الَّتِي تَحُدُّ بَلَدَكَ؟|С кои страни граничи твоята страна?','اذْكُرْ أَكْبَرَ الْمُدُنِ فِي بَلَدِكَ.|Назови най-големите градове в твоята страна.','مَتَى تَنْزِلُ الْأَمْطَارُ فِي بَلَدِكَ؟|Кога падат дъждовете в твоята страна?','مَاذَا يَزْرَعُ الْفَلَّاحُونَ فِي بَلَدِكَ؟|Какво отглеждат земеделците в твоята страна?']
},
{u:'Част 2',ar:'الْمَمْلَكَةُ الْعَرَبِيَّةُ السُّعُودِيَّةُ (٢)',t:'Кралство Саудитска Арабия (2)',wk:2,
 r:['فِي الْمَمْلَكَةِ الْعَرَبِيَّةِ السُّعُودِيَّةِ قِبْلَةُ الْمُسْلِمِينَ، فَفِي مَكَّةَ الْمُكَرَّمَةِ الْكَعْبَةُ الْمُشَرَّفَةُ.|В Кралство Саудитска Арабия е киблата на мюсюлманите – в почитаната Мека е почитаната Кааба.',
  'يَأْتِي الْمُسْلِمُونَ مِنْ كُلِّ بِلَادِ الْعَالَمِ إِلَى مَكَّةَ؛ لِيَحُجُّوا، وَيُصَلُّوا فِي الْمَسْجِدِ الْحَرَامِ، وَيَزُورُوا الْمَشَاعِرَ الْمُقَدَّسَةَ.|Мюсюлмани от всички страни на света идват в Мека, за да извършат хадж, да се молят в Свещената джамия и да посетят светите места.',
  'وَفِيهَا الْمَدِينَةُ الْمُنَوَّرَةُ، وَمِنْهَا انْتَشَرَ الْإِسْلَامُ.|В нея е и озарената Медина, от която се разпространи ислямът.',
  'وَفِي الْمَدِينَةِ الْمَسْجِدُ النَّبَوِيُّ، وَفِيهِ قَبْرُ الرَّسُولِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ، وَقَبْرَا صَاحِبَيْهِ أَبِي بَكْرٍ وَعُمَرَ رِضْوَانُ اللّٰهِ عَلَيْهِمَا.|В Медина е Джамията на Пророка, а в нея са гробът на Пратеника ﷺ и гробовете на двамата му сподвижници Абу Бакр и Умар – благоволението на Аллах да е над тях.',
  'وَيَذْهَبُ الْمُسْلِمُونَ إِلَى الْمَدِينَةِ؛ لِلصَّلَاةِ فِي الْمَسْجِدِ النَّبَوِيِّ.|Мюсюлманите ходят в Медина, за да се молят в Джамията на Пророка.',
  'وَفِي الْمَمْلَكَةِ سَبْعُ جَامِعَاتٍ، وَفِيهَا مَعَاهِدُ لِتَعْلِيمِ اللُّغَةِ الْعَرَبِيَّةِ لِلنَّاطِقِينَ بِغَيْرِهَا مِنْ أَبْنَاءِ الدُّوَلِ الْإِسْلَامِيَّةِ.|В кралството има седем университета, а в тях – институти за преподаване на арабски на хора от ислямските страни, за които той не е роден език.',
  'وَمِنْ أَهَمِّ صَادِرَاتِ الْمَمْلَكَةِ النِّفْطُ، وَيُسَمَّى الذَّهَبَ الْأَسْوَدَ، وَهِيَ تُصَدِّرُهُ إِلَى بِلَادٍ كَثِيرَةٍ.|Сред най-важните износни стоки на кралството е нефтът, наричан „черното злато“; тя го изнася за много страни.',
  'وَتَسْتَوْرِدُ الْمَمْلَكَةُ مِنَ الدُّوَلِ الْأُخْرَى الشَّايَ وَالْبُنَّ وَالْأَرُزَّ وَالْمَلَابِسَ وَالسَّيَّارَاتِ وَغَيْرَهَا.|А от другите държави кралството внася чай, кафе, ориз, дрехи, коли и други.'],
 w:['حَجَّ / يَحُجُّ|ḥaǧǧa / yaḥuǧǧu|извърши хадж (поклонение)',

  'الْمُشَرَّفَةُ|al-mušarrafatu|почитаната (за Кааба)',

  'رِضْوَانُ اللّٰهِ عَلَيْهِ|riḍwānu llāhi ʿalayhi|благоволението на Аллах да е над него',
  'نَاطِقٌ (بِـ)|nāṭiqun (bi-)|говорещ (на език)',
  'النَّاطِقُونَ بِغَيْرِهَا|an-nāṭiqūna bi-ġayrihā|онези, за които (арабският) не е роден език',
  'النِّفْطُ|an-nifṭu|нефтът',
  'صَادِرَاتٌ|ṣādirātun|износ (изнасяни стоки)',

 q:['فِي أَيِّ مَدِينَةٍ يَقَعُ الْمَسْجِدُ الْحَرَامُ؟|فِي مَكَّةَ الْمُكَرَّمَةِ|فِي الْمَدِينَةِ الْمُنَوَّرَةِ|فِي الرِّيَاضِ',
  'لِمَاذَا يَأْتِي الْمُسْلِمُونَ إِلَى مَكَّةَ؟|لِيَحُجُّوا وَيُصَلُّوا فِي الْمَسْجِدِ الْحَرَامِ|لِيَشْتَرُوا النِّفْطَ|لِيَعْمَلُوا فِي الْمَزَارِعِ',
  'مَنْ صَاحِبَا الرَّسُولِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ اللَّذَانِ قَبْرَاهُمَا فِي الْمَسْجِدِ النَّبَوِيِّ؟|أَبُو بَكْرٍ وَعُمَرُ|عُثْمَانُ وَعَلِيٌّ|أَبُو سَلَمَةَ وَعُثْمَانُ',
  'مَا أَهَمُّ صَادِرَاتِ الْمَمْلَكَةِ؟|النِّفْطُ|الشَّايُ|السَّيَّارَاتُ',

{u:'Част 3',ar:'رِحْلَةٌ قَصِيرَةٌ',t:'Кратък излет',wk:3,

  'قَالَ فَهْدٌ: هٰذِهِ فِكْرَةٌ جَمِيلَةٌ يَا سَالِمُ، نَذْهَبُ إِنْ شَاءَ اللّٰهُ يَوْمَ الْعُطْلَةِ.|Фахд каза: „Това е хубава идея, Салим. Ще отидем, ако е рекъл Аллах, в почивния ден.“',
  'قَالَ سَالِمٌ: سَنَأْخُذُ مَعَنَا بَعْضَ الطَّعَامِ وَالْمَاءِ وَالشَّايِ، وَعَلَيْنَا أَنْ نَخْرُجَ مُبَكِّرَيْنِ.|Салим каза: „Ще вземем с нас малко храна, вода и чай и трябва да тръгнем рано.“',
  'وَفِي يَوْمِ الْعُطْلَةِ خَرَجَ سَالِمٌ وَزَمِيلُهُ فَهْدٌ بَعْدَ صَلَاةِ الْفَجْرِ.|В почивния ден Салим и колегата му Фахд излязоха след сутрешната молитва.',

  'ثُمَّ وَصَلَا إِلَى حَدِيقَةٍ كَبِيرَةٍ، وَجَلَسَا فِيهَا يَوْمًا كَامِلًا سَعِيدَيْنِ بِالْهُدُوءِ بَعِيدًا عَنْ ضَجِيجِ الْمَدِينَةِ.|После стигнаха до голяма градина и прекараха в нея цял ден, щастливи от тишината далеч от шума на града.',
  'وَعِنْدَ غُرُوبِ الشَّمْسِ عَادَا إِلَى الْمَدِينَةِ.|При залез слънце се върнаха в града.',

{u:'Част 3',ar:'يَوْمٌ فِي حَيَاةِ طَالِبٍ',t:'Един ден от живота на един студент',wk:3,
 r:['أَحْمَدُ طَالِبٌ فِي مَعْهَدِ تَعْلِيمِ اللُّغَةِ الْعَرَبِيَّةِ فِي الرِّيَاضِ، وَقَدْ عَادَ إِلَى بَلَدِهِ فِي الْعُطْلَةِ.|Ахмад е студент в Института за преподаване на арабски език в Рияд и се върна в страната си за ваканцията.',
  'سَأَلَهُ وَالِدُهُ: كَيْفَ كُنْتَ تَقْضِي يَوْمَكَ فِي الرِّيَاضِ؟|Баща му го попита: „Как прекарваше деня си в Рияд?“',
  'قَالَ أَحْمَدُ: كُنْتُ أَسْتَيْقِظُ مُبَكِّرًا، فَأُصَلِّي الْفَجْرَ، ثُمَّ أَتَنَاوَلُ طَعَامَ الْإِفْطَارِ.|Ахмад каза: „Ставах рано, отслужвах сутрешната молитва, после закусвах.“',
  'ثُمَّ أَذْهَبُ إِلَى الْمَعْهَدِ، فَأَصِلُ إِلَيْهِ فِي السَّاعَةِ السَّابِعَةِ مَعَ بِدَايَةِ الدَّرْسِ الْأَوَّلِ.|„После отивах в института и пристигах там в седем часа, с началото на първия урок.“',
  'وَأَحْيَانًا أَعُودُ إِلَى الْمَعْهَدِ بَعْدَ صَلَاةِ الْعَصْرِ؛ لِأُمَارِسَ النَّشَاطَ الرِّيَاضِيَّ.|„Понякога се връщах в института след следобедната молитва, за да спортувам.“',
  'وَبَعْدَ صَلَاةِ الْمَغْرِبِ أُذَاكِرُ دُرُوسِي، ثُمَّ أَتَنَاوَلُ الْعَشَاءَ، وَأَعُودُ لِمُرَاجَعَةِ الدُّرُوسِ قَلِيلًا، وَأَنَامُ مُبَكِّرًا.|„След вечерната молитва учех уроците си, после вечерях, отново преговарях малко уроците и си лягах рано.“',
  'وَفِي نِهَايَةِ الْأُسْبُوعِ أَغْسِلُ مَلَابِسِي، وَأَكْتُبُ رَسَائِلَ إِلَى أَفْرَادِ أُسْرَتِي.|„В края на седмицата пера дрехите си и пиша писма на членовете на семейството си.“',
  'وَأَحْيَانًا أَذْهَبُ إِلَى السُّوقِ لِشِرَاءِ بَعْضِ الْأَشْيَاءِ، وَأَهْتَمُّ بِتَرْتِيبِ غُرْفَتِي.|„Понякога ходя на пазара да купя някои неща и се грижа да подреждам стаята си.“'],

{u:'Част 3',ar:'قِيمَةُ الْعَمَلِ',t:'Стойността на труда',wk:3,
 r:['الْعَمَلُ ضَرُورِيٌّ لِكُلِّ إِنْسَانٍ؛ لِأَنَّنَا بِدُونِ عَمَلٍ لَا نَحْصُلُ عَلَى الْغِذَاءِ وَالْكِسَاءِ وَالدَّوَاءِ وَالسَّكَنِ.|Трудът е необходим за всеки човек, защото без работа не можем да получим храна, облекло, лекарства и жилище.',
  'وَقَدْ مَنَحَنَا اللّٰهُ الْعَقْلَ وَالْجِسْمَ، وَمَنَحَنَا الْأَرْضَ بِمَا فِيهَا مِنْ خَيْرَاتٍ.|Аллах ни е дарил с разум и тяло и ни е дал земята с всичките ѝ блага.',
  'فَيَجِبُ عَلَيْنَا أَنْ نَعْمَلَ فِي الصِّنَاعَةِ وَالزِّرَاعَةِ وَالتِّجَارَةِ وَغَيْرِهَا.|Затова трябва да работим в промишлеността, земеделието, търговията и другаде.',
  'لِنَسْتَفِيدَ مِنْ عَمَلِنَا، وَمِنْ خَيْرَاتِ الْأَرْضِ الطَّيِّبَةِ النَّافِعَةِ.|За да имаме полза от труда си и от добрите и полезни блага на земята.',

  'وَيَكُونُ نَافِعًا لِنَفْسِهِ وَلِأُسْرَتِهِ وَلِوَطَنِهِ.|И е полезен за себе си, за семейството си и за родината си.',
  'قَالَ اللّٰهُ تَعَالَى: «وَقُلِ اعْمَلُوا فَسَيَرَى اللّٰهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ».|Аллах Всевишният казва: „И кажи: Работете! Аллах ще види делата ви, и Неговият Пратеник, и вярващите.“ (9:105, смисъл)'],

{u:'Част 4',ar:'الْهِجْرَةُ إِلَى أَرْضِ الْحَبَشَةِ',t:'Преселението в Абисиния',wk:4,
 r:['دَعَا الرَّسُولُ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ النَّاسَ فِي مَكَّةَ إِلَى الْإِيمَانِ بِاللّٰهِ وَتَرْكِ عِبَادَةِ الْأَصْنَامِ.|Пратеникът ﷺ призова хората в Мека към вяра в Аллах и към изоставяне на поклонението на идолите.',
  'فَآمَنَ بِهِ قَلِيلٌ مِنْ أَهْلِ مَكَّةَ، وَلَمْ يُؤْمِنْ بِهِ الْآخَرُونَ.|Малцина от жителите на Мека повярваха в него, а останалите не повярваха.',
  'وَعَذَّبَ الْكُفَّارُ الَّذِينَ آمَنُوا عَذَابًا شَدِيدًا.|А неверниците жестоко измъчваха онези, които повярваха.',
  'فَأَخْبَرَ الرَّسُولُ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ أَصْحَابَهُ أَنَّ فِي أَرْضِ الْحَبَشَةِ مَلِكًا لَا يُظْلَمُ عِنْدَهُ أَحَدٌ.|Тогава Пратеникът ﷺ съобщи на сподвижниците си, че в Абисиния има цар, при когото никой не бива угнетяван.',
  'وَنَصَحَهُمْ أَنْ يَذْهَبُوا إِلَيْهَا حَتَّى يَجْعَلَ اللّٰهُ لَهُمْ فَرَجًا مِمَّا هُمْ فِيهِ.|И ги посъветва да отидат там, докато Аллах не им даде избавление от положението, в което са.',
  'فَهَاجَرَ بَعْضُ أَصْحَابِ الرَّسُولِ إِلَى أَرْضِ الْحَبَشَةِ، وَمِنْهُمْ عُثْمَانُ بْنُ عَفَّانَ وَمَعَهُ زَوْجَتُهُ رُقَيَّةُ بِنْتُ رَسُولِ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ.|Някои от сподвижниците на Пратеника се преселиха в Абисиния; сред тях беше Усман ибн Аффан, а с него – съпругата му Рукайя, дъщерята на Пратеника на Аллах ﷺ.',

  'فَجَمَعَ النَّاسَ، وَدَعَاهُمْ إِلَى الْإِيمَانِ بِاللّٰهِ تَعَالَى، وَتَرْكِ عِبَادَةِ الْأَصْنَامِ الَّتِي لَا تَنْفَعُ وَلَا تَضُرُّ.|Той събра хората и ги призова към вяра в Аллах Всевишния и към изоставяне на поклонението на идолите, които нито помагат, нито вредят.',
  'لٰكِنَّ كَثِيرِينَ مِنْهُمْ رَفَضُوا دَعْوَتَهُ، وَعَذَّبُوا الَّذِينَ آمَنُوا بِهِ.|Но мнозина от тях отхвърлиха призива му и измъчваха онези, които повярваха в него.',
  'وَعَرَضَ الرَّسُولُ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ الْإِسْلَامَ عَلَى جَمَاعَةٍ مِنْ أَهْلِ الْمَدِينَةِ جَاءُوا إِلَى مَكَّةَ لِزِيَارَةِ الْكَعْبَةِ.|Пратеникът ﷺ предложи исляма на група жители на Медина, които бяха дошли в Мека, за да посетят Кааба.',
  'فَآمَنَ بِهِ عَدَدٌ كَبِيرٌ مِنْهُمْ، وَاتَّفَقُوا مَعَهُ عَلَى نُصْرَتِهِ إِذَا هَاجَرَ إِلَيْهِمْ.|Голям брой от тях повярваха в него и се договориха с него да го подкрепят, ако се пресели при тях.',
  'ثُمَّ أَمَرَ الرَّسُولُ أَصْحَابَهُ بِالْهِجْرَةِ إِلَى الْمَدِينَةِ، فَهَاجَرَ كَثِيرٌ مِنْهُمْ.|После Пратеникът нареди на сподвижниците си да се преселят в Медина и много от тях се преселиха.',
  'وَبَقِيَ الرَّسُولُ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ فِي مَكَّةَ حَتَّى أَذِنَ اللّٰهُ لَهُ بِالْهِجْرَةِ، فَهَاجَرَ هُوَ وَصَاحِبُهُ أَبُو بَكْرٍ رَضِيَ اللّٰهُ عَنْهُ.|Пратеникът ﷺ остана в Мека, докато Аллах не му позволи да се пресели; тогава той се пресели заедно с другаря си Абу Бакр – Аллах да е доволен от него.',

 p:['سَمَحَ الْوَالِدُ لِابْنِهِ بِالْخُرُوجِ.|مُرَادِفُ «سَمَحَ»|أَذِنَ الْوَالِدُ لِابْنِهِ بِالْخُرُوجِ.|Бащата позволи на сина си да излезе.|رَفَضَ الْوَالِدُ لِابْنِهِ بِالْخُرُوجِ.|أَمَرَ الْوَالِدُ لِابْنِهِ بِالْخُرُوجِ.',
  'قَابَلَ أَهْلُ الْمَدِينَةِ الرَّسُولَ مَسْرُورِينَ.|مُرَادِفُ «قَابَلَ»|اسْتَقْبَلَ أَهْلُ الْمَدِينَةِ الرَّسُولَ مَسْرُورِينَ.|Жителите на Медина посрещнаха Пратеника с радост.|رَفَضَ أَهْلُ الْمَدِينَةِ الرَّسُولَ مَسْرُورِينَ.|عَرَضَ أَهْلُ الْمَدِينَةِ الرَّسُولَ مَسْرُورِينَ.',
  'دَعَا الرَّسُولُ النَّاسَ إِلَى الْإِيمَانِ.|كَانَ (مَعَ الْمُضَارِعِ)|كَانَ الرَّسُولُ يَدْعُو النَّاسَ إِلَى الْإِيمَانِ.|Пратеникът призоваваше хората към вярата.|كَانَ الرَّسُولُ تَدْعُو النَّاسَ إِلَى الْإِيمَانِ.|كَانَ الرَّسُولَ يَدْعُو النَّاسَ إِلَى الْإِيمَانِ.'],
 tk:['بِمَاذَا أَمَرَ اللّٰهُ رَسُولَهُ؟|Какво повели Аллах на Своя Пратеник?','كَيْفَ قَابَلَ أَهْلُ مَكَّةَ الدَّعْوَةَ؟|Как жителите на Мека приеха призива?','عَلَى مَنْ عَرَضَ الرَّسُولُ الْإِسْلَامَ؟|На кого Пратеникът предложи исляма?','مَنْ هَاجَرَ مَعَ الرَّسُولِ؟|Кой се пресели с Пратеника?','كَيْفَ اسْتَقْبَلَهُ أَهْلُ الْمَدِينَةِ؟|Как го посрещнаха жителите на Медина?']
},
{u:'Част 4',ar:'حَدِيقَةُ الْحَيَوَانَاتِ',t:'Зоологическата градина',wk:4,
 r:['فِي مَدِينَةِ كَرَاتْشِي إِحْدَى الْمُدُنِ الْبَاكِسْتَانِيَّةِ حَدِيقَةٌ لِلْحَيَوَانَاتِ.|В град Карачи, един от пакистанските градове, има зоологическа градина.',
  'تَقَعُ هٰذِهِ الْحَدِيقَةُ فِي غَرْبِ الْمَدِينَةِ، وَفِيهَا كَثِيرٌ مِنَ الْحَيَوَانَاتِ الْمُخْتَلِفَةِ كَالْقِرْدِ وَالدُّبِّ.|Тази градина се намира в западната част на града и в нея има много различни животни като маймуната и мечката.',
  'وَفِيهَا حَيَوَانَاتٌ مُفْتَرِسَةٌ كَالْأَسَدِ وَالنَّمِرِ وَالذِّئْبِ وَالثَّعْلَبِ.|В нея има и хищни животни като лъва, тигъра, вълка и лисицата.',
  'وَفِيهَا حَيَوَانَاتٌ أَلِيفَةٌ كَالْجَمَلِ وَالْحِصَانِ وَالْحِمَارِ.|Има и домашни животни като камилата, коня и магарето.',
  'وَفِيهَا أَيْضًا طُيُورٌ كَثِيرَةٌ كَالْحَمَامِ وَالْعَصَافِيرِ وَالْبَبَّغَاءِ.|В нея има и много птици като гълъбите, врабчетата и папагала.',
  'وَهٰذِهِ الْحَيَوَانَاتُ وَالطُّيُورُ مُخْتَلِفَةُ الْأَشْكَالِ وَالْأَنْوَاعِ وَالْأَلْوَانِ.|Тези животни и птици са с различни форми, видове и цветове.',
  'وَفِي الْعُطْلَةِ يَذْهَبُ النَّاسُ إِلَى هٰذِهِ الْحَدِيقَةِ؛ لِيُشَاهِدُوا مَا فِيهَا، وَيَقْضُوا فِيهَا وَقْتًا طَيِّبًا.|В почивните дни хората ходят в тази градина, за да видят какво има в нея и да прекарат там приятно време.'],

 q:['فِي أَيِّ مَدِينَةٍ تَقَعُ حَدِيقَةُ الْحَيَوَانَاتِ؟|فِي كَرَاتْشِي|فِي الرِّيَاضِ|فِي مَكَّةَ',
  'أَيْنَ تَقَعُ الْحَدِيقَةُ فِي الْمَدِينَةِ؟|فِي غَرْبِ الْمَدِينَةِ|فِي شَرْقِ الْمَدِينَةِ|فِي وَسَطِ الْمَدِينَةِ',
  'مَا الْحَيَوَانَاتُ الْمُفْتَرِسَةُ فِي الْحَدِيقَةِ؟|الْأَسَدُ وَالنَّمِرُ وَالذِّئْبُ|الْجَمَلُ وَالْحِصَانُ|الْحَمَامُ وَالْعَصَافِيرُ',
  'مَتَى يَذْهَبُ النَّاسُ إِلَى حَدِيقَةِ الْحَيَوَانَاتِ؟|فِي الْعُطْلَةِ|فِي اللَّيْلِ|كُلَّ صَبَاحٍ قَبْلَ الْعَمَلِ',

 tf:['الْحِصَانُ مِنَ الْحَيَوَانَاتِ الْمُفْتَرِسَةِ.|0|Конят е от хищните животни.',

  'الثَّعْلَبُ مِنَ الْحَيَوَانَاتِ الْمُفْتَرِسَةِ.|1|Лисицата е от хищните животни.',

 o:['أَلِيفٌ|مُفْتَرِسٌ','الْغَرْبُ|الشَّرْقُ'],
 sp:['عُصْفُورٌ|عَصَافِيرُ','طَائِرٌ|طُيُورٌ','لَوْنٌ|أَلْوَانٌ'],
 p:['يَذْهَبُ النَّاسُ إِلَى الْحَدِيقَةِ. يُشَاهِدُونَ الْحَيَوَانَاتِ.|لِـ|يَذْهَبُ النَّاسُ إِلَى الْحَدِيقَةِ لِيُشَاهِدُوا الْحَيَوَانَاتِ.|Хората ходят в градината, за да гледат животните.|يَذْهَبُ النَّاسُ إِلَى الْحَدِيقَةِ لِيُشَاهِدُونَ الْحَيَوَانَاتِ.|يَذْهَبُ النَّاسُ إِلَى الْحَدِيقَةِ لِيُشَاهِدَ الْحَيَوَانَاتِ.',
  'ذَهَبَ الطُّلَّابُ إِلَى السُّوقِ. اشْتَرَوْا مَلَابِسَ.|لِـ|ذَهَبَ الطُّلَّابُ إِلَى السُّوقِ لِيَشْتَرُوا مَلَابِسَ.|Студентите отидоха на пазара, за да купят дрехи.|ذَهَبَ الطُّلَّابُ إِلَى السُّوقِ لِيَشْتَرُونَ مَلَابِسَ.|ذَهَبَ الطُّلَّابُ إِلَى السُّوقِ لِاشْتَرَوْا مَلَابِسَ.',
  'جَاءَ أَحْمَدُ إِلَى الْمَعْهَدِ. يَدْرُسُ اللُّغَةَ الْعَرَبِيَّةَ.|لِـ|جَاءَ أَحْمَدُ إِلَى الْمَعْهَدِ لِيَدْرُسَ اللُّغَةَ الْعَرَبِيَّةَ.|Ахмад дойде в института, за да учи арабски.|جَاءَ أَحْمَدُ إِلَى الْمَعْهَدِ لِيَدْرُسُ اللُّغَةَ الْعَرَبِيَّةَ.|جَاءَ أَحْمَدُ إِلَى الْمَعْهَدِ لِيَدْرُسُوا اللُّغَةَ الْعَرَبِيَّةَ.'],
 tk:['فِي أَيِّ يَوْمٍ زُرْتَ الْحَدِيقَةَ؟|В кой ден посети градината?','فِي أَيِّ وَقْتٍ زُرْتَهَا؟|По кое време я посети?','مَاذَا شَاهَدْتَ فِيهَا؟|Какво видя в нея?','كَمْ سَاعَةً قَضَيْتَ فِيهَا؟|Колко часа прекара в нея?','مَتَى خَرَجْتَ مِنْهَا؟|Кога излезе от нея?']
},
{u:'Част 5',ar:'إِبْرَاهِيمُ وَقَوْمُهُ (١)',t:'Ибрахим и неговият народ (1)',wk:5,
 r:['كَانَ قَوْمُ إِبْرَاهِيمَ عَلَيْهِ السَّلَامُ يَصْنَعُونَ الْأَصْنَامَ مِنَ الْحِجَارَةِ وَالْأَخْشَابِ.|Народът на Ибрахим (мир нему) правеше идоли от камъни и дърво.',
  'وَكَانُوا يَبْنُونَ لَهَا الْمَعَابِدَ الْكَبِيرَةَ، وَيَطُوفُونَ حَوْلَهَا، وَيَرْكَعُونَ وَيَسْجُدُونَ لَهَا.|Строяха им големи храмове, обикаляха около тях, кланяха им се и падаха ничком пред тях.',
  'وَكَانُوا يَعْبُدُونَ أَيْضًا النُّجُومَ وَالْقَمَرَ وَالشَّمْسَ.|Те се покланяха също на звездите, луната и слънцето.',
  'فَتَعَجَّبَ إِبْرَاهِيمُ مِنْ قَوْمِهِ، وَقَالَ لَهُمْ: كَيْفَ تَعْبُدُونَ أَصْنَامًا تَصْنَعُونَهَا بِأَيْدِيكُمْ؟|Ибрахим се учуди на народа си и им каза: „Как се покланяте на идоли, които правите със собствените си ръце?“',
  'وَأَرَادَ أَنْ يُبَيِّنَ لَهُمْ خَطَأَهُمْ، فَرَأَى فِي اللَّيْلِ نَجْمًا يَلْمَعُ، فَقَالَ: هٰذَا رَبِّي.|Той поиска да им покаже грешката им: видя нощем една звезда да блести и каза: „Това е моят Господ.“',
  'فَلَمَّا غَابَ النَّجْمُ قَالَ: «لَا أُحِبُّ الْآفِلِينَ».|Когато звездата залезе, той каза: „Не обичам залязващите.“ (6:76, смисъл)',
  'ثُمَّ رَأَى الْقَمَرَ يُضِيءُ السَّمَاءَ وَالْأَرْضَ، فَقَالَ: هٰذَا رَبِّي، فَلَمَّا غَابَ الْقَمَرُ قَالَ: الْإِلٰهُ لَا يَغِيبُ.|После видя луната да осветява небето и земята и каза: „Това е моят Господ.“ Когато луната залезе, каза: „Богът не залязва.“',
  'ثُمَّ رَأَى الشَّمْسَ، وَهِيَ أَكْبَرُ مِنَ الْقَمَرِ، فَقَالَ: هٰذَا رَبِّي، فَلَمَّا غَابَتْ قَالَ: «يَا قَوْمِ إِنِّي بَرِيءٌ مِّمَّا تُشْرِكُونَ».|После видя слънцето, което е по-голямо от луната, и каза: „Това е моят Господ.“ Когато то залезе, каза: „О, народе мой, аз съм непричастен към онова, което съдружавате (с Аллах).“ (6:78, смисъл)',
  'ثُمَّ قَالَ لَهُمْ: إِنَّ رَبِّي هُوَ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ، وَهُوَ وَحْدَهُ الَّذِي يَسْتَحِقُّ الْعِبَادَةَ.|После им каза: „Моят Господ е Онзи, Който сътвори небесата и земята, и само Той заслужава поклонение.“'],
 w:['قَوْمٌ|qawmun|народ, племе',

 q:['مِنْ أَيِّ شَيْءٍ كَانَ قَوْمُ إِبْرَاهِيمَ يَصْنَعُونَ الْأَصْنَامَ؟|مِنَ الْحِجَارَةِ وَالْأَخْشَابِ|مِنَ الذَّهَبِ|مِنَ الصُّوفِ',

 r:['دَعَا إِبْرَاهِيمُ عَلَيْهِ السَّلَامُ قَوْمَهُ إِلَى عِبَادَةِ اللّٰهِ وَحْدَهُ، وَتَرْكِ عِبَادَةِ الْأَصْنَامِ.|Ибрахим (мир нему) призова народа си да се покланя единствено на Аллах и да изостави поклонението на идолите.',
  'فَسَمِعَ الْمَلِكُ نُمْرُودُ بِذٰلِكَ، فَغَضِبَ غَضَبًا شَدِيدًا، وَأَمَرَ رِجَالَهُ أَنْ يُحْضِرُوا إِبْرَاهِيمَ.|Цар Нимрод чу за това, силно се разгневи и нареди на хората си да доведат Ибрахим.',
  'سَأَلَهُ الْمَلِكُ: مَنْ رَبُّكَ الَّذِي تَعْبُدُهُ؟ فَقَالَ إِبْرَاهِيمُ: «رَبِّيَ الَّذِي يُحْيِي وَيُمِيتُ».|Царят го попита: „Кой е твоят Господ, на Когото се покланяш?“ Ибрахим каза: „Моят Господ е Онзи, Който дава живот и смърт.“ (2:258, смисъл)',

  'فَقَالَ إِبْرَاهِيمُ: «فَإِنَّ اللّٰهَ يَأْتِي بِالشَّمْسِ مِنَ الْمَشْرِقِ فَأْتِ بِهَا مِنَ الْمَغْرِبِ»، فَسَكَتَ الْمَلِكُ وَلَمْ يَسْتَطِعْ أَنْ يُجِيبَ.|Тогава Ибрахим каза: „Аллах изкарва слънцето от изток, а ти го изкарай от запад!“ (2:258, смисъл). Царят замълча и не можа да отговори.',
  'وَفِي يَوْمِ الْعِيدِ وَجَدَ إِبْرَاهِيمُ الْمَعْبَدَ خَالِيًا مِنَ النَّاسِ، فَأَخَذَ فَأْسًا، وَكَسَرَ بِهَا التَّمَاثِيلَ إِلَّا التِّمْثَالَ الْكَبِيرَ، وَوَضَعَ الْفَأْسَ فِي عُنُقِهِ.|В празничния ден Ибрахим намери храма празен, взе брадва и с нея счупи статуите – освен най-голямата статуя, а брадвата окачи на шията ѝ.',
  'وَلَمَّا عَادَ النَّاسُ وَرَأَوُا الْأَصْنَامَ مَكْسُورَةً قَالُوا: الَّذِي فَعَلَ هٰذَا هُوَ إِبْرَاهِيمُ.|Когато хората се върнаха и видяха идолите счупени, казаха: „Този, който направи това, е Ибрахим.“',

  'وَلٰكِنَّ اللّٰهَ حَفِظَهُ، وَقَالَ لِلنَّارِ: «يَا نَارُ كُونِي بَرْدًا وَسَلَامًا عَلَىٰ إِبْرَاهِيمَ».|Но Аллах го опази и каза на огъня: „О, огън, бъди прохлада и спасение за Ибрахим!“ (21:69, смисъл)'],

  'وَكَانَ كَرِيمًا يُسَاعِدُ الْفُقَرَاءَ وَيُطْعِمُ الْمَسَاكِينَ.|Беше щедър, помагаше на бедните и хранеше нуждаещите се.',
  'وَكَانَ يُحِبُّ أَنْ يَبْقَى وَحْدَهُ، فَيَذْهَبُ إِلَى غَارِ حِرَاءٍ قُرْبَ مَكَّةَ شَهْرًا فِي كُلِّ سَنَةٍ.|Обичаше да остава сам и всяка година отиваше за един месец в пещерата Хира близо до Мека.',
  'وَكَانَ يَأْخُذُ مَعَهُ مَا يَحْتَاجُ إِلَيْهِ مِنْ طَعَامٍ وَشَرَابٍ، وَيَقْضِي وَقْتَهُ فِي الْعِبَادَةِ وَالتَّفْكِيرِ فِي هٰذَا الْعَالَمِ.|Вземаше със себе си храната и питието, от които се нуждаеше, и прекарваше времето си в поклонение и размисъл за този свят.',
  'فَإِذَا انْتَهَى الشَّهْرُ رَجَعَ إِلَى مَكَّةَ، فَطَافَ بِالْكَعْبَةِ سَبْعَ مَرَّاتٍ قَبْلَ أَنْ يَدْخُلَ بَيْتَهُ.|Когато месецът свършеше, се връщаше в Мека и обикаляше седем пъти около Кааба, преди да влезе в дома си.',
  'وَفِي يَوْمٍ مِنْ أَيَّامِ شَهْرِ رَمَضَانَ جَاءَهُ جِبْرِيلُ عَلَيْهِ السَّلَامُ فِي صُورَةِ رَجُلٍ وَهُوَ فِي الْغَارِ، وَقَالَ لَهُ: «اقْرَأْ».|В един от дните на месец рамадан, докато беше в пещерата, Джибрил (мир нему) дойде при него в образа на мъж и му каза: „Чети!“',
  'فَقَالَ النَّبِيُّ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ: «مَا أَنَا بِقَارِئٍ»، أَيْ: لَا أَعْرِفُ الْقِرَاءَةَ.|Пророкът отговори: „Аз не мога да чета“, т.е. не зная да чета.',
  'وَتَكَرَّرَ ذٰلِكَ ثَلَاثَ مَرَّاتٍ، ثُمَّ قَرَأَ عَلَيْهِ جِبْرِيلُ: ﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ ۝ خَلَقَ الْإِنْسَانَ مِنْ عَلَقٍ ۝ اقْرَأْ وَرَبُّكَ الْأَكْرَمُ ۝ الَّذِي عَلَّمَ بِالْقَلَمِ ۝ عَلَّمَ الْإِنْسَانَ مَا لَمْ يَعْلَمْ﴾.|Това се повтори три пъти, после Джибрил му прочете: „Чети в името на своя Господ, Който сътвори! Сътвори човека от съсирек. Чети! Твоят Господ е Най-щедрият, Който научи чрез перото, научи човека на онова, което не знаеше.“ (96:1–5, превод на смисъла)',
  'وَهٰذِهِ الْآيَاتُ هِيَ أَوَّلُ مَا نَزَلَ مِنَ الْقُرْآنِ الْكَرِيمِ.|Тези айети са първото, което е низпослано от Благородния Коран.'],

  'نَحْنُ كُنَّا (صَلَّى) فِي الْمَسْجِدِ.|صَحِّحِ الْفِعْلَ بَعْدَ «كَانَ»|نَحْنُ كُنَّا نُصَلِّي فِي الْمَسْجِدِ.|Ние се молехме в джамията.|نَحْنُ كُنَّا يُصَلِّي فِي الْمَسْجِدِ.|نَحْنُ كُنَّا تُصَلِّينَ فِي الْمَسْجِدِ.'],

{u:'Част 6',ar:'مَعَ وَرَقَةَ بْنِ نَوْفَلٍ',t:'При Варака ибн Науфал',wk:6,
 r:['بَعْدَ أَنْ نَزَلَ الْوَحْيُ عَلَى النَّبِيِّ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ فِي غَارِ حِرَاءٍ رَجَعَ إِلَى بَيْتِهِ وَهُوَ يَرْجُفُ.|След като откровението слезе при Пророка (мир нему) в пещерата Хира, той се върна у дома, треперейки.',
  'فَدَخَلَ عَلَى زَوْجَتِهِ خَدِيجَةَ رَضِيَ اللّٰهُ عَنْهَا وَقَالَ: «زَمِّلُونِي، زَمِّلُونِي»، فَغَطَّوْهُ حَتَّى ذَهَبَ عَنْهُ الْخَوْفُ.|Влезе при съпругата си Хадиджа (Аллах да е доволен от нея) и каза: „Завийте ме, завийте ме!“ Завиха го, докато страхът го напусна.',
  'ثُمَّ قَصَّ عَلَيْهَا مَا رَأَى وَمَا سَمِعَ، وَقَالَ لَهَا إِنَّهُ خَشِيَ عَلَى نَفْسِهِ.|После ѝ разказа какво е видял и чул и ѝ каза, че се е уплашил за себе си.',
  'فَقَالَتْ لَهُ خَدِيجَةُ إِنَّ اللّٰهَ لَنْ يُخْزِيَهُ أَبَدًا، لِأَنَّهُ يَصِلُ الرَّحِمَ، وَيُسَاعِدُ الضَّعِيفَ، وَيُكْرِمُ الضَّيْفَ.|Хадиджа му каза, че Аллах никога няма да го посрами, защото той поддържа роднинските връзки, помага на слабия и почита госта.',
  'ثُمَّ ذَهَبَتْ مَعَهُ إِلَى ابْنِ عَمِّهَا وَرَقَةَ بْنِ نَوْفَلٍ، وَكَانَ شَيْخًا كَبِيرًا قَدْ كُفَّ بَصَرُهُ.|После отиде с него при братовчед си Варака ибн Науфал, който беше възрастен старец и беше ослепял.',
  'وَكَانَ وَرَقَةُ يَعْبُدُ اللّٰهَ عَلَى دِينِ عِيسَى عَلَيْهِ السَّلَامُ.|Варака се покланяше на Аллах по вярата на Иса (мир нему).',
  'فَقَصَّ عَلَيْهِ النَّبِيُّ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ قِصَّتَهُ، فَقَالَ وَرَقَةُ إِنَّ هٰذَا هُوَ الْمَلَكُ الَّذِي أَنْزَلَهُ اللّٰهُ عَلَى مُوسَى عَلَيْهِ السَّلَامُ.|Пророкът му разказа историята си, а Варака каза, че това е ангелът, когото Аллах е изпратил при Муса (мир нему).',
  'وَتَمَنَّى وَرَقَةُ أَنْ يَكُونَ حَيًّا حِينَ يُخْرِجُهُ قَوْمُهُ مِنْ مَكَّةَ.|Варака пожела да е жив, когато народът му го изгони от Мека.',
  'فَسَأَلَهُ النَّبِيُّ: هَلْ سَيُخْرِجُنِي قَوْمِي؟ فَقَالَ وَرَقَةُ: نَعَمْ، وَإِنْ أَدْرَكْتُ ذٰلِكَ الْيَوْمَ أَنْصُرْكَ نَصْرًا قَوِيًّا.|Пророкът го попита: „Нима народът ми ще ме изгони?“ Варака отговори: „Да, и ако доживея този ден, ще те подкрепя силно.“',
  'وَلٰكِنَّ وَرَقَةَ لَمْ يُدْرِكْ ذٰلِكَ الْيَوْمَ، فَقَدْ تُوُفِّيَ بَعْدَ وَقْتٍ قَصِيرٍ.|Но Варака не доживя този ден — почина скоро след това.'],

 r:['سَأَلَ شَابٌّ بِرِيطَانِيٌّ اسْمُهُ «بِلْ» نَفْسَهُ ذَاتَ يَوْمٍ: هَلْ أَسْتَطِيعُ أَنْ أَتَحَدَّثَ مَعَ أَصْدِقَائِي وَهُمْ بَعِيدُونَ عَنِّي؟|Един ден млад британец на име Бел се запитал: „Мога ли да разговарям с приятелите си, когато са далеч от мен?“',
  'فَفَكَّرَ كَثِيرًا، وَجَرَّبَ مَرَّةً بَعْدَ مَرَّةٍ.|Мислил много и опитвал отново и отново.',
  'وَأَخِيرًا صَنَعَ صُنْدُوقَيْنِ صَغِيرَيْنِ، وَرَبَطَ الصُّنْدُوقَ الْأَوَّلَ بِالثَّانِي بِخَيْطٍ طَوِيلٍ.|Накрая направил две малки кутии и вързал първата за втората с дълъг конец.',
  'وَأَعْطَى أَحَدَ أَصْدِقَائِهِ صُنْدُوقًا، فَذَهَبَ الصَّدِيقُ إِلَى حُجْرَةٍ مُجَاوِرَةٍ.|Дал едната кутия на един от приятелите си и приятелят отишъл в съседната стая.',

  'وَمَا زَالَ النَّاسُ يَذْكُرُونَ «بِلْ» وَاخْتِرَاعَهُ، فَعَلَيْنَا أَنْ نَذْكُرَ اللّٰهَ الَّذِي خَلَقَ لَنَا الْأُذُنَ الَّتِي تَسْمَعُ، وَاللِّسَانَ الَّذِي يَنْطِقُ، وَالْعَقْلَ الَّذِي يُفَكِّرُ.|Хората и до днес помнят Бел и изобретението му; а ние трябва да помним Аллах, Който ни е сътворил ухото, което чува, езика, който говори, и разума, който мисли.'],

{u:'Част 7',ar:'الْهَاتِفُ (٢)',t:'Телефонът (2)',wk:7,
 r:['كَانَ الْهَاتِفُ الْقَدِيمُ صُنْدُوقًا كَبِيرًا مِنَ الْمَعْدِنِ، مُعَلَّقًا عَلَى الْحَائِطِ.|Старият телефон беше голяма метална кутия, окачена на стената.',
  'وَكَانَتْ فِيهِ سَمَّاعَةٌ يَضَعُهَا الْإِنْسَانُ عَلَى أُذُنِهِ لِيَسْمَعَ الْكَلَامَ.|В него имаше слушалка, която човек слагаше на ухото си, за да чува говора.',
  'وَكَانَ الصُّنْدُوقُ مَوْصُولًا بِصُنْدُوقٍ آخَرَ بِأَسْلَاكٍ طَوِيلَةٍ.|Кутията беше свързана с друга кутия с дълги жици.',
  'وَكَانَ الصَّوْتُ يَنْتَقِلُ عَبْرَ هٰذِهِ الْأَسْلَاكِ مِنْ مَكَانٍ إِلَى مَكَانٍ.|Гласът се пренасяше по тези жици от едно място до друго.',
  'وَكَانَ فِي كُلِّ صُنْدُوقٍ ذِرَاعٌ يُحَرِّكُهَا الْإِنْسَانُ، فَيَسْمَعُ الْآخَرُ رَنِينًا فِي صُنْدُوقِهِ.|Във всяка кутия имаше ръчка, която човек въртеше, и другият чуваше звънене в своята кутия.',
  'فَإِذَا أَرَادَ الْإِنْسَانُ أَنْ يَتَّصِلَ بِأَحَدٍ حَرَّكَ الذِّرَاعَ، فَيُجِيبُهُ الْمُوَظَّفُ، فَيَطْلُبُ مِنْهُ أَنْ يَصِلَهُ بِمَنْ يُرِيدُ.|Когато човек искаше да се обади на някого, въртеше ръчката, отговаряше му служителят (телефонистът) и той го молеше да го свърже с когото желае.',
  'ثُمَّ تَطَوَّرَ الْهَاتِفُ تَطَوُّرًا كَبِيرًا، وَأَصْبَحَ لِكُلِّ هَاتِفٍ رَقْمٌ خَاصٌّ بِهِ.|После телефонът се разви много и всеки телефон получи свой собствен номер.',
  'وَأَصْبَحَ الْإِنْسَانُ يَسْتَطِيعُ أَنْ يَتَحَدَّثَ إِلَى مَنْ يُرِيدُ فِي بَلَدِهِ وَفِي الْبِلَادِ الْبَعِيدَةِ.|Човек вече можеше да говори с когото поиска в своята страна и в далечни страни.',
  'وَلِلْهَاتِفِ الْيَوْمَ أَشْكَالٌ كَثِيرَةٌ، وَمِنْهَا الْهَاتِفُ الْمَحْمُولُ الَّذِي نَحْمِلُهُ فِي جُيُوبِنَا.|Днес телефонът има много форми, сред тях и мобилният телефон, който носим в джоба си.'],
 w:['مَعْدِنٌ|maʿdinun|метал',

{u:'Част 7',ar:'الْهَاتِفُ (٣)',t:'Телефонът (3)',wk:7,
 r:['أَرَادَ أَحْمَدُ أَنْ يَتَحَدَّثَ بِالْهَاتِفِ مَعَ صَدِيقِهِ، فَسَأَلَ رَجُلًا مَاشِيًا فِي الشَّارِعِ عَنْ مَكَانِ هَاتِفٍ عَامٍّ.|Ахмад искаше да говори по телефона с приятеля си и попита един минувач на улицата къде има обществен телефон.',
  'فَدَلَّهُ الرَّجُلُ عَلَى غُرْفَةِ الْهَاتِفِ، فَدَخَلَهَا وَقَرَأَ التَّعْلِيمَاتِ الْمَكْتُوبَةَ عَلَى الصُّنْدُوقِ.|Мъжът го упъти към телефонната кабина; той влезе и прочете инструкциите, написани на апарата.',
  'رَفَعَ أَحْمَدُ السَّمَّاعَةَ، وَوَضَعَ قِطْعَةَ نُقُودٍ، وَطَلَبَ الرَّقْمَ، ثُمَّ ضَغَطَ عَلَى الزِّرِّ.|Ахмад вдигна слушалката, пусна монета, набра номера и натисна бутона.',
  'وَلٰكِنَّ قِطْعَةَ النُّقُودِ رَجَعَتْ إِلَيْهِ، لِأَنَّ هَاتِفَ صَدِيقِهِ كَانَ مَشْغُولًا.|Но монетата му се върна, защото телефонът на приятеля му беше зает.',
  'فَانْتَظَرَ قَلِيلًا، ثُمَّ طَلَبَ الرَّقْمَ مَرَّةً ثَانِيَةً، فَأَجَابَهُ صَدِيقُهُ وَتَحَدَّثَ مَعَهُ.|Почака малко, после набра номера втори път; приятелят му отговори и той поговори с него.',
  'وَفِي الْمَسَاءِ أَرَادَ أَحْمَدُ أَنْ يَتَّصِلَ بِأَخِيهِ الَّذِي يَدْرُسُ فِي أَمْرِيكَا، فَذَهَبَ إِلَى مَكْتَبِ الْهَاتِفِ.|Вечерта Ахмад поиска да се обади на брат си, който учи в Америка, и отиде в телефонната служба.',
  'وَتَقَدَّمَ إِلَى الْمُوَظَّفِ وَأَعْطَاهُ الرَّقْمَ، فَطَلَبَ مِنْهُ الْمُوَظَّفُ أَنْ يَجْلِسَ قَلِيلًا عَلَى مَقْعَدٍ.|Приближи се до служителя и му даде номера, а служителят го помоли да поседне малко на една седалка.',
  'وَبَعْدَ قَلِيلٍ وَصَلَهُ الْمُوَظَّفُ بِأَخِيهِ، وَنَادَاهُ: تَكَلَّمْ مِنْ غُرْفَةِ الْهَاتِفِ الْأُولَى.|Малко след това служителят го свърза с брат му и го извика: „Говорете от първата кабина.“',
  'فَدَخَلَ أَحْمَدُ الْغُرْفَةَ وَرَفَعَ السَّمَّاعَةَ، فَسَمِعَ صَوْتَ أَخِيهِ وَفَرِحَ كَثِيرًا.|Ахмад влезе в кабината, вдигна слушалката, чу гласа на брат си и много се зарадва.',
  'وَبَعْدَ الْمُكَالَمَةِ أَعْطَاهُ الْمُوَظَّفُ وَرَقَةً فِيهَا الرَّقْمُ وَعَدَدُ الدَّقَائِقِ، فَدَفَعَ النُّقُودَ وَخَرَجَ.|След разговора служителят му даде листче с номера и броя на минутите; той плати и излезе.'],

{u:'Част 8',ar:'مُوسَى وَفِرْعَوْنُ (١)',t:'Муса и фараонът (1)',wk:8,
 r:['كَانَ مُلُوكُ مِصْرَ فِي الزَّمَنِ الْقَدِيمِ يُسَمَّوْنَ الْفَرَاعِنَةَ، وَكَانَ أَحَدُ هٰؤُلَاءِ الْفَرَاعِنَةِ مَلِكًا ظَالِمًا.|В древността царете на Египет се наричали фараони, а един от тези фараони бил жесток и несправедлив цар.',
  'وَكَانَ فِرْعَوْنُ يُعَذِّبُ بَنِي إِسْرَائِيلَ، فَيَجْعَلُهُمْ يَعْمَلُونَ لَهُ فِي قُصُورِهِ وَمَزَارِعِهِ.|Фараонът измъчвал израилтяните и ги карал да работят за него в дворците и нивите му.',
  'وَذَاتَ يَوْمٍ قَالَ لَهُ الْمُنَجِّمُونَ: سَيُولَدُ طِفْلٌ مِنْ بَنِي إِسْرَائِيلَ يَقْضِي عَلَى مُلْكِكَ.|Един ден звездобройците му казали: „Ще се роди момче от израилтяните, което ще сложи край на царството ти.“',
  'فَخَافَ فِرْعَوْنُ، وَأَمَرَ جُنُودَهُ أَنْ يَذْبَحُوا كُلَّ ذَكَرٍ يُولَدُ لِبَنِي إِسْرَائِيلَ.|Фараонът се уплашил и заповядал на войниците си да колят всяко момче, което се роди на израилтяните.',
  'وَفِي ذٰلِكَ الْوَقْتِ وُلِدَ مُوسَى عَلَيْهِ السَّلَامُ، فَخَافَتْ أُمُّهُ عَلَيْهِ، فَأَوْحَى اللّٰهُ إِلَيْهَا أَنْ تَضَعَهُ فِي صُنْدُوقٍ وَتُلْقِيَهُ فِي النَّهْرِ.|По това време се родил Муса (мир нему). Майка му се уплашила за него и Аллах ѝ вдъхнал да го сложи в сандък и да го пусне в реката.',
  'فَفَعَلَتْ، وَقَالَتْ لِأُخْتِهِ: امْشِي عَلَى شَاطِئِ النَّهْرِ وَانْظُرِي إِلَيْهِ مِنْ بَعِيدٍ.|Тя направила така и казала на сестра му: „Върви по брега на реката и го наблюдавай отдалеч.“',
  'فَسَارَ الصُّنْدُوقُ فِي النَّهْرِ حَتَّى وَصَلَ إِلَى قَصْرِ فِرْعَوْنَ، فَأَخَذَتْهُ الْجَوَارِي إِلَى امْرَأَةِ فِرْعَوْنَ.|Сандъкът плувал по реката, докато стигнал до двореца на фараона, и прислужниците го занесли на жената на фараона.',
  'فَلَمَّا رَأَتِ الطِّفْلَ أَحَبَّتْهُ وَقَالَتْ لِفِرْعَوْنَ: ﴿قُرَّتُ عَيْنٍ لِي وَلَكَ لَا تَقْتُلُوهُ عَسَى أَنْ يَنْفَعَنَا أَوْ نَتَّخِذَهُ وَلَدًا﴾، فَاتَّخَذَاهُ وَلَدًا.|Когато видяла детето, тя го обикнала и казала на фараона: „Радост за очите ми и твоите! Не го убивайте, може да ни е от полза или да го вземем за син“ (28:9, превод на смисъла). И те го взели за син.',
  'ثُمَّ أَحْضَرُوا لَهُ الْمَرَاضِعَ لِتُرْضِعَهُ، وَلٰكِنَّهُ رَفَضَ أَنْ يَرْضَعَ مِنْ أَيِّ مُرْضِعٍ.|После му довели кърмачки, за да го кърмят, но той отказвал да суче от която и да е кърмачка.',
  'فَقَالَتْ أُخْتُهُ: أَنَا أَدُلُّكُمْ عَلَى امْرَأَةٍ تُرْضِعُهُ، فَجَاءَتْ بِأُمِّهِ، فَرَضَعَ مِنْهَا، وَرَجَعَ مُوسَى إِلَى أُمِّهِ فَفَرِحَتْ بِهِ.|Тогава сестра му казала: „Аз ще ви покажа жена, която ще го кърми“, и довела майка му. Той засукал от нея — така Муса се върнал при майка си и тя се зарадвала.'],

 q:['مَاذَا قَالَ الْمُنَجِّمُونَ لِفِرْعَوْنَ؟|إِنَّ طِفْلًا مِنْ بَنِي إِسْرَائِيلَ سَيَقْضِي عَلَى مُلْكِهِ|إِنَّ النَّهْرَ سَيَجِفُّ|إِنَّ ابْنَهُ سَيُصْبِحُ مَلِكًا',
  'بِمَاذَا أَمَرَ فِرْعَوْنُ جُنُودَهُ؟|أَنْ يَذْبَحُوا كُلَّ ذَكَرٍ يُولَدُ|أَنْ يَبْنُوا قَصْرًا جَدِيدًا|أَنْ يَذْبَحُوا كُلَّ الْبَنَاتِ',
  'مَاذَا أَوْحَى اللّٰهُ إِلَى أُمِّ مُوسَى؟|أَنْ تَضَعَهُ فِي صُنْدُوقٍ وَتُلْقِيَهُ فِي النَّهْرِ|أَنْ تَهْرُبَ بِهِ إِلَى بَلَدٍ آخَرَ|أَنْ تُعْطِيَهُ لِلْجُنُودِ',
  'مَنْ وَجَدَ الصُّنْدُوقَ؟|جَوَارِي قَصْرِ فِرْعَوْنَ|جُنُودُ فِرْعَوْنَ|الْمُنَجِّمُونَ',
  'كَيْفَ رَجَعَ مُوسَى إِلَى أُمِّهِ؟|دَلَّتْهُمْ أُخْتُهُ عَلَيْهَا لِتُرْضِعَهُ|أَخَذَهُ أَبُوهُ مِنَ الْقَصْرِ|هَرَبَ مِنَ الْقَصْرِ وَحْدَهُ'],

  'اتَّخَذَ فِرْعَوْنُ وَامْرَأَتُهُ مُوسَى وَلَدًا.|1|Фараонът и жена му взеха Муса за син.'],

 p:['وَضَعَتْ أُمُّ مُوسَى طِفْلَهَا فِي الصُّنْدُوقِ.|ضَعِ السُّؤَالَ الْمُنَاسِبَ|أَيْنَ وَضَعَتْ أُمُّ مُوسَى طِفْلَهَا؟|Къде сложи майката на Муса детето си?|مَتَى وَضَعَتْ أُمُّ مُوسَى طِفْلَهَا؟|مَنْ وَضَعَتْ أُمُّ مُوسَى طِفْلَهَا؟',
  'فِرْعَوْنُ ظَالِمٌ.|أَدْخِلْ «كَانَ»|كَانَ فِرْعَوْنُ ظَالِمًا.|Фараонът беше несправедлив.|كَانَ فِرْعَوْنُ ظَالِمٌ.|كَانَ فِرْعَوْنَ ظَالِمًا.',

  'كَيْفَ وَصَلَ مُوسَى إِلَى قَصْرِ فِرْعَوْنَ؟|Как Муса стигна до двореца на фараона?',
  'كَيْفَ رَجَعَ مُوسَى إِلَى أُمِّهِ؟|Как Муса се върна при майка си?']

{u:'Част 8',ar:'مُوسَى وَفِرْعَوْنُ (٢)',t:'Муса и фараонът (2)',wk:8,
 r:['كَبِرَ مُوسَى عَلَيْهِ السَّلَامُ وَصَارَ شَابًّا قَوِيًّا.|Муса (мир нему) порасна и стана силен младеж.',
  'وَذَاتَ يَوْمٍ مَشَى فِي الْمَدِينَةِ، فَرَأَى رَجُلَيْنِ يَقْتَتِلَانِ: أَحَدُهُمَا إِسْرَائِيلِيٌّ وَالْآخَرُ قِبْطِيٌّ.|Един ден вървял из града и видял двама мъже да се бият: единият израилтянин, а другият копт.',
  'فَطَلَبَ الْإِسْرَائِيلِيُّ مِنْ مُوسَى أَنْ يُسَاعِدَهُ، فَضَرَبَ مُوسَى الْقِبْطِيَّ فَمَاتَ.|Израилтянинът помолил Муса за помощ; Муса ударил копта и той умрял.',
  'فَحَزِنَ مُوسَى لِمَا حَدَثَ، وَاسْتَغْفَرَ اللّٰهَ كَثِيرًا.|Муса се натъжил за случилото се и дълго молил Аллах за прошка.',
  'وَأَشَاعَ النَّاسُ الْخَبَرَ فِي الْمَدِينَةِ، فَعَلِمَ مُوسَى أَنَّ قَوْمَ فِرْعَوْنَ يُرِيدُونَ قَتْلَهُ، فَخَرَجَ مِنْ مِصْرَ إِلَى مَدْيَنَ.|Хората разгласили новината из града. Муса разбрал, че хората на фараона искат да го убият, и избягал от Египет към Мадян.',
  'وَلَمَّا وَصَلَ إِلَى مَاءِ مَدْيَنَ وَجَدَ النَّاسَ يَسْقُونَ مَوَاشِيَهُمْ، وَرَأَى امْرَأَتَيْنِ تَنْتَظِرَانِ بَعِيدًا عَنِ الزِّحَامِ.|Когато стигнал до водата на Мадян, заварил хората да поят добитъка си и видял две жени, които чакали настрана от навалицата.',
  'فَسَأَلَهُمَا عَنْ أَمْرِهِمَا، فَقَالَتَا: لَا نَسْتَطِيعُ أَنْ نَسْقِيَ مَاشِيَتَنَا حَتَّى يَذْهَبَ النَّاسُ، وَأَبُونَا رَجُلٌ كَبِيرٌ فِي السِّنِّ.|Попитал ги какво им е, а те отговорили: „Не можем да напоим стадото си, докато хората не си отидат, а баща ни е много възрастен.“',
  'فَسَقَى لَهُمَا مُوسَى، ثُمَّ جَلَسَ فِي ظِلِّ شَجَرَةٍ.|Муса напоил стадото им, после седнал на сянка под едно дърво.',
  'فَدَعَاهُ أَبُوهُمَا، وَعَرَضَ عَلَيْهِ أَنْ يُزَوِّجَهُ إِحْدَى ابْنَتَيْهِ عَلَى أَنْ يَعْمَلَ عِنْدَهُ ثَمَانِيَ سَنَوَاتٍ، فَوَافَقَ مُوسَى.|Баща им го повикал и му предложил да го ожени за една от двете си дъщери, при условие че работи при него осем години; Муса се съгласил.',
  'وَبَعْدَ تِلْكَ السَّنَوَاتِ سَافَرَ مُوسَى بِأَهْلِهِ، فَرَأَى نَارًا فِي الْوَادِي عِنْدَ جَبَلِ الطُّورِ.|След тези години Муса потеглил на път със семейството си и видял огън в долината до планината Тур.'],
 w:['اقْتَتَلَ / يَقْتَتِلُ|iqtatala / yaqtatilu|бият се (един с друг)',
  'قِبْطِيٌّ|qibṭiyyun|копт (египтянин)',
  'إِسْرَائِيلِيٌّ|isrāʾīliyyun|израилтянин',
  'حَزِنَ / يَحْزَنُ|ḥazina / yaḥzanu|натъжава се',
  'اسْتَغْفَرَ / يَسْتَغْفِرُ|istaġfara / yastaġfiru|моли за прошка',
  'أَشَاعَ / يُشِيعُ|ašāʿa / yušīʿu|разгласява, разпространява',
  'سَقَى / يَسْقِي|saqā / yasqī|напоява',
  'مَاشِيَةٌ (ج) مَوَاشٍ|māšiyatun (мн. ч. mawāšin)|добитък, стадо',
  'زِحَامٌ|ziḥāmun|навалица, тълпа',
  'ظِلٌّ|ẓillun|сянка',
  'زَوَّجَ / يُزَوِّجُ|zawwaǧa / yuzawwiǧu|оженва (някого за)',
  'وَافَقَ / يُوَافِقُ|wāfaqa / yuwāfiqu|съгласява се',
  'وَادٍ (الْوَادِي)|wādin (al-wādī)|долина',
  'الطُّورُ|aṭ-ṭūru|(планината) Тур'],
 q:['مَنِ الرَّجُلَانِ اللَّذَانِ رَآهُمَا مُوسَى يَقْتَتِلَانِ؟|إِسْرَائِيلِيٌّ وَقِبْطِيٌّ|قِبْطِيَّانِ|إِسْرَائِيلِيَّانِ',
  'مَاذَا فَعَلَ مُوسَى بَعْدَ مَوْتِ الْقِبْطِيِّ؟|حَزِنَ وَاسْتَغْفَرَ اللّٰهَ|فَرِحَ وَضَحِكَ|ذَهَبَ إِلَى فِرْعَوْنَ',

{u:'Част 9',ar:'الْوِقَايَةُ خَيْرٌ مِنَ الْعِلَاجِ',t:'Профилактиката е по-добра от лечението',wk:9,
 r:['زَارَ سُلَيْمَانُ صَدِيقَهُ الْمَرِيضَ فِي الْمُسْتَشْفَى، فَسَأَلَ الطَّبِيبَ: مَاذَا أَصَابَهُ يَا دُكْتُورُ؟|Сюлейман посети болния си приятел в болницата и попита лекаря: „Какво му има, докторе?“',
  'فَقَالَ الطَّبِيبُ: إِنَّهُ مُصَابٌ بِمَرَضٍ فِي الْكَبِدِ.|Лекарят отговори: „Той има болест на черния дроб.“',
  'قَالَ سُلَيْمَانُ: وَمَا سَبَبُ ذٰلِكَ؟ فَقَالَ الطَّبِيبُ: لِهٰذَا الْمَرَضِ أَسْبَابٌ عَدِيدَةٌ، مِنْهَا انْتِقَالُ الْجَرَاثِيمِ مِنْ إِنْسَانٍ مَرِيضٍ إِلَى إِنْسَانٍ صَحِيحٍ.|„А каква е причината?“ — попита Сюлейман. Лекарят каза: „Тази болест има много причини, например преминаването на микроби от болен човек към здрав.“',
  'وَمِنْهَا الذُّبَابُ الَّذِي يَنْقُلُ الْعَدْوَى إِلَى الطَّعَامِ، وَمِنْهَا اسْتِعْمَالُ الْأَدَوَاتِ الْمُلَوَّثَةِ كَالْمَنَاشِفِ وَالْمَلَابِسِ.|„Също и мухите, които пренасят заразата върху храната, и използването на замърсени вещи като кърпи и дрехи.“',
  'فَيَجِبُ عَلَى الْإِنْسَانِ أَنْ يَحْرِصَ عَلَى النَّظَافَةِ، لِأَنَّ النَّظَافَةَ تَقْتُلُ الْجَرَاثِيمَ.|„Затова човек трябва да държи на чистотата, защото чистотата убива микробите.“',
  'وَعَلَيْهِ أَنْ يَتَجَنَّبَ الِاخْتِلَاطَ بِذَوِي الْأَمْرَاضِ الْمُعْدِيَةِ.|„И трябва да избягва близкия контакт с болни от заразни болести.“',
  'وَقَدْ قَالَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ: «إِذَا سَمِعْتُمْ بِالطَّاعُونِ بِأَرْضٍ فَلَا تَدْخُلُوهَا، وَإِذَا وَقَعَ بِأَرْضٍ وَأَنْتُمْ بِهَا فَلَا تَخْرُجُوا مِنْهَا».|Пратеникът на Аллах (мир нему) е казал: „Ако чуете за чума в някоя земя, не влизайте в нея, а ако избухне в земя, в която се намирате, не излизайте от нея.“ (Бухари и Муслим)',
  'وَمِنَ الْوِقَايَةِ أَيْضًا التَّطْعِيمُ ضِدَّ الْأَمْرَاضِ الْخَطِيرَةِ، كَالْجُدَرِيِّ وَالْكُولِيرَا وَشَلَلِ الْأَطْفَالِ.|Към профилактиката спада и ваксинирането срещу опасни болести като едра шарка, холера и детски паралич.',
  'وَإِذَا مَرِضَ الْإِنْسَانُ فَعَلَيْهِ أَنْ يَذْهَبَ إِلَى الطَّبِيبِ لِيُعْطِيَهُ الدَّوَاءَ الَّذِي يَشْفِيهِ بِإِذْنِ اللّٰهِ.|А когато човек се разболее, трябва да отиде на лекар, за да му даде лекарство, което с позволението на Аллах ще го излекува.',
  'فَالْوِقَايَةُ خَيْرٌ مِنَ الْعِلَاجِ، وَكَمَا يَقُولُ الْحُكَمَاءُ: «دِرْهَمُ وِقَايَةٍ خَيْرٌ مِنْ قِنْطَارِ عِلَاجٍ».|Профилактиката е по-добра от лечението; както казват мъдреците: „Драхма профилактика е по-добра от кантар лечение.“'],

  'كَيْفَ يَنْقُلُ الذُّبَابُ الْعَدْوَى؟|يَنْقُلُهَا إِلَى الطَّعَامِ|يَنْقُلُهَا إِلَى الْمَنَاشِفِ فَقَطْ|لَا يَنْقُلُ الذُّبَابُ الْعَدْوَى',

  'ضِدَّ أَيِّ الْأَمْرَاضِ يَكُونُ التَّطْعِيمُ؟|ضِدَّ الْجُدَرِيِّ وَالْكُولِيرَا وَشَلَلِ الْأَطْفَالِ|ضِدَّ أَمْرَاضِ الْكَبِدِ فَقَطْ|ضِدَّ الْبَرْدِ وَالصُّدَاعِ',

 p:['لِكَيْ يَتَجَنَّبَ الْإِنْسَانُ الْأَمْرَاضَ عَلَيْهِ أَنْ يَهْتَمَّ بِصِحَّتِهِ.|ضَعْ «هِيَ» بَدَلَ «الْإِنْسَانُ»|لِكَيْ تَتَجَنَّبَ الْأَمْرَاضَ عَلَيْهَا أَنْ تَهْتَمَّ بِصِحَّتِهَا.|За да избегне болестите, тя трябва да се грижи за здравето си.|لِكَيْ تَتَجَنَّبَ الْأَمْرَاضَ عَلَيْهِ أَنْ يَهْتَمَّ بِصِحَّتِهِ.|لِكَيْ يَتَجَنَّبَ الْأَمْرَاضَ عَلَيْهَا أَنْ تَهْتَمَّ بِصِحَّتِهِ.',
  'لِكَيْ يَتَجَنَّبَ الْإِنْسَانُ الْأَمْرَاضَ عَلَيْهِ أَنْ يَهْتَمَّ بِصِحَّتِهِ.|ضَعْ «نَحْنُ» بَدَلَ «الْإِنْسَانُ»|لِكَيْ نَتَجَنَّبَ الْأَمْرَاضَ عَلَيْنَا أَنْ نَهْتَمَّ بِصِحَّتِنَا.|За да избегнем болестите, трябва да се грижим за здравето си.|لِكَيْ نَتَجَنَّبَ الْأَمْرَاضَ عَلَيْكُمْ أَنْ تَهْتَمُّوا بِصِحَّتِكُمْ.|لِكَيْ يَتَجَنَّبُوا الْأَمْرَاضَ عَلَيْهِمْ أَنْ يَهْتَمُّوا بِصِحَّتِهِمْ.',
  'لِكَيْ يَتَجَنَّبَ الْإِنْسَانُ الْأَمْرَاضَ عَلَيْهِ أَنْ يَهْتَمَّ بِصِحَّتِهِ.|ضَعْ «أَنْتُمْ» بَدَلَ «الْإِنْسَانُ»|لِكَيْ تَتَجَنَّبُوا الْأَمْرَاضَ عَلَيْكُمْ أَنْ تَهْتَمُّوا بِصِحَّتِكُمْ.|За да избегнете болестите, трябва да се грижите за здравето си.|لِكَيْ تَتَجَنَّبُونَ الْأَمْرَاضَ عَلَيْكُمْ أَنْ تَهْتَمُّونَ بِصِحَّتِكُمْ.|لِكَيْ تَتَجَنَّبُوا الْأَمْرَاضَ عَلَيْكُمْ أَنْ تَهْتَمَّ بِصِحَّتِكَ.'],

  'ضِدَّ أَيِّ الْأَمْرَاضِ أَخَذْتَ التَّطْعِيمَ؟|Срещу кои болести си ваксиниран?']

{u:'Част 9',ar:'الْإِيثَارُ',t:'Себеотрицанието',wk:9,
 r:['فِي مَوْقِعَةِ الْيَرْمُوكِ انْتَصَرَ الْمُسْلِمُونَ عَلَى الرُّومِ فِي عَهْدِ الْخَلِيفَةِ أَبِي بَكْرٍ الصِّدِّيقِ رَضِيَ اللّٰهُ عَنْهُ.|В битката при Ярмук мюсюлманите победили ромеите (византийците) по времето на халифа Абу Бакр ас-Сиддик (Аллах да е доволен от него).',
  'وَبَعْدَ الْمَعْرَكَةِ أَخَذَ جُنْدِيٌّ مُسْلِمٌ قَلِيلًا مِنَ الْمَاءِ، وَأَسْرَعَ يَبْحَثُ عَنِ ابْنِ عَمِّهِ بَيْنَ الْقَتْلَى وَالْجَرْحَى.|След битката един мюсюлмански войник взел малко вода и забързал да търси братовчед си сред убитите и ранените.',
  'فَوَجَدَهُ رَاقِدًا عَلَى الْأَرْضِ يَكَادُ يَمُوتُ، فَقَرَّبَ الْمَاءَ مِنْ فَمِهِ.|Намерил го да лежи на земята почти умиращ и приближил водата до устата му.',
  'وَلٰكِنْ قَبْلَ أَنْ يَشْرَبَ سَمِعَ صَوْتَ جَرِيحٍ آخَرَ يَتَأَلَّمُ وَيَطْلُبُ الْمَاءَ.|Но преди да пие, братовчедът чул гласа на друг ранен, който стенел и молел за вода.',
  'فَأَشَارَ ابْنُ عَمِّهِ إِلَيْهِ أَنْ يَأْخُذَ الْمَاءَ إِلَى ذٰلِكَ الْجَرِيحِ.|Братовчед му му дал знак да занесе водата на онзи ранен.',
  'فَذَهَبَ الْجُنْدِيُّ إِلَيْهِ فَوَجَدَهُ هِشَامَ بْنَ الْعَاصِ، فَلَمَّا قَرَّبَ الْمَاءَ مِنْهُ سَمِعَ هِشَامٌ جَرِيحًا ثَالِثًا يَطْلُبُ الْمَاءَ.|Войникът отишъл при него и видял, че това е Хишам ибн ал-Ас. Когато приближил водата до него, Хишам чул трети ранен да моли за вода.',
  'فَرَفَضَ هِشَامٌ أَنْ يَشْرَبَ، وَأَشَارَ إِلَى الْجُنْدِيِّ أَنْ يَسْقِيَ ذٰلِكَ الْجَرِيحَ.|Хишам отказал да пие и дал знак на войника да напои онзи ранен.',
  'فَأَسْرَعَ الْجُنْدِيُّ إِلَى الْجَرِيحِ الثَّالِثِ، فَوَجَدَهُ قَدْ مَاتَ قَبْلَ أَنْ يَشْرَبَ.|Войникът забързал към третия ранен, но го намерил мъртъв, преди да е пил.',
  'فَرَجَعَ إِلَى هِشَامٍ فَوَجَدَهُ قَدْ مَاتَ، ثُمَّ رَجَعَ إِلَى ابْنِ عَمِّهِ فَوَجَدَهُ قَدْ مَاتَ أَيْضًا.|Върнал се при Хишам — и него намерил мъртъв; после се върнал при братовчед си — и той бил починал.',
  'لَقَدْ مَاتُوا جَمِيعًا عِطَاشًا، وَكُلُّ وَاحِدٍ مِنْهُمْ يُؤْثِرُ أَخَاهُ عَلَى نَفْسِهِ، وَهٰذَا هُوَ الْإِيثَارُ.|Всички умрели жадни, като всеки предпочел брат си пред себе си — това е себеотрицанието (ал-ӣсар).'],

{u:'Част 10',ar:'الْأَشْهُرُ الْحُرُمُ',t:'Свещените месеци',wk:10,
 r:['كَانَتْ قَبَائِلُ الْعَرَبِ فِي قَدِيمِ الزَّمَانِ قَبْلَ الْإِسْلَامِ أَهْلَ حَرْبٍ وَقِتَالٍ.|В древни времена, преди исляма, арабските племена били хора на войната и сраженията.',
  'وَكَانَ بَعْضُهُمْ يُقَاتِلُ بَعْضًا لِأَسْبَابٍ تَافِهَةٍ.|Едни се биели с други по незначителни причини.',
  'فَاضْطَرَبَتِ الْحَيَاةُ، وَانْتَشَرَ الْخَوْفُ، وَعَمَّ الْفَزَعُ بَيْنَ النَّاسِ.|Животът се разстроил, страхът се разпространил и ужасът обхванал хората.',
  'ثُمَّ تَمَّ الِاتِّفَاقُ بَيْنَهُمْ عَلَى تَحْرِيمِ الْقِتَالِ فِي أَرْبَعَةِ أَشْهُرٍ مِنْ كُلِّ عَامٍ.|После се споразумели помежду си да забранят сраженията в четири месеца от всяка година.',
  'وَسُمِّيَتْ هٰذِهِ الْأَشْهُرُ «الْأَشْهُرَ الْحُرُمَ»، لِأَنَّ الْقِتَالَ يَحْرُمُ فِيهَا.|Тези месеци били наречени „свещените месеци“, защото в тях сражението е забранено.',
  'وَهِيَ: الْمُحَرَّمُ، وَرَجَبٌ، وَذُو الْقَعْدَةِ، وَذُو الْحِجَّةِ.|Те са: мухаррам, раджаб, зу-л-ка‘да и зу-л-хиджа.',
  'فَكَانَ الْأَمْنُ يَعُمُّ فِيهَا، وَكَانَ النَّاسُ يُسَافِرُونَ لِلْحَجِّ وَالتِّجَارَةِ دُونَ خَوْفٍ.|В тях настъпвала сигурност и хората пътували за хадж и търговия без страх.',
  'وَلَمَّا جَاءَ الْإِسْلَامُ أَقَرَّ تَحْرِيمَ الْقِتَالِ فِي هٰذِهِ الْأَشْهُرِ، إِلَّا إِذَا كَانَ دِفَاعًا ضِدَّ عُدْوَانٍ.|Когато дошъл ислямът, той потвърдил забраната за сражения в тези месеци, освен ако не става дума за отбрана срещу агресия.',
  'فَالْإِسْلَامُ يَكْرَهُ الْعُدْوَانَ وَالْحَرْبَ، وَيَدْعُو إِلَى السَّلَامِ.|Защото ислямът мрази агресията и войната и призовава към мир.',
  'وَأَشْهُرُ السَّنَةِ الْهِجْرِيَّةِ هِيَ: الْمُحَرَّمُ، صَفَرٌ، رَبِيعٌ الْأَوَّلُ، رَبِيعٌ الْآخِرُ، جُمَادَى الْأُولَى، جُمَادَى الْآخِرَةُ، رَجَبٌ، شَعْبَانُ، رَمَضَانُ، شَوَّالٌ، ذُو الْقَعْدَةِ، ذُو الْحِجَّةِ.|Месеците на хиджрийската година са: мухаррам, сафар, раби‘ ал-аввал, раби‘ ал-ахир, джумада ал-ула, джумада ал-ахира, раджаб, ша‘бан, рамадан, шаввал, зу-л-ка‘да, зу-л-хиджа.'],

 r:['الرِّيَاضَةُ ضَرُورِيَّةٌ وَمُفِيدَةٌ لِلْإِنْسَانِ، وَلِذٰلِكَ يَنْصَحُ الْأَطِبَّاءُ بِمُمَارَسَتِهَا فِي أَوْقَاتٍ مُنَاسِبَةٍ مِنَ النَّهَارِ أَوِ اللَّيْلِ.|Спортът е необходим и полезен за човека, затова лекарите съветват да се практикува в подходящо време през деня или вечерта.',
  'فَهِيَ تُقَوِّي الْعَضَلَاتِ، وَتُنَشِّطُ الْجِسْمَ، وَتُزِيلُ عَنْهُ الْكَسَلَ.|Той укрепва мускулите, ободрява тялото и прогонва мързела.',

  'فَكَانَتِ الْكَعْبَةُ أَمَامَهُ، وَكَانَ بَيْتُ الْمَقْدِسِ أَمَامَهُ أَيْضًا.|Така Каабата беше пред него, а и Байт ал-Макдис (Йерусалим) също беше пред него.',
  'فَلَمَّا هَاجَرَ إِلَى الْمَدِينَةِ تَعَذَّرَ عَلَيْهِ أَنْ يَتَوَجَّهَ إِلَى الْكَعْبَةِ وَإِلَى بَيْتِ الْمَقْدِسِ فِي وَقْتٍ وَاحِدٍ.|Когато се пресели в Медина, му стана невъзможно да се обръща едновременно към Каабата и към Байт ал-Макдис.',
  'فَأَمَرَهُ اللّٰهُ أَنْ يَتَوَجَّهَ فِي صَلَاتِهِ نَحْوَ بَيْتِ الْمَقْدِسِ، فَأَطَاعَ أَمْرَ رَبِّهِ.|Аллах му повели да се обръща в молитвата си към Байт ал-Макдис и той се подчини на повелята на своя Господ.',
  'وَصَلَّى هُوَ وَالْمُسْلِمُونَ نَحْوَ بَيْتِ الْمَقْدِسِ سِتَّةَ عَشَرَ أَوْ سَبْعَةَ عَشَرَ شَهْرًا.|Той и мюсюлманите се молеха към Байт ал-Макдис шестнайсет или седемнайсет месеца.',
  'فَقَالَ الْيَهُودُ: لِمَاذَا يُخَالِفُنَا مُحَمَّدٌ فِي دِينِنَا وَيُصَلِّي نَحْوَ قِبْلَتِنَا؟ لَوْلَا دِينُنَا مَا دَرَى أَيْنَ يَتَّجِهُ!|Тогава юдеите казаха: „Защо Мухаммад се различава от нас по религия, а се моли към нашата кибла? Ако не беше нашата религия, нямаше да знае накъде да се обърне!“',
  'وَكَانَ النَّبِيُّ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ يُحِبُّ أَنْ تَكُونَ قِبْلَتُهُ الْكَعْبَةَ، قِبْلَةَ أَبِيهِ إِبْرَاهِيمَ عَلَيْهِ السَّلَامُ، وَهِيَ أَقْدَمُ الْقِبْلَتَيْنِ.|Пророкът искаше киблата му да бъде Каабата – киблата на неговия праотец Ибрахим (мир нему), която е по-старата от двете кибли.',
  'فَكَانَ يَدْعُو اللّٰهَ بَعْدَ كُلِّ صَلَاةٍ، وَيَرْفَعُ وَجْهَهُ إِلَى السَّمَاءِ يَنْتَظِرُ أَمْرَ رَبِّهِ.|Затова след всяка молитва отправяше мольба към Аллах и вдигаше лице към небето в очакване на повелята на своя Господ.'],
 w:['رُكْنٌ / أَرْكَانٌ|ruknun / arkānun|ъгъл; опора',

  'خَالَفَ / يُخَالِفُ|ḫālafa / yuḫālifu|противоречи, различава се',
  'دَرَى / يَدْرِي|darā / yadrī|знае, узна',
  'قِبْلَةٌ|qiblatun|кибла (посока на молитвата)',

  'دَعَا / يَدْعُو|daʿā / yadʿū|отправи мольба (дуа)',
  'نَحْوَ|naḥwa|към, по посока на'],
 q:['أَيْنَ كَانَ النَّبِيُّ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ يُصَلِّي قَبْلَ الْهِجْرَةِ؟|بَيْنَ رُكْنَيْنِ مِنْ أَرْكَانِ الْكَعْبَةِ|فِي مَسْجِدِ الْقِبْلَتَيْنِ|فِي بَيْتِ الْمَقْدِسِ',
  'مَاذَا تَعَذَّرَ عَلَيْهِ بَعْدَ الْهِجْرَةِ؟|أَنْ يَتَوَجَّهَ إِلَى الْقِبْلَتَيْنِ فِي وَقْتٍ وَاحِدٍ|أَنْ يُصَلِّيَ فِي الْمَسْجِدِ|أَنْ يَدْعُوَ اللّٰهَ',
  'كَمْ شَهْرًا صَلَّى الْمُسْلِمُونَ نَحْوَ بَيْتِ الْمَقْدِسِ؟|سِتَّةَ عَشَرَ أَوْ سَبْعَةَ عَشَرَ شَهْرًا|ثَلَاثَةَ أَشْهُرٍ|عَشْرَ سَنَوَاتٍ',
  'مَاذَا قَالَ الْيَهُودُ؟|لَوْلَا دِينُنَا مَا دَرَى مُحَمَّدٌ أَيْنَ يَتَّجِهُ|قِبْلَتُنَا هِيَ الْكَعْبَةُ|نَحْنُ نُصَلِّي نَحْوَ مَكَّةَ',
  'بِمَاذَا كَانَ النَّبِيُّ يَدْعُو اللّٰهَ بَعْدَ كُلِّ صَلَاةٍ؟|أَنْ تَكُونَ قِبْلَتُهُ الْكَعْبَةَ|أَنْ يَرْجِعَ إِلَى مَكَّةَ سَرِيعًا|أَنْ يُصَلِّيَ نَحْوَ بَيْتِ الْمَقْدِسِ دَائِمًا'],
 tf:['أَمَرَ اللّٰهُ نَبِيَّهُ أَنْ يَتَوَجَّهَ نَحْوَ بَيْتِ الْمَقْدِسِ بَعْدَ الْهِجْرَةِ.|1|Аллах повели на Своя пророк да се обръща към Байт ал-Макдис след хиджрата.',
  'كَانَ النَّبِيُّ يُحِبُّ أَنْ تَكُونَ صَلَاتُهُ نَحْوَ الْكَعْبَةِ.|1|Пророкът искаше молитвата му да бъде към Каабата.',
  'كَانَتِ الْكَعْبَةُ خَلْفَ النَّبِيِّ وَهُوَ يُصَلِّي فِي مَكَّةَ.|0|Каабата беше зад Пророка, когато се молеше в Мека.',
  'الْكَعْبَةُ أَحْدَثُ الْقِبْلَتَيْنِ.|0|Каабата е по-новата от двете кибли.'],

 o:['أَطَاعَ|عَصَى','أَقْدَمُ|أَحْدَثُ'],
 sp:['رُكْنٌ|أَرْكَانٌ','شَهْرٌ|أَشْهُرٌ'],
 p:['مَا وَجَدَ إِبْرَاهِيمُ حَافِلَةً؛ لِذٰلِكَ تَعَذَّرَ عَلَيْهِ ...|الْوُصُولُ مُبَكِّرًا|مَا وَجَدَ إِبْرَاهِيمُ حَافِلَةً؛ لِذٰلِكَ تَعَذَّرَ عَلَيْهِ الْوُصُولُ مُبَكِّرًا.|Ибрахим не намери автобус, затова не успя да пристигне рано.|مَا وَجَدَ إِبْرَاهِيمُ حَافِلَةً؛ لِذٰلِكَ تَعَذَّرَ عَلَيْهِ الْوُصُولَ مُبَكِّرًا.|مَا وَجَدَ إِبْرَاهِيمُ حَافِلَةً؛ لِذٰلِكَ تَعَذَّرَتْ عَلَيْهِ الْوُصُولُ مُبَكِّرًا.',
  'الطَّرِيقُ مُزْدَحِمٌ بِالسَّيَّارَاتِ؛ لِذٰلِكَ تَعَذَّرَ عَلَى فَاطِمَةَ ...|حُضُورُ الدَّرْسِ الْأَوَّلِ|الطَّرِيقُ مُزْدَحِمٌ بِالسَّيَّارَاتِ؛ لِذٰلِكَ تَعَذَّرَ عَلَى فَاطِمَةَ حُضُورُ الدَّرْسِ الْأَوَّلِ.|Пътят е задръстен с коли, затова Фатима не успя да присъства на първия урок.|الطَّرِيقُ مُزْدَحِمٌ بِالسَّيَّارَاتِ؛ لِذٰلِكَ تَعَذَّرَ عَلَى فَاطِمَةَ حُضُورَ الدَّرْسِ الْأَوَّلِ.|الطَّرِيقُ مُزْدَحِمٌ بِالسَّيَّارَاتِ؛ لِذٰلِكَ تَعَذَّرَ عَلَى فَاطِمَةُ حُضُورُ الدَّرْسِ الْأَوَّلِ.',
  'كَانَ النَّبِيُّ يُصَلِّي نَحْوَ بَيْتِ الْمَقْدِسِ.|ضَعِ السُّؤَالَ: إِلَى أَيْنَ؟|إِلَى أَيْنَ كَانَ النَّبِيُّ يُصَلِّي؟|Накъде се молеше Пророкът?|مَتَى كَانَ النَّبِيُّ يُصَلِّي؟|إِلَى أَيْنَ كَانَتِ النَّبِيُّ يُصَلِّي؟'],
 tk:['كَيْفَ كَانَ النَّبِيُّ يُصَلِّي فِي مَكَّةَ قَبْلَ الْهِجْرَةِ؟|Как се молеше Пророкът в Мека преди хиджрата?',
  'إِلَى أَيْنَ صَلَّى الْمُسْلِمُونَ بَعْدَ الْهِجْرَةِ؟ وَكَمْ شَهْرًا؟|Накъде се молеха мюсюлманите след хиджрата и колко месеца?',
  'مَاذَا قَالَ الْيَهُودُ؟|Какво казаха юдеите?',
  'مَاذَا كَانَ النَّبِيُّ يُحِبُّ؟ وَلِمَاذَا؟|Какво искаше Пророкът и защо?']
},
{u:'Част 11',ar:'الْقِبْلَةُ (٢)',t:'Киблата (2)',wk:11,
 r:['اسْتَجَابَ اللّٰهُ دُعَاءَ نَبِيِّهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ، وَأَنْزَلَ عَلَيْهِ قَوْلَهُ تَعَالَى: «قَدْ نَرَىٰ تَقَلُّبَ وَجْهِكَ فِي السَّمَاءِ فَلَنُوَلِّيَنَّكَ قِبْلَةً تَرْضَاهَا فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ».|Аллах отвърна на мольбата на Своя пророк и му низпосла словата Си (смисълът): „Виждаме как обръщаш лицето си към небето. Ще те обърнем към кибла, която ще ти е угодна. Обърни лицето си към Свещената джамия“ (2:144).',
  'وَكَانَ النَّبِيُّ يُصَلِّي بِأَصْحَابِهِ فِي مَسْجِدِ بَنِي سَلِمَةَ عِنْدَمَا نَزَلَ عَلَيْهِ الْوَحْيُ يَأْمُرُهُ بِالتَّوَجُّهِ نَحْوَ الْكَعْبَةِ.|Пророкът водеше молитвата на сподвижниците си в джамията на Бану Салима, когато му слезе откровението, повеляващо му да се обърне към Каабата.',
  'فَتَوَجَّهَ نَحْوَ الْكَعْبَةِ وَهُوَ فِي الصَّلَاةِ، وَتَوَجَّهَ الْمُسْلِمُونَ مَعَهُ.|И той се обърна към Каабата, докато беше в молитва, а мюсюлманите се обърнаха заедно с него.',
  'وَلِذٰلِكَ سُمِّيَ هٰذَا الْمَسْجِدُ مَسْجِدَ الْقِبْلَتَيْنِ، وَهُوَ فِي الْجِهَةِ الْغَرْبِيَّةِ مِنَ الْمَدِينَةِ الْمُنَوَّرَةِ.|Затова тази джамия е наречена „Джамията на двете кибли“; тя се намира в западната част на Медина.',
  'وَمُنْذُ ذٰلِكَ الْيَوْمِ يَتَّجِهُ الْمُسْلِمُونَ فِي جَمِيعِ أَنْحَاءِ الْعَالَمِ فِي صَلَاتِهِمْ نَحْوَ الْكَعْبَةِ.|От онзи ден мюсюлманите по целия свят се обръщат в молитвата си към Каабата.',
  'وَيَقُولُ عُلَمَاءُ الْفِقْهِ: لَا تَصِحُّ الصَّلَاةُ إِلَّا إِذَا كَانَ الْمُصَلِّي مُتَوَجِّهًا إِلَى جِهَةِ الْكَعْبَةِ.|Учените по фикх казват: молитвата не е валидна, освен ако молещият се е обърнат в посока на Каабата.',
  'وَمَنْ جَهِلَ جِهَةَ الْقِبْلَةِ اجْتَهَدَ بِحَسَبِ وُسْعِهِ وَصَلَّى، وَصَلَاتُهُ صَحِيحَةٌ.|Който не знае посоката на киблата, се старае според възможностите си да я определи и се моли, и молитвата му е валидна.',
  'لِأَنَّ اللّٰهَ تَعَالَى يَقُولُ: «لَا يُكَلِّفُ اللّٰهُ نَفْسًا إِلَّا وُسْعَهَا».|Защото Всевишният Аллах казва (смисълът): „Аллах не натоварва никоя душа с повече от възможностите ѝ“ (2:286).'],
 w:['اسْتَجَابَ / يَسْتَجِيبُ|istaǧāba / yastaǧību|отвърна (на мольба), откликна',
  'مُتَوَجِّهٌ|mutawaǧǧihun|обърнат (към)',

  'الْفِقْهُ|al-fiqhu|фикх (ислямско право)',

  'غَرْبِيٌّ / غَرْبِيَّةٌ|ġarbiyyun / ġarbiyyatun|западен, западна',

 q:['مَتَى نَزَلَ الْوَحْيُ عَلَى النَّبِيِّ يَأْمُرُهُ بِالتَّوَجُّهِ نَحْوَ الْكَعْبَةِ؟|وَهُوَ يُصَلِّي فِي مَسْجِدِ بَنِي سَلِمَةَ|وَهُوَ فِي مَكَّةَ قَبْلَ الْهِجْرَةِ|وَهُوَ فِي الطَّرِيقِ إِلَى الْحَجِّ',
  'لِمَاذَا سُمِّيَ مَسْجِدُ بَنِي سَلِمَةَ مَسْجِدَ الْقِبْلَتَيْنِ؟|لِأَنَّ الْمُسْلِمِينَ صَلَّوْا فِيهِ إِلَى الْقِبْلَتَيْنِ فِي صَلَاةٍ وَاحِدَةٍ|لِأَنَّ لَهُ بَابَيْنِ|لِأَنَّهُ قَرِيبٌ مِنْ بَيْتِ الْمَقْدِسِ',
  'أَيْنَ يَقَعُ مَسْجِدُ الْقِبْلَتَيْنِ؟|فِي الْجِهَةِ الْغَرْبِيَّةِ مِنَ الْمَدِينَةِ|فِي الْجِهَةِ الشَّرْقِيَّةِ مِنْ مَكَّةَ|فِي وَسَطِ بَيْتِ الْمَقْدِسِ',
  'مَتَى تَصِحُّ الصَّلَاةُ؟|إِذَا كَانَ الْمُصَلِّي مُتَوَجِّهًا إِلَى جِهَةِ الْكَعْبَةِ|إِذَا كَانَ الْمُصَلِّي فِي الْمَسْجِدِ فَقَطْ|إِذَا صَلَّى الْمُصَلِّي وَحْدَهُ',
  'مَاذَا يَفْعَلُ مَنْ جَهِلَ جِهَةَ الْقِبْلَةِ؟|يَجْتَهِدُ وَيُصَلِّي|يَتْرُكُ الصَّلَاةَ|يَنْتَظِرُ حَتَّى يَرْجِعَ إِلَى بَيْتِهِ'],
 tf:['اسْتَجَابَ اللّٰهُ دُعَاءَ نَبِيِّهِ.|1|Аллах отвърна на мольбата на Своя пророк.',
  'تَوَجَّهَ النَّبِيُّ نَحْوَ الْكَعْبَةِ بَعْدَ أَنْ أَتَمَّ الصَّلَاةَ.|0|Пророкът се обърна към Каабата, след като завърши молитвата.',
  'يَقَعُ مَسْجِدُ الْقِبْلَتَيْنِ فِي مَكَّةَ.|0|Джамията на двете кибли се намира в Мека.',
  'مَنْ جَهِلَ جِهَةَ الْقِبْلَةِ وَاجْتَهَدَ صَحَّتْ صَلَاتُهُ.|1|Който не знае посоката на киблата и се постарае да я определи, молитвата му е валидна.'],
 f:['___ اللّٰهُ دُعَاءَ نَبِيِّهِ.|اسْتَجَابَ|اجْتَهَدَ|جَهِلَ',

 p:['نَزَلَ الْوَحْيُ عَلَى النَّبِيِّ وَهُوَ فِي الصَّلَاةِ.|ضَعِ السُّؤَالَ: مَتَى؟|مَتَى نَزَلَ الْوَحْيُ عَلَى النَّبِيِّ؟|Кога слезе откровението на Пророка?|أَيْنَ نَزَلَ الْوَحْيُ عَلَى النَّبِيِّ؟|مَتَى نَزَلَتِ الْوَحْيُ عَلَى النَّبِيِّ؟',
  'كَانَ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ يُصَلِّي فِي مَسْجِدِ بَنِي سَلِمَةَ.|ضَعِ السُّؤَالَ: أَيْنَ؟|أَيْنَ كَانَ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ يُصَلِّي؟|Къде се молеше Пророкът (мир нему)?|أَيْنَ كَانَ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ يُصَلُّونَ؟|مَتَى كَانَ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ يُصَلِّي؟',
  'يَقَعُ مَسْجِدُ الْقِبْلَتَيْنِ فِي الْجِهَةِ الْغَرْبِيَّةِ مِنَ الْمَدِينَةِ.|ضَعِ السُّؤَالَ: فِي أَيِّ جِهَةٍ؟|فِي أَيِّ جِهَةٍ مِنَ الْمَدِينَةِ يَقَعُ مَسْجِدُ الْقِبْلَتَيْنِ؟|В коя част на Медина се намира Джамията на двете кибли?|فِي أَيِّ جِهَةٌ مِنَ الْمَدِينَةِ يَقَعُ مَسْجِدُ الْقِبْلَتَيْنِ؟|لِمَاذَا يَقَعُ مَسْجِدُ الْقِبْلَتَيْنِ فِي الْمَدِينَةِ؟'],
 tk:['إِلَى أَيْنَ كَانَ النَّبِيُّ يُصَلِّي بَعْدَ الْهِجْرَةِ؟|Накъде се молеше Пророкът след хиджрата?',
  'فِي أَيِّ مَسْجِدٍ كَانَ يُصَلِّي عِنْدَمَا نَزَلَ الْوَحْيُ بِالتَّوَجُّهِ نَحْوَ الْكَعْبَةِ؟|В коя джамия се молеше, когато слезе откровението да се обърне към Каабата?',
  'أَيْنَ يَقَعُ مَسْجِدُ الْقِبْلَتَيْنِ؟ وَلِمَاذَا سُمِّيَ بِهٰذَا الِاسْمِ؟|Къде се намира Джамията на двете кибли и защо се нарича така?',
  'مَاذَا يَفْعَلُ الْمُسْلِمُ إِذَا لَمْ يَعْرِفْ جِهَةَ الْقِبْلَةِ؟|Какво прави мюсюлманинът, ако не знае посоката на киблата?']
},
{u:'Част 12',ar:'صُلْحُ الْحُدَيْبِيَةِ',t:'Примирието от Худайбия',wk:12,
 r:['مَضَتْ أَعْوَامٌ بَعْدَ هِجْرَةِ الرَّسُولِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ إِلَى الْمَدِينَةِ، وَكَانَ الْمُسْلِمُونَ فِي شَوْقٍ شَدِيدٍ إِلَى رُؤْيَةِ مَكَّةَ.|Минаха години след преселението на Пратеника в Медина и мюсюлманите силно копнееха да видят Мека.',
  'وَفِي لَيْلَةٍ مِنَ اللَّيَالِي رَأَى النَّبِيُّ فِي نَوْمِهِ رُؤْيَا أَدْخَلَتِ السُّرُورَ عَلَى نَفْسِهِ.|Една нощ Пророкът видя насън видение, което го изпълни с радост.',
  'رَأَى أَنَّهُ وَأَصْحَابَهُ يَدْخُلُونَ الْمَسْجِدَ الْحَرَامَ آمِنِينَ، مُحَلِّقِينَ رُؤُوسَهُمْ وَمُقَصِّرِينَ، لَا يَخَافُونَ.|Видя, че той и сподвижниците му влизат в Свещената джамия в безопасност, с обръснати или подстригани глави, без да се боят.',
  'فَقَصَّ الرُّؤْيَا عَلَى أَصْحَابِهِ فَفَرِحُوا، ثُمَّ خَرَجُوا مَعَهُ فِي ذِي الْقَعْدَةِ مِنَ السَّنَةِ السَّادِسَةِ لِأَدَاءِ الْعُمْرَةِ.|Разказа видението на сподвижниците си и те се зарадваха; после тръгнаха с него през месец зу-л-ка‘да на шестата година, за да извършат умра.',
  'فَلَمَّا وَصَلُوا إِلَى مَكَانٍ قَرِيبٍ مِنْ مَكَّةَ يُسَمَّى الْحُدَيْبِيَةَ، عَلِمَ الْمُشْرِكُونَ مِنْ قُرَيْشٍ بِقُدُومِهِمْ، فَمَنَعُوهُمْ مِنْ دُخُولِ مَكَّةَ وَاسْتَعَدُّوا لِقِتَالِهِمْ.|Когато стигнаха до място близо до Мека, наречено ал-Худайбия, езичниците от Курайш научиха за идването им, попречиха им да влязат в Мека и се приготвиха да се бият с тях.',
  'لٰكِنَّ الرَّسُولَ رَفَضَ الْحَرْبَ وَتَمَسَّكَ بِالسَّلَامِ، وَاتَّفَقَ مَعَهُمْ عَلَى أَنْ يَرْجِعَ الْمُسْلِمُونَ إِلَى الْمَدِينَةِ فِي ذٰلِكَ الْعَامِ.|Но Пратеникът отказа войната, придържаше се към мира и се споразумя с тях мюсюлманите да се върнат в Медина през тази година.',
  'وَأَنْ يَأْتُوا فِي الْعَامِ الْقَادِمِ، فَتُخْلِيَ لَهُمْ قُرَيْشٌ مَكَّةَ ثَلَاثَةَ أَيَّامٍ يَعْتَمِرُونَ فِيهَا ثُمَّ يَخْرُجُونَ.|И да дойдат следващата година, като Курайш ще им освободи Мека за три дни, в които да извършат умра и после да излязат.',
  'وَسُمِّيَ هٰذَا الِاتِّفَاقُ صُلْحَ الْحُدَيْبِيَةِ.|Това споразумение е наречено Примирието от Худайбия.',
  'وَفِي ذِي الْقَعْدَةِ مِنَ السَّنَةِ السَّابِعَةِ دَخَلَ الرَّسُولُ وَأَصْحَابُهُ مَكَّةَ آمِنِينَ، فَاعْتَمَرُوا وَأَقَامُوا فِيهَا ثَلَاثَةَ أَيَّامٍ، ثُمَّ رَجَعُوا إِلَى الْمَدِينَةِ.|През зу-л-ка‘да на седмата година Пратеникът и сподвижниците му влязоха в Мека в безопасност, извършиха умра, престояха там три дни и после се върнаха в Медина.'],

 q:['مَاذَا رَأَى الرَّسُولُ فِي نَوْمِهِ؟|رَأَى أَنَّهُ وَأَصْحَابَهُ يَدْخُلُونَ الْمَسْجِدَ الْحَرَامَ آمِنِينَ|رَأَى أَنَّ قُرَيْشًا تُقَاتِلُهُمْ|رَأَى أَنَّهُ يُسَافِرُ إِلَى الشَّامِ',
  'بِمَاذَا شَعَرَ أَصْحَابُهُ عِنْدَمَا قَصَّ عَلَيْهِمُ الرُّؤْيَا؟|فَرِحُوا|حَزِنُوا|خَافُوا',
  'إِلَى أَيْنَ وَصَلَ الْمُسْلِمُونَ وَهُمْ فِي طَرِيقِهِمْ إِلَى مَكَّةَ؟|إِلَى الْحُدَيْبِيَةِ|إِلَى الطَّائِفِ|إِلَى بَيْتِ الْمَقْدِسِ',
  'مَاذَا فَعَلَ الْمُشْرِكُونَ عِنْدَمَا عَلِمُوا بِقُدُومِ الْمُسْلِمِينَ؟|مَنَعُوهُمْ مِنْ دُخُولِ مَكَّةَ|أَخْلَوْا لَهُمْ مَكَّةَ فِي الْحَالِ|اسْتَقْبَلُوهُمْ بِفَرَحٍ',
  'مَتَى اعْتَمَرَ الْمُسْلِمُونَ؟|فِي السَّنَةِ السَّابِعَةِ|فِي السَّنَةِ السَّادِسَةِ|فِي السَّنَةِ الْعَاشِرَةِ'],
 tf:['كَانَ الْمُسْلِمُونَ فِي شَوْقٍ شَدِيدٍ إِلَى رُؤْيَةِ مَكَّةَ.|1|Мюсюлманите силно копнееха да видят Мека.',
  'لَمَّا عَلِمَ الْمُشْرِكُونَ بِقُدُومِ الْمُسْلِمِينَ فَرِحُوا فَرَحًا شَدِيدًا.|0|Когато езичниците научиха за идването на мюсюлманите, много се зарадваха.',
  'رَجَعَ الْمُسْلِمُونَ إِلَى الْمَدِينَةِ فِي السَّنَةِ السَّادِسَةِ دُونَ أَنْ يَعْتَمِرُوا.|1|През шестата година мюсюлманите се върнаха в Медина, без да извършат умра.',
