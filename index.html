<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алиф — арабски по нива</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430; --muted:#5E6875; --paper:#F5F7F6; --white:#FFFFFF;
  --teal:#0E5E57; --teal-soft:#E3EFEC; --gold:#B8862A; --line:#D9DFDD;
  --ok:#2E7D4F; --bad:#B03A2E;
  --ar:'Amiri','Noto Naskh Arabic','Traditional Arabic','Geeza Pro',serif;
  --ui:'Noto Sans','Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);background:var(--paper);color:var(--ink);line-height:1.5;min-height:100vh}
.ar{font-family:var(--ar);direction:rtl}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{background:var(--teal);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{font-family:var(--ar);font-size:34px;line-height:1;width:44px;height:44px;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.5);border-radius:50%}
header h1{font-size:18px;font-weight:700}
header p{font-size:13px;opacity:.8}
.back{margin-left:auto;color:#fff;font-size:14px;padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:20px}
.back[hidden]{display:none}

main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
h2{font-size:22px;margin-bottom:2px}
.h2ar{font-family:var(--ar);font-size:26px;color:var(--teal);direction:rtl;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.unit{font-size:14px;font-weight:700;color:var(--gold);margin:20px 0 8px}
.unit:first-child{margin-top:0}

.levels{display:grid;gap:12px}
.level{display:flex;align-items:center;gap:16px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;width:100%}
.level .num{font-family:var(--ar);font-size:40px;color:var(--teal);width:56px;text-align:center;line-height:1}
.level b{display:block;font-size:17px}
.level span{font-size:13px;color:var(--muted)}
.level.locked{opacity:.55;cursor:default}
.level.locked .num{color:var(--muted)}
.bar{height:6px;background:var(--teal-soft);border-radius:3px;margin-top:8px;overflow:hidden;width:160px}
.bar i{display:block;height:100%;background:var(--teal)}

.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
.row .ic{width:40px;height:40px;border-radius:8px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:var(--ar);font-size:22px;flex-shrink:0}
.row .ic.n{font-family:var(--ui);font-size:15px;font-weight:700}
.row b{display:block;font-size:15px}
.row span{font-size:13px;color:var(--muted)}
.row .done{margin-left:auto;color:var(--ok);font-size:20px}
.row.empty{border-style:dashed;cursor:default}
.row.empty .ic{background:#EEF1F0;color:var(--muted)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--teal);color:#fff}
.note{background:var(--white);border-left:4px solid var(--gold);padding:12px 14px;border-radius:6px;font-size:14px;margin-bottom:16px}
.hero{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;margin-bottom:14px}
.hero .big{font-family:var(--ar);font-size:96px;line-height:1.3;color:var(--teal)}
.hero b{font-size:18px}
.hero p{color:var(--muted);font-size:14px}
.forms{display:flex;gap:14px;direction:rtl;justify-content:center;flex-wrap:wrap;margin-top:10px}
.forms div{text-align:center;min-width:52px}
.forms .ar{font-size:34px;display:block;line-height:1.4}
.forms small{font-size:11px;color:var(--muted);direction:ltr;display:block}
.items{display:grid;gap:8px}
.item{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.item .w{font-family:var(--ar);font-size:30px;line-height:1.5;color:var(--teal);direction:rtl;flex:1;text-align:right}
.item .m{flex:1}
.item .m b{font-size:15px;display:block}
.item .tr{color:var(--muted);font-size:13px;font-style:italic}
.say{width:36px;height:36px;border-radius:50%;background:var(--teal-soft);color:var(--teal);font-size:16px;flex-shrink:0;display:grid;place-items:center}
.dlg{display:grid;gap:10px;margin-bottom:18px}
.bub{max-width:88%;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.bub.a{justify-self:end;border-top-right-radius:4px}
.bub.b{justify-self:start;background:var(--teal-soft);border-color:transparent;border-top-left-radius:4px}
.bub .ar{font-size:24px;line-height:1.6;display:block;text-align:right}
.bub small{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:space-between}
.bub .say{width:30px;height:30px;font-size:13px}
.label{font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 8px}

.card{background:var(--white);border:1px solid var(--line);border-radius:18px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;width:100%}
.card .face{font-family:var(--ar);font-size:56px;line-height:1.6;color:var(--teal);direction:rtl}
.card .face.long{font-size:34px}
.card .hint{font-size:13px;color:var(--muted);margin-top:8px}
.card .ans{font-size:22px;font-weight:700;margin-top:10px}
.card .ans small{display:block;font-size:15px;font-weight:400;color:var(--muted);font-style:italic}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.btn{background:var(--teal);color:#fff;padding:11px 18px;border-radius:24px;font-weight:600;font-size:15px}
.btn.ghost{background:var(--white);color:var(--teal);border:1.5px solid var(--teal)}
.count{font-size:14px;color:var(--muted)}

.q{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;margin-bottom:14px}
.q p{font-size:14px;color:var(--muted)}
.q .face{font-family:var(--ar);font-size:52px;line-height:1.6;color:var(--teal);direction:rtl}
.q .face.long{font-size:30px}
.q .face.bg{font-family:var(--ui);font-size:24px;font-weight:700;color:var(--ink);margin:14px 0;direction:ltr}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:12px 10px;font-size:15px;font-weight:600;min-height:56px}
.opt.ar{font-family:var(--ar);font-size:24px;font-weight:400;direction:rtl}
.opt.ok{border-color:var(--ok);background:#E6F3EB;color:var(--ok)}
.opt.bad{border-color:var(--bad);background:#F8E7E5;color:var(--bad)}
.result{text-align:center;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:30px 20px}
.result .score{font-size:48px;font-weight:700;color:var(--teal)}
.result p{color:var(--muted);margin:6px 0 18px}

.pad{background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pad canvas{display:block;width:100%;height:240px;touch-action:none;cursor:crosshair}
.padbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;direction:rtl}
.grid div{background:var(--white);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px}
.grid .ar{font-size:30px;color:var(--teal);display:block}
.grid small{font-size:11px;color:var(--muted)}
.syl{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center;margin-bottom:6px}
.syl button{font-size:30px;min-width:56px;padding:2px 10px;background:var(--white);border:1px solid var(--line);border-radius:10px;color:var(--teal)}
.pairs{display:grid;gap:8px}
.refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.ref{font:inherit;font-size:12px;white-space:nowrap;line-height:1.6;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--teal);cursor:pointer}
.pairs>div{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;direction:rtl}
.pairs .ar{font-size:26px}
.pairs .vs{color:var(--muted)}
.pairs.cols{grid-template-columns:1fr 1fr}
.pairs.cols>div{flex-direction:column;align-items:center;gap:2px;direction:ltr}
.pairs.cols b{font-size:13px;color:var(--gold)}
.note bdi.ar{font-size:19px;line-height:1.5}
.cue{margin-top:8px;font-size:14px;color:var(--muted)}
.cue .ar{font-size:24px;color:var(--gold)}
.txt{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.txt summary{cursor:pointer;color:var(--teal);font-size:14px;font-weight:600}
.txt .ar{text-align:right;font-size:22px;line-height:1.9;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">ا</div>
  <div><h1>Алиф</h1><p>Арабски език по нива</p></div>
  <button class="back" id="back" hidden>Назад</button>
</header>
<main id="app"></main>

<script>
/* level1.js */
/* ================= СЪДЪРЖАНИЕ: НИВО 1 =================
   Формат на думите: 'арабски|транскрипция|превод' или 'арабски|превод' */

const NAMES={'ا':'алиф','ب':'ба','ت':'та','ث':'са','ج':'джим','ح':'ха','خ':'ха (хъ)','د':'дал','ذ':'зал','ر':'ра','ز':'зай','س':'син','ش':'шин','ص':'сад','ض':'дад','ط':'та (тежко)','ظ':'за (тежко)','ع':'айн','غ':'гайн','ف':'фа','ق':'каф','ك':'каф (кяф)','ل':'лам','م':'мим','ن':'нун','ه':'ха (лека)','و':'уау','ي':'йа','ء':'хамза'};

/* Четене и писане — 32 урока в реда на книгата (28 букви + 4 правописни урока).
   Поле за всяка буква:
   L буква, snd звук, b/m/e думи с буквата в началото / средата / края ('арабски|транскрипция|превод'),
   w нови думи от урока, s изречения „Слушай и повтаряй“ ('арабски|превод'),
   c буква за сравнение, pp двойки думи 'с буквата|с другата буква' (сравнение на звуците),
   a аяти 'текст|смисъл|сура аят', r текст за четене, q въпроси към текста. */
const RW=[
 {L:'ب',snd:'като българското „б“',
  b:['بَيْتٌ|baytun|къща','بَقَّالٌ|baqqālun|бакалин','بِنْتٌ|bintun|момиче','بَلَدٌ|baladun|страна'],
  m:['مَكْتَبَةٌ|maktabatun|библиотека','حَقِيبَةٌ|ḥaqībatun|чанта','سَبُّورَةٌ|sabbūratun|черна дъска','سَبْعَةٌ|sabʿatun|седем'],
  w:['بَابٌ|bābun|врата','طَبِيبٌ|ṭabībun|лекар'],
  e:['كِتَابٌ|kitābun|книга','طَالِبٌ|ṭālibun|ученик, студент','كَاتِبٌ|kātibun|писар','حَلِيبٌ|ḥalībun|прясно мляко'],
  s:['قَابَلَ إِبْرَاهِيمُ الطَّبِيبَ.|Ибрахим срещна лекаря.','هٰذَا بَابُ الْمَدْرَسَةِ.|Това е вратата на училището.','الْكِتَابُ فِي الْحَقِيبَةِ.|Книгата е в чантата.','أَنَا طَالِبٌ.|Аз съм ученик.'],
  r:['هٰذَا طَالِبٌ اسْمُهُ إِبْرَاهِيمُ.|Това е ученик, казва се Ибрахим.','إِبْرَاهِيمُ طَالِبٌ فِي الْمَدْرَسَةِ.|Ибрахим е ученик в училището.','فِي حَقِيبَتِهِ كِتَابٌ وَدَفْتَرٌ.|В чантата му има книга и тетрадка.','أَبُوهُ طَبِيبٌ.|Баща му е лекар.'],
  q:['مَنْ إِبْرَاهِيمُ؟|طَالِبٌ|طَبِيبٌ|بَقَّالٌ','مَاذَا فِي حَقِيبَتِهِ؟|كِتَابٌ وَدَفْتَرٌ|خُبْزٌ وَحَلِيبٌ|قَلَمٌ فَقَطْ','مَا مِهْنَةُ أَبِيهِ؟|طَبِيبٌ|طَالِبٌ|كَاتِبٌ']},
 {L:'ت',snd:'като българското „т“',
  b:['تِينٌ|tīnun|смокини','تَمْرٌ|tamrun|фурми','تَاجِرٌ|tājirun|търговец','تَذْكِرَةٌ|tadhkiratun|билет'],
  m:['كِتَابٌ|kitābun|книга','مَكْتَبَةٌ|maktabatun|библиотека','دَفْتَرٌ|daftarun|тетрадка','سِتَّةٌ|sittatun|шест'],
  e:['بَيْتٌ|baytun|къща','بِنْتٌ|bintun|момиче','وَقْتٌ|waqtun|време','زَيْتٌ|zaytun|олио'],
  w:['رِيَالَاتٌ|riyālātun|риали (пари)'],
  s:['تَفَضَّلْ، اجْلِسْ عَلَى الْكُرْسِيِّ.|Заповядай, седни на стола.','عِنْدِي عَشَرَةُ رِيَالَاتٍ.|Имам десет риала.','بَيْتِي بَعِيدٌ.|Къщата ми е далеч.','هٰذِهِ بِنْتٌ صَغِيرَةٌ.|Това е малко момиче.'],
  r:['ذَهَبَ تَوْفِيقٌ إِلَى الْبَقَّالَةِ.|Тауфик отиде в бакалията.','اشْتَرَى تَمْرًا وَتِينًا وَزَيْتًا.|Купи фурми, смокини и олио.','دَفَعَ عَشَرَةَ رِيَالَاتٍ.|Плати десет риала.','ثُمَّ رَجَعَ إِلَى الْبَيْتِ.|После се върна вкъщи.'],
  q:['إِلَى أَيْنَ ذَهَبَ تَوْفِيقٌ؟|إِلَى الْبَقَّالَةِ|إِلَى الْمَكْتَبَةِ|إِلَى الْمَدْرَسَةِ','مَاذَا اشْتَرَى؟|تَمْرًا وَتِينًا وَزَيْتًا|خُبْزًا وَحَلِيبًا|كُتُبًا وَدَفَاتِرَ','كَمْ دَفَعَ؟|عَشَرَةَ رِيَالَاتٍ|سِتَّةَ رِيَالَاتٍ|ثَلَاثَةَ رِيَالَاتٍ']},
 {L:'م',snd:'като българското „м“',
  b:['مَاءٌ|māʾun|вода','مَكْتَبَةٌ|maktabatun|библиотека','مَعْهَدٌ|maʿhadun|институт','مَدْرَسَةٌ|madrasatun|училище'],
  m:['سَمَكٌ|samakun|риба','جُمُعَةٌ|jumuʿatun|петък','تَمْرٌ|tamrun|фурми','زَمِيلٌ|zamīlun|съученик, колега'],
  e:['قَلَمٌ|qalamun|химикалка, писалка','لَحْمٌ|laḥmun|месо','يَوْمٌ|yawmun|ден','اسْمٌ|ismun|име'],
  w:['صُحُفٌ|ṣuḥufun|вестници'],
  s:['دَخَلْتُ مَكْتَبَةَ الْمَعْهَدِ.|Влязох в библиотеката на института.','الْقَلَمُ فِي الْحَقِيبَةِ.|Химикалката е в чантата.','هٰذِهِ صُحُفُ الْيَوْمِ.|Това са днешните вестници.','الْحَقِيبَةُ عَلَى مَكْتَبِي.|Чантата е на бюрото ми.'],
  r:['مُحَمَّدٌ طَالِبٌ فِي الْمَعْهَدِ.|Мохамед е студент в института.','كُلَّ يَوْمٍ يَدْخُلُ الْمَكْتَبَةَ.|Всеки ден влиза в библиотеката.','يَقْرَأُ الصُّحُفَ وَيَكْتُبُ بِالْقَلَمِ.|Чете вестниците и пише с химикалката.','ثُمَّ يَأْكُلُ السَّمَكَ فِي الْمَطْعَمِ.|После яде риба в ресторанта.'],
  q:['أَيْنَ يَدْرُسُ مُحَمَّدٌ؟|فِي الْمَعْهَدِ|فِي الْمَطْعَمِ|فِي الْبَقَّالَةِ','مَاذَا يَقْرَأُ فِي الْمَكْتَبَةِ؟|الصُّحُفَ|الرِّسَالَةَ|الدَّفْتَرَ','مَاذَا يَأْكُلُ فِي الْمَطْعَمِ؟|السَّمَكَ|اللَّحْمَ|الدَّجَاجَ']},
 {L:'ر',snd:'трептящо „р“',
  b:['رَفٌّ|raffun|рафт','رَجُلٌ|rajulun|мъж','رِسَالَةٌ|risālatun|писмо','رِيَالٌ|riyālun|риал (пари)'],
  m:['كُرْسِيٌّ|kursiyyun|стол','كُرَّاسَةٌ|kurrāsatun|тетрадка за упражнения','فِرَاشٌ|firāshun|постеля','دَرْسٌ|darsun|урок'],
  e:['بَحْرٌ|baḥrun|море','دَفَاتِرُ|dafātiru|тетрадки','قَمَرٌ|qamarun|луна','كَبِيرٌ|kabīrun|голям'],

  a:['وَالْعَصْرِ|Кълна се във времето!|Ал-Аср 1','إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ|Човекът наистина е в загуба,|Ал-Аср 2','إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ|освен онези, които повярваха и вършеха праведни дела, и се призоваваха взаимно към истината и към търпението|Ал-Аср 3'],
  r:['صَالِحٌ وَصَادِقٌ صَدِيقَانِ مُخْلِصَانِ.|Салих и Садик са искрени приятели.','ذَهَبَا إِلَى السُّوقِ فِي الصَّبَاحِ.|Отидоха на пазара сутринта.','اشْتَرَى صَالِحٌ قَمِيصًا رَخِيصًا.|Салих купи евтина риза.','وَاشْتَرَى صَادِقٌ صَابُونًا وَمِصْبَاحًا صَغِيرًا.|А Садик купи сапун и малка лампа.'],

  a:['وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ|и от злото на мрака, когато настъпи,|Ал-Фалак 3','فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا|прославяй своя Господ с хвала и Го моли за прошка. Той винаги приема покаянието.|Ан-Наср 3'],

  q:['مَا الرَّدُّ عَلَى «السَّلَامُ عَلَيْكُمْ»؟|وَعَلَيْكُمُ السَّلَامُ|أَهْلًا بِكَ|بِخَيْرٍ','مَنْ قَالَ: «اسْمِي بَكْرٌ»؟|بَكْرٌ|مُحَمَّدٌ|خَالِدٌ','كَيْفَ حَالُ بَكْرٍ؟|بِخَيْرٍ، الْحَمْدُ لِلّٰهِ|لَيْسَ بِخَيْرٍ|لَا نَعْرِفُ']},
 {u:'Поздрав и запознанство',ar:'السُّؤَالُ عَنِ الْجِنْسِيَّةِ',t:'Въпрос за националността',
  d:['أَحْمَدُ: صَبَاحَ الْخَيْرِ.|Добро утро.','سَعِيدٌ: صَبَاحَ النُّورِ.|Добро утро (отговор).','أَحْمَدُ: أَنَا أَحْمَدُ، أَنَا بَاكِسْتَانِيٌّ.|Аз съм Ахмед, пакистанец съм.','سَعِيدٌ: وَأَنَا سَعِيدٌ.|А аз съм Саид.','أَحْمَدُ: هَلْ أَنْتَ هِنْدِيٌّ؟|Индиец ли си?','سَعِيدٌ: لَا، أَنَا سُودَانِيٌّ.|Не, суданец съм.','أَحْمَدُ: فُرْصَةٌ طَيِّبَةٌ.|Приятно ми е да се запознаем.','سَعِيدٌ: أَهْلًا وَسَهْلًا.|Добре дошъл.'],
  w:['صَبَاحُ الْخَيْرِ|ṣabāḥu l-khayr|добро утро','صَبَاحُ النُّورِ|ṣabāḥu n-nūr|добро утро (отговор)','فُرْصَةٌ طَيِّبَةٌ|furṣatun ṭayyibatun|приятно ми е (при запознанство)','جِنْسِيَّةٌ|jinsiyyatun|националност','مِنْ أَيْنَ؟|min ayna|откъде?','هَلْ|hal|дали (въпрос с да/не)','نَعَمْ|naʿam|да','لَا|lā|не','بَاكِسْتَانِيٌّ|bākistāniyyun|пакистанец','هِنْدِيٌّ|hindiyyun|индиец','سُودَانِيٌّ|sūdāniyyun|суданец','مِصْرِيٌّ|miṣriyyun|египтянин','عِرَاقِيٌّ|ʿirāqiyyun|иракчанин','تُرْكِيٌّ|turkiyyun|турчин','بُلْغَارِيٌّ|bulghāriyyun|българин'],
  g:'Принадлежност към страна (нисба): добавя се ـِيٌّ за мъж и ـِيَّةٌ за жена: مِصْرُ → مِصْرِيٌّ / مِصْرِيَّةٌ, السُّودَانُ → سُودَانِيٌّ / سُودَانِيَّةٌ, الْعِرَاقُ → عِرَاقِيٌّ. Въпросът с „да/не“ започва с هَلْ: هَلْ أَنْتَ هِنْدِيٌّ؟ — نَعَمْ، أَنَا هِنْدِيٌّ.',
  s:['أَنَا مِنْ مِصْرَ، أَنَا مِصْرِيٌّ.|Аз съм от Египет, египтянин съм.','أَنَا مِنْ تُونُسَ، أَنَا تُونُسِيَّةٌ.|(жена) Аз съм от Тунис, тунизийка съм.','هَلْ أَنْتَ عِرَاقِيٌّ؟ نَعَمْ، أَنَا عِرَاقِيٌّ.|Иракчанин ли си? Да, иракчанин съм.','هَلْ أَنْتِ لُبْنَانِيَّةٌ؟ لَا، أَنَا سُورِيَّةٌ.|Ливанка ли си? Не, сирийка съм.','أَنَا مِنْ بُلْغَارِيَا، أَنَا بُلْغَارِيٌّ.|Аз съм от България, българин съм.'],
  p:['مِنْ أَيْنَ أَنْتَ؟|مِصْرُ|أَنَا مِصْرِيٌّ.|Аз съм египтянин.|أَنَا مِصْرُ.|أَنْتَ مِصْرِيٌّ.','مِنْ أَيْنَ أَنْتَ؟|قَطَرُ|أَنَا قَطَرِيٌّ.|Аз съм катарец.|أَنَا قَطَرِيَّةٌ.|أَنْتَ قَطَرِيٌّ.','مِنْ أَيْنَ أَنْتِ؟|تُونُسُ|أَنَا تُونُسِيَّةٌ.|(жена) Аз съм тунизийка.|أَنَا تُونُسِيٌّ.|أَنْتِ تُونُسِيَّةٌ.','مِنْ أَيْنَ أَنْتِ؟|لُبْنَانُ|أَنَا لُبْنَانِيَّةٌ.|(жена) Аз съм ливанка.|أَنَا لُبْنَانِيٌّ.|أَنَا لُبْنَانُ.','هَلْ أَنْتَ هِنْدِيٌّ؟|نَعَمْ|نَعَمْ، أَنَا هِنْدِيٌّ.|Да, индиец съм.|نَعَمْ، أَنْتَ هِنْدِيٌّ.|لَا، أَنَا هِنْدِيٌّ.','هَلْ أَنْتَ كُوَيْتِيٌّ؟|لَا — الْعِرَاقُ|لَا، أَنَا عِرَاقِيٌّ.|Не, иракчанин съм.|نَعَمْ، أَنَا عِرَاقِيٌّ.|لَا، أَنَا كُوَيْتِيٌّ.'],
  q:['مِنْ أَيْنَ أَحْمَدُ؟|مِنْ بَاكِسْتَانَ|مِنَ الْهِنْدِ|مِنَ السُّودَانِ','هَلْ سَعِيدٌ هِنْدِيٌّ؟|لَا، هُوَ سُودَانِيٌّ|نَعَمْ، هُوَ هِنْدِيٌّ|لَا، هُوَ بَاكِسْتَانِيٌّ','مَا الرَّدُّ عَلَى «صَبَاحَ الْخَيْرِ»؟|صَبَاحَ النُّورِ|وَعَلَيْكُمُ السَّلَامُ|فُرْصَةٌ طَيِّبَةٌ']},
 {u:'Поздрав и запознанство',ar:'السُّؤَالُ عَنِ الْمِهْنَةِ',t:'Въпрос за професията',
  d:['حَامِدٌ: السَّلَامُ عَلَيْكُمْ يَا مَحْمُودُ.|Здравей, Махмуд.','مَحْمُودٌ: وَعَلَيْكُمُ السَّلَامُ يَا حَامِدُ.|Здравей, Хамид.','حَامِدٌ: مَا مِهْنَتُكَ يَا مَحْمُودُ؟|Каква е професията ти, Махмуд?','مَحْمُودٌ: أَنَا طَبِيبٌ. وَأَنْتَ، مَا مِهْنَتُكَ؟|Аз съм лекар. А ти каква професия имаш?','حَامِدٌ: أَنَا مُهَنْدِسٌ.|Аз съм инженер.','مَحْمُودٌ: وَمَنْ هٰذَا؟|А кой е това?','حَامِدٌ: هٰذَا يُوسُفُ، هُوَ مُمَرِّضٌ.|Това е Юсуф, той е медицински брат.','مَحْمُودٌ: أَهْلًا وَسَهْلًا يَا يُوسُفُ.|Добре дошъл, Юсуф.'],
  w:['مِهْنَةٌ|mihnatun|професия','مِهْنَتُكَ|mihnatuka|професията ти (м.р.)','مِهْنَتُكِ|mihnatuki|професията ти (ж.р.)','طَبِيبٌ|ṭabībun|лекар','طَبِيبَةٌ|ṭabībatun|лекарка','مُهَنْدِسٌ|muhandisun|инженер','مُمَرِّضٌ|mumarriḍun|медицински брат','مُمَرِّضَةٌ|mumarriḍatun|медицинска сестра','مُوَظَّفٌ|muwaẓẓafun|служител','مُوَظَّفَةٌ|muwaẓẓafatun|служителка','مُدَرِّسٌ|mudarrisun|учител','كَاتِبٌ|kātibun|писар','مَنْ؟|man|кой?','هُوَ|huwa|той','هِيَ|hiya|тя'],
  g:'Женски род на професиите: добавя се ـَةٌ: طَبِيبٌ → طَبِيبَةٌ, مُهَنْدِسٌ → مُهَنْدِسَةٌ, مُوَظَّفٌ → مُوَظَّفَةٌ. „Каква е професията ти?“ е مَا مِهْنَتُكَ؟ към мъж и مَا مِهْنَتُكِ؟ към жена. Отговор: أَنَا طَبِيبٌ / أَنَا طَبِيبَةٌ.',
  s:['مَا مِهْنَتُكَ؟ أَنَا مُهَنْدِسٌ.|Каква е професията ти? Инженер съм.','مَا مِهْنَتُكِ؟ أَنَا مُمَرِّضَةٌ.|Каква е професията ти (към жена)? Медицинска сестра съм.','هَلْ أَنْتَ طَبِيبٌ؟ نَعَمْ، أَنَا طَبِيبٌ.|Лекар ли си? Да, лекар съм.','هِيَ مُوَظَّفَةٌ، وَهُوَ مُدَرِّسٌ.|Тя е служителка, а той е учител.'],
  p:['مَا مِهْنَتُكَ؟|طَبِيبٌ|أَنَا طَبِيبٌ.|Аз съм лекар.|أَنَا طَبِيبَةٌ.|أَنْتَ طَبِيبٌ.','مَا مِهْنَتُكِ؟|طَبِيبَةٌ|أَنَا طَبِيبَةٌ.|(жена) Аз съм лекарка.|أَنَا طَبِيبٌ.|أَنْتِ طَبِيبَةٌ.','مَا مِهْنَتُكَ؟|مُوَظَّفٌ|أَنَا مُوَظَّفٌ.|Аз съм служител.|أَنَا مُوَظَّفَةٌ.|هُوَ مُوَظَّفٌ.','مَا مِهْنَتُكِ؟|مُمَرِّضَةٌ|أَنَا مُمَرِّضَةٌ.|(жена) Аз съм медицинска сестра.|أَنَا مُمَرِّضٌ.|هِيَ مُمَرِّضَةٌ.','هَلْ أَنْتَ مُهَنْدِسٌ؟|نَعَمْ|نَعَمْ، أَنَا مُهَنْدِسٌ.|Да, инженер съм.|نَعَمْ، أَنَا مُهَنْدِسَةٌ.|لَا، أَنَا مُهَنْدِسٌ.'],
  q:['مَا مِهْنَةُ مَحْمُودٍ؟|طَبِيبٌ|مُهَنْدِسٌ|مُمَرِّضٌ','مَا مِهْنَةُ حَامِدٍ؟|مُهَنْدِسٌ|طَبِيبٌ|مُوَظَّفٌ','مَا مِهْنَةُ يُوسُفَ؟|مُمَرِّضٌ|طَبِيبٌ|مُهَنْدِسٌ']},
 {u:'В училище',ar:'قَبْلَ دُخُولِ الْفَصْلِ (أ)',t:'Преди влизане в клас (мъже)',
  d:['خَالِدٌ: يَا إِبْرَاهِيمُ، مَنْ هٰذَا؟|Ибрахим, кой е това?','إِبْرَاهِيمُ: هٰذَا عُثْمَانُ.|Това е Осман.','خَالِدٌ: هَلْ هُوَ طَالِبٌ جَدِيدٌ؟|Нов студент ли е?','إِبْرَاهِيمُ: نَعَمْ، هُوَ طَالِبٌ جَدِيدٌ، وَهُوَ زَمِيلِي فِي الْفَصْلِ.|Да, нов студент е и е мой съученик в класа.','خَالِدٌ: وَأَنْتَ، هَلْ أَنْتَ طَالِبٌ جَدِيدٌ؟|А ти нов студент ли си?','إِبْرَاهِيمُ: لَا، أَنَا طَالِبٌ قَدِيمٌ.|Не, аз съм стар студент.','خَالِدٌ: وَأَنَا أَيْضًا طَالِبٌ قَدِيمٌ.|И аз също съм стар студент.'],
  w:['طَالِبٌ|ṭālibun|студент, ученик','جَدِيدٌ|jadīdun|нов','قَدِيمٌ|qadīmun|стар','مَنْ هٰذَا؟|man hādhā|кой е това?','هٰذَا|hādhā|това (м.р.)','يَا|yā|о (обръщение)','زَمِيلٌ|zamīlun|съученик, колега','زَمِيلِي|zamīlī|моят съученик','فَصْلٌ|faṣlun|клас','مَدْرَسَةٌ|madrasatun|училище','مَعْهَدٌ|maʿhadun|институт','أَيْضًا|ayḍan|също','دُخُولٌ|dukhūlun|влизане','قَبْلَ|qabla|преди'],
  g:'Прилагателното стои след съществителното и се съгласува с него: طَالِبٌ جَدِيدٌ „нов студент“, طَالِبٌ قَدِيمٌ „стар студент“. Обръщение с يَا: يَا إِبْرَاهِيمُ (името е с ـُ). Въпрос за човек: مَنْ هٰذَا؟',
  s:['مَنْ هٰذَا؟ هٰذَا خَالِدٌ.|Кой е това? Това е Халид.','هَلْ هُوَ طَالِبٌ جَدِيدٌ؟ نَعَمْ، هُوَ طَالِبٌ جَدِيدٌ.|Нов студент ли е? Да, нов студент е.','أَنَا طَالِبٌ قَدِيمٌ.|Аз съм стар студент.','هٰذَا زَمِيلِي فِي الْمَدْرَسَةِ.|Това е съученикът ми в училището.'],
  p:['مَنْ هٰذَا؟|عُثْمَانُ|هٰذَا عُثْمَانُ.|Това е Осман.|هٰذِهِ عُثْمَانُ.|أَنَا عُثْمَانُ.','هَلْ هُوَ طَالِبٌ جَدِيدٌ؟|نَعَمْ|نَعَمْ، هُوَ طَالِبٌ جَدِيدٌ.|Да, той е нов студент.|نَعَمْ، هُوَ طَالِبٌ قَدِيمٌ.|نَعَمْ، أَنْتَ طَالِبٌ جَدِيدٌ.','هَلْ هُوَ طَالِبٌ جَدِيدٌ؟|لَا|لَا، هُوَ طَالِبٌ قَدِيمٌ.|Не, той е стар студент.|لَا، هُوَ طَالِبٌ جَدِيدٌ.|نَعَمْ، هُوَ طَالِبٌ قَدِيمٌ.','هَلْ أَنْتَ طَالِبٌ؟|نَعَمْ|نَعَمْ، أَنَا طَالِبٌ.|Да, студент съм.|نَعَمْ، أَنْتَ طَالِبٌ.|نَعَمْ، هُوَ طَالِبٌ.'],
  q:['مَنْ عُثْمَانُ؟|طَالِبٌ جَدِيدٌ|طَالِبٌ قَدِيمٌ|مُدَرِّسٌ','هَلْ إِبْرَاهِيمُ طَالِبٌ جَدِيدٌ؟|لَا، هُوَ طَالِبٌ قَدِيمٌ|نَعَمْ، هُوَ طَالِبٌ جَدِيدٌ|لَا، هُوَ مُدَرِّسٌ','مَنْ زَمِيلُ إِبْرَاهِيمَ فِي الْفَصْلِ؟|عُثْمَانُ|خَالِدٌ|مُحَمَّدٌ']},
 {u:'В училище',ar:'قَبْلَ دُخُولِ الْفَصْلِ (ب)',t:'Преди влизане в клас (жени)',
  d:['فَاطِمَةُ: السَّلَامُ عَلَيْكُمْ يَا زَيْنَبُ. كَيْفَ حَالُكِ؟|Здравей, Зейнаб. Как си?','زَيْنَبُ: وَعَلَيْكُمُ السَّلَامُ. بِخَيْرٍ، وَالْحَمْدُ لِلّٰهِ.|Здравей. Добре, слава на Аллах.','فَاطِمَةُ: مَنْ هٰذِهِ؟|Коя е това?','زَيْنَبُ: هٰذِهِ زَمِيلَتِي عَائِشَةُ.|Това е съученичката ми Аиша.','فَاطِمَةُ: هَلْ هِيَ طَالِبَةٌ جَدِيدَةٌ؟|Нова студентка ли е?','زَيْنَبُ: لَا، هِيَ طَالِبَةٌ قَدِيمَةٌ.|Не, стара студентка е.','فَاطِمَةُ: أَهْلًا بِكِ يَا عَائِشَةُ.|Добре дошла, Аиша.'],
  w:['هٰذِهِ|hādhihi|това (ж.р.)','مَنْ هٰذِهِ؟|man hādhihi|коя е това?','طَالِبَةٌ|ṭālibatun|студентка','جَدِيدَةٌ|jadīdatun|нова','قَدِيمَةٌ|qadīmatun|стара','زَمِيلَةٌ|zamīlatun|съученичка','زَمِيلَتِي|zamīlatī|моята съученичка','هِيَ|hiya|тя','كَيْفَ حَالُكِ؟|kayfa ḥāluki|как си? (ж.р.)','كَيْفَ حَالُكَ؟|kayfa ḥāluka|как си? (м.р.)','أَهْلًا بِكِ|ahlan biki|добре дошла','مُدَرِّسَةٌ|mudarrisatun|учителка'],
  g:'Женски род: هٰذَا → هٰذِهِ, هُوَ → هِيَ, طَالِبٌ جَدِيدٌ → طَالِبَةٌ جَدِيدَةٌ. Окончанието „твой“ към жена е ـكِ: حَالُكِ, اسْمُكِ, بِكِ. Пред окончание ة се пише като ت: زَمِيلَةٌ → زَمِيلَتِي.',
  s:['مَنْ هٰذِهِ؟ هٰذِهِ زَيْنَبُ.|Коя е това? Това е Зейнаб.','هَلْ هِيَ طَالِبَةٌ جَدِيدَةٌ؟ نَعَمْ، هِيَ طَالِبَةٌ جَدِيدَةٌ.|Нова студентка ли е? Да, нова е.','هِيَ زَمِيلَتِي فِي الْفَصْلِ.|Тя е моя съученичка в класа.','كَيْفَ حَالُكِ يَا فَاطِمَةُ؟|Как си, Фатима?'],
  p:['مَنْ هٰذِهِ؟|عَائِشَةُ|هٰذِهِ عَائِشَةُ.|Това е Аиша.|هٰذَا عَائِشَةُ.|أَنَا عَائِشَةُ.','هَلْ هِيَ طَالِبَةٌ جَدِيدَةٌ؟|نَعَمْ|نَعَمْ، هِيَ طَالِبَةٌ جَدِيدَةٌ.|Да, тя е нова студентка.|نَعَمْ، هُوَ طَالِبٌ جَدِيدٌ.|نَعَمْ، هِيَ طَالِبَةٌ جَدِيدٌ.','هَلْ هِيَ طَالِبَةٌ جَدِيدَةٌ؟|لَا|لَا، هِيَ طَالِبَةٌ قَدِيمَةٌ.|Не, тя е стара студентка.|لَا، هِيَ طَالِبَةٌ قَدِيمٌ.|نَعَمْ، هِيَ طَالِبَةٌ قَدِيمَةٌ.','هَلْ أَنْتِ مُدَرِّسَةٌ؟|لَا — طَالِبَةٌ|لَا، أَنَا طَالِبَةٌ.|Не, студентка съм.|لَا، أَنَا طَالِبٌ.|نَعَمْ، أَنَا طَالِبَةٌ.'],
  q:['مَنْ عَائِشَةُ؟|زَمِيلَةُ زَيْنَبَ|زَمِيلَةُ فَاطِمَةَ|مُدَرِّسَةٌ','هَلْ عَائِشَةُ طَالِبَةٌ جَدِيدَةٌ؟|لَا، هِيَ طَالِبَةٌ قَدِيمَةٌ|نَعَمْ، هِيَ طَالِبَةٌ جَدِيدَةٌ|لَا، هِيَ مُدَرِّسَةٌ','كَيْفَ حَالُ زَيْنَبَ؟|بِخَيْرٍ|لَيْسَتْ بِخَيْرٍ|لَا نَعْرِفُ']},
 {u:'В училище',ar:'فِي الْفَصْلِ (أ)',t:'В класната стая (мъже)',
  d:['إِسْمَاعِيلُ: صَبَاحَ الْخَيْرِ يَا عُمَرُ.|Добро утро, Омар.','عُمَرُ: صَبَاحَ النُّورِ يَا إِسْمَاعِيلُ.|Добро утро, Исмаил.','إِسْمَاعِيلُ: هَلْ هٰذَا مَقْعَدُكَ؟|Това твоят чин ли е?','عُمَرُ: نَعَمْ، هٰذَا مَقْعَدِي، وَهٰذَا دُرْجِي.|Да, това е моят чин, а това е моето чекмедже.','إِسْمَاعِيلُ: مَاذَا فِي دُرْجِكَ؟|Какво има в чекмеджето ти?','عُمَرُ: فِي دُرْجِي كِتَابٌ وَقَلَمٌ.|В чекмеджето ми има книга и химикалка.','إِسْمَاعِيلُ: وَمَا هٰذَا؟|А какво е това?','عُمَرُ: هٰذَا دَفْتَرٌ. خُذِ الدَّفْتَرَ يَا إِسْمَاعِيلُ.|Това е тетрадка. Вземи тетрадката, Исмаил.','إِسْمَاعِيلُ: شُكْرًا.|Благодаря.','عُمَرُ: عَفْوًا.|Няма защо.'],
  w:['دُرْجٌ|durjun|чекмедже','قَلَمٌ|qalamun|химикалка, писалка','كِتَابٌ|kitābun|книга','دَفْتَرٌ|daftarun|тетрадка','كُرْسِيٌّ|kursiyyun|стол','مَقْعَدٌ|maqʿadun|чин','بَابٌ|bābun|врата','مَكْتَبٌ|maktabun|бюро','أَخَذَ / يَأْخُذُ|akhadha / yaʾkhudhu|взе / взема','خُذْ|khudh|вземи!','فِي|fī|в','مَاذَا؟|mādhā|какво?','مَا هٰذَا؟|mā hādhā|какво е това?','عِنْدِي|ʿindī|имам','شُكْرًا|shukran|благодаря','عَفْوًا|ʿafwan|няма защо'],
  g:'Окончанието ـِي означава „мой“: دُرْجٌ → دُرْجِي „моето чекмедже“; ـكَ означава „твой“: دُرْجُكَ. „Има“ се казва с فِي: فِي الدُّرْجِ كِتَابٌ „В чекмеджето има книга“. „Имам“ е عِنْدِي: عِنْدِي قَلَمٌ.',
  s:['مَاذَا فِي دُرْجِكَ؟ فِي دُرْجِي قَلَمٌ.|Какво има в чекмеджето ти? В чекмеджето ми има химикалка.','خُذِ الْكِتَابَ.|Вземи книгата.','مَا هٰذَا؟ هٰذَا كُرْسِيٌّ.|Какво е това? Това е стол.','عِنْدِي دَفْتَرٌ جَدِيدٌ.|Имам нова тетрадка.'],
  p:['مَا هٰذَا؟|كِتَابٌ|هٰذَا كِتَابٌ.|Това е книга.|هٰذِهِ كِتَابٌ.|أَنَا كِتَابٌ.','مَا هٰذَا؟|قَلَمٌ|هٰذَا قَلَمٌ.|Това е химикалка.|هٰذِهِ قَلَمٌ.|هَلْ هٰذَا قَلَمٌ؟','مَاذَا فِي دُرْجِكَ؟|كِتَابٌ وَقَلَمٌ|فِي دُرْجِي كِتَابٌ وَقَلَمٌ.|В чекмеджето ми има книга и химикалка.|فِي دُرْجِكَ كِتَابٌ وَقَلَمٌ.|دُرْجِي كِتَابٌ وَقَلَمٌ.','هَلْ هٰذَا دُرْجُكَ؟|نَعَمْ|نَعَمْ، هٰذَا دُرْجِي.|Да, това е моето чекмедже.|نَعَمْ، هٰذَا دُرْجُكَ.|نَعَمْ، هٰذِهِ دُرْجِي.','مَاذَا عِنْدَكَ؟|دَفْتَرٌ|عِنْدِي دَفْتَرٌ.|Имам тетрадка.|عِنْدَكَ دَفْتَرٌ.|عِنْدِي دَفْتَرًا.'],
  q:['مَاذَا فِي دُرْجِ عُمَرَ؟|كِتَابٌ وَقَلَمٌ|دَفْتَرٌ وَكُرْسِيٌّ|بَابٌ وَمَكْتَبٌ','مَاذَا أَعْطَى عُمَرُ إِسْمَاعِيلَ؟|الدَّفْتَرَ|الْكِتَابَ|الْقَلَمَ','مَاذَا قَالَ إِسْمَاعِيلُ بَعْدَ ذٰلِكَ؟|شُكْرًا|عَفْوًا|صَبَاحَ النُّورِ']},
 {u:'В училище',ar:'فِي الْفَصْلِ (ب)',t:'В класната стая (жени)',
  d:['آمِنَةُ: مَاذَا فِي حَقِيبَتِكِ يَا زَهْرَةُ؟|Какво има в чантата ти, Захра?','زَهْرَةُ: فِي حَقِيبَتِي كُرَّاسَةٌ وَمِسْطَرَةٌ.|В чантата ми има тетрадка и линийка.','آمِنَةُ: وَمَا هٰذِهِ؟|А какво е това?','زَهْرَةُ: هٰذِهِ مِسَّاحَةٌ.|Това е гума.','آمِنَةُ: هَلْ عِنْدَكِ وَرَقَةٌ؟|Имаш ли лист хартия?','زَهْرَةُ: نَعَمْ، عِنْدِي وَرَقَةٌ. تَفَضَّلِي.|Да, имам лист. Заповядай.','آمِنَةُ: شُكْرًا يَا زَهْرَةُ. وَمَا هٰذِهِ الصُّورَةُ؟|Благодаря, Захра. А каква е тази снимка?','زَهْرَةُ: هٰذِهِ صُورَتِي فِي الْفَصْلِ.|Това е моя снимка в класа.'],
  w:['حَقِيبَةٌ|ḥaqībatun|чанта','كُرَّاسَةٌ|kurrāsatun|тетрадка (за упражнения)','مِسْطَرَةٌ|misṭaratun|линийка','مِسَّاحَةٌ|missāḥatun|гума (за триене)','وَرَقَةٌ|waraqatun|лист хартия','صُورَةٌ|ṣūratun|снимка, картина','سَبُّورَةٌ|sabbūratun|черна дъска','رِسَالَةٌ|risālatun|писмо','نَافِذَةٌ|nāfidhatun|прозорец','عِنْدَكِ|ʿindaki|имаш (ж.р.)','تَفَضَّلِي|tafaḍḍalī|заповядай (към жена)','مَا هٰذِهِ؟|mā hādhihi|какво е това? (ж.р.)'],
  g:'Думите с ـة са от женски род и с тях се казва هٰذِهِ: هٰذِهِ مِسْطَرَةٌ, هٰذِهِ نَافِذَةٌ. „Какво е това?“ — مَا هٰذَا؟ (м.р.) и مَا هٰذِهِ؟ (ж.р.). Пред окончание ة се пише като ت: حَقِيبَةٌ → حَقِيبَتِي.',
  s:['مَا هٰذِهِ؟ هٰذِهِ سَبُّورَةٌ.|Какво е това? Това е черна дъска.','هٰذِهِ نَافِذَةٌ، وَهٰذَا بَابٌ.|Това е прозорец, а това е врата.','فِي الْحَقِيبَةِ وَرَقَةٌ وَصُورَةٌ.|В чантата има лист и снимка.','هَلْ عِنْدَكِ مِسْطَرَةٌ؟ نَعَمْ، عِنْدِي مِسْطَرَةٌ.|Имаш ли линийка? Да, имам.'],
  p:['مَا هٰذِهِ؟|كُرَّاسَةٌ|هٰذِهِ كُرَّاسَةٌ.|Това е тетрадка.|هٰذَا كُرَّاسَةٌ.|هٰذِهِ كُرَّاسَةً.','مَا هٰذِهِ؟|نَافِذَةٌ|هٰذِهِ نَافِذَةٌ.|Това е прозорец.|هٰذَا نَافِذَةٌ.|مَا نَافِذَةٌ.','مَاذَا فِي حَقِيبَتِكِ؟|مِسْطَرَةٌ وَدَفْتَرٌ|فِي حَقِيبَتِي مِسْطَرَةٌ وَدَفْتَرٌ.|В чантата ми има линийка и тетрадка.|فِي حَقِيبَتِكِ مِسْطَرَةٌ وَدَفْتَرٌ.|حَقِيبَتِي مِسْطَرَةٌ وَدَفْتَرٌ.','هَلْ عِنْدَكِ مِسَّاحَةٌ؟|نَعَمْ|نَعَمْ، عِنْدِي مِسَّاحَةٌ.|Да, имам гума.|نَعَمْ، عِنْدَكِ مِسَّاحَةٌ.|لَا، عِنْدِي مِسَّاحَةٌ.'],
  q:['مَاذَا فِي حَقِيبَةِ زَهْرَةَ؟|كُرَّاسَةٌ وَمِسْطَرَةٌ|كِتَابٌ وَقَلَمٌ|صُورَةٌ وَرِسَالَةٌ','مَاذَا أَعْطَتْ زَهْرَةُ آمِنَةَ؟|وَرَقَةً|مِسْطَرَةً|مِسَّاحَةً','صُورَةُ مَنْ فِي الْفَصْلِ؟|صُورَةُ زَهْرَةَ|صُورَةُ آمِنَةَ|صُورَةُ الْمُدَرِّسَةِ']},
 {u:'В училище',ar:'مَاذَا تَقْرَأُ؟',t:'Какво четеш?',
  d:['إِسْمَاعِيلُ: مَاذَا تَقْرَأُ يَا عُمَرُ؟|Какво четеш, Омар?','عُمَرُ: أَقْرَأُ الدَّرْسَ الْأَوَّلَ.|Чета първия урок.','إِسْمَاعِيلُ: هَلْ هُوَ صَعْبٌ؟|Труден ли е?','عُمَرُ: لَا، الْقِرَاءَةُ سَهْلَةٌ جِدًّا.|Не, четенето е много лесно.','إِسْمَاعِيلُ: هَلْ قَرَأْتَ الْكِتَابَ الْجَدِيدَ؟|Прочете ли новата книга?','عُمَرُ: نَعَمْ، قَرَأْتُهُ. وَأَنْتَ، مَاذَا تَقْرَأُ؟|Да, прочетох я. А ти какво четеш?','إِسْمَاعِيلُ: أَقْرَأُ الْقُرْآنَ الْكَرِيمَ.|Чета благородния Коран.'],
  w:['قَرَأَ / يَقْرَأُ|qaraʾa / yaqraʾu|прочете / чете','أَقْرَأُ|aqraʾu|чета','مَاذَا تَقْرَأُ؟|mādhā taqraʾu|какво четеш?','دَرْسٌ|darsun|урок','الْأَوَّلُ|al-awwalu|първият','الْقِرَاءَةُ|al-qirāʾatu|четенето','الْكِتَابَةُ|al-kitābatu|писането','سَهْلٌ|sahlun|лесен','صَعْبٌ|ṣaʿbun|труден','جِدًّا|jiddan|много','قَرَأْتُهُ|qaraʾtuhu|прочетох го','الْقُرْآنُ الْكَرِيمُ|al-qurʾānu l-karīmu|благородният Коран','عَرَبِيٌّ|ʿarabiyyun|арабски'],
  g:'Минало време: „аз“ завършва на ـْتُ, „ти“ на ـْتَ: قَرَأْتُ „прочетох“, قَرَأْتَ „ти прочете“. Предметът се заменя с ـهُ (м.р.) или ـهَا (ж.р.): قَرَأْتُ الْكِتَابَ → قَرَأْتُهُ, قَرَأْتُ الرِّسَالَةَ → قَرَأْتُهَا. جِدًّا „много“ стои след прилагателното: سَهْلَةٌ جِدًّا.',
  s:['هَلْ قَرَأْتَ الْكِتَابَ؟ نَعَمْ، قَرَأْتُهُ.|Прочете ли книгата? Да, прочетох я.','هَلْ قَرَأْتَ الرِّسَالَةَ؟ نَعَمْ، قَرَأْتُهَا.|Прочете ли писмото? Да, прочетох го.','الْقِرَاءَةُ سَهْلَةٌ جِدًّا.|Четенето е много лесно.','الْكِتَابَةُ صَعْبَةٌ جِدًّا.|Писането е много трудно.','الْحَقِيبَةُ جَدِيدَةٌ جِدًّا.|Чантата е съвсем нова.'],
  p:['هَلْ قَرَأْتَ الْكِتَابَ؟|نَعَمْ|نَعَمْ، قَرَأْتُهُ.|Да, прочетох я.|نَعَمْ، قَرَأْتُهَا.|نَعَمْ، قَرَأْتَهُ.','هَلْ قَرَأْتَ الرِّسَالَةَ؟|نَعَمْ|نَعَمْ، قَرَأْتُهَا.|Да, прочетох го.|نَعَمْ، قَرَأْتُهُ.|نَعَمْ، قَرَأْتَهَا.','مَاذَا تَقْرَأُ؟|الصَّحِيفَةُ|أَقْرَأُ الصَّحِيفَةَ.|Чета вестника.|تَقْرَأُ الصَّحِيفَةَ.|أَقْرَأُ الصَّحِيفَةُ.','كَيْفَ الْكِتَابَةُ؟|صَعْبٌ|الْكِتَابَةُ صَعْبَةٌ جِدًّا.|Писането е много трудно.|الْكِتَابَةُ صَعْبٌ جِدًّا.|الْكِتَابَةُ جِدًّا صَعْبَةٌ.','كَيْفَ الدَّرْسُ؟|سَهْلٌ|الدَّرْسُ سَهْلٌ جِدًّا.|Урокът е много лесен.|الدَّرْسُ سَهْلَةٌ جِدًّا.|الدَّرْسُ جِدًّا سَهْلٌ.'],
  q:['مَاذَا يَقْرَأُ عُمَرُ؟|الدَّرْسَ الْأَوَّلَ|الْكِتَابَ الْجَدِيدَ|الْقُرْآنَ الْكَرِيمَ','هَلِ الْقِرَاءَةُ صَعْبَةٌ؟|لَا، هِيَ سَهْلَةٌ جِدًّا|نَعَمْ، هِيَ صَعْبَةٌ جِدًّا|لَا، هِيَ جَدِيدَةٌ','هَلْ قَرَأَ عُمَرُ الْكِتَابَ الْجَدِيدَ؟|نَعَمْ، قَرَأَهُ|لَا، لَمْ يَقْرَأْهُ|لَا، قَرَأَهُ إِسْمَاعِيلُ','مَاذَا يَقْرَأُ إِسْمَاعِيلُ؟|الْقُرْآنَ الْكَرِيمَ|الدَّرْسَ الْأَوَّلَ|رِسَالَةً']},
 {u:'В училище',ar:'مَاذَا تَكْتُبُ؟',t:'Какво пишеш?',
  d:['عُمَرُ: مَاذَا تَكْتُبُ يَا إِسْمَاعِيلُ؟|Какво пишеш, Исмаил?','إِسْمَاعِيلُ: أَكْتُبُ رِسَالَةً.|Пиша писмо.','عُمَرُ: هَلْ تَكْتُبُ إِلَى وَالِدِكَ؟|На баща си ли пишеш?','إِسْمَاعِيلُ: لَا، أَكْتُبُ إِلَى صَدِيقِي.|Не, пиша на приятеля си.','عُمَرُ: هَلْ كَتَبْتَ الْعُنْوَانَ؟|Написа ли адреса?','إِسْمَاعِيلُ: نَعَمْ، كَتَبْتُهُ.|Да, написах го.','عُمَرُ: أَنَا أَيْضًا أَكْتُبُ رِسَالَةً إِلَى وَالِدِي.|И аз пиша писмо до баща си.'],
  w:['كَتَبَ / يَكْتُبُ|kataba / yaktubu|написа / пише','أَكْتُبُ|aktubu|пиша','مَاذَا تَكْتُبُ؟|mādhā taktubu|какво пишеш?','رِسَالَةٌ|risālatun|писмо','إِلَى|ilā|до, към','وَالِدٌ|wālidun|баща','وَالِدِي|wālidī|баща ми','وَالِدَةٌ|wālidatun|майка','صَدِيقٌ|ṣadīqun|приятел','صَدِيقِي|ṣadīqī|моят приятел','عُنْوَانٌ|ʿunwānun|адрес','كَتَبْتُهُ|katabtuhu|написах го'],
  g:'Сегашно време: أَكْتُبُ „пиша“, تَكْتُبُ „пишеш“, يَكْتُبُ „той пише“, تَكْتُبُ „тя пише“. إِلَى „до, към“: أَكْتُبُ إِلَى صَدِيقِي. Минало време със заместване: كَتَبْتُ الرِّسَالَةَ → كَتَبْتُهَا.',
  s:['يَكْتُبُ عُمَرُ إِلَى وَالِدِهِ.|Омар пише на баща си.','أَكْتُبُ اسْمِي وَعُنْوَانِي.|Пиша името и адреса си.','هَلْ كَتَبْتَ الرِّسَالَةَ؟ نَعَمْ، كَتَبْتُهَا.|Написа ли писмото? Да, написах го.','تَكْتُبُ فَاطِمَةُ إِلَى وَالِدَتِهَا.|Фатима пише на майка си.'],
  p:['مَاذَا تَكْتُبُ؟|رِسَالَةٌ|أَكْتُبُ رِسَالَةً.|Пиша писмо.|أَكْتُبُ رِسَالَةٌ.|يَكْتُبُ رِسَالَةً.','مَاذَا تَكْتُبُ؟|الدَّرْسُ|أَكْتُبُ الدَّرْسَ.|Пиша урока.|تَكْتُبُ الدَّرْسَ.|أَكْتُبُ الدَّرْسُ.','هَلْ كَتَبْتَ الرِّسَالَةَ؟|نَعَمْ|نَعَمْ، كَتَبْتُهَا.|Да, написах го.|نَعَمْ، كَتَبْتُهُ.|نَعَمْ، كَتَبْتَهَا.','هَلْ كَتَبْتَ الْعُنْوَانَ؟|نَعَمْ|نَعَمْ، كَتَبْتُهُ.|Да, написах го.|نَعَمْ، كَتَبْتُهَا.|لَا، كَتَبْتُهُ.','إِلَى مَنْ تَكْتُبُ؟|صَدِيقِي|أَكْتُبُ إِلَى صَدِيقِي.|Пиша на приятеля си.|أَكْتُبُ إِلَى صَدِيقُكَ.|يَكْتُبُ إِلَى صَدِيقِي.'],
  q:['مَاذَا يَكْتُبُ إِسْمَاعِيلُ؟|رِسَالَةً|الدَّرْسَ|كِتَابًا','إِلَى مَنْ يَكْتُبُ إِسْمَاعِيلُ؟|إِلَى صَدِيقِهِ|إِلَى وَالِدِهِ|إِلَى عُمَرَ','هَلْ كَتَبَ إِسْمَاعِيلُ الْعُنْوَانَ؟|نَعَمْ، كَتَبَهُ|لَا، لَمْ يَكْتُبْهُ|لَا، كَتَبَهُ عُمَرُ','إِلَى مَنْ يَكْتُبُ عُمَرُ؟|إِلَى وَالِدِهِ|إِلَى صَدِيقِهِ|إِلَى إِسْمَاعِيلَ']},
 {u:'В общежитието и ресторанта',ar:'السُّؤَالُ عَنِ السَّكَنِ',t:'Въпрос за жилището',
  d:['عَلِيٌّ: مَرْحَبًا يَا حَسَنُ.|Здравей, Хасан.','حَسَنٌ: مَرْحَبًا بِكَ يَا عَلِيُّ.|Здравей, Али.','عَلِيٌّ: أَيْنَ تَسْكُنُ؟|Къде живееш?','حَسَنٌ: أَسْكُنُ فِي سَكَنِ الطَّلَبَةِ.|Живея в студентското общежитие.','عَلِيٌّ: فِي أَيِّ طَابِقٍ؟|На кой етаж?','حَسَنٌ: فِي الطَّابِقِ الثَّانِي، فِي الْحُجْرَةِ الْخَامِسَةِ. وَأَنْتَ؟|На втория етаж, в пета стая. А ти?','عَلِيٌّ: أَنَا وَزَمِيلِي نَسْكُنُ فِي الطَّابِقِ الْأَوَّلِ.|Аз и съученикът ми живеем на първия етаж.','حَسَنٌ: هَلِ السَّكَنُ قَرِيبٌ مِنَ الْمَعْهَدِ؟|Близо ли е общежитието до института?','عَلِيٌّ: نَعَمْ، هُوَ قَرِيبٌ. إِلَى اللِّقَاءِ.|Да, близо е. Довиждане.','حَسَنٌ: إِلَى اللِّقَاءِ.|Довиждане.'],
  w:['سَكَنَ / يَسْكُنُ|sakana / yaskunu|живя / живее','سَكَنُ الطَّلَبَةِ|sakanu ṭ-ṭalabati|студентско общежитие','طَابِقٌ|ṭābiqun|етаж','حُجْرَةٌ|ḥujratun|стая','أَيْنَ؟|ayna|къде?','نَحْنُ|naḥnu|ние','الْأَوَّلُ / الْأُولَى|al-awwalu / al-ūlā|първият / първата','الثَّانِي / الثَّانِيَةُ|ath-thānī / ath-thāniyatu|вторият / втората','الثَّالِثُ / الثَّالِثَةُ|ath-thālithu / ath-thālithatu|третият / третата','الرَّابِعُ / الرَّابِعَةُ|ar-rābiʿu / ar-rābiʿatu|четвъртият / четвъртата','الْخَامِسُ / الْخَامِسَةُ|al-khāmisu / al-khāmisatu|петият / петата','قَرِيبٌ|qarībun|близо','بَعِيدٌ|baʿīdun|далеч','مَرْحَبًا|marḥaban|здравей','إِلَى اللِّقَاءِ|ilā l-liqāʾ|довиждане'],
  g:'Поредни числа: الْأَوَّلُ, الثَّانِي, الثَّالِثُ, الرَّابِعُ, الْخَامِسُ, السَّادِسُ, السَّابِعُ, الثَّامِنُ, التَّاسِعُ, الْعَاشِرُ. С дума от ж.р. се добавя ـة: الطَّابِقُ الثَّالِثُ, но الْحُجْرَةُ الثَّالِثَةُ (изключение: الْأَوَّلُ → الْأُولَى). „Живея“: أَسْكُنُ (аз), تَسْكُنُ (ти, м.р.), تَسْكُنِينَ (ти, ж.р.), يَسْكُنُ (той), نَسْكُنُ (ние).',
  s:['أَنَا أَسْكُنُ فِي الطَّابِقِ الثَّانِي.|Аз живея на втория етаж.','نَحْنُ نَسْكُنُ فِي الطَّابِقِ الْأَوَّلِ.|Ние живеем на първия етаж.','أَنْتَ تَسْكُنُ فِي الْحُجْرَةِ الْأُولَى.|Ти живееш в първа стая.','أَنْتِ تَسْكُنِينَ فِي الْحُجْرَةِ الثَّانِيَةِ.|Ти (ж.р.) живееш във втора стая.','هُوَ يَسْكُنُ فِي الْحُجْرَةِ الثَّالِثَةِ.|Той живее в трета стая.'],
  p:['أَيْنَ تَسْكُنُ؟|الطَّابِقُ الثَّالِثُ|أَسْكُنُ فِي الطَّابِقِ الثَّالِثِ.|Живея на третия етаж.|أَسْكُنُ فِي الطَّابِقِ الثَّالِثَةِ.|تَسْكُنُ فِي الطَّابِقِ الثَّالِثِ.','أَيْنَ تَسْكُنُ؟|الْحُجْرَةُ الرَّابِعَةُ|أَسْكُنُ فِي الْحُجْرَةِ الرَّابِعَةِ.|Живея в четвърта стая.|أَسْكُنُ فِي الْحُجْرَةِ الرَّابِعِ.|يَسْكُنُ فِي الْحُجْرَةِ الرَّابِعَةِ.','أَيْنَ تَسْكُنُونَ؟|الطَّابِقُ الْأَوَّلُ|نَحْنُ نَسْكُنُ فِي الطَّابِقِ الْأَوَّلِ.|Ние живеем на първия етаж.|نَحْنُ أَسْكُنُ فِي الطَّابِقِ الْأَوَّلِ.|نَحْنُ نَسْكُنُ فِي الطَّابِقِ الْأُولَى.','أَيْنَ تَسْكُنِينَ؟|الْحُجْرَةُ الْأُولَى|أَسْكُنُ فِي الْحُجْرَةِ الْأُولَى.|(жена) Живея в първа стая.|أَسْكُنُ فِي الْحُجْرَةِ الْأَوَّلِ.|تَسْكُنِينَ فِي الْحُجْرَةِ الْأُولَى.','هَلْ يَسْكُنُ عَلِيٌّ فِي الطَّابِقِ الثَّانِي؟|لَا — الْأَوَّلُ|لَا، هُوَ يَسْكُنُ فِي الطَّابِقِ الْأَوَّلِ.|Не, той живее на първия етаж.|نَعَمْ، هُوَ يَسْكُنُ فِي الطَّابِقِ الْأَوَّلِ.|لَا، هُوَ يَسْكُنُ فِي الطَّابِقِ الثَّانِي.'],
  q:['أَيْنَ يَسْكُنُ حَسَنٌ؟|فِي سَكَنِ الطَّلَبَةِ|فِي فُنْدُقٍ|فِي الْمَعْهَدِ','فِي أَيِّ طَابِقٍ يَسْكُنُ حَسَنٌ؟|فِي الطَّابِقِ الثَّانِي|فِي الطَّابِقِ الْأَوَّلِ|فِي الطَّابِقِ الْخَامِسِ','فِي أَيِّ حُجْرَةٍ يَسْكُنُ حَسَنٌ؟|فِي الْحُجْرَةِ الْخَامِسَةِ|فِي الْحُجْرَةِ الثَّانِيَةِ|فِي الْحُجْرَةِ الْأُولَى','هَلِ السَّكَنُ بَعِيدٌ عَنِ الْمَعْهَدِ؟|لَا، هُوَ قَرِيبٌ|نَعَمْ، هُوَ بَعِيدٌ|نَعَمْ، بَعِيدٌ جِدًّا']},
 {u:'В общежитието и ресторанта',ar:'فِي الْحُجْرَةِ',t:'В стаята',
  d:['خَالِدٌ: تَفَضَّلْ يَا آدَمُ، نَذْهَبُ إِلَى حُجْرَتِي.|Заповядай, Адам, да отидем в стаята ми.','آدَمُ: شُكْرًا. حُجْرَتُكَ وَاسِعَةٌ وَجَمِيلَةٌ.|Благодаря. Стаята ти е просторна и красива.','خَالِدٌ: تَفَضَّلِ اجْلِسْ عَلَى الْكُرْسِيِّ الْمُرِيحِ.|Заповядай, седни на удобния стол.','آدَمُ: فِي الْحُجْرَةِ سَرِيرٌ وَمَكْتَبٌ وَمُكَيِّفٌ.|В стаята има легло, бюро и климатик.','خَالِدٌ: نَعَمْ، وَفِيهَا هَاتِفٌ أَيْضًا.|Да, а има и телефон.','آدَمُ: هَلْ حَانَ وَقْتُ الذَّهَابِ إِلَى الْمَعْهَدِ؟|Дойде ли време да тръгваме за института?','خَالِدٌ: لَا، هٰذَا وَقْتُ الْغَدَاءِ.|Не, сега е време за обяд.'],
  w:['حُجْرَةٌ|ḥujratun|стая','سَرِيرٌ|sarīrun|легло','خِزَانَةٌ|khizānatun|гардероб','مُكَيِّفٌ|mukayyifun|климатик','هَاتِفٌ|hātifun|телефон','مُرِيحٌ|murīḥun|удобен','عَلَى|ʿalā|върху, на','اجْلِسْ|ijlis|седни!','تَفَضَّلْ|tafaḍḍal|заповядай','نَذْهَبُ|nadhhabu|отиваме','حَانَ|ḥāna|настъпи (времето)','وَقْتٌ|waqtun|време','الذَّهَابُ|adh-dhahābu|тръгването, отиването','الْغَدَاءُ|al-ghadāʾu|обядът'],
  g:'Когато съществителното получи ال, и прилагателното след него получава ال: كُرْسِيٌّ مُرِيحٌ „удобен стол“ → الْكُرْسِيُّ الْمُرِيحُ „удобният стол“. „Време е за…“: حَانَ وَقْتُ الْغَدَاءِ; въпрос: هَلْ حَانَ وَقْتُ الدَّرْسِ؟',
  s:['تَفَضَّلِ اجْلِسْ عَلَى كُرْسِيٍّ مُرِيحٍ.|Заповядай, седни на удобен стол.','تَفَضَّلِ اجْلِسْ عَلَى الْكُرْسِيِّ الْمُرِيحِ.|Заповядай, седни на удобния стол.','هَلْ حَانَ وَقْتُ الْغَدَاءِ؟ نَعَمْ، حَانَ وَقْتُ الْغَدَاءِ.|Дойде ли време за обяд? Да, дойде.','الْهَاتِفُ عَلَى الْمَكْتَبِ.|Телефонът е на бюрото.','تَفَضَّلْ، نَذْهَبُ إِلَى الطَّابِقِ الثَّالِثِ.|Заповядай, да отидем на третия етаж.'],
  p:['حَوِّلْ كَمَا فِي النَّمُوذَجِ:|كُرْسِيٌّ مُرِيحٌ|الْكُرْسِيُّ الْمُرِيحُ|удобният стол|الْكُرْسِيُّ مُرِيحٌ|كُرْسِيٌّ الْمُرِيحُ','حَوِّلْ كَمَا فِي النَّمُوذَجِ:|حُجْرَةٌ جَدِيدَةٌ|الْحُجْرَةُ الْجَدِيدَةُ|новата стая|الْحُجْرَةُ جَدِيدَةٌ|حُجْرَةٌ الْجَدِيدَةُ','حَوِّلْ كَمَا فِي النَّمُوذَجِ:|سَرِيرٌ كَبِيرٌ|السَّرِيرُ الْكَبِيرُ|голямото легло|السَّرِيرُ كَبِيرٌ|سَرِيرٌ الْكَبِيرُ','هَلْ حَانَ وَقْتُ الدَّرْسِ؟|نَعَمْ|نَعَمْ، حَانَ وَقْتُ الدَّرْسِ.|Да, време е за урока.|نَعَمْ، حَانَ وَقْتُ الْغَدَاءِ.|لَا، حَانَ وَقْتُ الدَّرْسِ.','أَيْنَ الْهَاتِفُ؟|عَلَى الْمَكْتَبِ|الْهَاتِفُ عَلَى الْمَكْتَبِ.|Телефонът е на бюрото.|الْهَاتِفُ عَلَى الْمَكْتَبُ.|الْمَكْتَبُ عَلَى الْهَاتِفِ.'],
  q:['إِلَى أَيْنَ ذَهَبَ آدَمُ وَخَالِدٌ؟|إِلَى حُجْرَةِ خَالِدٍ|إِلَى الْمَعْهَدِ|إِلَى الْمَطْعَمِ','كَيْفَ حُجْرَةُ خَالِدٍ؟|وَاسِعَةٌ وَجَمِيلَةٌ|صَغِيرَةٌ وَقَدِيمَةٌ|بَعِيدَةٌ','مَاذَا فِي الْحُجْرَةِ؟|سَرِيرٌ وَمَكْتَبٌ وَمُكَيِّفٌ وَهَاتِفٌ|سَبُّورَةٌ وَمَقَاعِدُ|كُتُبٌ وَرُفُوفٌ','هَلْ حَانَ وَقْتُ الذَّهَابِ إِلَى الْمَعْهَدِ؟|لَا، هٰذَا وَقْتُ الْغَدَاءِ|نَعَمْ، حَانَ وَقْتُ الذَّهَابِ|لَا، هٰذَا وَقْتُ الدَّرْسِ']},
 {u:'В общежитието и ресторанта',ar:'فِي الْمَطْعَمِ',t:'В ресторанта',
  d:['خَالِدٌ: وَصَلْنَا إِلَى الْمَطْعَمِ يَا آدَمُ.|Стигнахме до ресторанта, Адам.','آدَمُ: هُوَ مَطْعَمٌ نَظِيفٌ وَجَمِيلٌ.|Ресторантът е чист и красив.','خَالِدٌ: نَعَمْ، وَالطَّعَامُ فِيهِ لَذِيذٌ.|Да, и храната в него е вкусна.','آدَمُ: أَنَا جَوْعَانُ، أُرِيدُ أَنْ أَتَنَاوَلَ الْغَدَاءَ. مَاذَا فِي الْمَطْعَمِ؟|Гладен съм, искам да обядвам. Какво има в ресторанта?','خَالِدٌ: فِيهِ لَحْمٌ وَخُضَارٌ وَسَمَكٌ وَدَجَاجٌ.|Има месо, зеленчуци, риба и пиле.','آدَمُ: حَسَنًا، أَيْنَ عَامِلُ الْمَطْعَمِ؟|Добре, къде е сервитьорът?','خَالِدٌ: هَا هُوَ قَادِمٌ.|Ето го, идва.'],
  w:['وَصَلَ / يَصِلُ|waṣala / yaṣilu|пристигна / пристига','مَطْعَمٌ|maṭʿamun|ресторант','نَظِيفٌ|naẓīfun|чист','جَمِيلٌ|jamīlun|красив','لَذِيذٌ|ladhīdhun|вкусен','طَعَامٌ|ṭaʿāmun|храна','جَوْعَانُ|jawʿānu|гладен','أَرَادَ / يُرِيدُ|arāda / yurīdu|поиска / иска','تَنَاوَلَ / يَتَنَاوَلُ|tanāwala / yatanāwalu|похапна / приема (храна)','لَحْمٌ|laḥmun|месо','خُضَارٌ|khuḍārun|зеленчуци','سَمَكٌ|samakun|риба','دَجَاجٌ|dajājun|пиле','عَامِلٌ|ʿāmilun|работник, сервитьор','هَا هُوَ قَادِمٌ|hā huwa qādimun|ето го, идва'],
  g:'„Искам да…“: أُرِيدُ أَنْ + глагол: أُرِيدُ أَنْ أَتَنَاوَلَ الْغَدَاءَ. Формите: نَحْنُ نُرِيدُ أَنْ نَتَنَاوَلَ, أَنْتَ تُرِيدُ أَنْ تَتَنَاوَلَ, أَنْتِ تُرِيدِينَ أَنْ تَتَنَاوَلِي, هُوَ يُرِيدُ أَنْ يَتَنَاوَلَ, هِيَ تُرِيدُ أَنْ تَتَنَاوَلَ. „Ето го / я“: هَا هُوَ قَادِمٌ, هَا هِيَ قَادِمَةٌ.',
  s:['وَصَلْنَا إِلَى السَّكَنِ.|Стигнахме до общежитието.','أَيْنَ طَبِيبَةُ الْمَعْهَدِ؟ هَا هِيَ قَادِمَةٌ.|Къде е лекарката на института? Ето я, идва.','نَحْنُ نُرِيدُ أَنْ نَتَنَاوَلَ الْغَدَاءَ.|Искаме да обядваме.','أَنْتِ تُرِيدِينَ أَنْ تَتَنَاوَلِي الْغَدَاءَ.|Ти (ж.р.) искаш да обядваш.','هِيَ تُرِيدُ أَنْ تَتَنَاوَلَ الْغَدَاءَ.|Тя иска да обядва.'],
  p:['أَيْنَ عَامِلُ الْمَطْعَمِ؟|هُوَ|هَا هُوَ قَادِمٌ.|Ето го, идва.|هَا هِيَ قَادِمَةٌ.|هَا هُوَ قَادِمَةٌ.','أَيْنَ الطَّبِيبَةُ؟|هِيَ|هَا هِيَ قَادِمَةٌ.|Ето я, идва.|هَا هُوَ قَادِمٌ.|هَا هِيَ قَادِمٌ.','مَاذَا تُرِيدُ؟|أَنَا|أَنَا أُرِيدُ أَنْ أَتَنَاوَلَ الْغَدَاءَ.|Искам да обядвам.|أَنَا تُرِيدُ أَنْ تَتَنَاوَلَ الْغَدَاءَ.|أَنَا أُرِيدُ أَنْ يَتَنَاوَلَ الْغَدَاءَ.','مَاذَا تُرِيدُونَ؟|نَحْنُ|نَحْنُ نُرِيدُ أَنْ نَتَنَاوَلَ الْغَدَاءَ.|Искаме да обядваме.|نَحْنُ أُرِيدُ أَنْ أَتَنَاوَلَ الْغَدَاءَ.|نَحْنُ نُرِيدُ أَنْ تَتَنَاوَلَ الْغَدَاءَ.','مَاذَا تُرِيدُ هِيَ؟|هِيَ|هِيَ تُرِيدُ أَنْ تَتَنَاوَلَ الْغَدَاءَ.|Тя иска да обядва.|هِيَ يُرِيدُ أَنْ يَتَنَاوَلَ الْغَدَاءَ.|هِيَ تُرِيدِينَ أَنْ تَتَنَاوَلِي الْغَدَاءَ.'],
  q:['كَيْفَ الْمَطْعَمُ؟|نَظِيفٌ وَجَمِيلٌ|صَغِيرٌ وَقَدِيمٌ|بَعِيدٌ جِدًّا','لِمَاذَا يُرِيدُ آدَمُ أَنْ يَتَنَاوَلَ الْغَدَاءَ؟|لِأَنَّهُ جَوْعَانُ|لِأَنَّهُ مَرِيضٌ|لِأَنَّ الْمَطْعَمَ قَرِيبٌ','مَاذَا فِي الْمَطْعَمِ؟|لَحْمٌ وَخُضَارٌ وَسَمَكٌ وَدَجَاجٌ|شَايٌ وَقَهْوَةٌ فَقَطْ|خُبْزٌ وَجُبْنٌ','مَنِ الْقَادِمُ؟|عَامِلُ الْمَطْعَمِ|طَبِيبُ الْمَعْهَدِ|زَمِيلُ خَالِدٍ']},
 {u:'В общежитието и ресторанта',ar:'تَنَاوُلُ الطَّعَامِ',t:'Хранене',
  d:['عَامِلُ الْمَطْعَمِ: تَفَضَّلْ يَا آدَمُ، مَاذَا تُرِيدُ؟|Заповядай, Адам, какво желаеш?','آدَمُ: أُفَضِّلُ الدَّجَاجَ مَعَ الرُّزِّ.|Предпочитам пиле с ориз.','عَامِلُ الْمَطْعَمِ: وَأَنْتَ يَا خَالِدُ؟|А ти, Халид?','خَالِدٌ: أُفَضِّلُ السَّمَكَ مَعَ الْخُبْزِ.|Предпочитам риба с хляб.','عَامِلُ الْمَطْعَمِ: وَمَاذَا تَشْرَبُ يَا آدَمُ، شَايًا أَوْ قَهْوَةً؟|А какво ще пиеш, Адам — чай или кафе?','آدَمُ: أَشْرَبُ الشَّايَ بَعْدَ الطَّعَامِ.|Пия чай след храната.','خَالِدٌ: وَأَنَا أُفَضِّلُ الْقَهْوَةَ.|А аз предпочитам кафе.','آدَمُ: الطَّعَامُ لَذِيذٌ جِدًّا، الْحَمْدُ لِلّٰهِ.|Храната е много вкусна, слава на Аллах.'],
  w:['فَضَّلَ / يُفَضِّلُ|faḍḍala / yufaḍḍilu|предпочете / предпочита','أُفَضِّلُ|ufaḍḍilu|предпочитам','شَرِبَ / يَشْرَبُ|shariba / yashrabu|пи / пие','أَكَلَ / يَأْكُلُ|akala / yaʾkulu|яде / яде','شَايٌ|shāyun|чай','قَهْوَةٌ|qahwatun|кафе','مَعَ|maʿa|с, заедно с','بَعْدَ|baʿda|след','أَوْ|aw|или','رُزٌّ|ruzzun|ориз','خُبْزٌ|khubzun|хляб','مَاءٌ|māʾun|вода','عَصِيرٌ|ʿaṣīrun|сок','كَمْ؟|kam|колко?'],
  g:'„Предпочитам“: أُفَضِّلُ (аз), تُفَضِّلُ (ти), يُفَضِّلُ (той): يُفَضِّلُ أَحْمَدُ السَّمَكَ مَعَ الْخُبْزِ. Предлози за време и съпровод: مَعَ „с“, بَعْدَ „след“, قَبْلَ „преди“: أَشْرَبُ الْقَهْوَةَ بَعْدَ الطَّعَامِ. أَوْ „или“: شَايًا أَوْ قَهْوَةً.',
  s:['يُفَضِّلُ أَحْمَدُ الدَّجَاجَ مَعَ الرُّزِّ.|Ахмед предпочита пиле с ориз.','يُفَضِّلُ إِسْمَاعِيلُ اللَّحْمَ مَعَ الْخُضَارِ.|Исмаил предпочита месо със зеленчуци.','يُفَضِّلُ مَحْمُودٌ الْقَهْوَةَ بَعْدَ الطَّعَامِ.|Махмуд предпочита кафе след храната.','مَاذَا تَشْرَبُ؟ أَشْرَبُ الْمَاءَ.|Какво пиеш? Пия вода.'],
  p:['مَاذَا يُفَضِّلُ خَالِدٌ؟|السَّمَكُ مَعَ الْخُبْزِ|يُفَضِّلُ خَالِدٌ السَّمَكَ مَعَ الْخُبْزِ.|Халид предпочита риба с хляб.|أُفَضِّلُ خَالِدٌ السَّمَكَ مَعَ الْخُبْزِ.|يُفَضِّلُ خَالِدٌ السَّمَكُ مَعَ الْخُبْزِ.','مَاذَا تُفَضِّلُ؟|الدَّجَاجُ مَعَ الرُّزِّ|أُفَضِّلُ الدَّجَاجَ مَعَ الرُّزِّ.|Предпочитам пиле с ориз.|يُفَضِّلُ الدَّجَاجَ مَعَ الرُّزِّ.|أُفَضِّلُ الدَّجَاجُ مَعَ الرُّزِّ.','مَاذَا تَشْرَبُ؟|الشَّايُ|أَشْرَبُ الشَّايَ.|Пия чай.|تَشْرَبُ الشَّايَ.|أَشْرَبُ الشَّايُ.','مَتَى تَشْرَبُ الْقَهْوَةَ؟|بَعْدَ الطَّعَامِ|أَشْرَبُ الْقَهْوَةَ بَعْدَ الطَّعَامِ.|Пия кафе след храната.|أَشْرَبُ الْقَهْوَةَ بَعْدَ الطَّعَامُ.|يَشْرَبُ الْقَهْوَةَ بَعْدَ الطَّعَامِ.'],
  q:['مَاذَا يُفَضِّلُ آدَمُ؟|الدَّجَاجَ مَعَ الرُّزِّ|السَّمَكَ مَعَ الْخُبْزِ|اللَّحْمَ مَعَ الْخُضَارِ','مَاذَا يُفَضِّلُ خَالِدٌ؟|السَّمَكَ مَعَ الْخُبْزِ|الدَّجَاجَ مَعَ الرُّزِّ|اللَّحْمَ مَعَ الْخُضَارِ','مَاذَا يَشْرَبُ آدَمُ بَعْدَ الطَّعَامِ؟|الشَّايَ|الْقَهْوَةَ|الْعَصِيرَ','كَيْفَ الطَّعَامُ؟|لَذِيذٌ جِدًّا|لَيْسَ لَذِيذًا|قَلِيلٌ']},
 {u:'В библиотеката',ar:'أَيْنَ الْمَكْتَبَةُ؟',t:'Къде е библиотеката?',
  d:['يُوسُفُ: مِنْ فَضْلِكَ، أَيْنَ الْمَكْتَبَةُ؟|Моля, къде е библиотеката?','حَامِدٌ: هٰذِهِ هِيَ الْمَكْتَبَةُ.|Ето това е библиотеката.','يُوسُفُ: وَأَيْنَ الْمَلْعَبُ؟|А къде е игрището?','حَامِدٌ: ذٰلِكَ هُوَ الْمَلْعَبُ، بِجَانِبِ الْمَطْعَمِ.|Онова е игрището, до ресторанта.','يُوسُفُ: وَتِلْكَ؟|А онова (сградата там)?','حَامِدٌ: تِلْكَ مَدْرَسَةٌ صَغِيرَةٌ.|Онова е малко училище.','يُوسُفُ: شُكْرًا جَزِيلًا.|Много благодаря.','حَامِدٌ: عَفْوًا.|Няма защо.'],
  w:['مِنْ فَضْلِكَ|min faḍlika|моля','مَكْتَبَةٌ|maktabatun|библиотека','مَلْعَبٌ|malʿabun|игрище','هٰذَا هُوَ|hādhā huwa|ето това е (м.р.)','هٰذِهِ هِيَ|hādhihi hiya|ето това е (ж.р.)','ذٰلِكَ|dhālika|онова (м.р.)','تِلْكَ|tilka|онова (ж.р.)','بِجَانِبِ|bijānibi|до','وَاسِعٌ|wāsiʿun|просторен','صَغِيرٌ|ṣaghīrun|малък','كَبِيرٌ|kabīrun|голям','شُكْرًا جَزِيلًا|shukran jazīlan|много благодаря'],
  g:'Показателни местоимения: близко — هٰذَا (м.р.), هٰذِهِ (ж.р.); далечно — ذٰلِكَ (м.р.), تِلْكَ (ж.р.). „Ето това е…“: هٰذِهِ هِيَ الْمَكْتَبَةُ, هٰذَا هُوَ الْمَلْعَبُ. Определено прилагателно: أُرِيدُ الْحُجْرَةَ الصَّغِيرَةَ.',
  s:['أَيْنَ الْمَطْعَمُ؟ هٰذَا هُوَ الْمَطْعَمُ.|Къде е ресторантът? Ето това е ресторантът.','مِنْ فَضْلِكَ، أَيْنَ سَبُّورَةُ الْفَصْلِ؟|Моля, къде е дъската на класа?','أُرِيدُ النَّافِذَةَ الْوَاسِعَةَ.|Искам широкия прозорец.','أُرِيدُ الْحُجْرَةَ الصَّغِيرَةَ.|Искам малката стая.','هٰذَا كِتَابٌ، وَذٰلِكَ بَابٌ.|Това е книга, а онова е врата.'],
  p:['أَيْنَ الْمَكْتَبَةُ؟|هٰذِهِ|هٰذِهِ هِيَ الْمَكْتَبَةُ.|Ето това е библиотеката.|هٰذَا هُوَ الْمَكْتَبَةُ.|هٰذِهِ هُوَ الْمَكْتَبَةُ.','أَيْنَ الْمَلْعَبُ؟|ذٰلِكَ|ذٰلِكَ هُوَ الْمَلْعَبُ.|Онова е игрището.|تِلْكَ هِيَ الْمَلْعَبُ.|ذٰلِكَ هِيَ الْمَلْعَبُ.','أَيْنَ النَّافِذَةُ؟|تِلْكَ|تِلْكَ هِيَ النَّافِذَةُ.|Онова е прозорецът.|ذٰلِكَ هُوَ النَّافِذَةُ.|تِلْكَ هُوَ النَّافِذَةُ.','مَاذَا تُرِيدُ؟|حُجْرَةٌ صَغِيرَةٌ|أُرِيدُ الْحُجْرَةَ الصَّغِيرَةَ.|Искам малката стая.|أُرِيدُ الْحُجْرَةَ صَغِيرَةٌ.|أُرِيدُ الْحُجْرَةَ الصَّغِيرَ.','مَا هٰذَا وَمَا تِلْكَ؟|قَلَمٌ — سَبُّورَةٌ|هٰذَا قَلَمٌ، وَتِلْكَ سَبُّورَةٌ.|Това е химикалка, а онова е дъска.|هٰذَا قَلَمٌ، وَذٰلِكَ سَبُّورَةٌ.|هٰذِهِ قَلَمٌ، وَتِلْكَ سَبُّورَةٌ.'],
  q:['عَنْ مَاذَا سَأَلَ يُوسُفُ أَوَّلًا؟|عَنِ الْمَكْتَبَةِ|عَنِ الْمَلْعَبِ|عَنِ الْمَطْعَمِ','أَيْنَ الْمَلْعَبُ؟|بِجَانِبِ الْمَطْعَمِ|بِجَانِبِ الْمَكْتَبَةِ|بِجَانِبِ الْمَدْرَسَةِ','مَا تِلْكَ؟|مَدْرَسَةٌ صَغِيرَةٌ|مَكْتَبَةٌ كَبِيرَةٌ|مَطْعَمٌ جَمِيلٌ']},
 {u:'В библиотеката',ar:'فِي الْمَكْتَبَةِ',t:'В библиотеката',
  d:['عَبْدُ اللّٰهِ: السَّلَامُ عَلَيْكُمْ. أُرِيدُ كِتَابًا فِي الْحَدِيثِ.|Здравейте. Искам книга по хадис.','أَمِينُ الْمَكْتَبَةِ: وَعَلَيْكُمُ السَّلَامُ. الْكِتَابُ عَلَى الرَّفِّ الرَّابِعِ.|Здравейте. Книгата е на четвъртия рафт.','عَبْدُ اللّٰهِ: وَأُرِيدُ صَحِيفَةَ الْيَوْمِ.|И искам днешния вестник.','أَمِينُ الْمَكْتَبَةِ: تَجِدُهَا عَلَى الْمَكْتَبِ، بِجَانِبِ الْمَجَلَّاتِ.|Ще го намериш на бюрото, до списанията.','عَبْدُ اللّٰهِ: وَأَيْنَ أَجِدُ كُتُبَ النَّحْوِ؟|А къде да намеря книгите по граматика?','أَمِينُ الْمَكْتَبَةِ: تَجِدُهَا هُنَاكَ، عَلَى الرَّفِّ الْأَوَّلِ.|Ще ги намериш там, на първия рафт.','عَبْدُ اللّٰهِ: شُكْرًا جَزِيلًا.|Много благодаря.'],
  w:['أَمِينُ الْمَكْتَبَةِ|amīnu l-maktabati|библиотекар','الْحَدِيثُ|al-ḥadīthu|хадис','النَّحْوُ|an-naḥwu|граматиката','رَفٌّ|raffun|рафт','كُتُبٌ|kutubun|книги','صَحِيفَةٌ|ṣaḥīfatun|вестник','مَجَلَّةٌ|majallatun|списание','جَرِيدَةٌ|jarīdatun|вестник','طَاوِلَةٌ|ṭāwilatun|маса','وَجَدَ / يَجِدُ|wajada / yajidu|намери / намира','أَجِدُ|ajidu|намирам','تَجِدُهُ|tajiduhu|ще го намериш','تَجِدُهَا|tajiduhā|ще я намериш','الرَّابِعُ|ar-rābiʿu|четвъртият','هُنَاكَ|hunāka|там'],
  g:'Предлози за място: عَلَى „върху, на“ и فِي „в“: الْكِتَابُ عَلَى الرَّفِّ, الْكِتَابُ فِي الْحَقِيبَةِ. „Намирам“ с местоимение: تَجِدُهُ „ще го намериш“ (м.р.), تَجِدُهَا „ще я намериш“ (ж.р., а също за множествено число на неща: الْكُتُبُ → تَجِدُهَا).',
  s:['الْكِتَابُ عَلَى الرَّفِّ.|Книгата е на рафта.','الْقَلَمُ عَلَى الدُّرْجِ.|Химикалката е върху чекмеджето.','الْمِسْطَرَةُ فِي الدُّرْجِ.|Линийката е в чекмеджето.','أَيْنَ كِتَابُ الْحَدِيثِ؟ تَجِدُهُ فِي الْمَكْتَبَةِ.|Къде е книгата по хадис? Ще я намериш в библиотеката.','أَيْنَ أَجِدُ الطَّالِبَ؟ تَجِدُهُ فِي الْمَلْعَبِ.|Къде да намеря студента? Ще го намериш на игрището.'],
  p:['أَيْنَ الْكِتَابُ؟|عَلَى الرَّفِّ|الْكِتَابُ عَلَى الرَّفِّ.|Книгата е на рафта.|الْكِتَابُ عَلَى الرَّفُّ.|الرَّفُّ عَلَى الْكِتَابِ.','أَيْنَ الْمِسْطَرَةُ؟|فِي الْحَقِيبَةِ|الْمِسْطَرَةُ فِي الْحَقِيبَةِ.|Линийката е в чантата.|الْمِسْطَرَةُ فِي الْحَقِيبَةُ.|الْحَقِيبَةُ فِي الْمِسْطَرَةِ.','أَيْنَ أَجِدُ الْكِتَابَ؟|فِي الْمَكْتَبَةِ|تَجِدُهُ فِي الْمَكْتَبَةِ.|Ще я намериш в библиотеката.|تَجِدُهَا فِي الْمَكْتَبَةِ.|أَجِدُهُ فِي الْمَكْتَبَةِ.','أَيْنَ أَجِدُ الصَّحِيفَةَ؟|عَلَى الْمَكْتَبِ|تَجِدُهَا عَلَى الْمَكْتَبِ.|Ще го намериш на бюрото.|تَجِدُهُ عَلَى الْمَكْتَبِ.|تَجِدُهَا عَلَى الْمَكْتَبُ.','أَيْنَ أَجِدُ الطَّالِبَ؟|فِي الْمَلْعَبِ|تَجِدُهُ فِي الْمَلْعَبِ.|Ще го намериш на игрището.|تَجِدُهَا فِي الْمَلْعَبِ.|تَجِدُهُ فِي الْمَلْعَبُ.'],
  q:['مَاذَا أَرَادَ عَبْدُ اللّٰهِ أَوَّلًا؟|كِتَابًا فِي الْحَدِيثِ|كِتَابًا فِي النَّحْوِ|صَحِيفَةَ الْيَوْمِ','عَلَى أَيِّ رَفٍّ كِتَابُ الْحَدِيثِ؟|عَلَى الرَّفِّ الرَّابِعِ|عَلَى الرَّفِّ الْأَوَّلِ|عَلَى الرَّفِّ الثَّانِي','أَيْنَ صَحِيفَةُ الْيَوْمِ؟|عَلَى الْمَكْتَبِ|عَلَى الرَّفِّ الرَّابِعِ|فِي الدُّرْجِ','أَيْنَ كُتُبُ النَّحْوِ؟|عَلَى الرَّفِّ الْأَوَّلِ|عَلَى الْمَكْتَبِ|عَلَى الرَّفِّ الرَّابِعِ']},
 {u:'В бакалията',ar:'مَاذَا نَشْتَرِي؟',t:'Какво ще купим?',
  d:['الْوَالِدُ: تَعَالَ يَا أَحْمَدُ.|Ела, Ахмед.','أَحْمَدُ: نَعَمْ يَا وَالِدِي.|Да, татко.','الْوَالِدُ: اذْهَبْ إِلَى الْبَقَّالَةِ.|Иди до бакалията.','أَحْمَدُ: مَاذَا أَشْتَرِي يَا وَالِدِي؟|Какво да купя, татко?','الْوَالِدُ: اشْتَرِ زُجَاجَةَ مَاءٍ وَصَابُونَ حَمَّامٍ.|Купи бутилка вода и сапун за баня.','أَحْمَدُ: أَعْطِنِي النُّقُودَ.|Дай ми парите.','الْوَالِدُ: خُذِ النُّقُودَ وَأَسْرِعْ.|Вземи парите и побързай.','أَحْمَدُ: سَأَعُودُ بِسُرْعَةٍ.|Ще се върна бързо.'],
  w:['تَعَالَ|taʿāla|ела','اذْهَبْ|idhhab|иди','بَقَّالَةٌ|baqqālatun|бакалия','اشْتَرَى / يَشْتَرِي|ishtarā / yashtarī|купи / купува','اشْتَرِ|ishtari|купи!','زُجَاجَةٌ|zujājatun|бутилка','مَاءٌ|māʾun|вода','صَابُونٌ|ṣābūnun|сапун','حَمَّامٌ|ḥammāmun|баня','أَعْطِنِي|aʿṭinī|дай ми','نُقُودٌ|nuqūdun|пари','خُذْ|khudh|вземи','أَسْرِعْ|asriʿ|побързай','سَأَعُودُ|saʾaʿūdu|ще се върна','بِسُرْعَةٍ|bisurʿatin|бързо'],
  g:'Повелително наклонение: تَذْهَبُ → اذْهَبْ „иди!“, تَشْرَبُ → اشْرَبْ „пий!“, تَأْخُذُ → خُذْ „вземи!“, تُسْرِعُ → أَسْرِعْ „побързай!“. Бъдеще време със سَـ: أَعُودُ → سَأَعُودُ „ще се върна“. Сравнете: شَرِبَ عَبْدُ اللّٰهِ — اشْرَبْ يَا إِسْمَاعِيلُ — يَشْرَبُ إِسْمَاعِيلُ.',
  s:['اذْهَبْ إِلَى الْمَكْتَبَةِ يَا عَلِيُّ.|Иди в библиотеката, Али.','اشْرَبِ الْمَاءَ يَا إِسْمَاعِيلُ.|Пий водата, Исмаил.','مَاذَا تُرِيدُ أَنْ تَشْرَبَ؟ أُرِيدُ أَنْ أَشْرَبَ شَايًا.|Какво искаш да пиеш? Искам да пия чай.','هَلْ تُرِيدُ خُبْزًا؟ نَعَمْ، أُرِيدُ خُبْزًا.|Искаш ли хляб? Да, искам хляб.'],
  p:['قُلْ لِعَلِيٍّ:|الْمَكْتَبَةُ|اذْهَبْ إِلَى الْمَكْتَبَةِ يَا عَلِيُّ.|Иди в библиотеката, Али.|يَذْهَبُ إِلَى الْمَكْتَبَةِ يَا عَلِيُّ.|اذْهَبْ إِلَى الْمَكْتَبَةُ يَا عَلِيُّ.','قُلْ لِإِسْمَاعِيلَ:|الْمَاءُ|اشْرَبِ الْمَاءَ يَا إِسْمَاعِيلُ.|Пий водата, Исмаил.|يَشْرَبُ الْمَاءَ يَا إِسْمَاعِيلُ.|شَرِبَ الْمَاءَ يَا إِسْمَاعِيلُ.','مَاذَا تُرِيدُ أَنْ تَكْتُبَ؟|رِسَالَةٌ|أُرِيدُ أَنْ أَكْتُبَ رِسَالَةً.|Искам да напиша писмо.|أُرِيدُ أَنْ تَكْتُبَ رِسَالَةً.|أُرِيدُ أَنْ أَكْتُبَ رِسَالَةٌ.','مَاذَا تُرِيدُ أَنْ تَأْخُذَ؟|نُقُودٌ|أُرِيدُ أَنْ آخُذَ نُقُودًا.|Искам да взема пари.|أُرِيدُ أَنْ تَأْخُذَ نُقُودًا.|أُرِيدُ أَنْ آخُذَ نُقُودٌ.','هَلْ تُرِيدُ عَصِيرًا؟|نَعَمْ|نَعَمْ، أُرِيدُ عَصِيرًا.|Да, искам сок.|نَعَمْ، تُرِيدُ عَصِيرًا.|نَعَمْ، أُرِيدُ عَصِيرٌ.'],
  q:['إِلَى أَيْنَ يَذْهَبُ أَحْمَدُ؟|إِلَى الْبَقَّالَةِ|إِلَى الْمَكْتَبَةِ|إِلَى الْمَطْعَمِ','مَاذَا يَشْتَرِي أَحْمَدُ؟|زُجَاجَةَ مَاءٍ وَصَابُونَ حَمَّامٍ|خُبْزًا وَجُبْنًا|شَايًا وَسُكَّرًا','مَاذَا أَعْطَى الْوَالِدُ أَحْمَدَ؟|النُّقُودَ|الصَّابُونَ|الْمَاءَ','مَتَى سَيَعُودُ أَحْمَدُ؟|بِسُرْعَةٍ|فِي الْمَسَاءِ|بَعْدَ يَوْمٍ']},
 {u:'В бакалията',ar:'فِي الْبَقَّالَةِ',t:'В бакалията',
  d:['أَحْمَدُ: السَّلَامُ عَلَيْكُمْ. هَلْ عِنْدَكَ شَايٌ؟|Здравейте. Имате ли чай?','الْبَقَّالُ: وَعَلَيْكُمُ السَّلَامُ. نَعَمْ، كَمْ صُنْدُوقًا تُرِيدُ؟|Здравей. Да, колко кутии искаш?','أَحْمَدُ: أُرِيدُ صُنْدُوقَ شَايٍ وَخَمْسَ عُلَبِ حَلِيبٍ.|Искам кутия чай и пет кутии мляко.','الْبَقَّالُ: تَفَضَّلْ. هَلْ تُرِيدُ شَيْئًا آخَرَ؟|Заповядай. Искаш ли още нещо?','أَحْمَدُ: نَعَمْ، أَعْطِنِي زَيْتَ طَعَامٍ وَكِيلُو سُكَّرٍ.|Да, дайте ми олио и килограм захар.','أَحْمَدُ: كَمِ الْحِسَابُ؟|Колко е сметката?','الْبَقَّالُ: الْحِسَابُ ثَلَاثُونَ رِيَالًا.|Сметката е тридесет риала.','أَحْمَدُ: تَفَضَّلْ، هٰذِهِ ثَلَاثُونَ رِيَالًا. شُكْرًا.|Заповядайте, ето тридесет риала. Благодаря.'],
  w:['بَقَّالٌ|baqqālun|бакалин','صُنْدُوقٌ (ج) صَنَادِيقُ|ṣundūqun|кутия, кашон (мн. кутии)','عُلْبَةٌ (ج) عُلَبٌ|ʿulbatun|кутия, консерва (мн. кутии)','حَلِيبٌ|ḥalībun|прясно мляко','زَيْتُ طَعَامٍ|zaytu ṭaʿāmin|олио за готвене','كِيلُو|kīlū|килограм','سُكَّرٌ|sukkarun|захар','الْحِسَابُ|al-ḥisābu|сметката','كَمْ؟|kam|колко?','رِيَالٌ|riyālun|риал','شَيْءٌ آخَرُ|shayʾun ākharu|нещо друго','هَاتِ|hāti|дай (насам)','وَاحِدٌ، اثْنَانِ، ثَلَاثَةٌ|wāḥidun, ithnāni, thalāthatun|едно, две, три','عِشْرُونَ، ثَلَاثُونَ، أَرْبَعُونَ|ʿishrūna, thalāthūna, arbaʿūna|двадесет, тридесет, четиридесет','خَمْسُونَ … تِسْعُونَ|khamsūna … tisʿūna|петдесет … деветдесет'],
  g:'След كَمْ „колко“ съществителното е в единствено число с -ан: كَمْ قَلَمًا عِنْدَكَ؟ Отговор: عِنْدِي قَلَمٌ وَاحِدٌ, عِنْدِي قَلَمَانِ (две), عِنْدِي ثَلَاثَةُ أَقْلَامٍ (от 3 до 10 + множествено число). Десетиците عِشْرُونَ, ثَلَاثُونَ … تِسْعُونَ се следват от единствено число с -ан: تِسْعُونَ رِيَالًا.',
