 p:['مَضَتْ أَعْوَامٌ بَعْدَ هِجْرَةِ الرَّسُولِ.|ضَعْ مُرَادِفَ «مَضَتْ»: مَرَّ|مَرَّتْ أَعْوَامٌ بَعْدَ هِجْرَةِ الرَّسُولِ.|Минаха години след преселението на Пратеника.|مَرَّتْ أَعْوَامًا بَعْدَ هِجْرَةِ الرَّسُولِ.|مَرُّوا أَعْوَامٌ بَعْدَ هِجْرَةِ الرَّسُولِ.',
  'رَأَى الرَّسُولُ رُؤْيَا أَدْخَلَتِ السُّرُورَ عَلَى نَفْسِهِ.|ضَعْ مُرَادِفًا: فَرَّحَ|رَأَى الرَّسُولُ رُؤْيَا فَرَّحَتْهُ.|Пратеникът видя видение, което го зарадва.|رَأَى الرَّسُولُ رُؤْيَا فَرَّحَهُ.|رَأَى الرَّسُولُ رُؤْيَا فَرِحَتْهُ.',
  'لَمَّا عَلِمَ الْمُشْرِكُونَ بِقُدُومِهِمْ مَنَعُوهُمْ مِنْ دُخُولِ مَكَّةَ.|ضَعْ مُرَادِفَ «قُدُومِهِمْ»: مَجِيءٌ|لَمَّا عَلِمَ الْمُشْرِكُونَ بِمَجِيئِهِمْ مَنَعُوهُمْ مِنْ دُخُولِ مَكَّةَ.|Когато езичниците научиха за идването им, им попречиха да влязат в Мека.|لَمَّا عَلِمَ الْمُشْرِكُونَ بِمَجِيئُهُمْ مَنَعُوهُمْ مِنْ دُخُولِ مَكَّةَ.|لَمَّا عَلِمَ الْمُشْرِكُونَ بِمَجِيئَهُمْ مَنَعُوهُمْ مِنْ دُخُولِ مَكَّةَ.'],
 tk:['مَاذَا رَأَى الرَّسُولُ فِي نَوْمِهِ؟|Какво видя Пратеникът насън?',
  'مَتَى خَرَجَ الْمُسْلِمُونَ لِأَدَاءِ الْعُمْرَةِ؟ وَإِلَى أَيْنَ وَصَلُوا؟|Кога тръгнаха мюсюлманите за умра и докъде стигнаха?',
  'عَلَى مَاذَا اتَّفَقَ الرَّسُولُ وَالْمُشْرِكُونَ؟|За какво се споразумяха Пратеникът и езичниците?',
  'مَاذَا حَدَثَ فِي السَّنَةِ السَّابِعَةِ؟|Какво се случи през седмата година?']
},
{u:'Част 12',ar:'زِيَارَةٌ',t:'Посещение',wk:12,
 r:['سَمِعَ سَالِمٌ جَرَسَ الْبَابِ يَرِنُّ، فَقَامَ وَفَتَحَ الْبَابَ.|Салим чу звънеца на вратата, стана и отвори.',
  'فَوَجَدَ خَالَهُ قَدْ حَضَرَ مِنَ الْقَرْيَةِ لِزِيَارَتِهِ.|Видя, че вуйчо му е дошъл от селото да го посети.',
  'فَقَالَ سَالِمٌ: مَرْحَبًا بِكَ يَا خَالِي الْعَزِيزَ! مَتَى حَضَرْتَ مِنْ قَرْيَتِنَا؟ وَكَيْفَ حَالُ خَالَتِي عَائِشَةَ وَأَقَارِبِي جَمِيعًا؟|Салим каза: „Добре дошъл, скъпи вуйчо! Кога пристигна от нашето село? Как е леля Аиша и всички роднини?“',
  'قَالَ الْخَالُ: حَضَرْتُ الْيَوْمَ، وَهُمْ جَمِيعًا بِخَيْرٍ وَالْحَمْدُ لِلّٰهِ.|Вуйчото каза: „Пристигнах днес, а всички са добре, слава на Аллах.“',
  'قَالَ سَالِمٌ: دَقِيقَةً وَاحِدَةً، أُحْضِرُ لَكَ زُجَاجَةَ عَصِيرٍ. فَقَالَ الْخَالُ: شُكْرًا، لَا أُرِيدُ عَصِيرًا، بَلْ أُرِيدُ كُوبًا مِنَ الشَّايِ.|Салим каза: „Една минута, ще ти донеса бутилка сок.“ Вуйчото отвърна: „Благодаря, не искам сок, а искам чаша чай.“',
  'قَالَ سَالِمٌ: حَالًا أُحْضِرُ لَكَ الشَّايَ.|Салим каза: „Веднага ще ти донеса чая.“',
  'وَبَعْدَ قَلِيلٍ عَادَ سَالِمٌ يَحْمِلُ صِينِيَّةً جَمِيلَةً، عَلَيْهَا إِبْرِيقُ شَايٍ وَكُوبَانِ وَسُكَّرِيَّةٌ مَمْلُوءَةٌ بِالسُّكَّرِ وَمِلْعَقَتَانِ.|Скоро Салим се върна с красив поднос, на който имаше чайник, две чаши, захарница, пълна със захар, и две лъжички.',
  'فَقَالَ الْخَالُ: لَقَدْ ذَكَّرَنِي مَنْظَرُ السُّكَّرِ بِمَصْنَعِ السُّكَّرِ الَّذِي زُرْتُهُ قَبْلَ يَوْمَيْنِ.|Вуйчото каза: „Гледката на захарта ми напомни за захарната фабрика, която посетих преди два дни.“',
  'رَأَيْتُ الْقَصَبَ يَدْخُلُ الْمَصْنَعَ، وَالسُّكَّرَ الْأَبْيَضَ يَخْرُجُ مِنْهُ فِي أَكْيَاسٍ.|„Видях как във фабриката влиза тръстика, а от нея излиза бяла захар в торби.“',
  'فَسَأَلَهُ سَالِمٌ: كَيْفَ يُصْنَعُ السُّكَّرُ يَا خَالِي؟ فَوَعَدَهُ خَالُهُ أَنْ يَصِفَ لَهُ ذٰلِكَ.|Салим го попита: „Как се прави захарта, вуйчо?“ И вуйчо му обеща да му го опише.'],

 q:['مَاذَا سَمِعَ سَالِمٌ؟|سَمِعَ جَرَسَ الْبَابِ يَرِنُّ|سَمِعَ صَوْتَ السَّيَّارَةِ|سَمِعَ خَالَتَهُ تُنَادِيهِ',

  'مَاذَا كَانَ عَلَى الصِّينِيَّةِ؟|إِبْرِيقُ شَايٍ وَكُوبَانِ وَسُكَّرِيَّةٌ وَمِلْعَقَتَانِ|زُجَاجَةُ عَصِيرٍ وَكُوبٌ|طَعَامٌ وَمَاءٌ',
  'بِمَاذَا ذَكَّرَ مَنْظَرُ السُّكَّرِ الْخَالَ؟|بِمَصْنَعِ السُّكَّرِ الَّذِي زَارَهُ|بِقَرْيَتِهِ الْبَعِيدَةِ|بِبَيْتِ أُخْتِهِ'],
 tf:['خَالُ سَالِمٍ يَسْكُنُ فِي الْمَدِينَةِ.|0|Вуйчото на Салим живее в града.',
  'شَرِبَ الْخَالُ زُجَاجَةً مِنَ الْعَصِيرِ.|0|Вуйчото изпи бутилка сок.',

  'يُصْنَعُ السُّكَّرُ مِنَ الْقَصَبِ.|1|Захарта се прави от тръстика.'],

  'وَضَعَتْ أُمِّي الْأَكْوَابَ عَلَى ___.|الصِّينِيَّةِ|الْقَصَبِ|الْجَرَسِ',

 p:['فِي قَرْيَتِنَا مَصَانِعُ كَثِيرَةٌ.|اُنْفِ بِـ«لَيْسَ»|لَيْسَ فِي قَرْيَتِنَا مَصَانِعُ كَثِيرَةٌ.|В нашето село няма много фабрики.|لَيْسَ فِي قَرْيَتِنَا مَصَانِعَ كَثِيرَةً.|لَا فِي قَرْيَتِنَا مَصَانِعُ كَثِيرَةٌ.',
  'أُرَاجِعُ دُرُوسِي يَوْمَ الْجُمُعَةِ.|اُنْفِ بِـ«لَا»|لَا أُرَاجِعُ دُرُوسِي يَوْمَ الْجُمُعَةِ.|Не преговарям уроците си в петък.|لَيْسَ أُرَاجِعُ دُرُوسِي يَوْمَ الْجُمُعَةِ.|لَا أُرَاجِعَ دُرُوسِي يَوْمَ الْجُمُعَةِ.',
  'رَنَّ الْجَرَسُ ثَلَاثَ مَرَّاتٍ.|اُنْفِ بِـ«مَا»|مَا رَنَّ الْجَرَسُ ثَلَاثَ مَرَّاتٍ.|Звънецът не звънна три пъти.|مَا رَنَّ الْجَرَسَ ثَلَاثَ مَرَّاتٍ.|لَيْسَ رَنَّ الْجَرَسُ ثَلَاثَ مَرَّاتٍ.'],
 tk:['مَنْ زَارَ سَالِمًا؟ وَمِنْ أَيْنَ حَضَرَ؟|Кой посети Салим и откъде дойде?',
  'مَاذَا أَرَادَ سَالِمٌ أَنْ يُحْضِرَ لِخَالِهِ؟ وَمَاذَا طَلَبَ الْخَالُ؟|Какво искаше Салим да донесе на вуйчо си и какво поиска вуйчото?',
  'مَاذَا كَانَ عَلَى الصِّينِيَّةِ؟|Какво имаше на подноса?',
  'مَاذَا رَأَى الْخَالُ فِي مَصْنَعِ السُّكَّرِ؟|Какво видя вуйчото в захарната фабрика?']
},
{u:'Част 12',ar:'صِنَاعَةُ السُّكَّرِ',t:'Производството на захар',wk:12,
 r:['قَالَ الْخَالُ: سَأَصِفُ لَكَ مَا رَأَيْتُ فِي الْمَصْنَعِ، وَلَوْ أَنَّ الْوَصْفَ لَا يُغْنِيكَ عَنِ الزِّيَارَةِ.|Вуйчото каза: „Ще ти опиша какво видях във фабриката, макар че описанието не може да замени посещението.“',
  'رَأَيْتُ السَّيَّارَاتِ تَحْمِلُ عِيدَانَ الْقَصَبِ مِنَ الْمَزَارِعِ بَعْدَ قَطْعِهَا، وَتَضَعُهَا فِي الْمَصْنَعِ.|„Видях камиони да карат отрязаните стъбла на тръстиката от нивите и да ги стоварват във фабриката.“',
  'تَمُرُّ الْعِيدَانُ فِي مَجْرًى طَوِيلٍ يَسِيرُ بِالْكَهْرَبَاءِ، ثُمَّ تَدْخُلُ فِي عَصَّارَاتٍ تَعْصِرُهَا.|„Стъблата минават по дълъг улей, задвижван с електричество, после влизат в преси, които ги изстискват.“',
  'فَيَنْزِلُ الْعَصِيرُ وَيَتَجَمَّعُ فِي خَزَّانَاتٍ كَبِيرَةٍ.|„Сокът се стича и се събира в големи резервоари.“',
  'ثُمَّ يَمُرُّ الْعَصِيرُ فِي مِصْفَاةٍ، فَيَصِيرُ سَائِلًا صَافِيًا.|„После сокът минава през филтър и става бистра течност.“',
  'وَبَعْدَ ذٰلِكَ يُوضَعُ عَلَى الْعَصِيرِ مَحْلُولٌ يُخَلِّصُهُ مِنَ الْأَحْمَاضِ.|„След това към сока се добавя разтвор, който го очиства от киселините.“',
  'ثُمَّ يُغْلَى الْعَصِيرُ حَتَّى تَظْهَرَ فِيهِ بِلَّوْرَاتُ السُّكَّرِ.|„После сокът се вари, докато в него се появят кристали захар.“',
  'وَتُجَفَّفُ الْبِلَّوْرَاتُ، ثُمَّ يُحْفَظُ السُّكَّرُ فِي مُسْتَوْدَعٍ كَبِيرٍ.|„Кристалите се изсушават, а после захарта се съхранява в голям склад.“',
  'وَأَخِيرًا يُعَبَّأُ السُّكَّرُ فِي أَكْيَاسٍ وَيُبَاعُ فِي الْأَسْوَاقِ.|„Накрая захарта се пакетира в торби и се продава по пазарите.“',
  'فَقَالَ سَالِمٌ: سُبْحَانَ اللّٰهِ! أَخْرَجَ لَنَا مِنَ الْأَرْضِ كُلَّ هٰذِهِ النِّعَمِ.|Салим каза: „Слава на Аллах! Изкарал е за нас от земята всички тези блага.“'],
 w:['عُودٌ / عِيدَانٌ|ʿūdun / ʿīdānun|стъбло, пръчка',
  'عَصَّارَةٌ / عَصَّارَاتٌ|ʿaṣṣāratun / ʿaṣṣārātun|преса (за изстискване)',

 q:['مِنْ أَيْنَ تَحْمِلُ السَّيَّارَاتُ عِيدَانَ الْقَصَبِ؟|مِنَ الْمَزَارِعِ|مِنَ الْمُسْتَوْدَعِ|مِنَ الْأَسْوَاقِ',
  'مَاذَا تَفْعَلُ الْعَصَّارَاتُ؟|تَعْصِرُ الْعِيدَانَ|تُجَفِّفُ السُّكَّرَ|تَقْطَعُ الْقَصَبَ فِي الْمَزْرَعَةِ',

{u:'Част 13',ar:'الْإِمَامُ مُسْلِمٌ',t:'Имам Муслим',wk:13,
 r:['هُوَ الْإِمَامُ أَبُو الْحُسَيْنِ مُسْلِمُ بْنُ الْحَجَّاجِ النَّيْسَابُورِيُّ، مِنْ كِبَارِ أَئِمَّةِ الْحَدِيثِ.|Това е имам Абу-л-Хусайн Муслим ибн ал-Хаджадж ан-Найсабури, един от великите имами на хадиса.',
  'وُلِدَ سَنَةَ سِتٍّ وَمِئَتَيْنِ لِلْهِجْرَةِ فِي مَدِينَةِ نَيْسَابُورَ، وَكَانَتْ مِنْ أَعْظَمِ الْمُدُنِ الْإِسْلَامِيَّةِ.|Роден е през 206 г. по хиджра в град Нишапур, който беше сред най-великите ислямски градове.',
  'بَدَأَ يَطْلُبُ الْحَدِيثَ وَهُوَ صَغِيرٌ، ثُمَّ قَصَدَ الْحِجَازَ وَالْعِرَاقَ وَالشَّامَ وَمِصْرَ يَرْوِي الْحَدِيثَ عَنْ عُلَمَائِهَا.|Започнал да изучава хадис още като малък, после отишъл в Хиджаз, Ирак, Шам и Египет, за да предава хадиси от учените там.',
  'وَكَانَ مِنْ أَسَاتِذَتِهِ الْإِمَامُ أَحْمَدُ بْنُ حَنْبَلٍ وَالْإِمَامُ الْبُخَارِيُّ.|Сред неговите учители били имам Ахмад ибн Ханбал и имам ал-Бухари.',
  'وَلَمَّا وَرَدَ الْبُخَارِيُّ إِلَى نَيْسَابُورَ لَازَمَهُ مُسْلِمٌ، وَكَانَ يُجِلُّهُ إِجْلَالًا كَبِيرًا.|Когато ал-Бухари пристигнал в Нишапур, Муслим постоянно бил с него и дълбоко го почитал.',
  'وَاشْتَغَلَ بِالْحَدِيثِ طُولَ حَيَاتِهِ حَتَّى اشْتَهَرَ، وَصَارَ النَّاسُ يَقْصِدُونَهُ لِيَسْمَعُوا مِنْهُ.|Цял живот се занимавал с хадис, докато се прославил, и хората започнали да идват при него, за да слушат от него.',
  'وَأَلَّفَ كِتَابَ «صَحِيحِ مُسْلِمٍ»، وَاخْتَارَ أَحَادِيثَهُ مِنْ ثَلَاثِمِئَةِ أَلْفِ حَدِيثٍ، وَكَتَبَهُ فِي خَمْسَ عَشْرَةَ سَنَةً.|Съставил „Сахих Муслим“, като избрал хадисите в него измежду триста хиляди хадиса, и го писал петнайсет години.',
  'وَهُوَ أَصَحُّ كُتُبِ الْحَدِيثِ بَعْدَ صَحِيحِ الْبُخَارِيِّ، وَهُوَ مِنَ الصِّحَاحِ.|Това е най-достоверният сборник с хадиси след „Сахих“ на ал-Бухари и е един от „Сахих“-сборниците.',
  'وَقَدْ شَرَحَهُ الْعُلَمَاءُ مَرَّاتٍ كَثِيرَةً، وَطُبِعَ مَرَّاتٍ عَدِيدَةً.|Учените са го тълкували много пъти и е отпечатван многократно.',
  'وَتُوُفِّيَ هٰذَا الْمُحَدِّثُ الْعَظِيمُ سَنَةَ إِحْدَى وَسِتِّينَ وَمِئَتَيْنِ لِلْهِجْرَةِ.|Този велик учен по хадис починал през 261 г. по хиджра.'],

  'لَمَّا وَرَدَ الْبُخَارِيُّ إِلَى نَيْسَابُورَ لَازَمَهُ مُسْلِمٌ.|ضَعْ مُرَادِفَ «وَرَدَ»: وَصَلَ|لَمَّا وَصَلَ الْبُخَارِيُّ إِلَى نَيْسَابُورَ لَازَمَهُ مُسْلِمٌ.|Когато ал-Бухари пристигна в Нишапур, Муслим постоянно беше с него.|لَمَّا وَصَلَتِ الْبُخَارِيُّ إِلَى نَيْسَابُورَ لَازَمَهُ مُسْلِمٌ.|لَمَّا وَصَلَ الْبُخَارِيَّ إِلَى نَيْسَابُورَ لَازَمَهُ مُسْلِمٌ.',

  'إِلَى أَيِّ الْبِلَادِ سَافَرَ؟ وَلِمَاذَا؟|До кои страни е пътувал и защо?',

},
{u:'Част 13',ar:'حِيلَةُ مُفْلِسٍ',t:'Хитрината на един фалирал',wk:13,
 r:['كَثُرَ الدَّيْنُ عَلَى رَجُلٍ مُفْلِسٍ، فَاخْتَفَى مِنْ أَصْحَابِ الدَّيْنِ.|Един фалирал човек натрупал много дългове и се скрил от кредиторите си.',
  'فَوَجَدَهُ رَجُلٌ ذَكِيٌّ وَقَالَ لَهُ: مَاذَا تُعْطِينِي إِنْ عَلَّمْتُكَ حِيلَةً تُخَلِّصُكَ مِنْ أَصْحَابِ الدَّيْنِ؟|Един хитър човек го намерил и му казал: „Какво ще ми дадеш, ако те науча на хитрина, която ще те отърве от кредиторите?“',
  'قَالَ الْمُفْلِسُ: أُعْطِيكَ حَقَّكَ وَأَزِيدُكَ.|Фалиралият казал: „Ще ти дам полагащото ти се и даже повече.“',
  'فَقَالَ لَهُ: اجْلِسْ غَدًا أَمَامَ دُكَّانِكَ، وَإِذَا كَلَّمَكَ أَحَدٌ فَانْبَحْ فِي وَجْهِهِ كَمَا يَنْبَحُ الْكَلْبُ، وَلَا تَزِدْ عَلَى النُّبَاحِ.|Онзи му казал: „Седни утре пред дюкяна си и ако някой ти заговори, лай в лицето му, както лае куче, и не прави нищо друго освен да лаеш.“',
  'وَفِي الْيَوْمِ التَّالِي جَلَسَ الْمُفْلِسُ أَمَامَ دُكَّانِهِ، وَصَارَ يَنْبَحُ فِي وَجْهِ كُلِّ مَنْ يُكَلِّمُهُ.|На другия ден фалиралият седнал пред дюкяна си и започнал да лае в лицето на всеки, който му заговорел.',
  'فَذَهَبَ بِهِ أَصْحَابُ الدَّيْنِ إِلَى الْحَاكِمِ، فَلَمَّا سَأَلَهُ الْحَاكِمُ نَبَحَ فِي وَجْهِهِ أَيْضًا.|Кредиторите го завели при управителя, и когато управителят го попитал, той залаял и в неговото лице.',
  'فَقَالَ الْحَاكِمُ: هٰذَا رَجُلٌ مَجْنُونٌ، وَأَمَرَ أَصْحَابَ الدَّيْنِ أَنْ يُسَامِحُوهُ، فَانْصَرَفُوا.|Управителят казал: „Този човек е луд“ и наредил на кредиторите да му простят дълга; и те си тръгнали.',
  'وَبَعْدَ ذٰلِكَ جَاءَهُ الرَّجُلُ الَّذِي عَلَّمَهُ الْحِيلَةَ يَطْلُبُ أَجْرَهُ، فَنَبَحَ فِي وَجْهِهِ هُوَ أَيْضًا!|След това при него дошъл човекът, който го бил научил на хитрината, за да си поиска възнаграждението – но той залаял и на него!',
  'فَانْصَرَفَ الرَّجُلُ نَادِمًا، وَقَالَ: أَنَا عَلَّمْتُهُ الْحِيلَةَ فَاسْتَعْمَلَهَا ضِدِّي!|Човекът си тръгнал, съжалявайки, и казал: „Аз го научих на хитрината, а той я използва срещу мен!“',
  'وَمَنْ عَلَّمَ النَّاسَ الْحِيَلَ فَقَدْ يَقَعُ هُوَ فِيهَا.|Който учи хората на хитрини, може самият той да стане тяхна жертва.'],

 p:['بَعْدَ ذٰلِكَ ذَهَبَ إِلَيْهِ صَاحِبُ الدَّيْنِ فَنَبَحَ فِي وَجْهِهِ.|صَاحِبَا الدَّيْنِ|بَعْدَ ذٰلِكَ ذَهَبَ إِلَيْهِ صَاحِبَا الدَّيْنِ فَنَبَحَ فِي وُجُوهِهِمَا.|След това при него отидоха двамата кредитори и той залая в лицата им.|بَعْدَ ذٰلِكَ ذَهَبَ إِلَيْهِ صَاحِبَا الدَّيْنِ فَنَبَحَ فِي وَجْهِهِ.|بَعْدَ ذٰلِكَ ذَهَبَا إِلَيْهِ صَاحِبَيِ الدَّيْنِ فَنَبَحَ فِي وُجُوهِهِمَا.',
  'بَعْدَ ذٰلِكَ ذَهَبَ إِلَيْهِ صَاحِبُ الدَّيْنِ فَنَبَحَ فِي وَجْهِهِ.|صَاحِبَتَا الدَّيْنِ|بَعْدَ ذٰلِكَ ذَهَبَتْ إِلَيْهِ صَاحِبَتَا الدَّيْنِ فَنَبَحَ فِي وُجُوهِهِمَا.|След това при него отидоха двете кредиторки и той залая в лицата им.|بَعْدَ ذٰلِكَ ذَهَبَتَا إِلَيْهِ صَاحِبَتَا الدَّيْنِ فَنَبَحَ فِي وُجُوهِهِمَا.|بَعْدَ ذٰلِكَ ذَهَبَتْ إِلَيْهِ صَاحِبَتَا الدَّيْنِ فَنَبَحَ فِي وُجُوهِهِنَّ.',
  'بَعْدَ ذٰلِكَ ذَهَبَ إِلَيْهِ صَاحِبُ الدَّيْنِ فَنَبَحَ فِي وَجْهِهِ.|أَصْحَابُ الدَّيْنِ|بَعْدَ ذٰلِكَ ذَهَبَ إِلَيْهِ أَصْحَابُ الدَّيْنِ فَنَبَحَ فِي وُجُوهِهِمْ.|След това при него отидоха кредиторите и той залая в лицата им.|بَعْدَ ذٰلِكَ ذَهَبُوا إِلَيْهِ أَصْحَابُ الدَّيْنِ فَنَبَحَ فِي وُجُوهِهِمْ.|بَعْدَ ذٰلِكَ ذَهَبَ إِلَيْهِ أَصْحَابُ الدَّيْنِ فَنَبَحَ فِي وُجُوهِهِمَا.'],
 tk:['لِمَاذَا اخْتَفَى الْمُفْلِسُ؟|Защо се скри фалиралият?',
  'مَا الْحِيلَةُ الَّتِي تَعَلَّمَهَا؟ وَمَنْ عَلَّمَهُ إِيَّاهَا؟|Каква хитрина научи и кой го научи?',
  'مَاذَا قَالَ الْحَاكِمُ؟ وَمَاذَا فَعَلَ أَصْحَابُ الدَّيْنِ؟|Какво каза управителят и какво направиха кредиторите?',
  'مَاذَا حَدَثَ لِصَاحِبِ الْحِيلَةِ؟ وَمَاذَا نَتَعَلَّمُ مِنَ الْقِصَّةِ؟|Какво се случи с автора на хитрината и какво научаваме от историята?']
},
{u:'Част 14',ar:'ابْنُ جَرِيرٍ الطَّبَرِيُّ',t:'Ибн Джарир ат-Табари',wk:14,
 r:['هُوَ أَبُو جَعْفَرٍ مُحَمَّدُ بْنُ جَرِيرٍ الطَّبَرِيُّ، وُلِدَ فِي مَدِينَةِ آمُلَ فِي إِقْلِيمِ طَبَرِسْتَانَ سَنَةَ أَرْبَعٍ وَعِشْرِينَ وَمِئَتَيْنِ لِلْهِجْرَةِ.|Това е Абу Джа‘фар Мухаммад ибн Джарир ат-Табари; роден е в град Амул в област Табаристан през 224 г. по хиджра.',
  'أَحَبَّ الْعِلْمَ مُنْذُ صِغَرِهِ، فَحَفِظَ الْقُرْآنَ وَهُوَ ابْنُ سَبْعِ سِنِينَ، وَكَتَبَ الْحَدِيثَ وَهُوَ ابْنُ تِسْعِ سِنِينَ.|Обичал знанието от малък: научил Корана наизуст на седем години, а на девет записвал хадиси.',
  'وَرَأَى أَبُوهُ فِي النَّوْمِ أَنَّ ابْنَهُ بَيْنَ يَدَيْ رَسُولِ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ، فَقِيلَ لَهُ: إِنَّ ابْنَكَ سَيُدَافِعُ عَنْ شَرِيعَةِ الْإِسْلَامِ.|Баща му сънувал, че синът му стои пред Пратеника на Аллах, и му било казано: „Синът ти ще защитава шериата на исляма.“',
  'فَشَجَّعَهُ أَبُوهُ عَلَى الرِّحْلَةِ فِي طَلَبِ الْعِلْمِ، فَرَحَلَ إِلَى الرَّيِّ، ثُمَّ إِلَى الْكُوفَةِ وَبَغْدَادَ وَمِصْرَ.|Затова баща му го насърчил да пътува, търсейки знание, и той заминал за Рей, а после за Куфа, Багдад и Египет.',
  'وَفِي الْكُوفَةِ كَانَ النَّاسُ يَضِجُّونَ أَمَامَ بَيْتِ أَحَدِ الْعُلَمَاءِ، فَسَأَلَهُمْ: مَنْ مِنْكُمْ يَحْفَظُ مَا كَتَبَ عَنِّي؟ فَقَالَ الطَّبَرِيُّ: أَنَا.|В Куфа хората вдигали шум пред къщата на един учен и той ги попитал: „Кой от вас помни наизуст това, което е записал от мен?“ Ат-Табари отвърнал: „Аз.“',
  'فَسَأَلَهُ الْعَالِمُ فَأَجَابَ عَنْ كُلِّ شَيْءٍ، فَعَرَفَ قَدْرَهُ عَلَى الرَّغْمِ مِنْ صِغَرِ سِنِّهِ.|Ученият го изпитал и той отговорил на всичко; тогава ученият разбрал колко струва, въпреки младата му възраст.',
  'وَعَلَى الرَّغْمِ مِنْ تَعَبِ السَّفَرِ ظَلَّ مُجْتَهِدًا حَتَّى صَارَ فَقِيهًا كَبِيرًا، وَعَرَفَ عُلُومَ عَصْرِهِ كُلَّهَا.|Въпреки умората от пътуванията останал усърден, докато станал голям правовед, и познавал всички науки на своята епоха.',
  'فَكَانَ كَالْقَارِئِ الَّذِي لَا يَعْرِفُ إِلَّا الْقُرْآنَ، وَكَالْفَقِيهِ الَّذِي لَا يَعْرِفُ إِلَّا الْفِقْهَ، وَكَالْحَاسِبِ الَّذِي لَا يَعْرِفُ إِلَّا الْحِسَابَ.|Бил като четец, който знае само Корана, като правовед, който знае само фикх, и като смятач, който знае само аритметика.',
  'وَجَاءَهُ رَجُلٌ يَسْأَلُهُ عَنِ الْعَرُوضِ، وَلَمْ يَكُنْ قَدْ تَعَلَّمَهُ، فَقَالَ لَهُ: تَعَالَ غَدًا. ثُمَّ قَرَأَ كِتَابًا فِي الْعَرُوضِ فَأَجَادَهُ فِي لَيْلَةٍ وَاحِدَةٍ.|Веднъж дошъл човек да го пита за аруда (науката за стихоразмера), който той не бил учил; казал му: „Ела утре.“ После прочел книга по аруд и го овладял за една нощ.',
  'وَكَانَ أَعْظَمَ عُلَمَاءِ عَصْرِهِ، وَمِنْ أَشْهَرِ كُتُبِهِ تَفْسِيرُ الْقُرْآنِ وَكِتَابُ التَّارِيخِ.|Той бил най-великият учен на своето време, а сред най-известните му книги са тълкуванието на Корана и книгата му по история.'],

 q:['أَيْنَ وُلِدَ الطَّبَرِيُّ؟|فِي آمُلَ فِي إِقْلِيمِ طَبَرِسْتَانَ|فِي بَغْدَادَ|فِي الْكُوفَةِ',
  'كَمْ كَانَ عُمْرُهُ عِنْدَمَا حَفِظَ الْقُرْآنَ؟|سَبْعَ سِنِينَ|تِسْعَ سِنِينَ|عِشْرِينَ سَنَةً',
  'مَاذَا رَأَى أَبُوهُ فِي النَّوْمِ؟|رَأَى ابْنَهُ بَيْنَ يَدَيْ رَسُولِ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ|رَأَى ابْنَهُ يُسَافِرُ إِلَى مِصْرَ|رَأَى ابْنَهُ يَبِيعُ الْكُتُبَ',
  'إِلَى أَيْنَ رَحَلَ فِي طَلَبِ الْعِلْمِ؟|إِلَى الرَّيِّ وَالْكُوفَةِ وَبَغْدَادَ وَمِصْرَ|إِلَى الْأَنْدَلُسِ وَالْمَغْرِبِ|إِلَى الْيَمَنِ فَقَطْ',
  'كَيْفَ تَعَلَّمَ عِلْمَ الْعَرُوضِ؟|قَرَأَ كِتَابًا فِيهِ فِي لَيْلَةٍ وَاحِدَةٍ|دَرَسَهُ سَنَةً كَامِلَةً|تَعَلَّمَهُ مِنْ أَبِيهِ'],
 tf:['كَتَبَ الطَّبَرِيُّ الْحَدِيثَ وَهُوَ ابْنُ تِسْعِ سِنِينَ.|1|Ат-Табари записвал хадиси, когато бил на девет години.',
  'شَجَّعَهُ أَبُوهُ عَلَى تَرْكِ الْعِلْمِ.|0|Баща му го насърчил да изостави знанието.',
  'عَرَفَ الطَّبَرِيُّ عُلُومَ عَصْرِهِ كُلَّهَا.|1|Ат-Табари познавал всички науки на своята епоха.',
  'لَمْ يَعْرِفِ الْعَالِمُ قَدْرَ الطَّبَرِيِّ لِأَنَّهُ كَانَ صَغِيرًا.|0|Ученият не разбрал стойността на ат-Табари, защото бил малък.'],
 f:['كَانَ النَّاسُ ___ أَمَامَ بَيْتِ الْعَالِمِ.|يَضِجُّونَ|يَرْحَلُونَ|يُجِيدُونَ',
  'الطَّبَرِيُّ ___ كَبِيرٌ يَعْرِفُ أَحْكَامَ الشَّرِيعَةِ.|فَقِيهٌ|حَاسِبٌ|عَرُوضٌ',
  'عَرَفَ الْعَالِمُ ___ الطَّبَرِيِّ عَلَى الرَّغْمِ مِنْ صِغَرِ سِنِّهِ.|قَدْرَ|عَصْرَ|حِسَابَ',
  '___ الطَّبَرِيُّ إِلَى بَغْدَادَ فِي طَلَبِ الْعِلْمِ.|رَحَلَ|ضَجَّ|شَجَّعَ'],
 o:['صِغَرٌ|كِبَرٌ','قَصِيرَةٌ|طَوِيلَةٌ'],
 sp:['فَقِيهٌ|فُقَهَاءُ','عِلْمٌ|عُلُومٌ'],
 p:['كَانَ عَلِيٌّ مُحِبًّا لِلْعِلْمِ.|اُنْفِ بِـ«مَا»|مَا كَانَ عَلِيٌّ مُحِبًّا لِلْعِلْمِ.|Али не обичаше знанието.|مَا كَانَ عَلِيٌّ مُحِبٌّ لِلْعِلْمِ.|لَنْ كَانَ عَلِيٌّ مُحِبًّا لِلْعِلْمِ.',
  'سَأُسَافِرُ غَدًا إِلَى بَغْدَادَ.|اُنْفِ بِـ«لَنْ»|لَنْ أُسَافِرَ غَدًا إِلَى بَغْدَادَ.|Няма да пътувам утре до Багдад.|لَنْ سَأُسَافِرُ غَدًا إِلَى بَغْدَادَ.|لَنْ أُسَافِرُ غَدًا إِلَى بَغْدَادَ.',
  'حَفِظْتُ الْقُرْآنَ وَلِي سَبْعُ سِنِينَ.|أَسْنِدْ إِلَى «نَحْنُ»|حَفِظْنَا الْقُرْآنَ وَلَنَا سَبْعُ سِنِينَ.|Научихме Корана наизуст, когато бяхме на седем години.|حَفِظْنَا الْقُرْآنَ وَلِي سَبْعُ سِنِينَ.|حَفِظُوا الْقُرْآنَ وَلَنَا سَبْعُ سِنِينَ.'],
 tk:['أَيْنَ وَمَتَى وُلِدَ الطَّبَرِيُّ؟|Къде и кога е роден ат-Табари?',
  'كَيْفَ كَانَتْ طُفُولَتُهُ مَعَ الْعِلْمِ؟|Какво било детството му по отношение на знанието?',
  'إِلَى أَيْنَ رَحَلَ؟ وَمَاذَا حَدَثَ لَهُ فِي الْكُوفَةِ؟|Къде пътувал и какво му се случило в Куфа?',
  'مَا الْعُلُومُ الَّتِي عَرَفَهَا؟ وَمَا أَشْهَرُ كُتُبِهِ؟|Кои науки познавал и кои са най-известните му книги?']
},
{u:'Част 14',ar:'الطُّفَيْلِيُّ وَالْمَائِدَةُ',t:'Натрапникът и трапезата',wk:14,
 r:['فِي كُتُبِ الْأَدَبِ نَوَادِرُ كَثِيرَةٌ عَنِ الطُّفَيْلِيِّينَ، وَهُمُ الَّذِينَ يَحْضُرُونَ الْمَوَائِدَ مِنْ غَيْرِ أَنْ يُدْعَوْا إِلَيْهَا.|В литературните книги има много забавни истории за натрапниците – онези, които идват на трапези, без да са поканени.',
  'قَالَ أَحَدُ الطُّفَيْلِيِّينَ: ذَهَبْتُ إِلَى دَارِ رَجُلٍ عِنْدَهُ وَلِيمَةٌ، فَدَخَلْتُ بِغَيْرِ إِذْنٍ.|Един натрапник разказал: „Отидох в къщата на човек, който даваше угощение, и влязох без позволение.“',
  'وَكَانَ صَاحِبُ الدَّارِ قَدْ وَضَعَ سُلَّمًا، وَكُلَّمَا رَأَى طُفَيْلِيًّا قَالَ لَهُ: اصْعَدْ إِلَى السَّطْحِ.|„Стопанинът беше сложил стълба и всеки път, когато видеше натрапник, му казваше: ‚Качи се на покрива.‘“',
  'فَصَعِدْتُ أَنَا أَيْضًا، فَوَجَدْتُ عَلَى السَّطْحِ اثْنَيْ عَشَرَ طُفَيْلِيًّا، ثُمَّ رَفَعَ صَاحِبُ الدَّارِ السُّلَّمَ.|„Качих се и аз и намерих на покрива дванайсет натрапници; после стопанинът махна стълбата.“',
  'فَقَالَ لِي الطُّفَيْلِيُّونَ: مَا رَأَيْنَا مِثْلَ هٰذَا الرَّجُلِ الْمَاكِرِ قَطُّ!|„Натрапниците ми казаха: ‚Никога не сме виждали толкова хитър човек!‘“',
  'فَقُلْتُ لَهُمْ: إِذَا احْتَلْتُ لَكُمْ حَتَّى تَنْزِلُوا وَتَأْكُلُوا، فَهَلْ تَقُولُونَ إِنِّي أَعْلَمُكُمْ بِالتَّطَفُّلِ؟ قَالُوا: نَعَمْ.|„Казах им: ‚Ако измисля хитрина, за да слезете и да ядете, ще признаете ли, че разбирам от натрапничество повече от вас?‘ Те казаха: ‚Да.‘“',
  'فَنَادَيْتُ صَاحِبَ الدَّارِ وَقُلْتُ: إِمَّا أَنْ تُحْضِرَ لَنَا مَائِدَةً، وَإِمَّا أَنْ أَرْمِيَ نَفْسِي مِنْ فَوْقِ هٰذَا السَّطْحِ!|„Повиках стопанина и казах: ‚Или ще ни донесеш трапеза, или ще се хвърля от този покрив!‘“',
  'وَأَرَيْتُهُ كَأَنِّي أَرْمِي نَفْسِي، فَصَاحَ: لَا تَفْعَلْ! هٰذَا رَجُلٌ مَجْنُونٌ!|„И направих така, сякаш се хвърлям, а той извика: ‚Недей! Този човек е луд!‘“',
  'ثُمَّ أَعَادَ السُّلَّمَ وَأَحْضَرَ لَنَا مَائِدَةً، فَنَزَلْنَا وَأَكَلْنَا.|„После върна стълбата и ни донесе трапеза; слязохме и ядохме.“'],
 w:['نَادِرَةٌ / نَوَادِرُ|nādiratun / nawādiru|забавна история, анекдот',
  'طُفَيْلِيٌّ|ṭufayliyyun|натрапник (на гощавки)',
  'تَطَفَّلَ / يَتَطَفَّلُ|taṭaffala / yataṭaffalu|натрапи се (без покана)',
  'تَطَفُّلٌ|taṭaffulun|натрапничество',
  'مَائِدَةٌ / مَوَائِدُ|māʾidatun / mawāʾidu|трапеза',
  'وَلِيمَةٌ|walīmatun|угощение',
  'احْتَالَ / يَحْتَالُ|iḥtāla / yaḥtālu|прибегна до хитрина',
  'قَطُّ|qaṭṭu|никога (за минало)',
  'سَطْحٌ|saṭḥun|(плосък) покрив',
  'سُلَّمٌ|sullamun|стълба',
  'مَاكِرٌ|mākirun|хитър, лукав',
  'أَرَى / يُرِي|arā / yurī|показа',
  'مَجْنُونٌ|maǧnūnun|луд',
  'رَمَى / يَرْمِي|ramā / yarmī|хвърли',
  'صَاحَ / يَصِيحُ|ṣāḥa / yaṣīḥu|извика'],
 q:['مَنِ الطُّفَيْلِيُّ؟|الَّذِي يَحْضُرُ الْمَوَائِدَ مِنْ غَيْرِ أَنْ يُدْعَى|الَّذِي يَصْنَعُ الطَّعَامَ لِلنَّاسِ|الَّذِي يَبِيعُ الْمَوَائِدَ',
  'إِلَى أَيْنَ أَرْسَلَ صَاحِبُ الدَّارِ الطُّفَيْلِيِّينَ؟|إِلَى السَّطْحِ|إِلَى الْمَطْبَخِ|إِلَى السُّوقِ',
  'كَمْ طُفَيْلِيًّا وَجَدَ عَلَى السَّطْحِ؟|اثْنَيْ عَشَرَ|ثَلَاثَةً|عِشْرِينَ',
  'مَاذَا فَعَلَ الطُّفَيْلِيُّ حَتَّى يُحْضِرَ صَاحِبُ الدَّارِ الطَّعَامَ؟|أَرَاهُ كَأَنَّهُ يَرْمِي نَفْسَهُ مِنَ السَّطْحِ|نَزَلَ عَلَى السُّلَّمِ|بَكَى بِصَوْتٍ عَالٍ',
  'مَاذَا قَالَ صَاحِبُ الدَّارِ عَنْهُ؟|هٰذَا رَجُلٌ مَجْنُونٌ|هٰذَا رَجُلٌ عَالِمٌ|هٰذَا ضَيْفٌ كَرِيمٌ'],
 tf:['دَخَلَ الطُّفَيْلِيُّ الدَّارَ بَعْدَ أَنْ أَذِنَ لَهُ صَاحِبُهَا.|0|Натрапникът влезе в къщата, след като стопанинът му позволи.',
  'وَجَدَ الطُّفَيْلِيُّ عَلَى السَّطْحِ اثْنَيْ عَشَرَ طُفَيْلِيًّا.|1|Натрапникът намери на покрива дванайсет натрапници.',
  'كَانَ الطُّفَيْلِيُّ يُرِيدُ أَنْ يَرْمِيَ نَفْسَهُ حَقًّا.|0|Натрапникът наистина искаше да се хвърли.',
  'أَكَلَ الطُّفَيْلِيُّونَ فِي النِّهَايَةِ.|1|Накрая натрапниците ядоха.'],
 f:['صَعِدْتُ عَلَى ___ لِأَصِلَ إِلَى السَّطْحِ.|السُّلَّمِ|الْمَائِدَةِ|النَّادِرَةِ',
  'الثَّعْلَبُ حَيَوَانٌ ___.|مَاكِرٌ|مَاكِرًا|مَائِدَةٌ',
  'مَا رَأَيْنَا مِثْلَ هٰذَا الرَّجُلِ ___.|قَطُّ|غَدًا|سَطْحٌ',
  'فَكَّرَ الطُّفَيْلِيُّ فِي ___ لِيَنْزِلَ وَيَأْكُلَ.|حِيلَةٍ|مَجْنُونٍ|نَوَادِرَ'],
 o:['صَعِدَ|نَزَلَ','مَجْنُونٌ|عَاقِلٌ'],
 sp:['مَائِدَةٌ|مَوَائِدُ','نَادِرَةٌ|نَوَادِرُ'],
 p:['اصْعَدْ هٰذَا السُّلَّمَ.|أَسْنِدْ إِلَى «أَنْتِ»|اصْعَدِي هٰذَا السُّلَّمَ.|Качи се (ти, жена) по тази стълба.|اصْعَدِينَ هٰذَا السُّلَّمَ.|اصْعَدْنَ هٰذَا السُّلَّمَ.',
  'اصْعَدْ هٰذَا السُّلَّمَ.|أَسْنِدْ إِلَى «أَنْتُمْ»|اصْعَدُوا هٰذَا السُّلَّمَ.|Качете се (вие, мъже) по тази стълба.|اصْعَدُونَ هٰذَا السُّلَّمَ.|اصْعَدَا هٰذَا السُّلَّمَ.',
  'اصْعَدْ هٰذَا السُّلَّمَ.|أَسْنِدْ إِلَى «أَنْتُنَّ»|اصْعَدْنَ هٰذَا السُّلَّمَ.|Качете се (вие, жени) по тази стълба.|اصْعَدِي هٰذَا السُّلَّمَ.|اصْعَدُوا هٰذَا السُّلَّمَ.'],

  'لِمَاذَا صَعِدَ الطُّفَيْلِيُّونَ إِلَى السَّطْحِ؟|Защо натрапниците се качиха на покрива?',
  'مَا الْحِيلَةُ الَّتِي احْتَالَهَا الطُّفَيْلِيُّ؟|Каква хитрина използва натрапникът?',
  'هَلِ التَّطَفُّلُ عَادَةٌ حَسَنَةٌ؟ وَلِمَاذَا؟|Добър навик ли е натрапничеството и защо?']

{u:'Част 15',ar:'الْحَجَّاجُ وَالرَّجُلُ الصَّادِقُ',t:'Ал-Хаджадж и честният човек',wk:15,
 r:['خَطَبَ الْحَجَّاجُ بْنُ يُوسُفَ فِي يَوْمٍ شَدِيدِ الْحَرِّ خُطْبَةً طَوِيلَةً.|Ал-Хаджадж ибн Юсуф изнесъл дълга проповед в един много горещ ден.',
  'فَقَامَ رَجُلٌ وَقَالَ لَهُ: أَيُّهَا الْأَمِيرُ، إِنَّ الْوَقْتَ لَا يَنْتَظِرُكَ، وَقَدْ أَطَلْتَ الْخُطْبَةَ.|Един мъж станал и му казал: „Емире, времето (за молитвата) не те чака, а ти удължи проповедта.“',
  'فَغَضِبَ الْحَجَّاجُ وَأَمَرَ بِهِ فَسُجِنَ.|Ал-Хаджадж се разгневил и заповядал да го хвърлят в затвора.',
  'فَجَاءَ أَهْلُ الرَّجُلِ إِلَى الْحَجَّاجِ وَقَالُوا: إِنَّ أَخَانَا مَجْنُونٌ، فَأَخْرِجْهُ مِنَ السِّجْنِ.|Близките на мъжа дошли при ал-Хаджадж и казали: „Нашият брат е луд, пусни го от затвора.“',
  'فَقَالَ الْحَجَّاجُ: إِنِ اعْتَرَفَ بِأَنَّهُ مَجْنُونٌ أَخْرَجْتُهُ.|Ал-Хаджадж казал: „Ако признае, че е луд, ще го пусна.“',
  'فَذَهَبُوا إِلَيْهِ وَقَالُوا لَهُ: اعْتَرِفْ بِالْجُنُونِ حَتَّى تَخْرُجَ.|Те отишли при него и му казали: „Признай, че си луд, за да излезеш.“',
  'فَقَالَ الرَّجُلُ: لَا أَقُولُ إِنَّ اللّٰهَ ابْتَلَانِي بِالْجُنُونِ، وَقَدْ عَافَانِي!|Мъжът отвърнал: „Няма да кажа, че Аллах ме е изпитал с лудост, когато Той ме е дарил със здраве!“',

{u:'Част 15',ar:'الصِّحَّةُ وَالطَّعَامُ',t:'Здравето и храната',wk:15,
 r:['عَلَى الْإِنْسَانِ أَنْ يَتَّبِعَ الْعَادَاتِ الصِّحِّيَّةَ السَّلِيمَةَ فِي طَعَامِهِ وَشَرَابِهِ وَنَوْمِهِ.|Човек трябва да следва здравословни навици в храненето, пиенето и съня си.',
  'فَالطَّعَامُ الْجَيِّدُ مِنْ غَيْرِ إِكْثَارٍ يُغَذِّي الْجِسْمَ وَيُجَدِّدُ نَشَاطَهُ.|Добрата храна без преяждане подхранва тялото и обновява енергията му.',
  'أَمَّا الْإِكْثَارُ مِنَ الطَّعَامِ فَيُسَبِّبُ الْخُمُولَ وَعُسْرَ الْهَضْمِ، وَيُسَبِّبُ تَعَرُّضَ الْجِسْمِ لِلْأَمْرَاضِ.|А преяждането причинява отпадналост и лошо храносмилане и излага тялото на болести.',
  'قَالَ رَسُولُ اللّٰهِ صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّمَ: «مَا مَلَأَ آدَمِيٌّ وِعَاءً شَرًّا مِنْ بَطْنٍ، بِحَسْبِ ابْنِ آدَمَ لُقَيْمَاتٌ يُقِمْنَ صُلْبَهُ، فَإِنْ كَانَ لَا مَحَالَةَ فَثُلُثٌ لِطَعَامِهِ وَثُلُثٌ لِشَرَابِهِ وَثُلُثٌ لِنَفَسِهِ» (رَوَاهُ التِّرْمِذِيُّ).|Пратеникът на Аллах (Аллах да го благослови и с мир да го дари) е казал (смисълът): „Човек не е напълнил по-лош съд от стомаха си. Достатъчни са на сина на Адам няколко хапки, които да държат гърба му изправен. А ако непременно трябва повече, то една трета за храната му, една трета за питието му и една трета за дъха му“ (ат-Тирмизи).',
  'وَيَكُونُ الطَّعَامُ جَيِّدًا إِذَا جَمَعَ الْعَنَاصِرَ الْغِذَائِيَّةَ الَّتِي يَحْتَاجُ إِلَيْهَا الْجِسْمُ.|Храната е добра, когато съдържа хранителните елементи, от които тялото се нуждае.',
  'وَمِنْ هٰذِهِ الْعَنَاصِرِ: الْمَوَادُّ الْبُرُوتِينِيَّةُ، وَالْمَوَادُّ الدُّهْنِيَّةُ، وَالْمَوَادُّ السُّكَّرِيَّةُ، وَالْفِيتَامِينَاتُ.|Сред тези елементи са белтъчините, мазнините, захарите и витамините.',
  'وَيَنْبَغِي أَلَّا يَأْكُلَ الْإِنْسَانُ طَعَامًا شَدِيدَ الْحَرَارَةِ، وَلَا طَعَامًا شَدِيدَ الْبُرُودَةِ.|Не бива човек да яде много гореща храна, нито много студена.',
  'وَمِنَ الْعَادَاتِ الْمُفِيدَةِ أَنْ يَنَامَ الْإِنْسَانُ مُبَكِّرًا، وَيَسْتَيْقِظَ مُبَكِّرًا، وَأَلَّا يَنَامَ بَعْدَ الْأَكْلِ مُبَاشَرَةً.|Полезни навици са човек да си ляга рано, да става рано и да не спи веднага след ядене.',
  'وَقَدْ قِيلَ: «الصِّحَّةُ تَاجٌ عَلَى رُؤُوسِ الْأَصِحَّاءِ، لَا يَرَاهُ إِلَّا الْمَرْضَى».|Казано е: „Здравето е корона на главите на здравите, която виждат само болните.“'],

const ORDER='ءابتثجحخدذرزسشصضطظعغفقكلمنهوي';
const normAr=s=>plain(s).replace(/^ال/,'').replace(/[أإآ]/g,'ا').replace(/[ؤئ]/g,'ء');

const SHORT={pic:'Картини',rw:'Четене',exp:'Изразяване',quran:'Коран',hand:'Калиграфия',quran2:'Коран',hadith2:'Хадис',read2:'Четене'};
function buildDict(BOOKS){
  const seen=new Map();
  BOOKS.forEach((b,bi)=>{if(!b.lessons||b.id==='hand')return;b.lessons.forEach((ls,i)=>{
    const words=ls.kind==='review'?ls.own:ls.items;
    (words||[]).forEach(it=>{const p=plain(it.ar);if(p.split(' ').length>3||/[؟?]/.test(p))return;
      if(!seen.has(p))seen.set(p,{...it,refs:[]});const e=seen.get(p);if(!e.tr&&it.tr)e.tr=it.tr;
      if(!e.refs.some(r=>r.b===bi&&r.i===i))e.refs.push({b:bi,i,book:b.id,t:ls.t,L:ls.kind==='letter'&&!ls.special?ls.L:''})})})});

    const x=normAr(a.ar),y=normAr(b.ar);for(let i=0;i<Math.min(x.length,y.length);i++){const d=ORDER.indexOf(x[i])-ORDER.indexOf(y[i]);if(d)return d}return x.length-y.length});
}

/* ================= НАПРЕДЪК ================= */
const done=new Set();
/* В Claude се ползва window.storage; при самостоятелно отваряне в браузър — localStorage. */
const PROGRESS_KEY='alif-progress';
async function loadProgress(){
  let raw=null;
  try{if(window.storage){const r=await window.storage.get(PROGRESS_KEY,false);if(r&&r.value)raw=r.value}}catch(e){}
  if(raw==null){try{raw=window.localStorage?localStorage.getItem(PROGRESS_KEY):null}catch(e){}}
  if(raw){try{JSON.parse(raw).forEach(k=>done.add(k))}catch(e){}}
}
async function saveProgress(){
  const raw=JSON.stringify([...done]);let saved=false;
  try{if(window.storage){await window.storage.set(PROGRESS_KEY,raw,false);saved=true}}catch(e){}
  if(!saved){try{if(window.localStorage)localStorage.setItem(PROGRESS_KEY,raw)}catch(e){}}
}

/* ---------- седмичен план ----------
   Ниво 1 (собствено разпределение, ~8–10 урока седмично):
   • седмици 1–7: буквите („Четене и писане“) и калиграфията на същите букви, успоредно с устната „Книга с картини“;
   • Истиаза и Ал-Фатиха — в първите две седмици, защото са нужни за молитвата; останалите сури — седмици 8–15, когато буквите вече се четат;
   • „Изразяване“ (текстове за четене) — седмици 8–15, след като всички букви са научени.
   Ниво 2: запазва се хоризонталният ред на поредицата — част n от всяка книга в седмица n, защото думите от част n
   се повтарят във всички книги през същата седмица. Текстовете за четене от края на книгата с Корана се добавят
   към седмиците с кратки сури, по сходна тема. */
const spread=(i,n,from,to)=>from+Math.floor(i*(to-from+1)/n);
function lessonWeeks(l,b,i,ls){
  if(ls.wk!=null)return Array.isArray(ls.wk)?ls.wk:[ls.wk];
  if(l!==0)return [];
  const n=b.lessons.length;
  if(b.id==='pic')return [spread(i,n,1,7)];
  if(b.id==='rw')return [spread(i,n,1,7)];
  if(b.id==='hand'){if(i<2)return [1];const L=ls.L==='ا'?'ء':ls.L,j=rwLessons.findIndex(x=>x.L===L);return [spread(j,rwLessons.length,1,7)]}
  if(b.id==='exp')return [spread(i,n,8,15)];
  if(b.id==='quran')return i<2?[i+1]:[spread(i-2,n-2,8,15)];
  return [];
}

/* ---------- въпроси ---------- */
function pick(pool,ans,field,n=3){return shuffle([...new Set(pool.map(x=>x[field]).filter(v=>v!==ans[field]))]).slice(0,n)}
function makeQs(ls,b){
  const bookPool=b.lessons.flatMap(x=>x.kind==='dialog'?[...x.lines,...x.items]:(x.items||[]));
  let qs=[];
  if(ls.kind==='hand'){
    if(!NONCON.includes(ls.L)){const f=forms(ls.L);[1,2,3].forEach(p=>qs.push({p:'В коя позиция е тази форма?',show:f[p],ar:true,ans:POS[p],opts:POS}))}
    qs.push({p:'Как се казва тази буква?',show:ls.L,ar:true,ans:NAMES[ls.L],opts:[NAMES[ls.L],...shuffle(HAND_LETTERS.filter(x=>x!==ls.L)).slice(0,3).map(x=>NAMES[x])]});
    const others=shuffle(HAND_LETTERS.filter(x=>x!==ls.L)).slice(0,3);
    qs.push({p:'Коя е буквата „'+NAMES[ls.L]+'“?',showBg:'„'+NAMES[ls.L]+'“',ansAr:ls.L,ans:ls.L,opts:[ls.L,...others],optAr:true});
    ls.words.forEach(x=>{const w=plain(x.ar),alt=joinAlts(w);if(alt.length>=2)qs.push({p:'Как се пише слято?',show:[...w].join(' '),ar:true,ans:w,opts:[w,...alt.slice(0,3)],optAr:true})});
    return qs.map(q=>({...q,opts:shuffle([...new Set(q.opts)])}));
  }
  const items=ls.kind==='dialog'?[...ls.items,...ls.lines]:ls.kind==='rich'?[...ls.items,...ls.drills]:ls.items;
  if(isQH(ls)&&ls.ayat.length>2){
    /* аят, който се повтаря (напр. в сура Ал-Кафирун), няма еднозначен следващ — пропуска се */
    const cnt=t=>ls.ayat.filter(x=>x.ar===t).length;
    shuffle(ls.ayat.slice(0,-1).map((a,k)=>k).filter(k=>cnt(ls.ayat[k].ar)===1)).slice(0,3).forEach(k=>{
      const nxt=ls.ayat[k+1],others=shuffle([...new Set(ls.ayat.filter((x,j)=>j!==k+1&&j!==k&&x.ar!==nxt.ar&&x.ar!==ls.ayat[k].ar).map(x=>x.ar))]).slice(0,3);
      if(others.length)qs.push({p:ls.kind==='hadith'?'Какво следва в хадиса?':'Кой аят следва?',show:ls.ayat[k].ar,ar:true,ans:nxt.ar,opts:shuffle([nxt.ar,...others]),optAr:true})});
  }
  if(ls.kind==='letter'&&!ls.special){
    const others=shuffle(RW.map(x=>x.L).filter(x=>x!==ls.L)).slice(0,3);
    qs.push({p:'Как се казва тази буква?',show:ls.L,ar:true,ans:NAMES[ls.L],opts:shuffle([NAMES[ls.L],...others.map(x=>NAMES[x])])});
  }
  shuffle(items).slice(0,9).forEach((it,n)=>{
    const rev=n%2===1;
    if(rev)qs.push({p:'Изберете арабския превод',showBg:it.bg,ans:it.ar,opts:shuffle([it.ar,...pick(bookPool,it,'ar')]),optAr:true});
    else qs.push({p:'Какво означава?',show:it.ar,ar:true,ans:it.bg,opts:shuffle([it.bg,...pick(bookPool,it,'bg')])});
  });
  return qs;
}

function quiz(el,qs,k){
  let n=0,score=0;qs=shuffle(qs);
  const draw=()=>{
    if(n>=qs.length){const pass=score/qs.length>=.7;if(pass)markDone(k);
      el.innerHTML=`<div class="result"><div class="score">${score} / ${qs.length}</div><p>${pass?'Урокът е завършен.':'Нужни са поне 70%, за да завършите урока.'}</p><button class="btn" id="r">Започнете отново</button></div>`;
      el.querySelector('#r').onclick=()=>quiz(el,qs,k);return}
    const q=qs[n],long=q.opts.some(o=>(q.optAr?plain(o):o).length>(q.optAr?12:18));
    el.innerHTML=`<div class="q"><p>Въпрос ${n+1} от ${qs.length}. ${q.p}</p>
     ${q.showBg?`<div class="face bg">${esc(q.showBg)}</div>`:`<div class="face ${isLong(q.show)?'long':''}">${q.show}</div>${sayBtn(q.show)}`}</div>
     <div class="opts ${long?'one':''}">${q.opts.map((o,j)=>`<button class="opt ${q.optAr?'ar':''}" data-j="${j}">${q.optAr?o:esc(o)}</button>`).join('')}</div>`;
    bindSay(el);
    el.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
      const pick=q.opts[+btn.dataset.j];
      el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(q.opts[j]===q.ans)x.classList.add('ok')});
      if(pick===q.ans)score++;else btn.classList.add('bad');
      setTimeout(()=>{n++;draw()},900)});
  };draw();
}

/* ---------- упражнения: попълни и подреди ---------- */
const STOP=new Set(['في','من','إلى','على','هل','يا','و','لا','أنا','ما','عن']);
function sentPool(ls){
  if(isQH(ls))return ls.ayat;
  if(ls.kind==='dialog')return ls.lines;
  if(ls.kind==='review')return ls.reading.length?ls.reading:expLessons.filter(x=>x.u===ls.u&&x.kind!=='review').flatMap(sentPool);
  return [...ls.lines.map(x=>({ar:stripSp(x.ar),bg:x.bg})),...ls.drills,...ls.reading];
}
/* Упражнения към буквите, както в книгата: „عَيِّنِ الْكَلِمَةَ…“, място на буквата, „رَتِّبِ الْأَحْرُفَ…“, ال шамсия/камария */
function letterDrills(ls){
  const out=[];
  shuffle(ls.pairs).slice(0,3).forEach(([a,b])=>{
    const more=shuffle(ls.pairs.map(p=>p[1]).filter(o=>o!==b)).slice(0,1);
    out.push({type:'choice',p:ls.pq,opts:shuffle([a,b,...more]),ans:a,optAr:true})});
  if(ls.pos){
    shuffle([...ls.pos.b,...ls.pos.m,...ls.pos.e]).slice(0,3).forEach(it=>{const p=letterPos(it.ar,ls.L);
      if(p)out.push({type:'choice',p:`Къде е буквата ${ls.L} в тази дума?`,show:it.ar,sub:it.bg,ans:POS[p],opts:[POS[1],POS[2],POS[3]]})});
    shuffle(ls.items.filter(it=>!/\s/.test(it.ar)&&[...plain(it.ar)].length>=3&&[...plain(it.ar)].length<=6)).slice(0,2)
      .forEach(it=>out.push({type:'order',p:'Подредете буквите в дума',sep:'',x:it,t:[...plain(it.ar)]}));
  }
  shuffle(ls.cls).slice(0,4).forEach(w=>out.push({type:'choice',p:'Каква е ال в тази дума?',show:w,ans:SUN.includes(plain(w)[2])?'слънчева':'лунна',opts:['лунна','слънчева']}));
  return out;
}
/* Упражнения от „Уроци от Корана“: попълване, значение на думите, противоположни думи, сходни звуци */
/* Четене: попълване и противоположни (както в Корана) + вярно/невярно + единствено/множествено число */
function readingDrills(ls){
  const out=quranDrills(ls);
  shuffle(ls.tf).slice(0,2).forEach(t=>out.push({type:'choice',p:'Вярно или невярно? (صَوَابٌ أَمْ خَطَأٌ)',show:t.ar,ans:t.ok?'Вярно':'Невярно',opts:['Вярно','Невярно']}));
  const allP=read2Lessons.flatMap(l=>l.sp);
  shuffle(ls.sp).slice(0,2).forEach(([a,b])=>{const pl=Math.random()<.5,ans=pl?b:a,
    o=shuffle([...new Set(allP.map(x=>pl?x[1]:x[0]).filter(x=>x!==ans&&x!==(pl?a:b)))]).slice(0,2);
    if(o.length===2)out.push({type:'choice',p:pl?'Какво е множественото число? (هَاتِ الْجَمْعَ)':'Какво е единственото число? (هَاتِ الْمُفْرَدَ)',show:pl?a:b,ans,opts:shuffle([ans,...o]),optAr:true})});
  return out;
}
function quranDrills(ls){
  const out=[];
  shuffle(ls.fill).slice(0,3).forEach(f=>out.push({type:'fill',x:{ar:f.t.replace('___',f.a),bg:''},w:f.a,opts:shuffle([f.a,...f.w]),blank:f.t}));
  const allM=[...quranLessons,...quran2Lessons,...hadith2Lessons].flatMap(l=>l.mean);
  shuffle(ls.mean).slice(0,2).forEach(m=>{const o=shuffle([...new Set(allM.filter(x=>x.ex!==m.ex&&x.ar!==m.ar).map(x=>x.ex))]).slice(0,2);
    out.push({type:'choice',p:'Какво означава думата?',show:m.ar,sub:m.bg,ans:m.ex,opts:shuffle([m.ex,...o]),optAr:true})});
  shuffle(ls.opp).slice(0,2).forEach(([a,b])=>{const o=shuffle(ls.opp.flat().filter(x=>x!==a&&x!==b)).slice(0,2);
    if(o.length===2)out.push({type:'choice',p:'Изберете противоположната дума (الضِّدّ)',show:a,ans:b,opts:shuffle([b,...o]),optAr:true})});
  if(ls.cmp)shuffle(ls.pairs).slice(0,2).forEach(([a,b])=>{const more=shuffle(ls.pairs.map(p=>p[1]).filter(o=>o!==b)).slice(0,1);
    out.push({type:'choice',p:`Коя дума е с буквата ${ls.cmp[0]}?`,opts:shuffle([a,b,...more]),ans:a,optAr:true})});
  /* „اِخْتَرْ لِكُلِّ جُمْلَةٍ مَا يُنَاسِبُهَا فِي الْمَعْنَى مِنَ السُّورَةِ“ */
  shuffle(ls.km).slice(0,2).forEach(k=>{const a=ls.ayat[k.n-(ls.n0||1)];if(!a)return;
    const o=shuffle([...new Set(ls.ayat.filter(x=>x.ar!==a.ar).map(x=>x.ar))]).slice(0,2);
    if(o.length===2)out.push({type:'choice',p:ls.kind==='hadith'?'Коя част от хадиса отговаря на този смисъл?':'Кой аят отговаря на този смисъл?',show:k.t,ans:a.ar,opts:shuffle([a.ar,...o]),optAr:true})});
  return out;
}
/* грешни варианти за слято писане: разменени букви */
function joinAlts(w){const a=[...w],out=new Set();
  for(let i=0;i<a.length-1;i++){const b=[...a];[b[i],b[i+1]]=[b[i+1],b[i]];out.add(b.join(''))}
  out.add([...a].reverse().join(''));out.delete(w);return shuffle([...out])}
/* Упражнения към калиграфията: подреждане на буквите, слято писане, място на буквата */
function handDrills(ls){
  const out=[];
  ls.words.forEach(x=>{const w=plain(x.ar);if([...w].length>=3&&[...w].length<=7)out.push({type:'order',p:'Подредете буквите в дума',sep:'',x,t:[...w]})});
  ls.words.forEach(x=>{const w=plain(x.ar),alt=joinAlts(w);if(alt.length>=2)out.push({type:'choice',p:'Изберете правилно написаната дума',show:[...w].join(' '),sub:x.bg,ans:w,opts:shuffle([w,...alt.slice(0,2)]),optAr:true})});
  const L=ls.L==='ا'?null:ls.L;
  if(L)ls.words.forEach(x=>{const p=letterPos(x.ar,L);if(p)out.push({type:'choice',p:`Къде е буквата ${L} в тази дума?`,show:x.ar,sub:x.bg,ans:POS[p],opts:[POS[1],POS[2],POS[3]]})});
  const ord=toks(plain(ls.sent.ar));if(ord.length>=3)out.push({type:'order',x:ls.sent,t:toks(ls.sent.ar)});
  return shuffle(out);
}
function makeDrills(ls){
  if(ls.kind==='hand')return handDrills(ls);
  const pool=sentPool(ls),extra=ls.kind==='letter'?letterDrills(ls):isQH(ls)?quranDrills(ls):ls.kind==='reading'?readingDrills(ls):[];
  const nF=ls.kind==='letter'?3:isQH(ls)?2:5,nO=ls.kind==='letter'||isQH(ls)?2:4;
  const fill=[],order=[];
  if(pool.length>=2){
    const allW=[...new Set(pool.flatMap(x=>toks(x.ar)))];
    shuffle(pool).forEach(x=>{
      const t=toks(x.ar),cand=t.filter(w=>plain(w).length>=3&&!STOP.has(plain(w)));
      if(cand.length&&fill.length<nF){const w=cand[Math.random()*cand.length|0];
        const others=shuffle(allW.filter(o=>plain(o)!==plain(w)&&plain(o).length>=2)).slice(0,3);
        if(others.length>=2)fill.push({type:'fill',x,w,opts:shuffle([w,...others])})}
      if(t.length>=3&&t.length<=7&&order.length<nO)order.push({type:'order',x,t});
    });
  }
  const pat=shuffle(ls.pat||[]).slice(0,isQH(ls)?3:4).map(x=>({type:'choice',p:'Отговорете по образеца',show:x.q,cue:x.cue,ans:x.a,opts:shuffle([x.a,...x.w]),optAr:true}));
  return shuffle([...fill,...order,...extra,...pat]);
}
function drill(el,ls,k){
  const qs=makeDrills(ls);
  if(!qs.length){el.innerHTML='<div class="note">За този урок няма достатъчно изречения за упражнения.</div>';return}
  let n=0,score=0;
  const next=ok=>{if(ok)score++;setTimeout(()=>{n++;draw()},ok?900:1600)};
  const draw=()=>{
    if(n>=qs.length){const pass=score/qs.length>=.7;if(pass)markDone(k);
      el.innerHTML=`<div class="result"><div class="score">${score} / ${qs.length}</div><p>${pass?'Браво! Упражненията са изпълнени.':'Опитайте отново, за да затвърдите изреченията.'}</p><button class="btn" id="r">Нови упражнения</button></div>`;
      el.querySelector('#r').onclick=()=>drill(el,ls,k);return}
    const q=qs[n];
    if(q.type==='choice'){
      el.innerHTML=`<div class="q"><p>Упражнение ${n+1} от ${qs.length}. ${esc(q.p)}</p>${q.show?`<div class="face ${isLong(q.show)?'long':''}">${q.show}</div>${sayBtn(q.show)}`:''}${q.cue?`<div class="cue">подсказка: <span class="ar">${q.cue}</span></div>`:''}${q.sub?`<p style="margin-top:6px">${esc(q.sub)}</p>`:''}</div>
       <div class="opts ${(q.opts.length===3&&!q.optAr)||q.opts.some(o=>plain(o).length>12)?'one':''}">${q.opts.map((o,j)=>`<button class="opt ${q.optAr?'ar':''}" data-j="${j}">${q.optAr?o:esc(o)}</button>`).join('')}</div>`;
      bindSay(el);
      el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=q.opts[+b.dataset.j]===q.ans;
        el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(q.opts[j]===q.ans)x.classList.add('ok')});if(!ok)b.classList.add('bad');say(q.show||q.ans);next(ok)});
    }else if(q.type==='fill'){
      const shown=q.blank?q.blank.replace('___','<span style="border-bottom:2px solid var(--gold);padding:0 22px;color:transparent">ـــ</span>'):q.x.ar.split(q.w).join('<span style="border-bottom:2px solid var(--gold);padding:0 22px;color:transparent">ـــ</span>');
      el.innerHTML=`<div class="q"><p>Упражнение ${n+1} от ${qs.length}. Попълнете липсващата дума</p><div class="face long" style="font-size:30px">${shown}</div>${q.x.bg?`<p style="margin-top:8px">${esc(q.x.bg)}</p>`:''}</div>
       <div class="opts">${q.opts.map((o,j)=>`<button class="opt ar" data-j="${j}">${o}</button>`).join('')}</div>`;
      el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=q.opts[+b.dataset.j]===q.w;
        el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(q.opts[j]===q.w)x.classList.add('ok')});if(!ok)b.classList.add('bad');say(q.x.ar);next(ok)});
    }else{
      let picked=[];const chips=shuffle(q.t.map((w,i)=>({w,i})));
      const paint=()=>{
        el.innerHTML=`<div class="q"><p>Упражнение ${n+1} от ${qs.length}. ${q.p||'Подредете думите в изречение'}</p><p style="font-size:15px;color:var(--ink);margin:6px 0 12px">${esc(q.x.bg)}</p>
         <div class="ar" style="min-height:56px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;direction:rtl" id="ans">${picked.map((c,j)=>`<button class="opt ar" style="min-height:0;padding:4px 10px" data-u="${j}">${c.w}</button>`).join('')}</div></div>
         <div class="ar" style="display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center">${chips.filter(c=>!picked.includes(c)).map(c=>`<button class="opt ar" style="min-height:0;padding:6px 12px" data-c="${c.i}">${c.w}</button>`).join('')}</div>`;
        el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{picked.push(chips.find(c=>c.i==b.dataset.c));
          if(picked.length===q.t.length){const sp=q.sep??' ',ok=picked.map(c=>plain(c.w)).join(sp)===q.t.map(plain).join(sp);paint();
            const a=el.querySelector('#ans');a.style.borderColor=ok?'var(--ok)':'var(--bad)';a.style.background=ok?'#E6F3EB':'#F8E7E5';
            if(!ok)a.insertAdjacentHTML('afterend',`<p class="ar" style="font-size:22px;color:var(--ok);margin-top:8px">${q.x.ar}</p>`);
            el.querySelectorAll('button').forEach(x=>x.disabled=true);say(q.x.ar);next(ok)}else paint()});
        el.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.u,1);paint()});
      };paint();
    }
  };draw();
}

/* ---------- въпроси към текста (както „أَجِبْ عَنِ الْأَسْئِلَةِ“ в книгите) ---------- */
function textSource(ls){
  if(isQH(ls))return [...ls.ayat,...ls.reading,...ls.story,...(ls.lessonsL||[])];
  if(ls.reading&&ls.reading.length)return ls.reading;
  if(ls.lines&&ls.lines.length)return ls.lines;
  return ls.items||[];
}
function makeTextQs(ls){return (ls.tq||[]).map(x=>({q:x.q,ans:x.a,opts:shuffle([x.a,...x.w])}))}
function textQuiz(el,ls,k){
  const qs=makeTextQs(ls),src=textSource(ls);
  if(!qs.length){el.innerHTML='<div class="note">Към този урок няма въпроси.</div>';return}
  let n=0,score=0;
  const text=`<details class="txt"><summary>Текстът</summary><div class="ar">${src.map(x=>`<p>${x.ar}</p>`).join('')}</div></details>`;
  const draw=()=>{
    if(n>=qs.length){const pass=score/qs.length>=.7;if(pass)markDone(k);
      el.innerHTML=`<div class="result"><div class="score">${score} / ${qs.length}</div><p>${pass?'Браво! Разбрали сте текста.':'Прочетете текста отново и опитайте пак.'}</p><button class="btn" id="r">Отначало</button></div>`;
      el.querySelector('#r').onclick=()=>textQuiz(el,ls,k);return}
    const q=qs[n];
    el.innerHTML=`<div class="note">Прочетете текста и отговорете на въпросите според него.</div>${text}
     <div class="q"><p>Въпрос ${n+1} от ${qs.length}</p><div class="face long">${q.q}</div>${sayBtn(q.q)}</div>
     <div class="opts one">${q.opts.map((o,j)=>`<button class="opt ar" data-j="${j}">${o}</button>`).join('')}</div>`;
    bindSay(el);
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=q.opts[+b.dataset.j]===q.ans;
      el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(q.opts[j]===q.ans)x.classList.add('ok')});
      if(ok)score++;else b.classList.add('bad');
      setTimeout(()=>{n++;draw()},ok?900:1600)});
  };draw();
}

/* водещи линии за първото въведение */
function shapeGuide(c,t,w,h,lw){c.lineWidth=lw;c.lineCap='round';c.beginPath();const n=5,step=(w-60)/n,y0=h*.22,y1=h*.72;
  for(let k=0;k<n;k++){const x=w-40-k*step;
    if(t==='#vert'){c.moveTo(x,y0);c.lineTo(x,y1)}
    else if(t==='#slant'){c.moveTo(x,y0);c.lineTo(x-step*.5,y1)}
    else if(t==='#horiz'){const y=y0+(y1-y0)*k/(n-1);c.moveTo(w-40,y);c.lineTo(40,y)}
    else if(t==='#bowl'){c.moveTo(x,h*.4);c.quadraticCurveTo(x-step*.4,h*.95,x-step*.8,h*.4)}
    else if(t==='#circle'){c.moveTo(x-step*.15+step*.25,h*.5);c.arc(x-step*.4,h*.5,step*.25,0,Math.PI*2)}
    else if(t==='#dots'){c.moveTo(x-step*.3,h*.47);c.lineTo(x-step*.3+.1,h*.47)}}
  c.stroke()}
function write(el,ls,k){
  let i=0;const list=ls.trace;
  const draw=()=>{const it=list[i],shape=it.t[0]==='#';
    el.innerHTML=`<div class="note">${esc(it.lab)}${it.w?`: <bdi class="ar" dir="rtl">${it.w.ar}</bdi>${it.w.tr?` <i>${esc(it.w.tr)}</i>`:''} — ${esc(it.w.bg)}`:''}. Проследете сивата линия с пръст или мишка, отдясно наляво.</div>
     <div class="pad"><canvas id="cv"></canvas><div class="padbar"><button class="btn ghost" id="clr">Изчисти</button><button class="btn ghost" id="chk">Провери</button><span>${i+1} / ${list.length}</span>${shape?'':sayBtn(it.w?it.w.ar:it.t)}</div></div>
     <div id="fb" class="note" hidden></div>
     <div class="nav"><button class="btn ghost" id="p">Предишна</button><button class="btn" id="n">${i===list.length-1?'Готово':'Следваща'}</button></div>`;
    bindSay(el);
    const cv=el.querySelector('#cv'),dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
    let strokes=[];
    const glyph=(g,mode,lw)=>{g.textAlign='center';g.direction='rtl';const n=plain(it.t).length,size=n>3?Math.min(h*.5,w/(n*.62)):h*.62;
      g.font=`${size}px Amiri, 'Noto Naskh Arabic', serif`;
      if(shape){shapeGuide(g,it.t,w,h,lw||10);return}
      if(mode==='fill')g.fillText(it.t,w/2,h*.68);if(lw){g.lineWidth=lw;g.lineJoin='round';g.strokeText(it.t,w/2,h*.68)}};
    const ink=(g,lw)=>{g.strokeStyle=g.fillStyle='#000';g.lineWidth=lw;g.lineCap='round';g.lineJoin='round';
      strokes.forEach(st=>{g.beginPath();g.moveTo(...st[0]);st.forEach(p=>g.lineTo(...p));if(st.length===1)g.lineTo(st[0][0]+.1,st[0][1]);g.stroke()})};
    const paint=()=>{c.clearRect(0,0,w,h);c.strokeStyle='#E6EBE9';c.lineWidth=1;c.beginPath();c.moveTo(16,h*.68);c.lineTo(w-16,h*.68);c.stroke();
      c.fillStyle=c.strokeStyle='#D3E2DE';glyph(c,'fill',shape?10:0);c.save();c.strokeStyle='#0E5E57';ink(c,7);c.restore()};
    paint();document.fonts&&document.fonts.ready.then(paint);
    /* оценка: колко от сивата линия е покрита и колко от написаното е върху нея */
    const check=()=>{const fb=el.querySelector('#fb');fb.hidden=false;
      if(!strokes.length){fb.textContent='Първо напишете с пръст върху сивата линия.';return}
      const mk=f=>{const o=document.createElement('canvas');o.width=w;o.height=h;const g=o.getContext('2d');g.fillStyle=g.strokeStyle='#000';f(g);return g.getImageData(0,0,w,h).data};
      const G=mk(g=>glyph(g,'fill',shape?10:0)),Gd=mk(g=>glyph(g,'fill',shape?24:12)),I=mk(g=>ink(g,7)),Id=mk(g=>ink(g,16));
      let g=0,gc=0,n=0,nin=0;for(let p=3;p<G.length;p+=12){if(G[p]>100){g++;if(Id[p]>100)gc++}if(I[p]>100){n++;if(Gd[p]>100)nin++}}
      const cov=g?gc/g:0,prec=n?nin/n:0,sc=Math.round(100*Math.min(1,cov*1.1)*Math.pow(prec,1.5));
      fb.style.borderLeftColor=sc>=70?'var(--ok)':sc>=40?'var(--gold)':'var(--bad)';
      fb.textContent=`Точност: ${sc}%. `+(sc>=70?'Много добре!':sc>=40?'Добре — опитайте да следвате линията по-точно.':'Проследете цялата сива линия, без да излизате от нея.')};
    let cur=null;
    const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cur=[pos(e)];strokes.push(cur);paint()};
    cv.onpointermove=e=>{if(!cur)return;cur.push(pos(e));paint()};
    cv.onpointerup=cv.onpointercancel=()=>{cur=null};
    el.querySelector('#clr').onclick=()=>{strokes=[];el.querySelector('#fb').hidden=true;paint()};
    el.querySelector('#chk').onclick=check;
    el.querySelector('#p').onclick=()=>{if(i>0){i--;draw()}};
    el.querySelector('#n').onclick=()=>{if(i<list.length-1){i++;draw()}else{markDone(k);el.innerHTML=`<div class="result"><div class="score">✓</div><p>Упражнението по писане е завършено.</p><button class="btn" id="r">Отново</button></div>`;el.querySelector('#r').onclick=()=>write(el,ls,k)}};
  };draw();
}

stack=[{t:'home'}];
loadProgress().then(render);
if('speechSynthesis' in window)speechSynthesis.getVoices();
